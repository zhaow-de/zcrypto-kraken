name: Capture image

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
    paths:
      - "cli/capture/**"
      - "infra/docker/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zhaow-de/zcrypto-capture

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Write image digest to the job summary
        run: |
          {
            echo "### Capture image pushed"
            echo
            echo "- Image: \`${{ env.IMAGE }}\`"
            echo "- Tags: \`${{ github.sha }}\`, \`latest\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Pin the Ansible deploy var with:"
            echo '```yaml'
            echo "capture_image_digest: \"${{ steps.push.outputs.digest }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
