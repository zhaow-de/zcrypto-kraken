name: Capture image

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
    paths:
      - "cli/**"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/docker/**"
  # Manual trigger: on-demand rebuilds, and a way to test this workflow itself — edits to this
  # file don't match the paths filter above, so a workflow-only change never auto-runs.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # One image, two services: it serves both the capture daemon and the shadow engine (entrypoint overridden per service).
  IMAGE: ghcr.io/zhaow-de/zcrypto-capture

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # default: the AVX-optimized polars-runtime-32 (the VPS, AMD EPYC); multi-arch.
          - runtime: default
            # TEMPORARY (2026-07-15, owner): arm64 commented out -- the whole fleet is x86_64
            # (Linode VPS pair, NAS Atom, ops-node i7); the qemu cross-build only slows CI. Restore
            # the line below (and the QEMU step) if an arm64 host ever joins.
            # platforms: linux/amd64,linux/arm64
            platforms: linux/amd64
            suffix: ""
          # compat: polars-runtime-compat, no AVX needed (the Synology NAS, Atom Goldmont). amd64
          # only — the compat runtime is an x86 baseline build (see T0029).
          - runtime: compat
            platforms: linux/amd64
            suffix: "-compat"
    steps:
      - uses: actions/checkout@v7

      # QEMU registers binfmt handlers so buildx can cross-build the arm64 image on the amd64 runner.
      # TEMPORARY (2026-07-15): disabled with the arm64 platform above -- everything is x86_64 for now.
      # - uses: docker/setup-qemu-action@v4.2.0

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile
          # default variant is multi-arch (amd64 Linode + arm64); compat is amd64-only. Both base
          # images (python:3.14-slim, ghcr.io/astral-sh/uv) are multi-arch and `uv sync` installs
          # wheels, so no Dockerfile change is needed for the arch split.
          platforms: ${{ matrix.platforms }}
          build-args: |
            POLARS_RUNTIME=${{ matrix.runtime }}
          # Disable SLSA provenance attestations: they publish an extra `unknown/unknown` manifest in
          # GHCR's "OS/Arch" list (an attestation blob, not a runnable image). Off = the list shows
          # exactly linux/amd64 + linux/arm64. (Re-enable with provenance: mode=max if supply-chain
          # attestations are wanted later — accepting the unknown/unknown entries back.)
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}${{ matrix.suffix }}
            ${{ env.IMAGE }}:latest${{ matrix.suffix }}
          # An image must answer "what code is this, and which polars runtime?" ON ITS OWN, from a
          # DIGEST — because a digest is what a pin IS. Only image.source was set (the Dockerfile's
          # LABEL), so answering it meant scanning the registry's tags for one that resolves to your
          # digest. That is exactly what happened on 2026-07-17 when the NAS's pin was audited, and
          # it is worse offline or after a tag is deleted. `revision` makes the lookup local and
          # permanent (`docker inspect`), and polars-runtime makes the compat/AVX split INSPECTABLE
          # rather than discovered as `Illegal instruction (core dumped)` on the AVX-less Atom
          # (T0029; the 90-second NAS outage of 2026-07-16).
          #
          # Deliberately NO image.version: this workflow also builds on `v*` tags, where a sha-derived
          # version would stamp the sha instead of the release — misleading exactly where a version
          # label matters most. `revision` carries the sha and polars-runtime carries the variant, so
          # version would add nothing but a way to be wrong.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            de.zhaow.zcrypto.polars-runtime=${{ matrix.runtime }}

      - name: Write image digest to the job summary
        run: |
          {
            echo "### Capture image pushed (runtime: ${{ matrix.runtime }})"
            echo
            echo "- Image: \`${{ env.IMAGE }}\` (runtime: \`${{ matrix.runtime }}\`)"
            echo "- Platforms: \`${{ matrix.platforms }}\`"
            echo "- Tags: \`${{ github.sha }}${{ matrix.suffix }}\`, \`latest${{ matrix.suffix }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Pin the Ansible deploy var with (the multi-arch index digest; docker pull picks the host's arch):"
            echo '```yaml'
            echo "capture_image_digest: \"${{ steps.push.outputs.digest }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
