name: Prose ratchet on develop

# DETECTIVE, not preventive, and deliberately so. The PR step measures `merge(head, base-at-run-time)`;
# with `strict: false` a PR may merge against a base that has advanced since its run, so the merge
# result can differ from what was measured. That happened three times in the last twenty-five merges.
# `strict: true` would prevent it and would stale every open PR on each merge, which is why the base
# protection sets it false on purpose. This job prevents nothing: it collapses the window in which a
# red `develop` goes unnoticed from hours to about a minute, and a red `develop` only bites when
# someone cuts a branch or commits against it.
#
# Its own workflow rather than a `push` trigger on coverage.yml, whose comment rejects that by name to
# avoid a redundant post-merge run of the whole suite. This runs the ratchet alone.
#
# It must NOT become a required status check: `develop` requires exactly ["Full test suite"], and a
# signal that arrives after the merge cannot coherently gate it.

on:
  push:
    branches: [develop]

jobs:
  ratchet:
    name: Prose ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync
      # Byte-identical to the `pre-push` hook's stage and to coverage.yml's step: three call sites,
      # one invocation, so none of them can come to mean something different from the others.
      - run: uv run pre-commit run --hook-stage pre-push --all-files
