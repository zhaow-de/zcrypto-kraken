name: Full test suite

on:
  # PRs into develop/main only. Every change reaches those branches via a PR, so the PR run gates
  # each change before merge — and there is no redundant post-merge `push` run of the same suite.
  # Coverage is uploaded from the PR build (so the README develop-branch badge tracks PR builds).
  pull_request:
    branches: [develop, main]

jobs:
  coverage:
    # This string IS the required status-check context on develop (.github/settings.yml).
    # GitHub reports a job's `name:` as the check-run name, so renaming it here without
    # updating that contexts list blocks every PR on a check that never reports.
    # Renaming ALSO strands every pull request open at that moment: their runs already
    # reported under the old name, and a re-run replays the old workflow file, so each
    # needs a fresh run (push a commit, or close and reopen) before it can merge again.
    # Named for what it gates -- the whole suite; the coverage upload is a by-product.
    name: Full test suite
    runs-on: ubuntu-latest
    # The suite reads; nothing here writes. `actions/checkout` persists this token in .git/config
    # for every later step, so bounding it is worth the line whatever the repository default is.
    permissions:
      contents: read
    steps:
      # The whole history, not the tip: at fetch-depth 1 the clone is shallow, and
      # `tests/test_change_index.py::test_every_keyed_merge_on_develop_has_a_row` reads the
      # first-parent merges of `develop` — a rowless merge already there is what it catches, and
      # it cannot see one at all in a depth-1 clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request writes setup-uv's cache only when it changes the lockfile: otherwise develop
      # already holds its key (uv-cache.yml seeds it), and a copy under the PR's merge ref is one no
      # other pull request can read. A failed comparison counts as changed, so a run still saves.
      - id: lock
        run: |
          if git diff --quiet origin/develop -- uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The key-bearing inputs equal uv-cache.yml's (tests/test_ci_uv_cache.py).
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          cache-dependency-glob: uv.lock
          save-cache: ${{ steps.lock.outputs.changed == 'true' }}
      # The branch under the name the tooling reads: a pull_request checkout is detached at the
      # merge ref with only `origin/develop`, and `count-list.sh` refuses a checkout with no local
      # `develop`, which left nine of `tests/test_count_list.py`'s cases skipping here.
      - run: git branch --force develop origin/develop
      - run: uv sync
      - run: uv run coverage run -m pytest
      - run: uv run coverage lcov -o coverage.lcov
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          # The test suite above is the gate; this upload is informational. The action defaults to
          # fail-on-error: true, which hands a third-party service a veto over every merge in the repo
          # -- a coveralls.io outage (two 504s on 2026-07-13 alone) turned green test runs into red
          # checks and blocked PRs that had nothing wrong with them. Degrade the upload to a warning.
          fail-on-error: false
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
