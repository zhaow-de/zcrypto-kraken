name: Test coverage

on:
  # PRs into develop/main only. Every change reaches those branches via a PR, so the PR run gates
  # each change before merge — and there is no redundant post-merge `push` run of the same suite.
  # Coverage is uploaded from the PR build (so the README develop-branch badge tracks PR builds).
  pull_request:
    branches: [develop, main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run coverage run -m pytest
      - run: uv run coverage lcov -o coverage.lcov
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          # The test suite above is the gate; this upload is informational. The action defaults to
          # fail-on-error: true, which hands a third-party service a veto over every merge in the repo
          # -- a coveralls.io outage (two 504s on 2026-07-13 alone) turned green test runs into red
          # checks and blocked PRs that had nothing wrong with them. Degrade the upload to a warning.
          fail-on-error: false
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
