name: Test coverage

on:
  push:
    branches: [develop, main]
  # Also run on PRs into develop/main so a failing test (or, before, a CI-only
  # failure like the ANSI/gitignored-file cases) is caught *before* merge, not only
  # on the post-merge push. The Coveralls upload below stays push-only so the
  # coverage record tracks the integration branches, without duplicate PR builds.
  pull_request:
    branches: [develop, main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run coverage run -m pytest
      - run: uv run coverage lcov -o coverage.lcov
        if: github.event_name == 'push'
      - name: Upload coverage to Coveralls
        if: github.event_name == 'push'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
