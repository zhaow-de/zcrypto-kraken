version: 2

# Per-ecosystem PRs, deliberately UNGROUPED (owner ruling): the multi-ecosystem group
# produced consolidated "bump the dependencies group" titles that broke the dependabot
# skill's per-package triage, and whether the group was honored at all was never
# established (T0099, resolved by this removal).
# target-branch stays develop on every entry (branch model: develop is the integration
# branch; a Dependabot PR against main means this drifted — see .claude/skills/dependabot).
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pre-commit"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"

  # `uv`'s binary is the pin nothing else tracks, and it is a `FROM` stage in the Dockerfile
  # because this parser reads no other line. The base image is deliberately EXCLUDED: its tag is
  # mutable on purpose, so a patch-level CPython arrives at the next image build with no PR, and a
  # minor bump is not a dependency decision -- it asserts every PyPI dependency is ready for the
  # new interpreter, which no proposal can establish (owner's ruling).
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
