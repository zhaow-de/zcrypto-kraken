# infra/nas/rrsync is vendored VERBATIM — rsync 3.4.1's upstream python3 rrsync, byte-identical to the
# fleet's own /usr/bin/rrsync (sha256 d4739b6f…). Our formatters must never rewrite third-party
# security code: a reformat both defeats the provenance and edits the sole write-jail into custody
# (spec 00056 D2). Excluded globally; its integrity is verified by hash against the in-fleet copy.
# This line is the ONLY thing holding every non-ruff hook off that file — removed, trailing-whitespace
# rewrites it (measured 2026-07-24). tests/test_vendored_rrsync_integrity.py is the tripwire.
exclude: '^infra/nas/rrsync$'

# Every hook is a commit-time hook unless it says otherwise. Removing this line puts most of them
# into the push stage as well, and nothing here is worth paying for twice.
# The push stage needs `pre-commit install --hook-type pre-push`, which is per-clone: a fresh clone
# has none until it is re-run, and these declarations are the tracked half of that arrangement.
# The generated hook execs the MAIN CHECKOUT's `.venv/bin/python` by absolute path, shared by every
# worktree. Delete that venv and, while `pre-commit` is absent from PATH as it is here, every push
# fails in milliseconds naming neither this file nor `uv sync`; install it on PATH instead and pushes
# silently run a different, unpinned pre-commit.
# A push that succeeds is not evidence any hook ran. pre-commit skips the push stage outright when
# every commit is already reachable from a remote-tracking ref of that remote — and the hooks measure
# the tree you are STANDING in, not the ref you are pushing.
default_stages: [pre-commit]
# `pre-commit install` then installs every hook type a hook here declares -- pre-push for the tracked
# declarations above, commit-msg for guidance-guard -- instead of one `--hook-type` per clone.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  # Five hooks below pin `stages: [pre-commit]`. Their upstream manifest declares
  # `[pre-commit, pre-push, manual]`, which outranks `default_stages`, and two of the five REWRITE
  # files — at push they would edit the working tree mid-push. The push stage is empty by design and
  # `tests/test_pre_push_stage.py` holds it there, so a hook arriving in it is a red, not a choice.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
        exclude: '\.j2$'
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
        exclude: '^infra/ansible/(group_vars/.*/vault\.yml|host_vars/.*/vault\.yml|vault-password\.sops\.yaml)$'
      - id: debug-statements
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        stages: [pre-commit]

  # Local (not the upstream mirror) so there is ONE ruff: the one pinned in pyproject/uv.lock, which
  # dependabot's `uv` ecosystem already tracks -- same reasoning as ansible-lint below. The mirror
  # pinned ruff a second time and the two drifted: #199 bumped only the uv side, leaving the gate on
  # 0.15.22 while `uv run ruff` was 0.16.0 (T0099).
  # `--force-exclude` is REQUIRED here: pre-commit passes explicit paths, and without it ruff ignores
  # `exclude` for paths named on the command line. `types_or` mirrors the upstream hooks' scoping.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]

  # Local (not the upstream hook repo) so there is ONE ansible-lint version: the one pinned in
  # pyproject/uv.lock, which dependabot's `uv` ecosystem already tracks. The upstream repo would add
  # a second, separately-pinned copy in an isolated venv (ansible-core is heavy) and the two would
  # drift. Config -- incl. the skipped rule -- lives in `.ansible-lint`.
  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: uv run ansible-lint
        args: ["infra/ansible/"]
        language: system
        # `.ansible-lint` is in the pattern so a skip_list/config edit re-lints; without it a
        # config-only commit would never re-run the hook.
        files: '^(infra/|\.ansible-lint$)'
        pass_filenames: false

  # Enforcement for the one-kind-per-commit rule (violated five times while
  # written down — the P6 trigger). Only separates claude-kind from everything else; feat/fix
  # commits legitimately mix cli/ + tests/ + docs. Deliberate exception: SKIP=staged-kind.
  - repo: local
    hooks:
      - id: staged-kind
        name: claude-kind files not mixed with other kinds
        entry: bash infra/scripts/staged-kind-check.sh
        language: system
        pass_filenames: false
        always_run: true
      # The always-loaded guidance -- CLAUDE.md, .claude/rules/*.md, every skill's name and description
      # lines -- grows only with a stated reason in the message, and a corpus bullet with a universal
      # names its count entry. Runs at commit-msg, the one stage that can read the message.
      - id: guidance-guard
        name: guidance growth is stated, universals are counted
        entry: uv run python infra/scripts/guidance-guard.py
        language: system
        stages: [commit-msg]
        always_run: true

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
    - id: mdformat
      args: [--number, --compact-tables]
      additional_dependencies:
      - mdformat-gfm
      - mdformat-toc
      # Allowlist of mdformat-managed docs: the three READMEs + infra/external-systems.md + EVERY
      # file under infra/runbooks/ + EVERY report under docs/research/, matched by glob so a new
      # subsystem runbook or research paper is covered automatically (no per-file edit here).
      # Excluded by the negative lookahead: the verbatim per-phase decision logs *-decisions.md,
      # whose option lists + "(Decision: N)" markers mdformat would restructure (the
      # iteration-closeout skill owns their shape). Nothing else under docs/ is covered (reference/, specs/,
      # plans/, open-topics topic files format by hand).
      files: |
        (?x)^(
            README\.md|
            infra/README\.md|
            infra/external-systems\.md|
            infra/runbooks/.*\.md|
            docs/open-topics/README\.md|
            docs/research/(?!.*-decisions\.md$).*\.md
        )$
