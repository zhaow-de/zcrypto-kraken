repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude: '\.j2$'
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
        exclude: '^infra/ansible/(group_vars/.*/vault\.yml|host_vars/.*/vault\.yml|vault-password\.sops\.yaml)$'
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
    - id: mdformat
      args: [--number]
      additional_dependencies:
      - mdformat-gfm
      - mdformat-toc
      # Allowlist of mdformat-managed docs: the READMEs + each research REPORT under docs/research/.
      # Append each new research paper here when it lands. Verbatim docs (e.g. the
      # decision log 01.3.phase0-decisions.md, whose option lists + "(Decision: N)" markers mdformat
      # would restructure) are intentionally left off so they stay as-is.
      files: |
        (?x)^(
            README\.md|
            docs/open-topics/README\.md|
            docs/research/00\.master-plan\.md|
            docs/research/01\.1\.kraken-snapshot-register\.md|
            docs/research/01\.2\.nautilus-kraken-adapter-memo\.md|
            docs/research/01\.3\.phase0-closeout\.md|
            docs/research/02\.phase1-data-foundation-closeout\.md|
            docs/research/03\.phase2-validation-harness-closeout\.md|
            docs/research/04\.phase3-benchmarks-closeout\.md|
            docs/research/05\.phase4-orientation\.md|
            docs/research/06\.phase4-a1-results\.md|
            docs/research/07\.phase4-a1-cost-reality\.md|
            docs/research/08\.phase4-a2-orientation\.md|
            docs/research/09\.phase4-a2-results\.md|
            docs/research/10\.phase4-closeout\.md
        )$
