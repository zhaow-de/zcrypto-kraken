# The NAS archive-pull stack (spec 00048 Role A): always-on pull and hash-verify of the VPS capture
# segments and engine journal into custody. Runs under Synology Container Manager, DEPLOYED BY the
# `nas` Ansible role, which copies this file verbatim and renders the adjacent .env filling the
# `${...:?}` placeholders below. See infra/nas/README.md for the deploy command and the env
# contract.
#
# Every pull channel below shares one shape, stated once here: its OWN least-privilege rrsync
# channel; its own per-call SSH port where the source is the home-LAN ops node rather than a VPS;
# and, for every channel EXCEPT the primary capture pull, leaving its `*_SOURCE` unset skips that
# pull entirely, so this file stays valid on a NAS that has not been given the channel. The primary
# pull is unconditional. Each block below says only what is particular to its channel.
services:
  archive-pull:
    # The digest pin arrives via the ansible-rendered .env: the same x86 image the VPS capture
    # daemon runs, so no separate NAS build, but ALWAYS the `-compat` (no-AVX) build, because the
    # NAS Atom has no AVX and the default build dies instantly with `Illegal instruction` (T0029).
    # The `:?` makes compose REFUSE to start without the pin, which a committed `:latest`
    # placeholder did not.
    image: ${CAPTURE_IMAGE:?set by the ansible-rendered .env — the -compat digest pin}
    container_name: zcrypto-archive-pull
    entrypoint: ["/opt/pull-entrypoint.sh"]
    user: "1000:1000"
    restart: unless-stopped
    environment:
      CAPTURE_SOURCE: ${CAPTURE_SOURCE}
      CAPTURE_DEST: ${CAPTURE_DEST:-/archive/capture-segments}
      # Role C (spec 00050): the redundant secondary's mirror, pulled into its OWN root -- the two
      # raw mirrors are never mixed, because the reconciler needs both as independent witnesses.
      CAPTURE_RED_SOURCE: ${CAPTURE_RED_SOURCE:-}
      CAPTURE_RED_DEST: ${CAPTURE_RED_DEST:-/archive/capture-segments-red}
      CAPTURE_RED_SSH_KEY: /keys/sync_capture_red
      # The healed overlay. OPS-5 (spec 00054 D4) inverted who writes it: the ops node is the
      # producer now, so this is a PULL DESTINATION rather than the reconciler's output path. Only
      # HEALED hours land here, plus the append-only ledger, and readers resolve reconciled-first
      # with primary-final otherwise. Kept off both raw mirrors on purpose: the raw primary is the
      # T0003 exit bar's only input and the overlay heals gaps by design, so mixing them would
      # launder the very gaps the bar exists to measure.
      RECONCILED_DEST: ${RECONCILED_DEST:-/archive/capture-reconciled}
      JOURNAL_SOURCE: ${JOURNAL_SOURCE}
      JOURNAL_DEST: ${JOURNAL_DEST:-/archive/engine-journal}
      # OPS-2 (spec 00051): the ops node's liquidations tree.
      LIQUIDATIONS_SOURCE: ${LIQUIDATIONS_SOURCE:-}
      LIQUIDATIONS_DEST: ${LIQUIDATIONS_DEST:-/archive/liquidations}
      LIQUIDATIONS_SSH_KEY: /keys/sync_liquidations
      LIQUIDATIONS_SSH_PORT: ${LIQUIDATIONS_SSH_PORT:-22}
      # OPS-4 (spec 00052 D7): the ops node's L2 primitive panel tree, convenience durability only
      # -- the panel is recomputable from raw, so this copy is not custody-critical.
      PANEL_SOURCE: ${PANEL_SOURCE:-}
      PANEL_DEST: ${PANEL_DEST:-/archive/l2-panel}
      PANEL_SSH_KEY: /keys/sync_panel
      PANEL_SSH_PORT: ${PANEL_SSH_PORT:-22}
      # OPS-5 (spec 00054 D4): the NAS PULLS the overlay and never receives a push, which preserves
      # spec 00051 D10's pull-only transport -- a compromised ops node still cannot write into
      # custody.
      #
      # Hash-verified, unlike the journal: every minted hour carries a sidecar, and `verify_tree`
      # walks parquet only, so the unsidecar'd ledger rides along unchecked rather than failing the
      # pull.
      RECONCILED_SOURCE: ${RECONCILED_SOURCE:-}
      RECONCILED_SSH_KEY: /keys/sync_reconciled
      RECONCILED_SSH_PORT: ${RECONCILED_SSH_PORT:-22}
      # OPS-6 (spec 00056 D2/D4): the ops node's hot-out outbox, additively pulled into the hot/ hub
      # (/archive == /volume1/ZhaoCrypto, so /archive/hot IS the hub). Own least-privilege read-only
      # key + home-LAN port 22, same shape as panel/reconciled. Unset HOT_SOURCE and the pull is
      # skipped entirely, so this compose file stays valid on a NAS not yet given the channel.
      HOT_SOURCE: ${HOT_SOURCE:-}
      HOT_DEST: ${HOT_DEST:-/archive/hot}
      HOT_SSH_KEY: /keys/sync_hot
      HOT_SSH_PORT: ${HOT_SSH_PORT:-22}
      CAPTURE_SSH_KEY: /keys/sync_capture
      JOURNAL_SSH_KEY: /keys/sync_journal
      ARCHIVE_SSH_KNOWN_HOSTS: /keys/known_hosts
      ARCHIVE_SSH_PORT: ${ARCHIVE_SSH_PORT:-10022}
      # Default declared here, not left to chance: the NAS `.env` never defined this, so compose
      # substituted the empty string and the hourly cadence held only because pull-entrypoint.sh
      # falls back to `${ARCHIVE_PULL_INTERVAL:-3600}`. Correct by accident is not correct -- and the
      # dead-man alert's 3h window is sized against this hourly cadence (infra/grafana/alerts.yaml).
      ARCHIVE_PULL_INTERVAL: ${ARCHIVE_PULL_INTERVAL:-3600}
      GATE_TEXTFILE: /textfile/gate.prom
      # Spec 00102 D7: full re-hashes every segment each cycle; incremental hashes rsync's
      # transfers plus a rotating 1/24 slice. Flipping it is a config-only converge (no image
      # re-pin) and the rollback is the same flip.
      ARCHIVE_PULL_HASH_SCOPE: ${ARCHIVE_PULL_HASH_SCOPE:-full}
      GATE_HEALTHCHECK_URL: ${GATE_HEALTHCHECK_URL:-}
    volumes:
      - /volume1/ZhaoCrypto:/archive
      - ./pull-entrypoint.sh:/opt/pull-entrypoint.sh:ro
      - ./keys:/keys:ro
      - ./zcrypto.toml:/app/zcrypto.toml:ro
      - /volume1/docker/zcrypto-archive/textfile:/textfile
    # journald, not json-file (00068 D6/T8): this container's stdout now reaches Grafana Cloud
    # through the host journal + `loki.source.journal` (config.alloy), alongside Alloy's own
    # stream -- so its stdout has no json.log to rotate any more.
    logging:
      driver: journald

  # NAS telemetry stack (spec 00049 Role B): Grafana Alloy ships host metrics and both containers'
  # logs to Grafana Cloud, under plain `docker compose` with no ansible or systemd here. Both
  # containers log through the journald driver and Alloy reads the host journal, so nothing in this
  # stack holds Docker API access -- which is what keeps T0042's docker-socket residual closed. See
  # infra/nas/config.alloy and infra/nas/README.md.
  alloy:
    # The Alloy digest pin arrives the same way, with the same `:?` refuse-to-start trap: a
    # committed `:latest` only HAPPENED to resolve to the deployed digest (T0056).
    image: ${ALLOY_IMAGE:?set by the ansible-rendered .env — the alloy digest pin}
    container_name: grafana-alloy
    restart: unless-stopped
    # Run as the dedicated non-root, non-secret-owning user created on the NAS at deploy. §8 posture
    # and T0030: WITHOUT a `user:` override the upstream image runs as ROOT and the /host/root:ro
    # mount below would expose every 0600 host secret. The image's built-in uid cannot be used,
    # because it is not a Synology-recognised user and the DSM ACL then denies it write to the
    # persistent alloy-data mount, so Alloy crash-loops. This uid is a real DSM user and is NOT the
    # owner of the 0600 rrsync pull keys, so a compromised Alloy cannot read them through
    # /host/root. Its gid IS the key-owning group, so that protection rests on the keys being 0600
    # rather than on group isolation -- keep the keys 0600.
    user: "1031:1000"
    # The supplementary gid is DSM's `log` group, which owns the volatile journal this stack reads:
    # DSM's group model has no systemd-journal at all, and the persistent journal path is empty
    # here. Without it, the container's only group cannot read those files and the journal pipeline
    # would silently ship nothing. It grants journal read ONLY -- no Docker API access, so T0042's
    # residual stays closed.
    group_add: ["19"]
    network_mode: host
    environment:
      # Go's GC otherwise overshoots a small `memory` cap under default behavior (00043).
      GOMEMLIMIT: 460MiB
    env_file:
      # Grafana Cloud remote_write + Loki creds (GRAFANA_PROM_URL/USERNAME/PASSWORD,
      # GRAFANA_LOKI_URL/USERNAME/PASSWORD) -- rendered by the nas role from
      # group_vars/observed/vault.yml since T0056 (0600, never committed; rotate in the vault and
      # re-converge, never hand-place). See infra/nas/README.md.
      - ./alloy-secrets.env
    command:
      - run
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      # Alternate-path RO mounts (mounting over Alloy's own container /proc//sys is impossible) --
      # config.alloy points procfs_path/sysfs_path/rootfs_path at these.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # No `/var/lib/docker` mount: on DSM the Docker root is root-only and unreadable by the non-
      # root Alloy, and cadvisor -- the only component that would use it -- is not run here at all,
      # because it SIGSEGVs on DSM's cgroup-less kernel. Host metrics come from the unix exporter's
      # /host mounts. This is the same shared textfile dir archive-pull mounts read-write.
      - /volume1/docker/zcrypto-archive/textfile:/textfile:ro
      # The DIRECTORY, not the file. A single-file bind mount binds the inode, so a later atomic
      # rewrite of config.alloy leaves this container reading a file no longer in the host tree --
      # silently, for its whole lifetime. Its own dir rather than the project dir, which holds the
      # rendered .env with the digest pins. The role's apply tasks run `compose up -d`, which
      # recreates Alloy because the volume spec is part of the service-config hash.
      - ./conf:/etc/alloy:ro
      # RW: the remote_write WAL + Loki log positions must survive container replacement, or a
      # redeploy re-ships the retained log backlog into the ingest quota (00043).
      - ./alloy-data:/var/lib/alloy
      # The host's VOLATILE journal: the persistent path other hosts read is empty on DSM, so this
      # is the only path carrying entries here. Both containers' logs arrive through it, via the
      # journald driver on both services above.
      - /run/log/journal:/host/journal:ro
      # Journal readers resolve the CURRENT boot's files via the host's machine id
      # (/run/log/journal/<machine-id>/...) -- without this mount the reader sees an empty journal.
      - /etc/machine-id:/etc/machine-id:ro
    deploy:
      resources:
        limits:
          # No `cpus:`/`cpu_shares:` -- the Synology DSM kernel has no CPU cgroup; `GOMEMLIMIT`
          # above bounds Alloy's Go heap regardless.
          memory: 512m
    # journald, not json-file (00068 D6/T8): Alloy's own logs now reach Grafana Cloud through the
    # same journal + `loki.source.journal` pipeline (config.alloy) that carries archive-pull's
    # lines too -- so its stdout has no json.log to rotate any more.
    logging:
      driver: journald
