# The NAS archive-pull stack (spec 00048 Role A) — always-on pull + hash-verify of the VPS
# capture segments + engine journal into /volume1/ZhaoCrypto. Runs standalone under Synology
# Container Manager (no Ansible rendering, no NAS-OS config — plain `docker compose up -d`; see
# infra/nas/README.md for the deploy steps and the env-var contract).
services:
  archive-pull:
    # Pin this to a digest at deploy time (plan Task 6) -- the same x86 image the VPS capture
    # daemon runs; it already contains the `zcrypto` CLI, so no separate NAS build is needed.
    image: ghcr.io/zhaow-de/zcrypto-capture:latest
    entrypoint: ["/opt/pull-entrypoint.sh"]
    user: "1000:1000"
    restart: unless-stopped
    environment:
      CAPTURE_SOURCE: ${CAPTURE_SOURCE}
      CAPTURE_DEST: ${CAPTURE_DEST:-/archive/capture-segments}
      # Role C (spec 00050): the redundant secondary's mirror, pulled over its OWN least-privilege
      # rrsync channel (`sync_capture_red`) into its OWN root -- the two raw mirrors are never mixed,
      # because the reconciler needs both as independent witnesses. Leave CAPTURE_RED_SOURCE unset and
      # both the secondary pull and the reconcile step are skipped entirely (pull-entrypoint.sh), so
      # this compose file stays valid on a NAS that has not been given the red channel yet.
      CAPTURE_RED_SOURCE: ${CAPTURE_RED_SOURCE:-}
      CAPTURE_RED_DEST: ${CAPTURE_RED_DEST:-/archive/capture-segments-red}
      CAPTURE_RED_SSH_KEY: /keys/sync_capture_red
      # The healed overlay. Primary stays canonical-by-default; only HEALED hours are written here,
      # plus the append-only ledger. Readers resolve reconciled-first, primary-final otherwise
      # (cli/archive/reader.py). Kept off both raw mirrors on purpose: the raw primary is the T0003
      # exit bar's only input, and the overlay heals gaps by design, so mixing them would launder the
      # very gaps the exit bar exists to measure.
      RECONCILED_DEST: ${RECONCILED_DEST:-/archive/capture-reconciled}
      RECONCILE_TEXTFILE: /textfile/reconcile.prom
      # DETECT-ONLY until T0039's soak pins this from real cross-host data. The default is deliberately
      # 2x the measured 14.78 s single-host maximum natural quiescence; one secondary update row is
      # enough to witness a gap, so a per-connection coalescing artifact could otherwise trip a phantom
      # splice -- an unaudited data swap into an archive that cannot be backfilled.
      RECONCILE_MIN_GAP_SECONDS: ${RECONCILE_MIN_GAP_SECONDS:-30}
      RECONCILE_WINDOW_HOURS: ${RECONCILE_WINDOW_HOURS:-48}
      JOURNAL_SOURCE: ${JOURNAL_SOURCE}
      JOURNAL_DEST: ${JOURNAL_DEST:-/archive/engine-journal}
      CAPTURE_SSH_KEY: /keys/sync_capture
      JOURNAL_SSH_KEY: /keys/sync_journal
      ARCHIVE_SSH_KNOWN_HOSTS: /keys/known_hosts
      ARCHIVE_SSH_PORT: ${ARCHIVE_SSH_PORT:-10022}
      # Default declared here, not left to chance: the NAS `.env` never defined this, so compose
      # substituted the empty string and the hourly cadence held only because pull-entrypoint.sh
      # falls back to `${ARCHIVE_PULL_INTERVAL:-3600}`. Correct by accident is not correct -- and the
      # dead-man alert's 3h window is sized against this hourly cadence (infra/grafana/alerts.yaml).
      ARCHIVE_PULL_INTERVAL: ${ARCHIVE_PULL_INTERVAL:-3600}
      GATE_TEXTFILE: /textfile/gate.prom
      GATE_HEALTHCHECK_URL: ${GATE_HEALTHCHECK_URL:-}
    volumes:
      - /volume1/ZhaoCrypto:/archive
      - ./pull-entrypoint.sh:/opt/pull-entrypoint.sh:ro
      - ./keys:/keys:ro
      - ./zcrypto.toml:/app/zcrypto.toml:ro
      - /volume1/docker/zcrypto-archive/textfile:/textfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # NAS telemetry stack (spec 00049 Role B, Task 3) — Grafana Alloy ships host metrics and the
  # container logs to the already-provisioned Grafana Cloud instance. Adapted from
  # docs/specs/00043-observability-design.md (the VPS counterpart) for plain `docker compose` under
  # Container Manager -- no ansible/systemd here. See infra/nas/config.alloy for the Alloy pipeline
  # and infra/nas/README.md for the deploy steps + secrets file + resource-budget rationale.
  #
  # A GET-only docker-socket-proxy (tecnativa) used to sit between Alloy and the socket, with POST=0
  # as the boundary. It was REMOVED on 2026-07-14 (owner's decision) because it corrupted the logs it
  # existed to carry: its HAProxy `timeout client/server 10m` cut Docker's long-lived
  # /containers/<id>/logs?follow=1 stream whenever a container went quiet, Alloy reconnected with an
  # inclusive `since=<second>`, and Docker re-sent the last line -- so on a quiet container the SAME
  # line was re-ingested every 10 minutes forever (measured: 2 lines in Docker, 5 entries in Loki).
  # Upstream had already special-cased /events with `timeout server 0` and simply missed the logs
  # endpoint. Accepted residual: Alloy now holds root-equivalent Docker access (the API can create a
  # privileged container regardless of the `:ro` on the socket mount), so a compromised Alloy could
  # reach the rrsync keys that pull from the capture VPS. See T0042 -- revisit before go-live.
  alloy:
    # Pin this to a digest at deploy time (plan Task 3) -- resolved offline here, no registry
    # access; see infra/nas/README.md.
    image: grafana/alloy:latest
    restart: unless-stopped
    # Run as the dedicated non-root, non-secret-owning user `zcrypto-dummy` (uid 1031, gid 1000 -- the
    # `zcrypto` group -- created on the NAS at deploy). §8 posture + T0030: WITHOUT a `user:` override
    # the upstream grafana/alloy image runs as ROOT, and the /host/root:ro mount below would expose
    # every 0600 host secret. The image's built-in uid-473 user can't be used -- 473 is not a
    # Synology-recognized user, so the DSM ACL denies it write to the persistent alloy-data mount
    # (Alloy crash-loops on `mkdir /var/lib/alloy/...: permission denied`). uid 1031 is a real DSM
    # user, so it writes alloy-data (chmod 0775 + chown 1031:1000 at deploy), and -- crucially -- it
    # is NOT the owner of the 0600 rrsync pull keys (owner is uid 1000), so a compromised Alloy cannot
    # read them through /host/root (this closes T0030). Note gid 1000 IS the key-owning group, so the
    # protection rests on the keys being 0600 -- owner-only, group has no read (verified live) -- not
    # on group isolation; keep the keys 0600. See infra/nas/README.md.
    user: "1031:1000"
    # /var/run/docker.sock is root:root 0660, so a non-root Alloy cannot open it without a
    # supplementary group. Add gid 0 rather than running Alloy AS root: uid stays 1031, so the
    # /host/root:ro mount below still cannot read the 0600 rrsync keys (owner uid 1000, group has no
    # read) -- T0030's protection survives. This is defence in depth only: anything holding the Docker
    # API is root-equivalent by definition, which is the residual T0042 records.
    group_add:
      - "0"
    network_mode: host
    environment:
      # Go's GC otherwise overshoots a small `memory` cap under default behavior (00043).
      GOMEMLIMIT: 460MiB
    env_file:
      # Grafana Cloud remote_write + Loki creds (GRAFANA_PROM_URL/USERNAME/PASSWORD,
      # GRAFANA_LOKI_URL/USERNAME/PASSWORD) -- 0600, distributed out-of-band, never committed.
      # See infra/nas/README.md.
      - ./alloy-secrets.env
    command:
      - run
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      # Alternate-path RO mounts (mounting over Alloy's own container /proc//sys is impossible) --
      # config.alloy points procfs_path/sysfs_path/rootfs_path at these.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # Docker API, for discovery.docker + loki.source.docker. `:ro` is cosmetic -- it makes the
      # socket FILE read-only, not the API -- see the residual noted at the top of this service.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # No `/var/lib/docker` mount: on Synology DSM the Docker root is /volume1/@docker (root-only),
      # unreadable by the non-root Alloy -- and cadvisor (the only component that would use it) is not
      # run here at all (see config.alloy: it SIGSEGVs on DSM's cgroup-less kernel). Host metrics (the
      # requested load / netdev / disk-free) come from the unix exporter's /host mounts, not here.
      # Same shared textfile dir Task 2's archive-pull mounts RW and writes gate.prom into.
      - /volume1/docker/zcrypto-archive/textfile:/textfile:ro
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # RW: the remote_write WAL + Loki log positions must survive container replacement, or a
      # redeploy re-ships the retained log backlog into the ingest quota (00043).
      - ./alloy-data:/var/lib/alloy
    deploy:
      resources:
        limits:
          # No `cpus:`/`cpu_shares:` -- the Synology DSM kernel has no CPU cgroup (see the
          # socket-proxy service); `GOMEMLIMIT` above bounds Alloy's Go heap regardless.
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
