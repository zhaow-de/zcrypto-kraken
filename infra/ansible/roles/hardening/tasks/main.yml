# bootstrap.yml leaves a temporary sshd drop-in behind (/etc/ssh/sshd_config.d/10-zcrypto.conf,
# "Port 22" + "Port 10022") so 10022 can be verified before 22 is retired. devsec.hardening's
# ssh_hardening below replaces /etc/ssh/sshd_config wholesale with no "Include" directive, orphaning
# it — removed explicitly so no stale file still claims port 22 is open.
- name: remove stale sshd drop-ins (orphaned once ssh_hardening owns the whole file)
  ansible.builtin.file:
    path: "/etc/ssh/sshd_config.d/{{ item }}"
    state: absent
  loop: "{{ hardening_stale_sshd_dropins }}"

# Root SSH stays enabled KEY-ONLY (PermitRootLogin prohibit-password) as the operator's break-glass
# path — decided 2026-07-14 (spec 00050 review). The operator installs the master pubkey
# (`zhaow-master-2018`) MANUALLY at each node's bootstrap; ansible must never manage or purge
# /root/.ssh/authorized_keys (a purge task here once deleted the hand-installed key).

- name: apply devsec.hardening.os_hardening baseline (+ sysctl extras not already covered)
  ansible.builtin.include_role:
    name: devsec.hardening.os_hardening
  vars:
    sysctl_overwrite: "{{ hardening_extra_sysctl }}"
    # Keep ttyS0 — the provider's serial console (Linode Lish/Glish), the operator's last
    # break-glass path when SSH is unreachable. The devsec default omits it, so without this
    # every converge would silently strip the hand-added entry (same class of bug as purging
    # /root/.ssh/authorized_keys). Decided 2026-07-14 with the key-only root SSH posture.
    os_auth_root_ttys: "{{ hardening_root_ttys }}"

- name: apply devsec.hardening.ssh_hardening baseline (port 10022, key-only, root key-only)
  ansible.builtin.include_role:
    name: devsec.hardening.ssh_hardening
  vars:
    ssh_server_ports: ["{{ hardening_ssh_port }}"]
    ssh_permit_root_login: "prohibit-password"
    ssh_server_password_login: false
    ssh_pubkey_authentication: true
    ssh_allow_users: "{{ hardening_ssh_allow_users }}"
    ssh_listen_to: "{{ hardening_ssh_listen_to }}"
