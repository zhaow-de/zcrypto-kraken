hardening_stale_sshd_dropins:
  - "10-zcrypto.conf"

hardening_ssh_port: "10022"
# AllowUsers (spec 00057 D1, T0068): zcrypto-data is the m2m pull user the NAS connects as — sshd
# gates AllowUsers at session setup BEFORE the forced command, so it must be listed even though the
# account only ever runs an rrsync forced command; zcrypto-deploy is the admin/Ansible user; root is
# the key-only break-glass — never drop it. The transitional `deploy` entry was dropped once both
# capture hosts were renamed (2026-07-19) — leaving it would silently re-admit a resurrected `deploy`.
# A virgin host is bootstrapped straight to zcrypto-deploy, so this value is correct there too.
hardening_ssh_allow_users: zcrypto-data zcrypto-deploy root

# devsec.hardening.ssh_hardening hard-codes ssh_listen_to: [0.0.0.0] by default even though
# network_ipv6_enable defaults to true (AddressFamily any) — list both explicitly so sshd
# keeps listening on IPv6 too, matching the host's dual-stack bootstrap state instead of
# silently narrowing to IPv4-only.
hardening_ssh_listen_to:
  - 0.0.0.0
  - "::"

# devsec.hardening.os_hardening's default sysctl_config already covers kptr_restrict=2,
# rp_filter=1, tcp_syncookies=1, randomize_va_space=2, and disabling ip forwarding /
# redirects / source-routing. These two are the actual gaps against the spec's list:
# dmesg_restrict isn't set by the role at all, and its ptrace_scope default (2, admin-only)
# is stricter than the ptrace_scope=1 the spec asks for — merged in via sysctl_overwrite.
#
# net.ipv4.ip_forward MUST stay 1: this is a Docker host, and container↔internet egress needs
# kernel IP forwarding (Docker's default bridge is IPv4-NAT). os_hardening's CIS default disables
# it (0); we override to 1 so forwarding is persisted here rather than left to the docker daemon
# to re-enable at runtime — that ordering is fragile and a hardening-only converge broke it
# (ip_forward went to 0, all container egress died) until this override was added.
hardening_extra_sysctl:
  kernel.dmesg_restrict: 1
  kernel.yama.ptrace_scope: 1
  net.ipv4.ip_forward: 1
# TTYs root may log in on at the console; ttyS0 is the provider serial console (break-glass).
hardening_root_ttys: [console, tty1, tty2, tty3, tty4, tty5, tty6, ttyS0]
