hardening_stale_sshd_dropins:
  - "10-zcrypto.conf"

hardening_ssh_port: "10022"
# AllowUsers (spec 00057 D1, T0068). sshd gates AllowUsers at session setup BEFORE the forced
# command, so zcrypto-data must be listed even though it only ever runs an rrsync forced command.
# zcrypto-deploy is the admin and Ansible user, and root is the key-only break-glass -- never drop
# it.
hardening_ssh_allow_users: zcrypto-data zcrypto-deploy root

# devsec.hardening.ssh_hardening hard-codes ssh_listen_to: [0.0.0.0] by default even though
# network_ipv6_enable defaults to true (AddressFamily any) — list both explicitly so sshd
# keeps listening on IPv6 too, matching the host's dual-stack bootstrap state instead of
# silently narrowing to IPv4-only.
hardening_ssh_listen_to:
  - 0.0.0.0
  - "::"

# The two gaps against the spec's list, merged over os_hardening's own sysctl defaults, which do not
# set dmesg_restrict and default ptrace_scope to 2 where the spec asks 1. net.ipv4.ip_forward MUST
# stay 1 -- this is a Docker host, container egress needs kernel forwarding, and the role's default
# is 0.
hardening_extra_sysctl:
  kernel.dmesg_restrict: 1
  kernel.yama.ptrace_scope: 1
  net.ipv4.ip_forward: 1
# TTYs root may log in on at the console; ttyS0 is the provider serial console (break-glass).
hardening_root_ttys: [console, tty1, tty2, tty3, tty4, tty5, tty6, ttyS0]
