# Fleet policy, pinned in config (spec 00050; spec 00051; .claude/rules/fleet-deploys.md): no two
# hosts in the capture + ops fleet may ever share an unattended-upgrades reboot slot — a same-night
# kernel reboot would take multiple hosts down at once, and a book gap with no surviving witness is
# permanent.
#
# It reads the slots from `hostvars`, so every capture/ops host must declare its own in host_vars:
# `hostvars` resolves inventory/group/host vars and facts but NOT role defaults, so a host relying
# on this role's default is `UNDECLARED` here — checked explicitly rather than silently skipped.
# Declared in inventory (not set_fact'd), the check also survives `--limit`, which is exactly when
# a single-host converge could otherwise collide the fleet unseen.
- name: assert the fleet's maintenance windows do not collide
  ansible.builtin.assert:
    that:
      - "'UNDECLARED' not in base_fleet_reboot_times"
      - base_fleet_reboot_times | unique | list | length == base_fleet_reboot_times | length
    fail_msg: >-
      fleet hosts {{ base_fleet_hosts }} have colliding or undeclared reboot windows
      ({{ base_fleet_reboot_times }}). Give each host its own slot in host_vars via
      base_unattended_upgrades_reboot_time (>= 1 h apart, off the hour boundary, >= 1 h from a 4h
      bar boundary — measure from the archive, see .claude/rules/fleet-deploys.md).
    success_msg: "fleet maintenance windows are distinct: {{ base_fleet_reboot_times }}"
  vars:
    base_fleet_hosts: "{{ (groups['capture_host'] | default([])) + (groups['ops_host'] | default([])) }}"
    base_fleet_reboot_times: >-
      {{ base_fleet_hosts | map('extract', hostvars)
         | map(attribute='base_unattended_upgrades_reboot_time', default='UNDECLARED') | list }}
  run_once: true
  when: inventory_hostname in base_fleet_hosts

- name: set timezone to UTC
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: set the system hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"

- name: ensure the hostname resolves locally (avoid sudo "unable to resolve host" warnings)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\b'
    line: "127.0.1.1 {{ base_hostname }}"
    state: present

- name: install base utility packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: configure unattended-upgrades — security pocket, auto-reboot, mail on failure only
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: enable periodic apt update + unattended-upgrade runs
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: enable + start unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: create the zcrypto-data system user (rrsync-only shell, home = its state dir)
  ansible.builtin.user:
    name: "{{ base_capture_user }}"
    system: true
    # the capture user now also SERVES the NAS pulls — spec 00057 — so it needs the rrsync-only
    # wrapper, not nologin; the wrapper file is deployed by the capture role in the same converge
    shell: "{{ base_capture_shell }}"
    home: "{{ base_capture_data_dir }}"
    create_home: false
    state: present
  # Capture hosts ONLY. The ops node also runs `base`, but it owns its OWN `zcrypto-data` (the ops
  # role — home /home/zcrypto-data, holding its four rrsync pull-channel keys). Without this guard,
  # base would `usermod -d` that same-named m2m user's home to the capture state dir on the next ops
  # converge — no `-m`, so its authorized_keys is orphaned and all four NAS->ops pulls are denied
  # (spec 00057; the rename kraken-capture->zcrypto-data introduced the name collision).
  when: inventory_hostname in groups['capture_host']

- name: ensure the capture state dir exists and is owned by zcrypto-data
  ansible.builtin.file:
    path: "{{ base_capture_data_dir }}"
    state: directory
    owner: "{{ base_capture_user }}"
    group: "{{ base_capture_user }}"
    mode: "0750"
  when: inventory_hostname in groups['capture_host']  # capture-only, same reason as the user above

# T0089: the `/var/log/zcrypto-capture` directory task that stood here existed solely as the
# removed policy's `olddir` and had no other consumer, so it goes with it. The archives already
# written there are deliberately left in place (spec 00043: historical data; cleaning them, if
# ever, is an attended call) — `state: directory` only ensured existence, so dropping the task
# touches nothing on disk.
#
# T0089: this used to install a daily `copytruncate` logrotate policy over
# /var/lib/docker/containers/*/*-json.log. `copytruncate` truncates a file dockerd holds open,
# which leaves its json-file reader unable to serve that container's logs -- the container then
# ships nothing to Loki and `docker logs` hangs. Measured 2026-07-21: six long-lived containers
# wedged across all three base-role hosts. Docker already rotates these itself, by RENAME, which
# readers follow safely, and every long-lived container sets its own caps (50m/5 capture + engine,
# 10m/3 the Alloys and the liquidations poller; 50m/3 daemon-wide for anything else) -- so the
# policy was redundant as well as harmful. Spec 00043 §Logs called for exactly this removal and
# named this exact risk; it never landed because it was assigned to an `obs` role that was never
# built. Never logrotate a live docker json log.
#
# `state: absent` rather than a plain deletion: the file persists on every host that already has
# it, and a deleted task would leave it there rotating forever. Drop this task once every host has
# converged past it (check: /etc/logrotate.d/zcrypto-capture-docker absent fleet-wide).
- name: remove the docker json-log logrotate policy (copytruncate wedges dockerd's readers)
  ansible.builtin.file:
    path: /etc/logrotate.d/zcrypto-capture-docker
    state: absent
