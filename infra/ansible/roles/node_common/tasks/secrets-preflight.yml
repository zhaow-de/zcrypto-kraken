---
- name: refuse a missing or misshapen secret, naming the key and never the value
  ansible.builtin.assert:
    that: node_common_secrets_preflight_faults | length == 0
    fail_msg: >-
      {{ node_common_secrets_preflight_faults | join(', ') }} in {{ node_common_secrets_preflight_file }}: missing, or
      not the shape its source writes (no trailing newline): {{ node_common_secrets_preflight_runbook }}.
  vars:
    node_common_secrets_preflight_faults: >-
      {%- set found = namespace(faults=[]) -%}
      {%- for entry in node_common_secrets_preflight -%}
      {%- if lookup('vars', entry.key, default='') is not match(entry.shape) -%}
      {%- set found.faults = found.faults + [entry.key] -%}
      {%- endif -%}
      {%- endfor -%}
      {{- found.faults -}}
