# Deliberately "reloaded", not "restarted": Debian's nftables.service sets ExecStop to `nft flush
# ruleset`, so a restart would go briefly wide open, while ExecReload re-applies /etc/nftables.conf
# as one atomic transaction.
- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
