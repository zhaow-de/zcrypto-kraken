# The access_ops role (spec 00075): the ops-node end of the zaccess WireGuard link -- WG client,
# the NAS relay, the managed tmux conf (D15), and the ops-side tunnel/cert probe (D11/D12).

# The G1 relay makes THIS host's sshd internet-reachable, and D6's byte-copy relay rewrites the
# client source, so per-IP throttling is impossible on this path and fail2ban cannot see the real
# attacker. Password auth here would be unthrottled, source-anonymized internet guessing against the
# box holding the live session, so key-only is forced. The ops node otherwise runs no sshd hardening
# role by owner choice: this is the minimum the internet exposure demands, not the full baseline.
- name: ops sshd -- key-only, no password auth (the G1 relay exposes :22 to the internet)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-zaccess-ops.conf
    content: |
      # Managed by the `access_ops` role (spec 00075 G1) -- do not hand-edit.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    mode: '0644'
    validate: 'sshd -t -f %s'
  notify: reload sshd

- name: wireguard dependencies (ops needs wg-quick/wg show too -- the access role installs it only on the bridgehead)
  ansible.builtin.apt: {name: [wireguard-tools], state: present}

- name: wireguard client conf
  ansible.builtin.template:
    src: zaccess0.conf.j2
    dest: /etc/wireguard/zaccess0.conf
    mode: '0600'
  no_log: true # renders the WireGuard private key -- keep it out of --diff output
  notify: restart wg-quick@zaccess0
- name: wireguard tunnel enabled
  ansible.builtin.systemd: {name: wg-quick@zaccess0, enabled: true, state: started}

# Two tasks, not one `loop: [socket, service]`: a loop assigns its whole notify list to EVERY item
# and gates notification on the AGGREGATE changed result, so a service-only edit would also fire the
# socket handler -- and the service's `Requires=` propagates that restart, bouncing the live relay
# twice per converge. spec 00075 D6.
- name: nas relay socket unit (systemd-socket-proxyd, no NAT/forwarding)
  ansible.builtin.template:
    src: zaccess-nas-proxy.socket.j2
    dest: /etc/systemd/system/zaccess-nas-proxy.socket
    mode: '0644'
  notify: [reload systemd, restart zaccess-nas-proxy.socket]
- name: nas relay service unit (relays the socket above to the NAS on the home LAN)
  ansible.builtin.template:
    src: zaccess-nas-proxy.service.j2
    dest: /etc/systemd/system/zaccess-nas-proxy.service
    mode: '0644'
  notify: [reload systemd, restart zaccess-nas-proxy]
- name: nas relay socket enabled
  ansible.builtin.systemd: {name: zaccess-nas-proxy.socket, enabled: true, state: started, daemon_reload: true}

# spec 00075 D15.
- name: managed ~/.tmux.conf for zhaow (hand edits are overwritten by design)
  ansible.builtin.template:
    src: tmux.conf.j2
    dest: /home/zhaow/.tmux.conf
    owner: zhaow
    group: zhaow
    mode: '0644'
  notify: source tmux conf

- name: ops-side probe script
  ansible.builtin.template:
    src: zaccess-probe-ops.sh.j2
    dest: /usr/local/sbin/zaccess-probe-ops
    mode: '0755'
- name: ops-side probe service + timer
  ansible.builtin.template:
    src: "zaccess-probe-ops.{{ item }}.j2"
    dest: "/etc/systemd/system/zaccess-probe-ops.{{ item }}"
    mode: '0644'
  loop: [service, timer]
  notify: reload systemd
- name: ops-side probe timer enabled
  ansible.builtin.systemd: {name: zaccess-probe-ops.timer, enabled: true, state: started, daemon_reload: true}

# Idempotency is keyed on the pinned version being present under nvm's CURRENT node, not on a
# hardcoded path, which `creates:` would pin. `npm ls` exits non-zero when the exact version is
# absent -- after a node upgrade moved the global bin, say -- which re-triggers the install for the
# new node. community.general.npm cannot be used: a user-scope global install needs nvm's node
# prefix on PATH and the module has no hook to source nvm.sh first. spec 00075 D13, gate G2.
- name: agentboard -- is the pinned version present under nvm's current node?
  ansible.builtin.command:
    cmd: >-
      bash -c 'source {{ access_ops_agentboard_nvm_sh }} &&
      npm ls -g @gbasin/agentboard@{{ access_ops_agentboard_version }} --depth=0'
  register: access_ops_agentboard_present
  changed_when: false
  failed_when: false
  become: true
  become_user: zhaow

- name: agentboard -- install the pinned version into nvm's current global bin
  ansible.builtin.command:
    cmd: >-
      bash -c 'source {{ access_ops_agentboard_nvm_sh }} &&
      npm install -g @gbasin/agentboard@{{ access_ops_agentboard_version }}'
  when: access_ops_agentboard_present.rc != 0
  changed_when: true # only runs when the pinned version is absent, and then it installs
  become: true
  become_user: zhaow

# Rendered ahead of the unit that ExecStarts it and notifying nothing on purpose: a changed script
# takes effect at the next restart the operator chooses.
#
# That is NOT "a converge cannot restart agentboard", and the difference is why KillMode=process
# matters. No task or handler here restarts the unit, but `zaccess-agentboard.service` declares
# `Requires=wg-quick@zaccess0.service` and the wireguard template above notifies a restart of it,
# which systemd propagates. So a tunnel-conf change DOES restart agentboard -- and the notifying
# task is `no_log: true`, so it shows as `changed` with no diff to warn you. Under the unit's old
# default KillMode that path reached the operator's tmux server, from an ordinary tag-scoped
# converge rather than only from a hand restart.
- name: agentboard start script (execs the server as MainPID so KillMode=process is correct)
  ansible.builtin.template:
    src: zaccess-agentboard-start.sh.j2
    dest: /usr/local/sbin/zaccess-agentboard-start
    mode: '0755'
# spec 00075 D13, gate G2.
- name: agentboard unit rendered (web terminal, tunnel-bound)
  ansible.builtin.template:
    src: zaccess-agentboard.service.j2
    dest: /etc/systemd/system/zaccess-agentboard.service
    mode: '0644'
  notify: reload systemd
# Gated on `access_ops_agentboard_live` (D13) rather than hardcoded: a converge must never bring the
# web terminal live on its own, and a fixed enabled state would fight whatever the owner set by
# hand. False converges to disabled and stopped every time, so a reboot cannot auto-start it via
# `WantedBy=`.
- name: agentboard unit state — gated on the spike (access_ops_agentboard_live)
  ansible.builtin.systemd:
    name: zaccess-agentboard.service
    enabled: "{{ access_ops_agentboard_live | bool }}"
    state: "{{ 'started' if (access_ops_agentboard_live | bool) else 'stopped' }}"
    daemon_reload: true
