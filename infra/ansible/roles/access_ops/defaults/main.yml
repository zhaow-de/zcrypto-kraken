---
# Defaults for the `access_ops` role (spec 00075): the ops-node end of the zaccess WireGuard link.

# Mirrors access_wg_listen_port in the `access` role's defaults -- same value, a role-prefixed name
# here (ansible-lint var-naming) -- the client's Endpoint port must match the server's ListenPort;
# defined here too rather than shared, so this role carries no cross-role variable dependency.
access_ops_wg_listen_port: 51820

# agentboard (spec 00075 D13 -- G2, web terminal onto the operator tmux). Pinned + spike-gated: the
# owner runs the D13 spike (scratch-prefix install, decoy-session destructive-capability drill)
# before this role is trusted to install/start the real thing; the role installs the pinned version
# and renders the unit on every converge, but access_ops_agentboard_live below gates whether it is
# ever enabled or started (see access_ops/tasks/main.yml).
access_ops_agentboard_version: "0.4.8"
# D13 gate -- stays false until the owner's spike proves agentboard cannot hibernate/kill/resize a
# discovered session; the owner sets it true (host_vars or -e) to bring the unit live, and it then
# stays enabled+started idempotently. false also means the unit is explicitly disabled+stopped on
# every converge, so a reboot before the spike passes cannot auto-start it via WantedBy=.
access_ops_agentboard_live: false
# nvm's init script. The unit sources it at START time and execs `agentboard` off the resulting PATH
# (not a converge-time-resolved absolute path), so a node upgrade via nvm -- `nvm install <new>;
# nvm alias default <new>; npm i -g @gbasin/agentboard@<pin>` -- is picked up by a plain
# `systemctl restart zaccess-agentboard`, with no codebase change and no re-converge.
access_ops_agentboard_nvm_sh: "/home/zhaow/.nvm/nvm.sh"
