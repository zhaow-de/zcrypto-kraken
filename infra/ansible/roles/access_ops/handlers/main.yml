---
- name: restart wg-quick@zaccess0
  # wg-quick has no reload -- a restart is the only way to apply a changed conf.
  ansible.builtin.systemd: {name: wg-quick@zaccess0, state: restarted}

- name: reload systemd
  ansible.builtin.systemd: {daemon_reload: true}

- name: restart zaccess-nas-proxy.socket
  # `state: started` on the enable task is a no-op on a running unit, so a changed ListenStream
  # reaches nothing without this. The running proxyd holds a duplicate of the listening fd, so a bare
  # socket restart would risk EADDRINUSE; it does not, because the service's `Requires=` propagates
  # the restart and its `After=` stops the service first, releasing the fd. Ansible runs handlers in
  # DEFINITION order, so this one precedes the service handler regardless of notify order.
  ansible.builtin.systemd: {name: zaccess-nas-proxy.socket, state: restarted}

- name: restart zaccess-nas-proxy
  # Accept=no and no --exit-idle-time, so one long-lived instance holds the socket: a daemon-reload
  # leaves it running the ExecStart it started with. Only a restart applies a changed relay target.
  ansible.builtin.systemd: {name: zaccess-nas-proxy.service, state: restarted}

- name: source tmux conf
  ansible.builtin.command: tmux source-file /home/zhaow/.tmux.conf
  become: true
  become_user: zhaow
  changed_when: false # applies live config, not an idempotent resource -- nothing here for Ansible to track
  failed_when: false # no server running = nothing to apply; the file governs the next start

- name: reload sshd
  # reload, not restart -- keeps live sessions up; the copy task validated with `sshd -t` first.
  ansible.builtin.service: {name: ssh, state: reloaded}
