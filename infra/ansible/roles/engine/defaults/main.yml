---
# The engine reuses the capture image — one image, two services; the rendered compose file
# overrides the entrypoint to start the engine instead of the capture daemon.
engine_image: ghcr.io/zhaow-de/zcrypto-capture

# The pinned image digest to deploy — no sane default; override per-run (or in group_vars) with
# the value from the capture-image workflow's job summary, e.g.:
#   -e engine_image_digest=sha256:<...>
engine_image_digest: ""

engine_state_dir: /var/lib/zcrypto-engine

# Where the journal prune publishes its .prom (spec 00071, T0100). Same path the capture role uses
# -- the engine only ever runs on a capture host -- but declared here so the engine play does not
# depend on the capture play having run first. tests/test_engine_journal_prune.py pins it equal to
# the capture role's value and to the directory Alloy's textfile collector actually reads.
engine_textfile_dir: /var/lib/zcrypto-node-textfile

# Where the workstation's QA'd warm store lives on the controller (ansible runs from the
# workstation); playbook_dir is infra/ansible, so ../.. is the repo root.
engine_store_src: "{{ playbook_dir }}/../../data/engine-store/"

# Resource budget sized to the 2-vCPU/4-GB host with capture as the protected service: capture's
# default cpu_shares (1024) wins CPU contention deterministically over the engine's 512, and the
# combined memory caps (capture 2g + engine 1g) stay under host RAM with OS headroom.
engine_cpu_limit: "0.75"
engine_memory_limit: "1g"
engine_cpu_shares: 512

engine_log_max_size: "50m"
engine_log_max_file: "5"

# healthchecks.io ping URL for the dead-man's switch — vault-supplied (the attended deployment
# vaults it as engine_healthcheck_url); empty means the engine simply skips liveness pings.
engine_healthcheck_url: ""

# Days of engine journal kept on the VPS (spec 00070, T0021; owner ruling 2026-07-26 -- 60, raised
# from the earlier 14). The NAS holds the durable archive and the gate scores THAT copy, so this is
# a local tail. The prune also always keeps the newest N day-dirs regardless of age -- N is this same
# value -- because an empty journal makes the next cycle rebuild the whole book instead of deltas.
engine_journal_retention_days: 60

# [zcrypto.engine] knobs rendered into /opt/zcrypto-engine/zcrypto.toml.
engine_shadow_nav_eur: 1000.0
engine_settle_delay_secs: 90
engine_exec_max_plan_notional_eur: 100.0
