---
# Deploys the shadow engine as a second compose service beside capture -- same image, compose-level
# entrypoint override (spec 00042). Like capture, the unit's own ExecStartPre/ExecStart/ExecStop own
# the actual pull and run; ansible only starts, enables and restarts it.

# The §8-hardening gate asserts before anything else: the probes are read-only and run with
# `check_mode: false`, so a --check dry run still evaluates it, and any failure aborts the role
# before a single secret is rendered.
#
# `noqa: command-instead-of-module` on the systemctl probes: that rule assumes systemctl is MANAGING
# a unit, where the module is idempotent. These read state to feed an assert, and the module would
# act on the thing being observed. Per-task, so a genuine state-managing systemctl elsewhere still
# fails the lint.
- name: "§8 gate — probe nftables enablement (a RemainAfterExit oneshot: is-active alone can be stale)"  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-enabled nftables
  register: engine_gate_nft_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: "§8 gate — probe the live nftables ruleset for content"
  # No pipe, deliberately. As `nft list ruleset | grep -q .` the rc was GREP's alone, so an `nft`
  # that failed while emitting any output still matched and reported 0 -- passing the firewall gate
  # that guards the live trade key on a host whose ruleset could not be read. `set -o pipefail` is
  # NOT the fix: `grep -q` exits on first match, so nft can die of SIGPIPE and the pipeline returns
  # 141 on a HEALTHY host, failing the gate closed; and that outcome races the pipe buffer, so
  # pipefail buys a FLAKY gate rather than a fixed one. Without the pipe the rc is unambiguously
  # nft's own and the non-empty test is an explicit assert below.
  ansible.builtin.command: /usr/sbin/nft list ruleset
  register: engine_gate_nft_ruleset
  changed_when: false
  failed_when: false
  check_mode: false

- name: "§8 gate — assert the firewall posture (nftables enabled + non-empty live ruleset)"
  ansible.builtin.assert:
    that:
      - engine_gate_nft_enabled.rc == 0
      - engine_gate_nft_enabled.stdout | trim == 'enabled'
      - engine_gate_nft_ruleset.rc == 0
      - engine_gate_nft_ruleset.stdout | trim | length > 0
    fail_msg: >-
      §8-hardening gate failed (spec docs/specs/00042-vps-deployment-design.md): nftables must be
      enabled with a non-empty live ruleset before the engine (and its trade key) may land.

- name: "§8 gate — probe fail2ban activity"  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active fail2ban
  register: engine_gate_fail2ban
  changed_when: false
  failed_when: false
  check_mode: false

- name: "§8 gate — assert fail2ban is active"
  ansible.builtin.assert:
    that:
      - engine_gate_fail2ban.rc == 0
      - engine_gate_fail2ban.stdout | trim == 'active'
    fail_msg: >-
      §8-hardening gate failed (spec docs/specs/00042-vps-deployment-design.md): fail2ban must be
      active before the engine (and its trade key) may land.

- name: "§8 gate — probe the unattended-upgrades package"
  ansible.builtin.command: dpkg -s unattended-upgrades
  register: engine_gate_uu_pkg
  changed_when: false
  failed_when: false
  check_mode: false

- name: "§8 gate — probe unattended-upgrades enablement"  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-enabled unattended-upgrades
  register: engine_gate_uu_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: "§8 gate — assert unattended-upgrades is installed and enabled"
  ansible.builtin.assert:
    that:
      - engine_gate_uu_pkg.rc == 0
      - engine_gate_uu_enabled.rc == 0
      - engine_gate_uu_enabled.stdout | trim == 'enabled'
    fail_msg: >-
      §8-hardening gate failed (spec docs/specs/00042-vps-deployment-design.md):
      unattended-upgrades must be installed and enabled before the engine (and its trade key)
      may land.

- name: "§8 gate — probe the effective sshd posture"
  ansible.builtin.command: /usr/sbin/sshd -T
  register: engine_gate_sshd
  changed_when: false
  failed_when: false
  check_mode: false

- name: "§8 gate — assert the sshd posture (no root login, no passwords, AllowUsers has zcrypto-data + zcrypto-deploy)"
  ansible.builtin.assert:
    that:
      - engine_gate_sshd.rc == 0
      # `prohibit-password` is accepted alongside `no`: the gate's substance is that no password-
      # based access exists anywhere, and key-only root satisfies it, while `yes` still fails. `sshd
      # -T` normalises it to the legacy alias, so the config value and the effective value spell it
      # differently and both must be accepted or the gate fails on a correctly configured host --
      # which a --check run cannot catch, since check mode never writes sshd_config and `sshd -T`
      # still reports the OLD value.
      - engine_gate_sshd.stdout is search('(?m)^permitrootlogin (no|prohibit-password|without-password)$')
      - engine_gate_sshd.stdout is search('(?m)^passwordauthentication no$')
      # `\\b`, not `\b`: assert `that:` expressions unicode-escape the Jinja string literal, so a
      # single `\b` reaches the regex as a backspace and silently never matches. Superset gate (spec
      # 00057 D1, T0068): both the m2m pull user and the renamed admin must be present in
      # AllowUsers, and deploy or root may also be present -- roles/hardening/defaults/main.yml says
      # why `deploy` must never be re-added.
      - engine_gate_sshd.stdout is search('(?m)^allowusers .*\\bzcrypto-data\\b')
      - engine_gate_sshd.stdout is search('(?m)^allowusers .*\\bzcrypto-deploy\\b')
    fail_msg: >-
      §8-hardening gate failed (spec docs/specs/00042-vps-deployment-design.md): sshd -T must
      report permitrootlogin no|prohibit-password, passwordauthentication no, and allowusers
      containing both zcrypto-data and zcrypto-deploy before the engine (and its trade key) may
      land. Effective posture lines (rc={{ engine_gate_sshd.rc }}):
      {{ engine_gate_sshd.stdout_lines | select("match", "^(allowusers|allowgroups|denyusers|denygroups|permitrootlogin|passwordauthentication)") | list }};
      stderr: {{ engine_gate_sshd.stderr | default("") | trim }}

# spec 00082 converge guards (wave 1), immediately after the §8 gate and before anything is written.
# Probe idiom: probes never fail or change, and the assert refuses with the fix in its message.
# Hoisted out of the compose render it originally guarded so the TARGETED message comes first --
# otherwise the residency preflight answers a forgotten `-e` with a `docker pull` of a ref ending in
# a bare `@`, losing the pointer to where the digest comes from.
- name: fail fast if the pinned engine image digest was not supplied
  ansible.builtin.assert:
    that: engine_image_digest | length > 0
    fail_msg: >-
      engine_image_digest is empty — pass the built image's digest, e.g.
      -e engine_image_digest=sha256:<...> (see the job summary of
      .github/workflows/capture-image.yml — the engine reuses the capture image).

- name: probe — is the pinned digest already on this host
  ansible.builtin.command: docker image inspect "{{ engine_image }}@{{ engine_image_digest }}"
  register: engine_digest_probe
  failed_when: false
  changed_when: false
  check_mode: false

- name: preflight — refuse a digest the host has not pulled
  ansible.builtin.assert:
    that: engine_digest_probe.rc == 0
    fail_msg: >-
      {{ engine_image }}@{{ engine_image_digest }} is not on {{ inventory_hostname }} — the unit's
      ExecStartPre pulls at start, so the stop→start window would contain a registry pull, and that
      window must hold only stop → migration-if-any → start inside the inter-cycle gap. Pre-stage it
      first: sudo docker pull {{ engine_image }}@{{ engine_image_digest }}

- name: probe — the logship secrets file the engine's compose reads at start
  ansible.builtin.stat:
    path: /opt/zcrypto-capture/logship-secrets.env
    get_checksum: false
  register: engine_logship_secrets_stat
  failed_when: false
  changed_when: false
  check_mode: false

- name: preflight — refuse to restart the engine without its logship secrets
  ansible.builtin.assert:
    that: engine_logship_secrets_stat.stat.exists
    fail_msg: >-
      /opt/zcrypto-capture/logship-secrets.env is missing on {{ inventory_hostname }} — its absence
      crash-loops the engine instead of failing the render (the compose mount is required:false, so
      the container starts and then dies for want of the Loki env vars). The capture role renders
      it; run the capture play on this host first, then re-run this converge.

# The :9102 holder is RECORDED, never asserted (spec 00082 D3-6): on every re-converge the engine's
# own container legitimately holds the port, so a refusal would refuse every normal run. What the
# operator needs before a stop→start is WHO holds it, in the play log.
- name: probe — who currently holds the engine's metrics port
  ansible.builtin.command: ss -ltnp sport = :9102
  register: engine_port_probe
  failed_when: false
  changed_when: false
  check_mode: false

- name: record the current metrics-port holder (evidence for the operator, not a refusal)
  ansible.builtin.debug:
    msg: "listeners on 127.0.0.1:9102 before this converge: {{ engine_port_probe.stdout | default('') | trim }}"

- name: probe — the currently-running digest this converge would replace (pins recording)
  ansible.builtin.command: docker inspect --format '{{ "{{" }}.Config.Image{{ "}}" }}' zcrypto-engine
  register: engine_running_digest_probe
  failed_when: false
  changed_when: false
  check_mode: false

- name: read fleet-pins.md from the controller tree
  ansible.builtin.set_fact:
    engine_fleet_pins_text: "{{ lookup('file', playbook_dir ~ '/../../docs/reference/fleet-pins.md') }}"
  when: engine_running_digest_probe.rc == 0

# M3: regex_search yields None (not an error) on a tag-started image ref. default('') does NOT catch
# that -- None is defined, so the filter passes it through -- and replace() stringifies it, making the
# needle the literal 'None', which no pins row carries. Measured: such a ref fails CLOSED, never open.
- name: pins recording — refuse to replace a digest fleet-pins.md does not record
  ansible.builtin.assert:
    that: >-
      ((engine_running_digest_probe.stdout | default('') | regex_search('sha256:[0-9a-f]{12}') | default('') | replace('sha256:', '')) in engine_fleet_pins_text)
      or ((pins_override | default('') | string | length > 8)
          and (pins_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
    fail_msg: >-
      The digest this converge replaces ({{ engine_running_digest_probe.stdout }}) is not recorded in
      docs/reference/fleet-pins.md — an unrecorded pin is one docker-prune from an unrecoverable
      rollback. Record the CURRENT digest there first (or pass -e '{"pins_override": "<reason>"}' and
      record it immediately after).
  when: engine_running_digest_probe.rc == 0 and engine_fleet_pins_text is defined

# spec 00082 D1: the reason reaches the play log only when the override was ACCEPTED, i.e. the
# replaced digest is genuinely unrecorded -- gating on the override merely being PRESENT would print
# a why on runs that overrode nothing. The negated clause below is the assert's own first disjunct
# character-for-character, so an edit to one that is not mirrored in the other shows up as a textual
# mismatch.
- name: pins override accepted — the reason, on the record
  ansible.builtin.debug:
    msg: "pins_override accepted: {{ pins_override }}"
  when: >-
    engine_running_digest_probe.rc == 0 and engine_fleet_pins_text is defined
    and not ((engine_running_digest_probe.stdout | default('') | regex_search('sha256:[0-9a-f]{12}') | default('') | replace('sha256:', '')) in engine_fleet_pins_text)
    and (pins_override | default('') | string | length > 8)
    and (pins_override | default('') | string | lower not in ['true', 'false', '1', 'yes'])

# The cache proxy's image takes the engine image's residency and pins guards; its upstream image carries no
# `zcrypto` command, so it takes neither the engine's preflight nor a bake.
- name: fail fast if the pinned cache proxy image digest was not supplied
  ansible.builtin.assert:
    that: engine_cache_proxy_image_digest | length > 0
    fail_msg: >-
      engine_cache_proxy_image_digest is empty — pass the haproxy index digest docs/reference/fleet-pins.md
      records for cache-proxy on this host, e.g. -e cache_proxy_image_digest=sha256:<...> (read it
      with `docker buildx imagetools inspect haproxy:<version>`), pre-staged on this host.

- name: probe — is the pinned cache proxy digest already on this host
  ansible.builtin.command: docker image inspect "{{ engine_cache_proxy_image }}@{{ engine_cache_proxy_image_digest }}"
  register: engine_cache_proxy_digest_probe
  failed_when: false
  changed_when: false
  check_mode: false

- name: preflight — refuse a cache proxy digest the host has not pulled
  ansible.builtin.assert:
    that: engine_cache_proxy_digest_probe.rc == 0
    fail_msg: >-
      {{ engine_cache_proxy_image }}@{{ engine_cache_proxy_image_digest }} is not on {{ inventory_hostname }} — the
      unit's ExecStartPre pulls at start, and the stop→start window must hold no registry pull.
      Pre-stage it first: sudo docker pull {{ engine_cache_proxy_image }}@{{ engine_cache_proxy_image_digest }}

- name: probe — the currently-running cache proxy digest this converge would replace (pins recording)
  ansible.builtin.command: docker inspect --format '{{ "{{" }}.Config.Image{{ "}}" }}' zcrypto-cache-proxy
  register: engine_cache_proxy_running_probe
  failed_when: false
  changed_when: false
  check_mode: false

- name: read fleet-pins.md from the controller tree (cache proxy)
  ansible.builtin.set_fact:
    engine_cache_proxy_pins_text: "{{ lookup('file', playbook_dir ~ '/../../docs/reference/fleet-pins.md') }}"
  when: engine_cache_proxy_running_probe.rc == 0

- name: cache proxy pins recording — refuse to replace a digest fleet-pins.md does not record
  ansible.builtin.assert:
    that: >-
      ((engine_cache_proxy_running_probe.stdout | default('') | regex_search('sha256:[0-9a-f]{12}') | default('') | replace('sha256:', '')) in engine_cache_proxy_pins_text)
      or ((pins_override | default('') | string | length > 8)
          and (pins_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
    fail_msg: >-
      The cache proxy digest this converge replaces ({{ engine_cache_proxy_running_probe.stdout }}) is
      not recorded in docs/reference/fleet-pins.md — an unrecorded pin is one docker-prune from an
      unrecoverable rollback. Record the CURRENT digest there first (or pass -e '{"pins_override":
      "<reason>"}' and record it immediately after).
  when: engine_cache_proxy_running_probe.rc == 0 and engine_cache_proxy_pins_text is defined

# The engine's echo above, mirrored for the proxy: the negated clause is the assert's first disjunct verbatim.
- name: cache proxy pins override accepted — the reason, on the record
  ansible.builtin.debug:
    msg: "pins_override accepted (cache proxy): {{ pins_override }}"
  when: >-
    engine_cache_proxy_running_probe.rc == 0 and engine_cache_proxy_pins_text is defined
    and not ((engine_cache_proxy_running_probe.stdout | default('') | regex_search('sha256:[0-9a-f]{12}') | default('') | replace('sha256:', '')) in engine_cache_proxy_pins_text)
    and (pins_override | default('') | string | length > 8)
    and (pins_override | default('') | string | lower not in ['true', 'false', '1', 'yes'])

# The two cache secrets this role renders, into engine.env unquoted and into the proxy's quoted check
# line, hold to the cache role's floor too.
- name: refuse a cache password shorter than five characters or outside letters and digits (the engine's two)
  ansible.builtin.assert:
    that: >-
      [cache_engine_password, cache_sentinel_requirepass] | reject('match', '[A-Za-z0-9]{5,}\Z') | list | length == 0
    fail_msg: >-
      {{ ['cache_engine_password', 'cache_sentinel_requirepass'] | zip([cache_engine_password, cache_sentinel_requirepass]) | rejectattr('1', 'match', '[A-Za-z0-9]{5,}\Z') | map('first') | join(', ') }}
      in group_vars/all/vault.yml must be five or more letters and digits. Re-generate it with
      `openssl rand -hex 24 | tr -d '\n' | uv run ansible-vault encrypt_string --stdin-name <key>` and replace its entry.

# The arming backstop: a machine check at the only moment that matters, the converge that would
# actually arm the engine. Until it existed, arming on a nautilus version whose attended order-
# semantics pass had not run was prevented only by prose.
#
# The arming intent is read from the TREE's own template, because that is where arming is expressed
# and there is deliberately no `-e` override for the value. The test is inverted on purpose: a
# converge counts as DISARMED only when the template carries the literal `exec_armed = false`, and
# anything else -- `true`, or a Jinja expression this role cannot evaluate at assert time -- counts
# as ARMED and must clear the gate. Fail-closed, so templating that line cannot silently make the
# guard inert.
- name: arming backstop — read the tree's arming intent, nautilus pin, and verified-version record
  ansible.builtin.set_fact:
    engine_config_template_text: "{{ lookup('file', role_path ~ '/templates/zcrypto.toml.j2') }}"
    engine_pyproject_text: "{{ lookup('file', playbook_dir ~ '/../../pyproject.toml') }}"
    engine_verified_nautilus: "{{ (lookup('file', playbook_dir ~ '/../../cli/engine/order-semantics-verified.json') | from_json).verified_nautilus_versions | default([]) }}"

- name: arming backstop — derive the pinned version and the list the record vouches for
  ansible.builtin.set_fact:
    engine_pinned_nautilus: >-
      {{ engine_pyproject_text | regex_search('nautilus-trader=+[^"= ;]+') | default('', true) | regex_replace('^nautilus-trader=+', '') }}
    engine_verified_list: >-
      {{ engine_verified_nautilus if (engine_verified_nautilus is sequence
          and engine_verified_nautilus is not string
          and engine_verified_nautilus is not mapping
          and (engine_verified_nautilus | reject('string') | list | length == 0)) else [] }}

- name: arming backstop — refuse an ARMED converge on a nautilus version whose order-semantics pass has not run
  ansible.builtin.assert:
    that: >-
      (engine_config_template_text | regex_search('(?m)^exec_armed *= *false *$') is not none)
      or (engine_pinned_nautilus in engine_verified_list)
      or ((arming_override | default('') | string | length > 8)
          and (arming_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
    fail_msg: >-
      This converge renders the engine ARMED on nautilus-trader
      {{ engine_pinned_nautilus | default('(unparseable pin)', true) }},
      whose attended ~EUR 0.20 order-semantics pass has not been recorded in
      cli/engine/order-semantics-verified.json (recorded:
      {{ engine_verified_list | join(', ') | default('(the record is not a list of versions -- nothing is verified)', true) }}).
      The adapter's margin/short/post-only and reconciliation behaviour is native and no test here
      places an order, so this version's order path is unmeasured. Run the probes, write
      docs/reference/adapter-verification/<version>.md, add <version> to the .json — or pass
      -e '{"arming_override": "<why this cannot wait>"}' (a reason, not a flag).

- name: arming override accepted — the reason, on the record
  ansible.builtin.debug:
    msg: "arming_override accepted: {{ arming_override }}"
  when: >-
    not (engine_config_template_text | regex_search('(?m)^exec_armed *= *false *$') is not none)
    and not (engine_pinned_nautilus in engine_verified_list)
    and (arming_override | default('') | string | length > 8)
    and (arming_override | default('') | string | lower not in ['true', 'false', '1', 'yes'])

# --- 2. The zcrypto-engine service account — created by this role itself, deliberately unlike
# zcrypto-data (which the base role creates on capture hosts; renamed from kraken-capture, spec
# 00057): in-role creation keeps `--tags engine` self-sufficient on first deploy.
- name: create the zcrypto-engine system user (nologin, home = its state dir)
  ansible.builtin.user:
    name: zcrypto-engine
    system: true
    shell: /usr/sbin/nologin
    home: "{{ engine_state_dir }}"
    create_home: false
    state: present

- name: look up the zcrypto-engine service account
  ansible.builtin.getent:
    database: passwd
    key: zcrypto-engine
  register: engine_getent
  # First-run check mode: the user task above didn't really create the account, so the lookup
  # legitimately comes up empty — only a real run may fail here.
  failed_when: engine_getent is failed and not ansible_check_mode

- name: derive the zcrypto-engine uid/gid for the container's user mapping
  # On a first-run --check the account doesn't exist yet, so a placeholder keeps the dry-run
  # rendering/diffing; a real converge always re-derives the actual uid/gid before anything is
  # written to the host.
  ansible.builtin.set_fact:
    engine_uid: "{{ engine_passwd['zcrypto-engine'][1] if engine_account_known else 'first-run-check-mode' }}"
    engine_gid: "{{ engine_passwd['zcrypto-engine'][2] if engine_account_known else 'first-run-check-mode' }}"
  vars:
    engine_passwd: "{{ ansible_facts['getent_passwd'] | default({}) }}"
    engine_account_known: "{{ (engine_passwd['zcrypto-engine'] | default(none)) is not none }}"

# --- 3. State directories.
- name: ensure the engine state directories exist (state dir + store + journal)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: zcrypto-engine
    group: zcrypto-engine
    mode: "0750"
  loop:
    - "{{ engine_state_dir }}"
    - "{{ engine_state_dir }}/store"
    - "{{ engine_state_dir }}/journal"

# Store delivery, only when absent: converges never clobber a live store. Run a delivering converge
# after the workstation's `zcrypto engine seed` has returned, never beside it: a mid-write copy could
# deliver a truncated parquet.
#
# VPS store repair, since `zcrypto engine seed` is workstation-only and the image carries no
# canonical dataset (infra/runbooks/engine.md, zcrypto-engine-cycle-stale, holds the procedure):
# repair the leg in the workstation's data/engine-store/ first, since that is the source this copy
# delivers and a re-run delivers it again; then stop the unit, move the store dir aside beside
# itself rather than deleting it (unversioned data has no undo), re-run the engine-tagged converge
# with `-e converge_primary=true`, the digest and `-e '{"engine_preflight_override": "<reason>"}'` with
# the user's approval (the stopped unit's preview finds the store aside and the preflight refuses on its
# missing files), inside the inter-cycle gap and outside a published Kraken maintenance window -- the
# flag is required or the guard drops this host and the engine play silently skips -- so the
# only-when-absent copy re-delivers the workstation's data/engine-store/ and
# this play starts the unit; the aside dir is purged once the refused file has been read and the
# runbook's all-clear by value has landed. A seed or a boundary that refuses naming the REST fetch
# rather than a file is a row the venue itself carries: it is the venue's to answer, nothing was
# written, and no store repair or converge reaches it.
- name: probe whether the store was already delivered (BTC subtree present)
  ansible.builtin.stat:
    path: "{{ engine_state_dir }}/store/BTC"
  register: engine_store_probe

# A stat guard, not `force: no` — force:no still copies files that are new on the source side,
# which would let a converge partially refresh a live store.
- name: deliver the workstation's QA'd engine store (only when absent)
  ansible.builtin.copy:
    src: "{{ engine_store_src }}"
    dest: "{{ engine_state_dir }}/store/"
    owner: zcrypto-engine
    group: zcrypto-engine
    mode: "0640"
    directory_mode: "0750"
  register: engine_store_delivery
  when: not engine_store_probe.stat.exists

- name: read-verify one delivered store file (a truncated mid-write copy must fail loudly)
  ansible.builtin.stat:
    path: "{{ engine_state_dir }}/store/BTC/EUR/240.parquet"
  register: engine_store_verify
  when: engine_store_delivery is changed and not ansible_check_mode

- name: assert the delivered store is readable and non-empty
  ansible.builtin.assert:
    that:
      - engine_store_verify.stat.exists
      - engine_store_verify.stat.size > 0
    fail_msg: >-
      The delivered store looks incomplete (BTC/EUR/240.parquet missing or empty). This copy came from
      the workstation's data/engine-store/, so repair it there first (move that leg aside, outside the
      store, then zcrypto engine seed, on the workstation) -- a re-run delivers the same source again,
      and a seed that refuses naming the REST fetch rather than a file is a row the venue itself
      carries, which is the venue's to answer and no store repair reaches. Then stop the unit, move
      this delivered copy aside too (a second store.aside-<stamp> if the repair already made one,
      purged with it), and re-run this converge with --tags engine, -e converge_primary=true,
      -e engine_image_digest=sha256:<full digest>, -e cache_proxy_image_digest=sha256:<the running
      proxy digest> and -e '{"engine_preflight_override": "<reason>"}' with the user's approval, since the
      stopped unit's preview finds the store aside and the preflight refuses on its missing files,
      inside the inter-cycle gap and outside a published
      Kraken maintenance window checked immediately before: infra/runbooks/engine.md's
      zcrypto-engine-cycle-stale section holds the whole repair.
  when: engine_store_delivery is changed and not ansible_check_mode

# --- 5. The compose project dir + the secrets env file. The §8 gate above has already passed by
# the time this renders — the first (and only) place the trade key lands on disk.
- name: ensure the compose project directory exists
  ansible.builtin.file:
    path: /opt/zcrypto-engine
    state: directory
    owner: root
    group: root
    mode: "0755"

# The engine's re-pin gate: the candidate image's own preflight, offline and read-only against this host's state dir
# and a candidate render of the configuration, and its revision label a first-parent merge of the controller's develop
# or main. It runs on every converge, the running digest's included: a read of what runs or of what the compose file
# pins would skip a candidate staged on the host before the converge. No `rescue` on the block and no `ignore_errors`,
# `failed_when` or `when` on either assert: each turns a refusal into a pass and the play renders the refused digest.
# No `no_log`, `success_msg`, `quiet` or `verbosity` either: the rollout's preview reads their default output.
- name: engine preflight — run the candidate image's own preflight on this host
  block:
    - name: engine preflight — render the candidate configuration beside the live one
      ansible.builtin.template:
        src: zcrypto.toml.j2
        dest: /opt/zcrypto-engine/zcrypto.toml.candidate
        owner: root
        group: root
        mode: "0644"
      diff: false
      check_mode: false

    - name: engine preflight — run the candidate image's preflight, offline and read-only
      ansible.builtin.command: >-
        docker run --rm --network none --user {{ engine_uid }}:{{ engine_gid }} --memory 512m
        -v {{ engine_state_dir }}:{{ engine_state_dir }}:ro
        -v /opt/zcrypto-engine/zcrypto.toml.candidate:/app/zcrypto.toml:ro
        --entrypoint zcrypto {{ engine_image }}@{{ engine_image_digest }}
        engine preflight --state-dir {{ engine_state_dir }}
      register: engine_preflight_run
      check_mode: false
      failed_when: false
      changed_when: false

    - name: engine provenance — read the candidate image's revision label
      ansible.builtin.command: >-
        docker image inspect --format '{{ "{{" }}index .Config.Labels "org.opencontainers.image.revision"{{ "}}" }}'
        {{ engine_image }}@{{ engine_image_digest }}
      register: engine_preflight_label
      check_mode: false
      failed_when: false
      changed_when: false

    # The git module lists no first-parent line.
    - name: engine provenance — list the first-parent merges of the controller's develop and main  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git rev-list --first-parent origin/develop origin/main
        chdir: "{{ playbook_dir }}"
      register: engine_preflight_merges
      delegate_to: localhost
      become: false
      run_once: true
      check_mode: false
      failed_when: false
      changed_when: false

    - name: engine preflight — refuse an engine re-pin the candidate image has not passed on this host
      ansible.builtin.assert:
        that: >-
          (engine_preflight_run.rc | default(none) == 0)
          or ((engine_preflight_override | default('') | string | length > 8)
              and (engine_preflight_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
        fail_msg: >-
          {% if (engine_preflight_run.rc | default(none)) == 1 %}The preflight of {{ engine_image }}@{{ engine_image_digest }}
          refused on this host (rc 1): {{ engine_preflight_run.stdout_lines | default([]) | last | default('(no output)', true) }};
          stderr: {{ engine_preflight_run.stderr | default('') | trim }}.
          {% elif (engine_preflight_run.rc | default(none)) == 2
          and "No such command 'preflight'" in (engine_preflight_run.stderr | default('')) %}{{ engine_image }}@{{ engine_image_digest }}
          carries no preflight: it was built before the engine image carried one (rc 2).
          {% else %}The preflight of {{ engine_image }}@{{ engine_image_digest }} could not be run
          (rc {{ engine_preflight_run.rc | default(none) }}): {{ engine_preflight_run.stderr | default('') | trim }}.
          {% endif %}No engine file was rewritten. Fix what the line names, or pass the reason as JSON:
          -e '{"engine_preflight_override": "<why this cannot wait>"}' (a reason, not a boolean), with the user's explicit approval.

    - name: engine provenance — refuse an image whose revision is not a merge on develop or main
      ansible.builtin.assert:
        that: >-
          ((engine_preflight_label.stdout | default('') | trim) in (engine_preflight_merges.stdout_lines | default([])))
          or ((engine_preflight_override | default('') | string | length > 8)
              and (engine_preflight_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
        fail_msg: >-
          The revision label of {{ engine_image }}@{{ engine_image_digest }},
          '{{ engine_preflight_label.stdout | default('') | trim }}', is not a commit on the first-parent line of the
          controller's origin/develop or origin/main{% if (engine_preflight_merges.stdout_lines | default([])) | length == 0 %}
          (the controller listed none: git rev-list rc {{ engine_preflight_merges.rc | default(none) }},
          stderr: {{ engine_preflight_merges.stderr | default('') | trim }}){% endif %}.
          A stale controller refuses a fresh image: run git fetch origin, then re-run this converge.
          An image built off a branch, or with no label, passes only with a reason, as JSON:
          -e '{"engine_preflight_override": "<why this cannot wait>"}' (a reason, not a boolean), with the user's explicit approval.

    - name: engine preflight override — print the reason where it bypassed a refusal
      ansible.builtin.debug:
        msg: >-
          engine preflight override accepted: {{ engine_preflight_override }} — preflight rc {{ engine_preflight_run.rc | default(none) }}:
          {{ engine_preflight_run.stdout_lines | default([]) | last | default('(no output)', true) }};
          revision {{ engine_preflight_label.stdout | default('') | trim }},
          first-parent merge: {{ ((engine_preflight_label.stdout | default('') | trim) in (engine_preflight_merges.stdout_lines | default([]))) }}
      when: >-
        (not (engine_preflight_run.rc | default(none) == 0)
         or not ((engine_preflight_label.stdout | default('') | trim) in (engine_preflight_merges.stdout_lines | default([]))))
        and (engine_preflight_override | default('') | string | length > 8)
        and (engine_preflight_override | default('') | string | lower not in ['true', 'false', '1', 'yes'])
  always:
    - name: engine preflight — remove the candidate configuration
      ansible.builtin.file:
        path: /opt/zcrypto-engine/zcrypto.toml.candidate
        state: absent
      check_mode: false
      changed_when: false

# The file site.yml's window task wrote: read back and written with `preflight` merged in, so the window's keys stay.
- name: engine preflight — this run's preflight, for the deploy-log row
  ansible.builtin.copy:
    dest: "{{ zcrypto_window_record }}"
    content: >-
      {{ (lookup('file', zcrypto_window_record) or '{}') | from_json
         | combine({'preflight': {'engaged': true, 'digest': engine_image_digest,
                                  'rc': engine_preflight_run.rc | default(none),
                                  'revision': engine_preflight_label.stdout | default('') | trim | default(none, true),
                                  'first_parent': ((engine_preflight_label.stdout | default('') | trim) in (engine_preflight_merges.stdout_lines | default([]))),
                                  'line': engine_preflight_run.stdout_lines | default([]) | last | default(none)}})
         | to_json }}
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  when: not ansible_check_mode and (zcrypto_window_record | default('') | length > 0)

# --- 5a. The cache proxy's config, ahead of the engine's three files: a refused render stops before any
# is rewritten, and the file exists before compose.yaml bind-mounts it, whose missing source Docker
# creates as a directory.
- name: render the cache proxy config beside its live copy (0600 root-only; never logged, never diffed)
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /opt/zcrypto-engine/haproxy.cfg.next
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  check_mode: false

# no_log: a refusal quotes the AUTH line. The rescue masks the requirepass, which the floor keeps
# verbatim in the report, and binds its hand check with --mount, which refuses a missing source.
- name: validate the rendered cache proxy config, or remove it and stop
  block:
    - name: validate the rendered cache proxy config with the pinned image's own haproxy -c
      ansible.builtin.command: >-
        docker run --rm --user 0:0
        -v /opt/zcrypto-engine/haproxy.cfg.next:/usr/local/etc/haproxy/haproxy.cfg:ro
        {{ engine_cache_proxy_image }}@{{ engine_cache_proxy_image_digest }}
        haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      changed_when: false
      no_log: true
      check_mode: false
  rescue:
    - name: remove the refused candidate
      ansible.builtin.file:
        path: /opt/zcrypto-engine/haproxy.cfg.next
        state: absent
      check_mode: false

    - name: probe — is there a live cache proxy config the unit still reads
      ansible.builtin.stat:
        path: /opt/zcrypto-engine/haproxy.cfg
        get_checksum: false
      register: engine_cache_proxy_live_config
      check_mode: false

    - name: refuse the cache proxy config whose validation failed (its report shown with the requirepass masked)
      ansible.builtin.fail:
        msg: >-
          The rendered cache proxy config's validation failed -- haproxy -c refusing the render, or the
          validation run itself (Docker, the image); the report below says which. It was not installed,
          its candidate is removed and no engine file was rewritten;
          {% if engine_cache_proxy_live_config.stat.exists %}the unit still reads the live /opt/zcrypto-engine/haproxy.cfg.
          {% else %}no live /opt/zcrypto-engine/haproxy.cfg exists yet, so the proxy has no config until a converge installs one.
          {% endif %}
          The report, the requirepass masked:
          {{ ((ansible_failed_result.stdout | default('')) ~ ' ' ~ (ansible_failed_result.stderr | default(''))) | replace(cache_sentinel_requirepass, '<requirepass>') }}
          Reproduce it with converge.sh's preview: this run's arguments and --check.
          {% if engine_cache_proxy_live_config.stat.exists %}The check by hand on {{ inventory_hostname }}, over the live copy:
          sudo docker run --rm --user 0:0
          --mount type=bind,src=/opt/zcrypto-engine/haproxy.cfg,dst=/usr/local/etc/haproxy/haproxy.cfg,readonly
          {{ engine_cache_proxy_image }}@{{ engine_cache_proxy_image_digest }} haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          {% endif %}

- name: install the validated cache proxy config (changed only where it differs from the live copy)
  ansible.builtin.copy:
    src: /opt/zcrypto-engine/haproxy.cfg.next
    dest: /opt/zcrypto-engine/haproxy.cfg
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: restart engine service

- name: remove the validated candidate
  ansible.builtin.file:
    path: /opt/zcrypto-engine/haproxy.cfg.next
    state: absent
  changed_when: false
  check_mode: false

- name: render the engine secrets env file (0600 root-only; never logged, never diffed)
  ansible.builtin.template:
    src: engine.env.j2
    dest: /opt/zcrypto-engine/engine.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: restart engine service

# --- 6. The engine's zcrypto.toml (bind-mounted read-only at /app/zcrypto.toml by the compose
# file below).
- name: render the engine zcrypto.toml
  ansible.builtin.template:
    src: zcrypto.toml.j2
    dest: /opt/zcrypto-engine/zcrypto.toml
    owner: root
    group: root
    mode: "0644"
  notify: restart engine service

# --- 7. The compose file (secret-free — the key material stays in engine.env). The empty-digest
# fail-fast that used to open this section now runs up in §1b, above the residency preflight.
- name: render the engine compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/zcrypto-engine/compose.yaml
    owner: root
    group: root
    mode: "0644"
  notify: restart engine service

# --- 8. The systemd unit (capture's pull/up/down pattern; enabled — boot resume).
- name: install the engine systemd unit
  ansible.builtin.copy:
    src: zcrypto-engine.service
    dest: /etc/systemd/system/zcrypto-engine.service
    owner: root
    group: root
    mode: "0644"
  register: engine_unit_install
  notify: restart engine service

# The emergency halt an operator runs by hand. Not a service: nothing starts it, and it notifies no
# handler — installing it must never restart the engine.
- name: install the engine flatten wrapper
  ansible.builtin.template:
    src: zcrypto-flatten.sh.j2
    dest: /usr/local/sbin/zcrypto-flatten
    owner: root
    group: root
    mode: "0750"

- name: enable + start the engine service (boot resume)
  ansible.builtin.systemd_service:
    name: zcrypto-engine.service
    daemon_reload: true
    enabled: true
    state: started
  # First-run check mode would fail here: the unit file above was never actually installed, so
  # systemd cannot find the service. Skip exactly that case; every real converge still runs this,
  # and a later dry-run (unit already on the host) still verifies the enabled/started state.
  when: not (ansible_check_mode and engine_unit_install is changed)

# --- 9. The journal pull channel: the rrsync forced-command key the NAS uses to pull the engine
# journal, read-only, on zcrypto-data (the m2m data user, spec 00057). deploy's old copy was dropped
# at the migration cutover (Task 7) and deploy no longer exists (renamed zcrypto-deploy), so the role
# manages only the zcrypto-data key below.
- name: ensure rsync (which ships the rrsync helper) is installed
  ansible.builtin.package:
    name: rsync
    state: present

# rrsync lives at /usr/bin/rrsync on Debian 13 (trixie) — the rsync package installs it there
# since bookworm (rsync 3.2.4 promoted it out of /usr/share/doc/rsync/scripts/). The absolute
# path keeps the forced command independent of the login shell's PATH.

# The journal export the NAS pulls lands on zcrypto-data, the m2m data user (spec 00057), not the
# admin account. That user is not the journal's owner, so it joins the owning group to TRAVERSE the
# 0750 dirs, and the journal files must be group-READABLE for the rrsync -ro pull. `exclusive:
# false` so it never disturbs that user's other keys.
- name: install the sync pubkey as a forced-command entry on zcrypto-data (journal read-only)
  ansible.posix.authorized_key:
    user: zcrypto-data
    exclusive: false
    key: "{{ sync_authorized_key }}"
    key_options: 'command="/usr/bin/rrsync -ro {{ engine_state_dir }}/journal",restrict'

- name: add zcrypto-data to the zcrypto-engine group (traverse the 0750 journal subtree for the pull)
  ansible.builtin.user:
    name: zcrypto-data
    groups: zcrypto-engine
    append: true
  when: not (ansible_check_mode and not engine_account_known)
  vars:
    engine_account_known: "{{ ((ansible_facts['getent_passwd'] | default({}))['zcrypto-engine'] | default(none)) is not none }}"

- name: ensure the journal subtree is group-readable (zcrypto-data pulls it as rrsync -ro)
  ansible.builtin.file:
    path: "{{ engine_state_dir }}/journal"
    state: directory
    recurse: true
    mode: g+rX

# Journal retention (spec 00070, T0021), deployed AFTER the pull plumbing deliberately: the NAS
# mirror is what makes deleting a local day safe, so the path that copies days off the host is
# established before the one that removes them. Declared in both this role and capture's so neither
# play depends on the other's ordering (spec 00071).
- name: ensure the node-exporter textfile directory exists
  ansible.builtin.file:
    path: "{{ engine_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: install the journal-prune script
  ansible.builtin.copy:
    src: zcrypto-engine-journal-prune.sh
    dest: /usr/local/sbin/zcrypto-engine-journal-prune
    owner: root
    group: root
    mode: "0755"

- name: render the journal-prune systemd unit
  ansible.builtin.template:
    src: zcrypto-engine-journal-prune.service.j2
    dest: /etc/systemd/system/zcrypto-engine-journal-prune.service
    owner: root
    group: root
    mode: "0644"

- name: install the journal-prune systemd timer
  ansible.builtin.copy:
    src: zcrypto-engine-journal-prune.timer
    dest: /etc/systemd/system/zcrypto-engine-journal-prune.timer
    owner: root
    group: root
    mode: "0644"

# Only the TIMER is enabled -- the service is the oneshot it triggers, and enabling that too would
# prune on every boot (same reasoning as the capture-prune pair).
- name: enable + start the journal-prune timer
  ansible.builtin.systemd_service:
    name: zcrypto-engine-journal-prune.timer
    daemon_reload: true
    enabled: true
    state: started
