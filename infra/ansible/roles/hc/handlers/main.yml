---
- name: restart hc service
  ansible.builtin.systemd_service:
    name: zcrypto-hc.service
    daemon_reload: true
    state: restarted
  # A first-install preview never wrote the unit, so systemd cannot find it. A container the start task just
  # started already runs the files this converge rendered. `status` is the unit as the start task found it.
  when: not (ansible_check_mode and hc_unit_install is changed) and hc_service_start.status.ActiveState in ['active', 'activating']

- name: restart alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: restarted
  when: not alloy_apt_previewed
