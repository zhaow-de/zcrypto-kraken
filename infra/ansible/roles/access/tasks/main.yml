# The access role (spec 00075): WireGuard server + relays + Caddy edge + native Alloy.
- name: wireguard + probe dependencies
  ansible.builtin.apt: {name: [wireguard-tools], state: present}

- name: add the Grafana apt repository (deb822 format; module fetches + stores the signing key)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: https://apt.grafana.com/gpg.key
# Alloy and Caddy are apt packages from THIRD-PARTY repos, so this role FOLLOWS what apt installs
# rather than driving it. Both the version force and the hold are gone, and the hold is actively
# CLEARED rather than merely unset, so a host provisioned under the old model converges back.
#
# `apt-mark hold` makes `apt upgrade` skip a package SILENTLY, and nothing in that output says which
# entries are held. A version force was worse: with ansible's default `allow_downgrade: false` a
# repo that ships a newer build turns this task into a refused downgrade, and a failure here --
# third in the role -- drops the host from the play and takes the pinned-leaves and Caddyfile tasks
# with it, which ARE the client-cert revocation path.
#
# Deliberately NOT recorded in fleet-pins.md: a version there would have no producer and no
# consumer, so it would drift into a confidently-wrong number. Read it off the host with `dpkg-query
# -W alloy`. Ordering: `dpkg_selections` hard-fails on a package dpkg has never seen, so the
# selections task stays AFTER the apt install.
- name: alloy present — version FOLLOWED from apt, never forced (see the note above)
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true
- name: alloy is never held — a hold makes `apt upgrade` skip it silently
  ansible.builtin.dpkg_selections: {name: alloy, selection: install}

- name: alloy env — CONFIG_FILE + credentials (the deb's unit reads EnvironmentFile=/etc/default/alloy)
  ansible.builtin.template:
    src: alloy-env.j2
    dest: /etc/default/alloy
    owner: root
    group: alloy
    mode: '0640'
  no_log: true # renders the Grafana Cloud push credentials — keep them out of --diff output
  notify: restart alloy
- name: >-
    alloy config — UNGATED copy; every converge ships it, so a hand edit cannot outlive the next
    converge. That is the whole drift remedy: the other tiers carry asserts because their copies
    are digest-gated and an ordinary converge skips them — this one is not.
  ansible.builtin.copy:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'
  notify: restart alloy
- name: alloy enabled + started
  ansible.builtin.systemd: {name: alloy, enabled: true, state: started}

- name: textfile dir for the probe
  ansible.builtin.file: {path: /var/lib/zaccess-textfiles, state: directory, mode: '0755'}
- name: probe script
  ansible.builtin.template:
    src: zaccess-probe.sh.j2
    dest: /usr/local/sbin/zaccess-probe
    mode: '0755'
- name: probe service + timer
  ansible.builtin.template:
    src: "zaccess-probe.{{ item }}.j2"
    dest: "/etc/systemd/system/zaccess-probe.{{ item }}"
    mode: '0644'
  loop: [service, timer]
  notify: reload systemd
- name: probe timer enabled
  ansible.builtin.systemd: {name: zaccess-probe.timer, enabled: true, state: started, daemon_reload: true}

# spec 00075 D6.
- name: wireguard server conf (the bridgehead end of the zaccess0 tunnel)
  ansible.builtin.template:
    src: zaccess0.conf.j2
    dest: /etc/wireguard/zaccess0.conf
    mode: '0600'
  no_log: true # renders the WireGuard private key -- keep it out of --diff output
  notify: restart wg-quick@zaccess0
- name: wireguard tunnel enabled
  ansible.builtin.systemd: {name: wg-quick@zaccess0, enabled: true, state: started}

# spec 00075 D5.
- name: ssh relay socket + service (systemd-socket-proxyd, no NAT/forwarding)
  ansible.builtin.template:
    src: "zaccess-ssh-proxy.{{ item }}.j2"
    dest: "/etc/systemd/system/zaccess-ssh-proxy.{{ item }}"
    mode: '0644'
  loop: [socket, service]
  notify: reload systemd
- name: ssh relay socket enabled
  ansible.builtin.systemd: {name: zaccess-ssh-proxy.socket, enabled: true, state: started, daemon_reload: true}

- name: add the Caddy apt repository (deb822 format; module fetches + stores the signing key)
  ansible.builtin.deb822_repository:
    name: caddy
    types: [deb]
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: [any-version]
    components: [main]
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
# Caddy follows apt too, and the version pin was never what protected the mTLS edge: the Caddyfile
# task below runs `validate: caddy validate` -- the INSTALLED binary against the NEW config, before
# writing it -- so a version whose client-auth syntax moved fails the converge loudly and version-
# independently. A Caddy that cannot parse its config does not start, so the failure direction is
# CLOSED: the edge goes dark, never serving without mTLS.
- name: caddy present — version FOLLOWED from apt, never forced (the Caddyfile validate is the guard)
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
- name: caddy is never held — same reason as alloy above
  ansible.builtin.dpkg_selections: {name: caddy, selection: install}

# spec 00075 D16.
- name: zaccess mTLS CA cert (the trust_pool the Caddyfile's mtls snippet reads)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/zaccess_ca.crt"
    dest: /etc/caddy/zaccess_ca.crt
    owner: root
    group: root
    mode: '0644'
  notify: reload caddy
- name: /etc/caddy/pinned-leaves is traversable by the caddy service user (uid != root)
  ansible.builtin.file:
    path: /etc/caddy/pinned-leaves
    state: directory
    owner: root
    group: root
    mode: '0755'
  notify: reload caddy
# spec 00075 D16.
- name: pinned mTLS client leaves (a PEM's presence here IS the pin; absence is revocation)
  ansible.builtin.copy:
    src: pinned-leaves/
    dest: /etc/caddy/pinned-leaves/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'  # the leaves are public certs -- caddy (uid 997, not in group root) just needs to traverse
  notify: reload caddy
# spec 00075 D7.
- name: NAS upstream CA (the Sectigo intermediate the NAS omits from its chain; pins the ops->NAS TLS leg)
  ansible.builtin.copy:
    src: nas-upstream-ca.pem
    dest: /etc/caddy/nas-upstream-ca.pem
    owner: root
    group: root
    mode: '0644'
  notify: reload caddy
# spec 00075 D14: mTLS is proven before any upstream exists; the NAS/agentboard upstreams are
# wired behind this same gate.
- name: >-
    Caddyfile -- global block + the (mtls) snippet + the two static vhosts (mTLS proven
    before any upstream exists; later upstreams are wired behind this same gate)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
    validate: "caddy validate --adapter caddyfile --config %s"
  notify: reload caddy
- name: caddy enabled + started
  ansible.builtin.systemd: {name: caddy, enabled: true, state: started}

# LAST IN THE ROLE, and skipped under `--check`, because an assert that fails takes the rest of the
# play with it and below it are the pinned-leaves and Caddyfile tasks that ARE the client-cert
# revocation path. `flush_handlers` runs before it for the same reason: force_handlers defaults to
# False, so a failure here would strand `reload caddy`, the handler that makes a deleted pinned leaf
# take effect.
#
# The relay is Accept=no with no --exit-idle-time, so one long-lived systemd-socket-proxyd holds the
# listener. Rewriting the unit does not replace its target -- no ExecReload, the target is a
# command-line argument rather than config, `daemon-reload` refreshes only systemd's view of the
# FILE, and `state: started` is a no-op on a running unit -- so a converge that rewrites this unit
# reports `changed` and reaches nothing. What DOES restart it is `restart wg-quick@zaccess0`, which
# both relay halves inherit through `Requires=`, so a tunnel-conf change bounces the relay and the
# gate then passes.
#
# It REPORTS drift and does not prevent it: by the time this can fail, every task above has applied.
# Read a failure as "the converge landed and the relay still needs a hand", never as "the converge
# was refused". Asserted rather than restarted because a restart drops every SSH session traversing
# the relay into the ops node, including the shell a remote operator may be driving this play from;
# this converge reaches zaccess's own sshd directly on :10022, so it cannot cut its own transport.
# The sibling relay in roles/access_ops takes restart handlers instead: it carries DSM traffic, not
# an operator's session.
- name: apply pending handlers before the relay drift gate
  ansible.builtin.meta: flush_handlers

# Read the RUNNING process's argv, never `systemctl show`: after a daemon-reload that reports the NEW
# value while the process keeps the old one -- the same trap the deploy skills'
# shared converge mechanics record for the Alloy drift assert, which compares the deployed FILE
# and not what the process loaded.
- name: read the ssh relay's running target
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pid=$(systemctl show -p MainPID --value zaccess-ssh-proxy.service)
      if [ "$pid" = "0" ]; then echo __not_running__; else tr '\0' '\n' < "/proc/$pid/cmdline" | tail -1; fi
    executable: /bin/bash
  register: access_ssh_relay_running
  changed_when: false
  when: not ansible_check_mode
- name: read the ssh relay's rendered target
  # $NF is the LAST token, which is the target only while the target stays last. If an option is ever
  # appended after it (--exit-idle-time, say) both sides shift together and this compares a constant
  # to itself -- an always-passing guard. Keep the target last, or match the argument explicitly.
  ansible.builtin.shell:
    cmd: awk '/^ExecStart=/{print $NF}' /etc/systemd/system/zaccess-ssh-proxy.service
    executable: /bin/bash
  register: access_ssh_relay_rendered
  changed_when: false
  when: not ansible_check_mode
- name: the ssh relay is running the target this play renders
  # __not_running__ PASSES: an inactive unit execs from the rendered file at its next activation, so
  # it cannot be drifted, and failing there would fail a healthy converge on any host that rebooted
  # without a remote session since. The length test closes the both-empty hole, where no ExecStart
  # line and a defunct proxyd's empty cmdline would compare equal. No override, because this reports
  # after the converge has applied -- there is no refusal left to bypass, and the remedy is the hand
  # restart the message names.
  when: not ansible_check_mode
  ansible.builtin.assert:
    that: >-
      (access_ssh_relay_rendered.stdout | default('') | length > 0)
      and (access_ssh_relay_running.stdout | default('') in ['__not_running__', access_ssh_relay_rendered.stdout])
    fail_msg: >-
      This converge HAS ALREADY APPLIED -- this is a report, not a refusal. The SSH relay is still
      running "{{ access_ssh_relay_running.stdout | default('') }}" while the unit on disk now renders
      "{{ access_ssh_relay_rendered.stdout | default('') }}". A reload cannot close that gap: the unit
      defines no ExecReload and the target is a command-line argument, not config. Restart it by hand
      -- `sudo systemctl restart zaccess-ssh-proxy.service` -- from a session that did NOT reach the
      ops node through port 20022, because the restart drops every connection traversing the relay.
      Re-run this play afterwards for a green run.
