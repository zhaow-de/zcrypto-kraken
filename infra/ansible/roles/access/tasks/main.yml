# The access role (spec 00075): WireGuard server + relays + Caddy edge + native Alloy.
- name: wireguard + probe dependencies
  ansible.builtin.apt: {name: [wireguard-tools], state: present}

- name: add the Grafana apt repository (deb822 format; module fetches + stores the signing key)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: https://apt.grafana.com/gpg.key
- name: alloy, pinned (D11 — native, no docker on the edge; pin recorded in fleet-pins.md)
  ansible.builtin.apt:
    name: "alloy={{ access_alloy_version }}"
    state: present
    update_cache: true
    allow_change_held_packages: false
- name: hold alloy at the pin
  ansible.builtin.dpkg_selections: {name: alloy, selection: hold}

- name: alloy env — CONFIG_FILE + credentials (the deb's unit reads EnvironmentFile=/etc/default/alloy)
  ansible.builtin.template:
    src: alloy-env.j2
    dest: /etc/default/alloy
    owner: root
    group: alloy
    mode: '0640'
  no_log: true # renders the Grafana Cloud push credentials — keep them out of --diff output
  notify: restart alloy
- name: >-
    alloy config — UNGATED copy; every converge ships it, so a hand edit cannot outlive the next
    converge. That is the whole drift remedy: the other tiers carry asserts because their copies
    are digest-gated and an ordinary converge skips them — this one is not.
  ansible.builtin.copy:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'
  notify: restart alloy
- name: alloy enabled + started
  ansible.builtin.systemd: {name: alloy, enabled: true, state: started}

- name: textfile dir for the probe
  ansible.builtin.file: {path: /var/lib/zaccess-textfiles, state: directory, mode: '0755'}
- name: probe script
  ansible.builtin.template:
    src: zaccess-probe.sh.j2
    dest: /usr/local/sbin/zaccess-probe
    mode: '0755'
- name: probe service + timer
  ansible.builtin.template:
    src: "zaccess-probe.{{ item }}.j2"
    dest: "/etc/systemd/system/zaccess-probe.{{ item }}"
    mode: '0644'
  loop: [service, timer]
  notify: reload systemd
- name: probe timer enabled
  ansible.builtin.systemd: {name: zaccess-probe.timer, enabled: true, state: started, daemon_reload: true}

- name: wireguard server conf (spec 00075 D6 -- the bridgehead end of the zaccess0 tunnel)
  ansible.builtin.template:
    src: zaccess0.conf.j2
    dest: /etc/wireguard/zaccess0.conf
    mode: '0600'
  no_log: true # renders the WireGuard private key -- keep it out of --diff output
  notify: restart wg-quick@zaccess0
- name: wireguard tunnel enabled
  ansible.builtin.systemd: {name: wg-quick@zaccess0, enabled: true, state: started}

- name: ssh relay socket + service (spec 00075 D5 -- systemd-socket-proxyd, no NAT/forwarding)
  ansible.builtin.template:
    src: "zaccess-ssh-proxy.{{ item }}.j2"
    dest: "/etc/systemd/system/zaccess-ssh-proxy.{{ item }}"
    mode: '0644'
  loop: [socket, service]
  notify: reload systemd
- name: ssh relay socket enabled
  ansible.builtin.systemd: {name: zaccess-ssh-proxy.socket, enabled: true, state: started, daemon_reload: true}

- name: add the Caddy apt repository (deb822 format; module fetches + stores the signing key)
  ansible.builtin.deb822_repository:
    name: caddy
    types: [deb]
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: [any-version]
    components: [main]
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
- name: caddy, pinned (upstream apt, no docker on the edge -- the mTLS gate, spec 00075 Phase 5)
  ansible.builtin.apt:
    name: "caddy={{ access_caddy_version }}"
    state: present
    update_cache: true
    allow_change_held_packages: false
- name: hold caddy at the pin
  ansible.builtin.dpkg_selections: {name: caddy, selection: hold}

- name: zaccess mTLS CA cert (spec 00075 D16 -- the trust_pool the Caddyfile's mtls snippet reads)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/zaccess_ca.crt"
    dest: /etc/caddy/zaccess_ca.crt
    owner: root
    group: root
    mode: '0644'
  notify: reload caddy
- name: /etc/caddy/pinned-leaves is traversable by the caddy service user (uid != root)
  ansible.builtin.file:
    path: /etc/caddy/pinned-leaves
    state: directory
    owner: root
    group: root
    mode: '0755'
  notify: reload caddy
- name: pinned mTLS client leaves (spec 00075 D16 -- a PEM's presence here IS the pin; absence is revocation)
  ansible.builtin.copy:
    src: pinned-leaves/
    dest: /etc/caddy/pinned-leaves/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'  # the leaves are public certs -- caddy (uid 997, not in group root) just needs to traverse
  notify: reload caddy
- name: >-
    Caddyfile -- global block + the (mtls) snippet + the two static vhosts (D14: mTLS proven
    before any upstream exists; Task 9/10 wire the NAS/agentboard upstreams behind this same gate)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
    validate: "caddy validate --adapter caddyfile --config %s"
  notify: reload caddy
- name: caddy enabled + started
  ansible.builtin.systemd: {name: caddy, enabled: true, state: started}
