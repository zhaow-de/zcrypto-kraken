# The access role (spec 00075): WireGuard server + relays + Caddy edge + native Alloy.
- name: wireguard + probe dependencies
  ansible.builtin.apt: {name: [wireguard-tools], state: present}

- name: add the Grafana apt repository (deb822 format; module fetches + stores the signing key)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: https://apt.grafana.com/gpg.key
# Alloy and Caddy here are apt packages from THIRD-PARTY repos we do not control, not images whose
# digest we choose. So the repo FOLLOWS what apt installs; it does not drive it. Both the version
# force and the hold are deliberately gone, and the hold is actively CLEARED rather than merely
# unset, so a host provisioned under the old model converges back to the followed state.
#
# The hold was the worse half: `apt-mark hold` makes `apt upgrade` skip a package SILENTLY, and
# nothing in that output says which entries are third-party or held — so the burden of remembering
# lands on whoever is reading a long upgradeable list, which is exactly when it is hardest.
#
# The version force cost more than toil, and this is not hypothetical. Grafana shipped 1.18.1-1;
# `apt: name=alloy=<older>` with ansible's default `allow_downgrade: false` then asks apt for a
# downgrade, apt refuses, and this task — the THIRD in the role — fails and drops the host from the
# play. Everything below became unreachable, including the pinned-leaves + Caddyfile tasks that ARE
# the client-cert revocation path (spec 00075 D16: delete the PEM, converge, reload). A pin meant to
# protect the mTLS edge had disabled its one emergency operation. Found live, 2026-08-20.
#
# Deliberately NOT recorded in docs/reference/fleet-pins.md: a version there would have no producer
# and no consumer -- nothing asserts it and nothing updates it -- so it would drift into a
# confidently-wrong number. Read the installed version off the host instead: `dpkg-query -W alloy`.
#
# ORDERING, easy to break later: ansible's dpkg_selections hard-fails on a package dpkg has never
# seen, so the selections task must stay AFTER the apt install, never hoisted above it.
- name: alloy present — version FOLLOWED from apt, never forced (see the note above)
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true
- name: alloy is never held — a hold makes `apt upgrade` skip it silently
  ansible.builtin.dpkg_selections: {name: alloy, selection: install}

- name: alloy env — CONFIG_FILE + credentials (the deb's unit reads EnvironmentFile=/etc/default/alloy)
  ansible.builtin.template:
    src: alloy-env.j2
    dest: /etc/default/alloy
    owner: root
    group: alloy
    mode: '0640'
  no_log: true # renders the Grafana Cloud push credentials — keep them out of --diff output
  notify: restart alloy
- name: >-
    alloy config — UNGATED copy; every converge ships it, so a hand edit cannot outlive the next
    converge. That is the whole drift remedy: the other tiers carry asserts because their copies
    are digest-gated and an ordinary converge skips them — this one is not.
  ansible.builtin.copy:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'
  notify: restart alloy
- name: alloy enabled + started
  ansible.builtin.systemd: {name: alloy, enabled: true, state: started}

- name: textfile dir for the probe
  ansible.builtin.file: {path: /var/lib/zaccess-textfiles, state: directory, mode: '0755'}
- name: probe script
  ansible.builtin.template:
    src: zaccess-probe.sh.j2
    dest: /usr/local/sbin/zaccess-probe
    mode: '0755'
- name: probe service + timer
  ansible.builtin.template:
    src: "zaccess-probe.{{ item }}.j2"
    dest: "/etc/systemd/system/zaccess-probe.{{ item }}"
    mode: '0644'
  loop: [service, timer]
  notify: reload systemd
- name: probe timer enabled
  ansible.builtin.systemd: {name: zaccess-probe.timer, enabled: true, state: started, daemon_reload: true}

- name: wireguard server conf (spec 00075 D6 -- the bridgehead end of the zaccess0 tunnel)
  ansible.builtin.template:
    src: zaccess0.conf.j2
    dest: /etc/wireguard/zaccess0.conf
    mode: '0600'
  no_log: true # renders the WireGuard private key -- keep it out of --diff output
  notify: restart wg-quick@zaccess0
- name: wireguard tunnel enabled
  ansible.builtin.systemd: {name: wg-quick@zaccess0, enabled: true, state: started}

- name: ssh relay socket + service (spec 00075 D5 -- systemd-socket-proxyd, no NAT/forwarding)
  ansible.builtin.template:
    src: "zaccess-ssh-proxy.{{ item }}.j2"
    dest: "/etc/systemd/system/zaccess-ssh-proxy.{{ item }}"
    mode: '0644'
  loop: [socket, service]
  notify: reload systemd
- name: ssh relay socket enabled
  ansible.builtin.systemd: {name: zaccess-ssh-proxy.socket, enabled: true, state: started, daemon_reload: true}

- name: add the Caddy apt repository (deb822 format; module fetches + stores the signing key)
  ansible.builtin.deb822_repository:
    name: caddy
    types: [deb]
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: [any-version]
    components: [main]
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
# Caddy follows apt too, and its stakes ARE higher — this is the mTLS edge, the bridgehead's only
# auth control. The version pin was never what protected it: the Caddyfile task below carries
# `validate: caddy validate ...`, which runs the INSTALLED binary against the NEW config before
# writing it, so a version whose client-auth syntax moved fails the converge loudly and
# version-independently. And a Caddy that cannot parse its config does not start, so the failure
# direction is CLOSED — the edge goes dark, it never serves without mTLS.
#
# Accepted limitation, recorded rather than fixed: no alert fires on a caddy-only outage — the
# cert-expiry rule that probes the edge carries `noDataState: OK` because it treats
# `zcrypto-alloy-dark-zaccess` as owning "the host is dark", and that rule stays green while alloy
# is healthy. A dead edge is found by a human failing to reach it, which is tolerable here: this
# tier carries interactive access only, no trading and no data path.
- name: caddy present — version FOLLOWED from apt, never forced (the Caddyfile validate is the guard)
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
- name: caddy is never held — same reason as alloy above
  ansible.builtin.dpkg_selections: {name: caddy, selection: install}

- name: zaccess mTLS CA cert (spec 00075 D16 -- the trust_pool the Caddyfile's mtls snippet reads)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/zaccess_ca.crt"
    dest: /etc/caddy/zaccess_ca.crt
    owner: root
    group: root
    mode: '0644'
  notify: reload caddy
- name: /etc/caddy/pinned-leaves is traversable by the caddy service user (uid != root)
  ansible.builtin.file:
    path: /etc/caddy/pinned-leaves
    state: directory
    owner: root
    group: root
    mode: '0755'
  notify: reload caddy
- name: pinned mTLS client leaves (spec 00075 D16 -- a PEM's presence here IS the pin; absence is revocation)
  ansible.builtin.copy:
    src: pinned-leaves/
    dest: /etc/caddy/pinned-leaves/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'  # the leaves are public certs -- caddy (uid 997, not in group root) just needs to traverse
  notify: reload caddy
- name: NAS upstream CA (spec 00075 D7 -- the Sectigo intermediate the NAS omits from its chain; pins the ops->NAS TLS leg)
  ansible.builtin.copy:
    src: nas-upstream-ca.pem
    dest: /etc/caddy/nas-upstream-ca.pem
    owner: root
    group: root
    mode: '0644'
  notify: reload caddy
- name: >-
    Caddyfile -- global block + the (mtls) snippet + the two static vhosts (D14: mTLS proven
    before any upstream exists; Task 9/10 wire the NAS/agentboard upstreams behind this same gate)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
    validate: "caddy validate --adapter caddyfile --config %s"
  notify: reload caddy
- name: caddy enabled + started
  ansible.builtin.systemd: {name: caddy, enabled: true, state: started}
