---
# Defaults for the `access` role (spec 00075): the internet bridgehead.

# Native Alloy (D11), apt-pinned + held -- no docker on the edge. Current upstream at execution
# (2026-07-29, apt.grafana.com stable); record beside the caddy pin in fleet-pins.md at Task 11.
access_alloy_version: "1.18.0-1"

# WireGuard server listen port (Task 6 wires the tunnel itself); firewall_extra_udp_ports
# (group_vars/access_host/vars.yml) already opens it.
access_wg_listen_port: 51820

# ACME registration contact (Task 7's Caddy role reads this).
access_acme_email: zhaow.km@gmail.com

# Caddy from the upstream apt repo, pinned + held (same pattern as alloy above) -- no docker on
# the edge. Verified against Cloudsmith's package listing at execution (2026-07-30, bare semver,
# no debian revision suffix); record beside the alloy pin in fleet-pins.md at Task 11.
access_caddy_version: "2.11.4"

# Pinned mTLS client leaves (spec 00075 D16): the file's presence in roles/access/files/pinned-leaves/
# IS the pin; the Caddyfile template loops this list. Sorted -- an unstable glob order would make
# the rendered Caddyfile flap changed on every converge even with no leaves added or removed.
access_pinned_leaves: "{{ lookup('ansible.builtin.fileglob', role_path ~ '/files/pinned-leaves/*.pem', wantlist=true) | map('basename') | sort }}"
