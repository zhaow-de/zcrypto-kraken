---
# Defaults for the `access` role (spec 00075): the internet bridgehead.

# WireGuard server listen port (the role wires the tunnel itself); firewall_extra_udp_ports
# (group_vars/access_host/vars.yml) already opens it.
access_wg_listen_port: 51820

# ACME registration contact (the Caddy config reads this).
access_acme_email: zhaow.km@gmail.com

# Pinned mTLS client leaves (spec 00075 D16): the file's presence in roles/access/files/pinned-leaves/
# IS the pin; the Caddyfile template loops this list. Sorted -- an unstable glob order would make
# the rendered Caddyfile flap changed on every converge even with no leaves added or removed.
access_pinned_leaves: "{{ lookup('ansible.builtin.fileglob', role_path ~ '/files/pinned-leaves/*.pem', wantlist=true) | map('basename') | sort }}"
