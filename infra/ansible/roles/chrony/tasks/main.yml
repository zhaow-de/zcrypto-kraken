- name: ensure chrony is installed
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: chrony_install

- name: configure chrony — NTS servers + makestep
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

# A fresh node's preview never installed the package, so systemd cannot find the unit.
- name: enable + start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  when: not (ansible_check_mode and chrony_install is changed)

- name: flush handlers so the source verification below sees the new config
  ansible.builtin.meta: flush_handlers

# A selected source (`*` in the second column of the MS field, after the mode character) exists
# only after NTS-KE and the iburst exchange, a few seconds after a restart; a source whose NTS-KE
# fails stays `?` and is never selected, so one selected line is the proof that a source is usable
# with NTS. A read, so it runs under --check too, except on a fresh node whose preview never
# installed the package.
- name: verify chrony has a selected NTS source
  ansible.builtin.command: chronyc -N sources
  register: chrony_sources_result
  changed_when: false
  check_mode: false
  until: chrony_sources_result.stdout is search('^.[*] ', multiline=True)
  retries: 12
  delay: 5
  when: not (ansible_check_mode and chrony_install is changed)

- name: report chrony sources
  ansible.builtin.debug:
    var: chrony_sources_result.stdout_lines
  when: chrony_sources_result is not skipped
