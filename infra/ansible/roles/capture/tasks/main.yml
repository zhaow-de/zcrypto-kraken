---
# Deploys the capture daemon: renders compose.yaml + the systemd unit, and lets the unit's own
# ExecStartPre/ExecStart/ExecStop ("docker compose pull" / "up" / "down") own the actual
# pull+run — that's also what resumes capture on boot. Ansible only starts/enables/restarts it.
# Fleet users/groups (spec 00057): zcrypto-data (renamed from kraken-capture, uid kept) SERVES the
# NAS capture pull via an rrsync forced-command key, so it needs a login-capable shell. DSM rejects a
# custom shell, but these hosts are Debian, so the same rrsync-only wrapper the ops node uses works.
- name: install the rrsync-only login shell for zcrypto-data
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/rrsync-shell"
    dest: "{{ capture_rrsync_shell }}"
    owner: root
    group: root
    mode: "0755"

- name: look up the zcrypto-data service account (created by the base role)
  ansible.builtin.getent:
    database: passwd
    key: zcrypto-data

- name: derive the zcrypto-data uid/gid for the container's user mapping
  ansible.builtin.set_fact:
    capture_uid: "{{ ansible_facts['getent_passwd']['zcrypto-data'][1] }}"
    capture_gid: "{{ ansible_facts['getent_passwd']['zcrypto-data'][2] }}"

- name: fail fast if the pinned image digest was not supplied
  ansible.builtin.assert:
    that: capture_image_digest | length > 0
    fail_msg: >-
      capture_image_digest is empty — pass the built image's digest, e.g.
      -e capture_image_digest=sha256:<...> (see the job summary of
      .github/workflows/capture-image.yml for the digest of the latest push).

# --- spec 00082 converge guards (wave 1). Probe idiom: probes never fail or change; the assert
# --- refuses with the fix in the message. Tests: tests/test_infra_converge_guards.py.
- name: probe — is the pinned digest already on this host
  ansible.builtin.command: docker image inspect "{{ capture_image }}@{{ capture_image_digest }}"
  register: capture_digest_probe
  failed_when: false
  changed_when: false
  check_mode: false

- name: preflight — refuse a digest the host has not pulled
  ansible.builtin.assert:
    that: capture_digest_probe.rc == 0
    fail_msg: >-
      {{ capture_image }}@{{ capture_image_digest }} is not on {{ inventory_hostname }} — the unit's
      ExecStartPre pulls at start, so the stop→start window would contain a registry pull, extending
      the capture gap. Pre-stage it first:
      sudo docker pull {{ capture_image }}@{{ capture_image_digest }}

- name: probe — this host's own deployed pair list (does this converge ADD a pair?)
  ansible.builtin.slurp:
    src: /opt/zcrypto-capture/compose.yaml
  register: capture_local_compose_raw
  when: inventory_hostname not in groups['engine_host']
  failed_when: false
  changed_when: false
  check_mode: false

- name: derive whether new pairs are being added (guard engages only then — I1)
  ansible.builtin.set_fact:
    capture_deployed_pairs: >-
      {{ (capture_local_compose_raw.content | b64decode | regex_search('CAPTURE_PAIRS: \"([^\"]*)\"', '\1') | first).split(',')
         if capture_local_compose_raw.content is defined else [] }}
  when: inventory_hostname not in groups['engine_host']

- name: probe — the primary's deployed pair list (pair-add order; fail-CLOSED on unreachable, a new pair is the hazard)
  ansible.builtin.slurp:
    src: /opt/zcrypto-capture/compose.yaml
  register: capture_primary_compose_raw
  delegate_to: "{{ groups['engine_host'] | first }}"
  changed_when: false
  when: >-
    inventory_hostname not in groups['engine_host']
    and capture_pairs | difference(capture_deployed_pairs | default([])) | length > 0
  check_mode: false

- name: derive the primary's pair list
  ansible.builtin.set_fact:
    capture_primary_pairs: >-
      {{ (capture_primary_compose_raw.content | b64decode | regex_search('CAPTURE_PAIRS: \"([^\"]*)\"', '\1') | first).split(',') }}
  when: inventory_hostname not in groups['engine_host'] and capture_primary_compose_raw.content is defined
  # no failed_when on the delegated slurp above: an unreachable primary FAILS the play when (and only
  # when) a new pair is being added — fail-closed is the point (spec D3-7)

- name: pair-add order — refuse a pair the primary does not already carry
  ansible.builtin.assert:
    that: capture_pairs | difference(capture_primary_pairs) | length == 0
    fail_msg: >-
      {{ capture_pairs | difference(capture_primary_pairs) | join(', ') }} not deployed on the primary —
      a secondary-first pair add poisons the reconciler's append-only ledger. Add the pair on the
      PRIMARY first (two --limit runs, primary then secondary), then re-run this converge.
  when: inventory_hostname not in groups['engine_host'] and capture_primary_pairs is defined

- name: probe — the primary's running capture digest (canary scope)
  ansible.builtin.command: docker inspect --format '{{ "{{" }}.Config.Image{{ "}}" }}' zcrypto-capture
  register: capture_primary_running_probe
  failed_when: false
  changed_when: false
  check_mode: false
  when: inventory_hostname in groups['engine_host']

- name: probe — the secondary's running capture digest (canary parity)
  ansible.builtin.command: docker inspect --format '{{ "{{" }}.Config.Image{{ "}}" }}' zcrypto-capture
  register: capture_secondary_digest_probe
  delegate_to: "{{ (groups['capture_host'] | difference(groups['engine_host'])) | first }}"
  failed_when: false
  ignore_unreachable: true  # I1: an unreachable secondary must reach the assert (empty stdout -> refuse via override), never abort or silently pass
  changed_when: false
  check_mode: false
  when: >-
    inventory_hostname in groups['engine_host']
    and capture_primary_running_probe.stdout is defined
    and capture_image_digest not in capture_primary_running_probe.stdout

- name: canary parity — refuse a primary re-pin the secondary has not baked
  ansible.builtin.assert:
    that: >-
      (capture_image_digest in capture_secondary_digest_probe.stdout | default(''))
      or ((canary_override | default('') | string | length > 8)
          and (canary_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
    fail_msg: >-
      The secondary does not run {{ capture_image_digest }} — the primary's canary gate is that digest
      running as capture on the secondary. Converge the secondary first and let it bake, or pass
      -e canary_override="<why this cannot wait>" (a reason, not a boolean; it lands in this log).
  when: >-
    inventory_hostname in groups['engine_host']
    and capture_secondary_digest_probe is not skipped

# spec 00082 D1 (second half): an ACCEPTED override lands its reason in the play log — the assert
# above literally promises "it lands in this log". Gated on the override having been ACCEPTED (the
# fragment true AND the parity check failing), never on the override merely being PRESENT: the
# latter would print a "why" on runs that overrode nothing.
- name: canary override accepted — the reason, on the record
  ansible.builtin.debug:
    msg: "canary_override accepted: {{ canary_override }}"
  when: >-
    inventory_hostname in groups['engine_host']
    and capture_secondary_digest_probe is not skipped
    and not (capture_image_digest in capture_secondary_digest_probe.stdout | default(''))
    and (canary_override | default('') | string | length > 8)
    and (canary_override | default('') | string | lower not in ['true', 'false', '1', 'yes'])

- name: probe — the currently-running digest this converge would replace (pins recording)
  ansible.builtin.command: docker inspect --format '{{ "{{" }}.Config.Image{{ "}}" }}' zcrypto-capture
  register: capture_running_digest_probe
  failed_when: false
  changed_when: false
  check_mode: false

- name: read fleet-pins.md from the controller tree
  ansible.builtin.set_fact:
    capture_fleet_pins_text: "{{ lookup('file', playbook_dir ~ '/../../docs/reference/fleet-pins.md') }}"
  when: capture_running_digest_probe.rc == 0

# M3: regex_search yields None (not an error) on a tag-started image ref. default('') does NOT catch
# that -- None is defined, so the filter passes it through -- and replace() stringifies it, making the
# needle the literal 'None', which no pins row carries. Measured: such a ref fails CLOSED, never open.
- name: pins recording — refuse to replace a digest fleet-pins.md does not record
  ansible.builtin.assert:
    that: >-
      ((capture_running_digest_probe.stdout | default('') | regex_search('sha256:[0-9a-f]{12}') | default('') | replace('sha256:', '')) in capture_fleet_pins_text)
      or ((pins_override | default('') | string | length > 8)
          and (pins_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
    fail_msg: >-
      The digest this converge replaces ({{ capture_running_digest_probe.stdout }}) is not recorded in
      docs/reference/fleet-pins.md — an unrecorded pin is one docker-prune from an unrecoverable
      rollback. Record the CURRENT digest there first (or pass -e pins_override="<reason>" and
      record it immediately after).
  when: capture_running_digest_probe.rc == 0 and capture_fleet_pins_text is defined

# spec 00082 D1 (second half), same shape as the canary echo above: the reason reaches the play log
# only when the override was actually ACCEPTED, i.e. the replaced digest is genuinely unrecorded.
- name: pins override accepted — the reason, on the record
  ansible.builtin.debug:
    msg: "pins_override accepted: {{ pins_override }}"
  when: >-
    capture_running_digest_probe.rc == 0 and capture_fleet_pins_text is defined
    and not ((capture_running_digest_probe.stdout | default('') | regex_search('sha256:[0-9a-f]{12}') | default('') | replace('sha256:', '')) in capture_fleet_pins_text)
    and (pins_override | default('') | string | length > 8)
    and (pins_override | default('') | string | lower not in ['true', 'false', '1', 'yes'])

- name: ensure the capture data directory exists
  ansible.builtin.file:
    path: "{{ capture_data_dir }}"
    state: directory
    owner: zcrypto-data
    group: zcrypto-data
    mode: "0750"

- name: ensure the compose project directory exists
  ansible.builtin.file:
    path: /opt/zcrypto-capture
    state: directory
    owner: root
    group: root
    mode: "0755"

# The zcrypto CLI's own Loki push creds for the CAPTURE container (spec 00068 D5) -- distinct
# from the alloy secrets rendered further below, and NOT gated on `capture_alloy_digest`: this
# render is unrelated to whether Alloy is deployed at all. Root-owned (unlike alloy-secrets.env,
# which the dedicated zcrypto-alloy user must own to read): `docker compose up` for this service
# runs as root (the zcrypto-capture.service systemd unit, ExecStart), never as a key-owning user.
# `logship_loki_token is defined` is the structural safety net -- the vault already carries it
# fleet-wide (2026-07-22), so this renders on every `observed` host from the next converge; a
# converge landing before that vault change existed would simply skip this task, matching the same
# guard on the compose file's env_file/environment additions below that reference this file.
# Deliberately does NOT `notify: restart capture service` (Minor-3, 00068 T4/T5 review): a
# credential rotation must never restart live capture -- a token rotation takes effect at the next
# attended recreate, not by this render alone.
- name: render the logship secrets env file
  ansible.builtin.template:
    src: logship-secrets.env.j2
    dest: /opt/zcrypto-capture/logship-secrets.env
    owner: root
    group: root
    mode: "0600"
  when: logship_loki_token is defined
  no_log: true
  diff: false

- name: render the capture compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/zcrypto-capture/compose.yaml
    owner: root
    group: root
    mode: "0644"
  notify: restart capture service

- name: install the capture systemd unit
  ansible.builtin.copy:
    src: zcrypto-capture.service
    dest: /etc/systemd/system/zcrypto-capture.service
    owner: root
    group: root
    mode: "0644"
  notify: restart capture service

- name: enable + start the capture service (boot resume)
  ansible.builtin.systemd_service:
    name: zcrypto-capture.service
    daemon_reload: true
    enabled: true
    state: started

# --- The segments pull channel: an rrsync forced-command key, pinned read-only to the capture
# data dir (mirrors the engine role's journal pull channel, section 9 of
# infra/ansible/roles/engine/tasks/main.yml).
- name: ensure rsync (which ships the rrsync helper) is installed
  ansible.builtin.package:
    name: rsync
    state: present

# rrsync lives at /usr/bin/rrsync on Debian 13 (trixie) — the rsync package installs it there
# since bookworm (rsync 3.2.4 promoted it out of /usr/share/doc/rsync/scripts/). The absolute
# path keeps the forced command independent of the login shell's PATH.
# The capture data export the NAS pulls now lands on zcrypto-data (the m2m data user, spec 00057),
# not the admin `deploy`. exclusive:false ADDS it; deploy's old copy is dropped by a one-time step
# AFTER the NAS repoints (Task 5/8) — dual authorization so the pull never drops. zcrypto-data OWNS
# the 0750 capture dir now, so the old `deploy`-in-kraken-capture-group traversal hack is gone.
- name: install the sync_capture pubkey as a forced-command entry on zcrypto-data (segments read-only)
  ansible.posix.authorized_key:
    user: zcrypto-data
    exclusive: false
    key: "{{ sync_capture_authorized_key }}"
    key_options: 'command="/usr/bin/rrsync -ro {{ capture_data_dir }}",restrict'

# --- Segment retention (spec 00050 D8, closes T0032's retention half): a daily timer bounds the
# host's local spool at `capture_retention_days` of committed hours. The NAS mirror is the durable
# archive; this disk is not. The script is the load-bearing part — it deletes finals + sidecars and
# nothing else (never .part / .held / .corrupt) — and is tested directly by tests/test_capture_prune.py.
# --- One-off timer metrics -------------------------------------------------------------------
# One-off timers publish a .prom here; long-lived services use /metrics (spec 00071 D1). 0755
# root:root: Alloy runs as a non-key-owning user with only the journal gid, so world-readable is
# what lets its textfile collector read what root writes. Publishers must chmod 0644 their output --
# mktemp makes 0600 and `mv` preserves it, which silently hides the metric from the collector.
# Placed OUTSIDE the Alloy-digest gate below: the directory and its producers must exist whether or
# not this converge carries a digest, or the .prom writers land with nowhere to write.
- name: ensure the node-exporter textfile directory exists
  ansible.builtin.file:
    path: "{{ capture_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: install the reboot-check script
  ansible.builtin.copy:
    src: zcrypto-reboot-check.sh
    dest: /usr/local/sbin/zcrypto-reboot-check
    owner: root
    group: root
    mode: "0755"

- name: render the reboot-check systemd unit
  ansible.builtin.template:
    src: zcrypto-reboot-check.service.j2
    dest: /etc/systemd/system/zcrypto-reboot-check.service
    owner: root
    group: root
    mode: "0644"

- name: install the reboot-check systemd timer
  ansible.builtin.copy:
    src: zcrypto-reboot-check.timer
    dest: /etc/systemd/system/zcrypto-reboot-check.timer
    owner: root
    group: root
    mode: "0644"

# Only the TIMER is enabled -- same reasoning as the prune pairs.
- name: enable + start the reboot-check timer
  ansible.builtin.systemd_service:
    name: zcrypto-reboot-check.timer
    daemon_reload: true
    enabled: true
    state: started

- name: install the segment-prune script
  ansible.builtin.copy:
    src: zcrypto-capture-prune.sh
    dest: /usr/local/sbin/zcrypto-capture-prune
    owner: root
    group: root
    mode: "0755"

- name: render the segment-prune systemd unit
  ansible.builtin.template:
    src: zcrypto-capture-prune.service.j2
    dest: /etc/systemd/system/zcrypto-capture-prune.service
    owner: root
    group: root
    mode: "0644"

- name: install the segment-prune systemd timer
  ansible.builtin.copy:
    src: zcrypto-capture-prune.timer
    dest: /etc/systemd/system/zcrypto-capture-prune.timer
    owner: root
    group: root
    mode: "0644"

# Only the TIMER is enabled: the service is the oneshot it triggers, and enabling that too would
# run a prune on every boot.
- name: enable + start the segment-prune timer
  ansible.builtin.systemd_service:
    name: zcrypto-capture-prune.timer
    daemon_reload: true
    enabled: true
    state: started

# --- The capture host's telemetry stack — Grafana Alloy (spec 00057; T0020's first-time telemetry
# stand-up on the capture VPSes). Gated on the pinned Alloy digest: a converge without it skips the
# whole block, so this stays inert until the attended first-start step (plan Tasks 5/7) passes a
# digest. This RENDERS the stack only — it never starts Alloy (no systemd unit, no `docker compose
# up`, no restart handler), mirroring the ops role's render-only Alloy block: the first start is an
# attended step, not a converge side effect.
# T0110: the gate above skips the config copy on any converge that omits the digest -- by design,
# and the reason both capture hosts silently ran a month-old keep-regex while the repo was correct.
# Every automated check in this repo compares the repo to ITSELF; nothing compared a host to it.
# This is that check, and it lives OUTSIDE the gate on purpose: inside, it would be skipped by
# exactly the converge that caused the drift. It asserts only when a config is already deployed, so
# a host that has never had Alloy (nothing to drift) passes, and the first real deploy creates it.
- name: read the deployed alloy config's checksum (drift check — never gated on the digest)
  ansible.builtin.stat:
    path: "{{ capture_alloy_dir }}/conf/config.alloy"
    checksum_algorithm: sha256
    get_checksum: true
  register: capture_deployed_alloy_config

# On the CONTROLLER, via stat rather than lookup+hash: the file lookup strips the trailing
# newline, so hashing its result never equals the file's real sha256 and the assert below would
# fail on every host forever -- a check that cannot pass is worse than none, because it gets
# disabled. stat on both sides hashes the same bytes.
- name: read the repo's alloy config checksum (controller-side, same algorithm)
  ansible.builtin.stat:
    path: "{{ role_path }}/files/config.alloy"
    checksum_algorithm: sha256
    get_checksum: true
  register: capture_repo_alloy_config
  delegate_to: localhost
  become: false
  changed_when: false

- name: assert the deployed alloy config matches the repo
  ansible.builtin.assert:
    that: "capture_deployed_alloy_config.stat.checksum == capture_repo_alloy_config.stat.checksum"
    fail_msg: >-
      The Alloy config on this host does NOT match the repo. A converge that omits
      `capture_alloy_digest` skips the config copy and still exits 0, so the host can serve a stale
      keep-regex indefinitely while every other check passes. Re-run this converge with
      `-e capture_alloy_digest=<currently-running>`, then recreate the container so the new file is
      read. Runbook context: docs/open-topics/archive/T0109-alloy-config-changes-never-reach-the-capture-hosts.md
    success_msg: "deployed Alloy config matches the repo"
  # Only on a converge that CANNOT reconcile the drift. A run carrying the digest is about to
  # copy the file, so asserting first would fail the host, drop it from every later task, and
  # leave the copy unreached -- making a legitimate config change unconvergeable and looping the
  # fail_msg's own remedy back into this assert. The drift-CAUSING converge is the one that omits
  # the digest, and that is exactly the case still checked.
  when:
    - capture_alloy_digest is not defined
    - capture_deployed_alloy_config.stat.exists

- name: install the capture telemetry stack — Grafana Alloy (needs the pinned Alloy digest)
  when: capture_alloy_digest is defined
  block:
    # Alloy mounts /:/host/root:ro (alloy-compose.yaml.j2) for free-disk-space metrics, so a
    # key-owning user's ~/.ssh would be readable straight through that mount, no escalation needed —
    # the exact protection the NAS replicates with its dedicated uid-1031 (T0030). The capture hosts
    # hold no private key today, but running Alloy as a key-owning user would still be the wrong
    # default, so `zcrypto-alloy` is a dedicated, non-login system user that owns nothing key-adjacent
    # — the direct-read path stays closed by construction. (The docker-socket residual this used to
    # sit alongside is gone — the socket mount and its group_add retired with `discovery.docker`,
    # spec 00068 D6.)
    - name: create the zcrypto-alloy system user (nologin, non-key-owning, dedicated to Alloy)
      ansible.builtin.user:
        name: zcrypto-alloy
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: look up the zcrypto-alloy account
      ansible.builtin.getent:
        database: passwd
        key: zcrypto-alloy

    - name: derive the zcrypto-alloy uid/gid for the container user mapping
      ansible.builtin.set_fact:
        capture_alloy_uid: "{{ ansible_facts['getent_passwd']['zcrypto-alloy'][1] }}"
        capture_alloy_gid: "{{ ansible_facts['getent_passwd']['zcrypto-alloy'][2] }}"

    # The host's persistent journal files are root:systemd-journal 0640, and Alloy (running as the
    # non-root zcrypto-alloy user) reads them through the /var/log/journal:/host/journal:ro mount
    # for the capture-prune unit's host-side lines AND its own journald-driver stream (D6) — neither
    # exists in any container json.log. NUMERIC gid, derived here (never hardcoded — it is a
    # per-host accident). The `systemd-journal` group is created by the systemd package itself, so
    # it exists on any Debian host.
    - name: look up the systemd-journal group (Alloy's journal-read group_add needs its numeric gid)
      ansible.builtin.getent:
        database: group
        key: systemd-journal

    - name: derive the systemd-journal group's numeric gid for the alloy container's group_add
      ansible.builtin.set_fact:
        capture_journal_gid: "{{ ansible_facts['getent_group']['systemd-journal'][1] }}"

    # Admin-plane files (this dir, config.alloy, compose.yaml) are owned root:root — NOT a per-user
    # owner like the admin zcrypto-deploy: root:root matches the capture role's own /opt/zcrypto-capture
    # + compose convention and keeps the render decoupled from any admin account's existence/uid (it
    # rendered before zcrypto-deploy existed, during the D1 rename). ONLY alloy-data and the rendered
    # secrets file are owned by the dedicated Alloy user (it must WRITE the WAL, and READ the 0600
    # secrets it does not own by default).
    - name: ensure the alloy project directory exists
      ansible.builtin.file:
        path: "{{ capture_alloy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Owned by the dedicated Alloy user, not root: this holds the remote_write WAL + Loki log
    # read-positions, which must survive container replacement, or a redeploy re-ships the retained log
    # backlog into the ingest quota (00043) — and Alloy (running as zcrypto-alloy) needs WRITE here,
    # unlike everything else under capture_alloy_dir.
    - name: ensure the alloy data directory exists, owned by the dedicated Alloy user
      ansible.builtin.file:
        path: "{{ capture_alloy_dir }}/alloy-data"
        state: directory
        owner: zcrypto-alloy
        group: zcrypto-alloy
        mode: "0755"

    # Plain `copy`, not `template` — this file is 100% static (the host label is read at runtime from
    # constants.hostname, not templated); see the file's own header for why `template:` would be wrong.
    # In its OWN directory, which is what the compose file bind-mounts. A single-file bind mount
    # binds the inode, and this `copy` writes atomically (temp file + rename), so the inode is
    # replaced and a running container keeps reading the old one -- forever, silently, however many
    # times the converge reports `changed`. Mounting the directory makes the new file visible
    # through the path instead. The directory holds ONLY the config: the project dir also carries
    # alloy-secrets.env, which must not appear inside the container at a second path.
    - name: ensure the alloy config directory exists
      ansible.builtin.file:
        path: "{{ capture_alloy_dir }}/conf"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: install the alloy pipeline config
      ansible.builtin.copy:
        src: config.alloy
        dest: "{{ capture_alloy_dir }}/conf/config.alloy"
        owner: root
        group: root
        mode: "0644"
      notify: reload alloy

    # Renders straight from the vault (group_vars/observed/vault.yml) — capture_host is in the
    # `observed` group, so the six GRAFANA_* creds resolve. no_log + diff: false: without both, a
    # converge prints the six Grafana Cloud credentials to the terminal and any log capturing the run.
    # Owned by zcrypto-alloy (the container's `user:`), so it can read a 0600 file it does not own by
    # default.
    - name: render the alloy secrets env file
      ansible.builtin.template:
        src: alloy-secrets.env.j2
        dest: "{{ capture_alloy_dir }}/alloy-secrets.env"
        owner: zcrypto-alloy
        group: zcrypto-alloy
        mode: "0600"
      no_log: true
      diff: false

    - name: render the alloy compose file
      ansible.builtin.template:
        src: alloy-compose.yaml.j2
        dest: "{{ capture_alloy_dir }}/compose.yaml"
        owner: root
        group: root
        mode: "0644"
