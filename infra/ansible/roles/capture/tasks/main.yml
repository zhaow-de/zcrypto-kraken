---
# Deploys the capture daemon: renders compose.yaml + the systemd unit, and lets the unit's own
# ExecStartPre/ExecStart/ExecStop ("docker compose pull" / "up" / "down") own the actual
# pull+run — that's also what resumes capture on boot. Ansible only starts/enables/restarts it.
- name: look up the kraken-capture service account (created by the base role)
  ansible.builtin.getent:
    database: passwd
    key: kraken-capture

- name: derive the kraken-capture uid/gid for the container's user mapping
  ansible.builtin.set_fact:
    capture_uid: "{{ ansible_facts['getent_passwd']['kraken-capture'][1] }}"
    capture_gid: "{{ ansible_facts['getent_passwd']['kraken-capture'][2] }}"

- name: fail fast if the pinned image digest was not supplied
  ansible.builtin.assert:
    that: capture_image_digest | length > 0
    fail_msg: >-
      capture_image_digest is empty — pass the built image's digest, e.g.
      -e capture_image_digest=sha256:<...> (see the job summary of
      .github/workflows/capture-image.yml for the digest of the latest push).

- name: ensure the capture data directory exists
  ansible.builtin.file:
    path: "{{ capture_data_dir }}"
    state: directory
    owner: kraken-capture
    group: kraken-capture
    mode: "0750"

- name: ensure the compose project directory exists
  ansible.builtin.file:
    path: /opt/zcrypto-capture
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: render the capture compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/zcrypto-capture/compose.yaml
    owner: root
    group: root
    mode: "0644"
  notify: restart capture service

- name: install the capture systemd unit
  ansible.builtin.copy:
    src: zcrypto-capture.service
    dest: /etc/systemd/system/zcrypto-capture.service
    owner: root
    group: root
    mode: "0644"
  notify: restart capture service

- name: enable + start the capture service (boot resume)
  ansible.builtin.systemd_service:
    name: zcrypto-capture.service
    daemon_reload: true
    enabled: true
    state: started

# --- The segments pull channel: an rrsync forced-command key on the deploy account, pinned
# read-only to the capture data dir regardless of deploy's other powers (mirrors the engine
# role's journal pull channel, section 9 of infra/ansible/roles/engine/tasks/main.yml).
- name: ensure rsync (which ships the rrsync helper) is installed
  ansible.builtin.package:
    name: rsync
    state: present

# rrsync lives at /usr/bin/rrsync on Debian 13 (trixie) — the rsync package installs it there
# since bookworm (rsync 3.2.4 promoted it out of /usr/share/doc/rsync/scripts/). The absolute
# path keeps the forced command independent of the login shell's PATH.
- name: install the sync_capture pubkey as a forced-command entry in deploy's authorized_keys (segments read-only)
  ansible.posix.authorized_key:
    user: deploy
    exclusive: false
    key: "{{ sync_capture_authorized_key }}"
    key_options: 'command="/usr/bin/rrsync -ro {{ capture_data_dir }}",restrict'

- name: add deploy to the kraken-capture group (makes the 0750 capture data dir traversable for the pull)
  ansible.builtin.user:
    name: deploy
    groups: kraken-capture
    append: true
  # First-run check mode: the kraken-capture account is created by the base role, which itself
  # no-ops under --check — so on a first-run dry run the account (and its group) doesn't really
  # exist yet and this membership edit cannot resolve it. Skip exactly that case; every real
  # converge still runs it (same guard rationale as the engine role's journal pull channel).
  when: not (ansible_check_mode and not capture_account_known)
  vars:
    capture_account_known: "{{ ((ansible_facts['getent_passwd'] | default({}))['kraken-capture'] | default(none)) is not none }}"

# --- Segment retention (spec 00050 D8, closes T0032's retention half): a daily timer bounds the
# host's local spool at `capture_retention_days` of committed hours. The NAS mirror is the durable
# archive; this disk is not. The script is the load-bearing part — it deletes finals + sidecars and
# nothing else (never .part / .held / .corrupt) — and is tested directly by tests/test_capture_prune.py.
- name: install the segment-prune script
  ansible.builtin.copy:
    src: zcrypto-capture-prune.sh
    dest: /usr/local/sbin/zcrypto-capture-prune
    owner: root
    group: root
    mode: "0755"

- name: render the segment-prune systemd unit
  ansible.builtin.template:
    src: zcrypto-capture-prune.service.j2
    dest: /etc/systemd/system/zcrypto-capture-prune.service
    owner: root
    group: root
    mode: "0644"

- name: install the segment-prune systemd timer
  ansible.builtin.copy:
    src: zcrypto-capture-prune.timer
    dest: /etc/systemd/system/zcrypto-capture-prune.timer
    owner: root
    group: root
    mode: "0644"

# Only the TIMER is enabled: the service is the oneshot it triggers, and enabling that too would
# run a prune on every boot.
- name: enable + start the segment-prune timer
  ansible.builtin.systemd_service:
    name: zcrypto-capture-prune.timer
    daemon_reload: true
    enabled: true
    state: started
