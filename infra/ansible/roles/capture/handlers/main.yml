---
- name: restart capture service
  ansible.builtin.systemd_service:
    name: zcrypto-capture.service
    daemon_reload: true
    state: restarted

- name: reload alloy
  # The config is bind-mounted as a DIRECTORY, so the container sees a new file at once but Alloy does
  # not watch it -- this reload applies the edit, and does NOT re-read alloy-secrets.env, so a rotated
  # credential still needs a recreate. `-1` is fetch_url's connection failure, tolerating Alloy DOWN;
  # a 4xx/5xx from a RUNNING Alloy MUST fail here -- `copy` then reports `ok` and nothing re-notifies.
  ansible.builtin.uri:
    url: http://127.0.0.1:12345/-/reload
    method: POST
    status_code: [200, -1]
  register: capture_alloy_reload
  changed_when: capture_alloy_reload.status | default(0) == 200
