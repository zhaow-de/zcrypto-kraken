---
# The pinned image digest to deploy — no sane default; override per-run (or in group_vars) with
# the value from the capture-image workflow's job summary, e.g.:
#   -e capture_image_digest=sha256:<...>
capture_image_digest: ""

# The rrsync-only login shell for zcrypto-data (spec 00057) — deployed by this role, pointed at by
# the base role's base_capture_shell.
capture_rrsync_shell: /usr/local/sbin/rrsync-shell

capture_cpu_limit: "1.5"
capture_memory_limit: "2g"
capture_log_max_size: "50m"
capture_log_max_file: "5"

# Optional healthchecks.io ping URL (the `monitoring` role provisions + supplies this once it
# lands); empty means the daemon simply skips liveness pings.
capture_healthcheck_url: ""

# Local retention of committed hour segments, in days (spec 00050 D8, T0032). The NAS mirror is the
# durable archive, so this disk is a spool. Raising it is safe; lowering it below a day is not, and
# the timer refuses.
capture_retention_days: 14

# Alloy (spec 00057, T0020), this host's own Grafana Cloud shipper. Gated on `capture_alloy_digest`,
# which has no default and is passed per run: a converge without it skips the whole Alloy block
# rather than rendering a compose file pointing at a broken image reference. The secrets file has no
# role var because alloy-compose.yaml.j2 hardcodes its relative `env_file`.
capture_alloy_dir: /etc/zcrypto-capture/alloy
capture_alloy_image: grafana/alloy

# Where one-off timers on this host publish node-exporter .prom files (spec 00071 D1, T0100).
# Alloy's textfile collector reads it through the EXISTING `/:/host/root:ro` mount, so this needs no
# compose edit and no container recreate.
capture_textfile_dir: /var/lib/zcrypto-node-textfile
