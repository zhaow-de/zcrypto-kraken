# The whole managed fleet runs its admin account as zcrypto-deploy (spec 00057 D1), so this default
# is correct fleet-wide and needs no per-host override. It must NOT be `deploy`: the consumer
# (tasks/main.yml, ansible.builtin.user) CREATES the user if absent, so a stale `deploy` here would
# silently resurrect the dead admin account, in the docker group, on any host lacking it.
docker_deploy_user: zcrypto-deploy

# Verified against download.docker.com/linux/debian/dists/ at build time: trixie is
# published there. Kept overridable (e.g. -e docker_apt_distribution=bookworm) as a
# safety net should Docker's repo ever lag a future Debian release again.
docker_apt_distribution: "{{ ansible_facts.distribution_release }}"

docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64
docker_apt_arch: "{{ docker_apt_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

docker_log_max_size: 50m
docker_log_max_file: "3"
