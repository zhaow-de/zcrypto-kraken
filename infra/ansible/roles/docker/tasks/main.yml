# Docker's own install docs make this step a prerequisite, and it is not optional on a stock Linode
# Debian 13 image: that image ships Debian's OWN docker packages, and `docker-buildx` (0.13.1+ds1-3)
# owns /usr/libexec/docker/cli-plugins/docker-buildx -- the exact path Docker's `docker-buildx-plugin`
# installs to. Installing Docker CE over it aborts mid-transaction with `trying to overwrite ...,
# which is also in package docker-buildx`, leaving the CE packages unpacked-but-unconfigured (dpkg
# `iU`) and the host with NO working docker at all. Purge first, then install. Idempotent: on a host
# that never had them (the primary), this is a no-op.
- name: remove Debian's own docker packages (they conflict with Docker CE)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true

- name: install prerequisites for the Docker apt repo
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: add the Docker apt repository (deb822 format; module fetches + stores the signing key)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ docker_apt_distribution }}"
    components: stable
    architectures: "{{ docker_apt_arch }}"
    signed_by: https://download.docker.com/linux/debian/gpg
    install_python_debian: true

- name: install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: add deploy user to the docker group
  ansible.builtin.user:
    name: "{{ docker_deploy_user }}"
    groups: docker
    append: true

- name: configure the docker daemon (bounded json-file log driver)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: enable + start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
