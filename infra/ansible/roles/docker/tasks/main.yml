# Purge Debian's own docker packages before installing Docker CE, which Docker's install docs make a
# prerequisite: on a stock Debian image their buildx plugin claims the path CE's plugin installs to,
# and the collision aborts CE mid-transaction, leaving the host with no working docker at all. A
# no-op where they were never present.
- name: remove Debian's own docker packages (they conflict with Docker CE)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true

- name: install prerequisites for the Docker apt repo
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: add the Docker apt repository (deb822 format; module fetches + stores the signing key)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ docker_apt_distribution }}"
    components: stable
    architectures: "{{ docker_apt_arch }}"
    signed_by: https://download.docker.com/linux/debian/gpg
    install_python_debian: true

- name: install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: add deploy user to the docker group
  ansible.builtin.user:
    name: "{{ docker_deploy_user }}"
    groups: docker
    append: true

# daemon.json change-ack (spec 00082 D3 guard 8): the template below notifies `restart docker`, and
# bouncing dockerd under live capture is an unbackfillable gap, so this renders to a probe path and
# refuses until the operator acks the diff. `check_mode: false` writes under `--check` -- a stated
# exception to the read-only probe idiom, safe because /run is tmpfs and no service reads it.
- name: probe — render daemon.json to a scratch path (writes under --check; tmpfs, no secrets, no service touched)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /run/zcrypto-daemon-json.probe
    owner: root
    group: root
    mode: "0644"
  changed_when: false
  check_mode: false

# rc != 0 counts as differing, and that deliberately folds in diff's rc 2 (/etc/docker/daemon.json
# absent, i.e. first provision): the handler would fire there too, so it owes an ack like any change.
- name: probe — diff the pending daemon.json against the deployed one
  ansible.builtin.command: diff /run/zcrypto-daemon-json.probe /etc/docker/daemon.json
  register: docker_daemon_json_diff
  failed_when: false
  changed_when: false
  check_mode: false

# Without this the operator would ack unseen content: a `failed_when: false` command prints nothing
# under the default callback, which would void the boolean ack's own rationale below.
- name: daemon.json — show the pending change before asking for an ack
  ansible.builtin.debug:
    var: docker_daemon_json_diff.stdout_lines
  when: docker_daemon_json_diff.rc != 0

# A boolean ack is deliberate HERE (unlike the free-text overrides on the digest guards, which
# substitute for absent evidence): the diff is displayed immediately above, so this acknowledges
# specific shown content.
- name: daemon.json — refuse an unacknowledged change (its handler bounces dockerd)
  ansible.builtin.assert:
    that: docker_daemon_json_diff.rc == 0 or daemon_json_ack | default(false) | bool
    fail_msg: >-
      daemon.json would change and its handler restarts dockerd — under live capture that is a data
      gap. Review the diff above, then re-run with -e daemon_json_ack=true.

- name: configure the docker daemon (bounded json-file log driver)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: enable + start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
