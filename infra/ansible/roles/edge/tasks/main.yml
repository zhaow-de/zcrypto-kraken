---
# The Caddy edge (spec 00122 D15), the node's one public listener; tests/test_infra_edge_role.py holds what it renders and gates.
# Caddy is frozen at the installed version while Cloudsmith's repository is out (five outages in 30 days by
# 2026-10-11): the source and its key are removed so `apt update` passes, and apt keeps the installed Caddy over
# Debian's older one, since it downgrades only under a pin of 1000 or more. A node that never had Caddy installs
# Debian's own from main instead, 2.6.2 on Debian 13, until the owner's debmirror replaces the source.
- name: the Caddy apt repository removed — the interim of 2026-10-11
  ansible.builtin.deb822_repository:
    name: caddy
    state: absent
    install_python_debian: true

- name: caddy present — the installed version, never forced or held
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
  register: edge_caddy_install

# A preview that would install caddy has no unit of it for systemd to find.
- name: note a preview that runs before caddy is installed
  ansible.builtin.set_fact:
    edge_units_previewed: "{{ ansible_check_mode and edge_caddy_install is changed }}"

# Validated by the installed binary before it replaces the live file, so a Caddyfile this Caddy cannot
# parse fails the converge and the edge keeps serving the old one. It carries the basic-auth users' hashes.
- name: Caddyfile — the one public listener's routes
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: caddy validate --adapter caddyfile --config %s
  no_log: true
  diff: false
  notify: reload caddy

- name: caddy enabled + started
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
  when: not edge_units_previewed
