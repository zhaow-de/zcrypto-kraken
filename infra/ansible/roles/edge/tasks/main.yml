---
# The Caddy edge (spec 00122 D15), the node's one public listener; tests/test_infra_edge_role.py holds what it renders and gates.
- name: the Caddy apt source, its key and Debian's caddy pinned out, from the bridgehead's mirror
  ansible.builtin.import_tasks: caddy-source.yml

# A preview whose Caddy source this converge changes (a fresh node, or a first converge onto the mirror) has no lists
# from it, so apt may not find caddy and converge.sh stops on a failed preview: what needs the package or unit skips it.
- name: note a preview that runs before the Caddy repository exists
  ansible.builtin.set_fact:
    edge_repo_previewed: "{{ ansible_check_mode and edge_caddy_repo is changed }}"

- name: caddy present — version FOLLOWED from apt, never forced or held
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
  register: edge_caddy_install
  when: not edge_repo_previewed

# A preview that would install caddy has no unit of it for systemd to find.
- name: note a preview that runs before caddy is installed
  ansible.builtin.set_fact:
    edge_units_previewed: "{{ ansible_check_mode and (edge_repo_previewed or edge_caddy_install is changed) }}"

# Validated by the installed binary before it replaces the live file, so a Caddyfile this Caddy cannot
# parse fails the converge and the edge keeps serving the old one. It carries the basic-auth users' hashes.
- name: Caddyfile — the one public listener's routes
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: caddy validate --adapter caddyfile --config %s
  no_log: true
  diff: false
  notify: reload caddy

- name: caddy enabled + started
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
  when: not edge_units_previewed
