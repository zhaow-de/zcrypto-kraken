# ONE handler for every deployed file: `up -d` converges the containers onto the rendered files,
# and the trailing alloy restart is T0048 CODIFIED — after any `up -d` that recreates a container,
# Alloy's docker tailer keeps following the DEAD container id and the recreated service's logs
# silently stop shipping until Alloy restarts. Baking the restart into the apply makes that
# runbook step impossible to forget.
#
# Guarded on nas_apply_compose (default false): an unflagged converge renders files but DEFERS
# the restarts — deliberate, the same explicit-apply discipline as the ops role's attended first
# start. Apply with: ./scripts/run.sh site.yml --limit nas -e nas_apply_compose=true
- name: apply the nas stack
  ansible.builtin.shell: cd {{ nas_stack_dir }} && {{ nas_docker }} compose up -d && {{ nas_docker }} compose restart alloy
  when: nas_apply_compose | default(false) | bool
  changed_when: true
