# The nas role (T0056): the Synology NAS's zcrypto payload — deploy the archive-pull + alloy
# stack files verbatim from infra/nas/ and render the two env files, applying via the flag-gated
# end-of-role tasks below (NOT a handler — see the apply section for why). DSM owns the OS:
# nothing here touches packages, sshd, the firewall, or Docker itself.

# --- THE TZ GUARD — the play's first act, tags: [always] so it fires even on a tag-scoped run.
# `docker logs --since` parses its argument in the host's LOCAL time: on the CEST NAS a UTC
# timestamp silently selected a 2-hour-wider window and returned stale lines, producing two false
# review verdicts on 2026-07-16 (T0056). Until the clock is UTC, log-based evidence from this
# host cannot be trusted, so the play refuses to manage a non-UTC NAS. The owner deliberately
# keeps the NAS on CEST until this guard exists — it is EXPECTED to fail on first contact; that
# failure is the owner's cue to flip DSM to UTC.
- name: read the NAS clock's UTC offset (the TZ guard's evidence)
  ansible.builtin.command: date +%z
  register: nas_tz_offset
  changed_when: false
  # check_mode false: a read-only clock probe must run even under --check, or the assert below
  # evaluates a SKIPPED result and the guard fails for the wrong reason (found on the maiden dry-run).
  check_mode: false
  tags: [always]

- name: refuse to manage a non-UTC NAS (docker logs --since parses LOCAL time)
  ansible.builtin.assert:
    that: nas_tz_offset.stdout == '+0000'
    fail_msg: >-
      REFUSING to converge the NAS: its clock offset is {{ nas_tz_offset.stdout }}, not +0000.
      `docker logs --since` parses LOCAL time, so every log-window query against a non-UTC NAS is
      silently wrong — the CEST/UTC mismatch produced two false review verdicts on 2026-07-16
      (T0056). Fix: DSM Control Panel -> Regional Options -> Time Zone -> (GMT) Greenwich Mean
      Time, then re-run this play.
    success_msg: NAS clock is UTC (+0000) — proceeding.
  tags: [always]

# --- The stack files, verbatim from infra/nas/ (playbook_dir is infra/ansible, so ../nas is the
# canonical tree — the engine role's ../ src pattern). Deployed by copy, NEVER duplicated into
# this role: a second copy of these files is exactly the drift T0056 documents.
- name: deploy the pull-entrypoint (the in-container scheduler)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nas/pull-entrypoint.sh"
    dest: "{{ nas_stack_dir }}/pull-entrypoint.sh"
    owner: root
    group: root
    mode: "0755"
  register: nas_deploy_entrypoint

- name: deploy the compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nas/compose.yaml"
    dest: "{{ nas_stack_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: nas_deploy_compose

- name: deploy the alloy pipeline config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nas/config.alloy"
    dest: "{{ nas_stack_dir }}/config.alloy"
    owner: root
    group: root
    mode: "0644"
  register: nas_deploy_alloy_config

# The deploy-time env: the image pins compose.yaml refuses to start without (the ${...:?} trap
# that kills T0056's `:latest` placeholder class), the pull sources/ports, and the vaulted gate
# dead-man URL. no_log + diff: false — GATE_HEALTHCHECK_URL is a credential (a healthchecks.io
# ping URL is a bearer capability), so neither the rendered content nor a diff may reach the
# terminal or any log capturing the run (the established pattern wherever a role renders a
# secret — see the ops role).
- name: render the stack .env (image pins, pull sources, the vaulted gate dead-man URL)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nas_stack_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  register: nas_deploy_env

# Grafana Cloud creds for the NAS's Alloy, rendered straight from group_vars/observed/vault.yml —
# the NAS joined the `observed` group when it came under Ansible (T0056), so the hand-placed
# out-of-band credentials file is dead. Same six GRAFANA_* names as the ops role's template; same
# no_log/diff discipline.
- name: render the alloy secrets env file
  ansible.builtin.template:
    src: alloy-secrets.env.j2
    dest: "{{ nas_stack_dir }}/alloy-secrets.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  register: nas_deploy_alloy_secrets

# --- The hot/ hub push channel (spec 00056 D2/D4): the ONE write path into custody. The workstation
# pushes the replicated working set here over rsync-over-ssh, jailed by a vendored rrsync forced
# command pinned to hot/ -- never through the rw NFS mount (a soft-mounted write can corrupt on
# timeout). Deploy-time only (dir + binary + authorized_key); nothing restarts, so NOT gated on
# nas_apply_compose. Ops-authored hot artifacts arrive by the SEPARATE pull channel (HOT_SOURCE in
# pull-entrypoint.sh), not this key. Containment (four layers, all holding against a stolen key running
# its OWN rsync client, not merely a cooperating one): `restrict` (SSH-level, the fleet's D9 idiom); the
# command="" path jail pins the command-line dest under hot/; -munge (rsync --munge-links) mangles
# incoming symlink targets so a pushed symlink cannot be used to traverse OUT of hot/ (the documented
# writable-rrsync escape); and -no-del -no-overwrite enforce the D1c append-only contract SERVER-SIDE
# (strip every --delete*/--remove*, force --ignore-existing -- which also neutralizes --force's
# dir-replace delete, measured). -ro is dropped (it would forbid writes; it is also the only flag that
# implies -no-del, so both -no-del and -no-overwrite are named explicitly here).
# 2775 = setgid: hot/ is the fleet's ONLY two-writer custody dir. The pull container writes as uid 1000
# (primary group zcrypto), but the workstation push writes as zcrypto-deploy whose PRIMARY group is
# `users` -- without setgid its subtrees would drift to group `users` and break the custody-wide
# group-zcrypto invariant (spec 00048), the precondition for the exit-23 whole-pull failure class. The
# setgid forces both writers' children to inherit group zcrypto. (Siblings are plain 0775 because they
# have a single writer whose primary group already IS zcrypto.)
- name: ensure the hot/ hub directory exists (setgid so both writers' children inherit group zcrypto)
  ansible.builtin.file:
    path: /volume1/ZhaoCrypto/hot
    state: directory
    # The custody data user was renamed zcrypto -> zcrypto-data (uid 1000 kept; fleet users/groups
    # regularization, spec 00057); the GROUP stayed zcrypto (gid 1000). Matches every sibling custody dir.
    owner: zcrypto-data
    group: zcrypto
    mode: "2775"

- name: deploy the vendored rrsync jailer (the NAS ships no rrsync -- rsync 3.4.1's python3 rrsync, T0056)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nas/rrsync"
    dest: "{{ nas_stack_dir }}/rrsync"
    owner: root
    group: root
    mode: "0755"
  register: nas_deploy_rrsync

- name: install the hot-push pubkey as a write-capable rrsync forced command jailed to hot/
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    exclusive: false
    key: "{{ nas_hot_push_authorized_key }}"
    key_options: 'command="{{ nas_stack_dir }}/rrsync -munge -no-del -no-overwrite /volume1/ZhaoCrypto/hot",restrict'

# --- Render-only report: an unflagged converge lands files and says which ones changed, nothing
# restarts. Safe to print for the no_log tasks too — but NOT because the framework censors them:
# in this ansible-core a no_log task's REGISTERED variable keeps the full result dict (dest,
# checksums, temp src path — verified empirically on 2.21.2; no_log only suppresses the task's own
# output). This message is safe only because it projects the key names and .changed booleans —
# never print these registers wholesale.
- name: report which stack files this converge changed
  ansible.builtin.debug:
    msg: >-
      Stack files changed this run:
      {{ nas_changed_files if nas_changed_files else '(none)' }}{{ '' if nas_apply_compose | default(false) | bool
      else ' — render-only (no restarts); apply with -e nas_apply_compose=true' }}
  vars:
    nas_changed_files: >-
      {{ {'pull-entrypoint.sh': nas_deploy_entrypoint,
          'compose.yaml': nas_deploy_compose,
          'config.alloy': nas_deploy_alloy_config,
          'rrsync': nas_deploy_rrsync,
          '.env': nas_deploy_env,
          'alloy-secrets.env': nas_deploy_alloy_secrets}
         | dict2items | selectattr('value.changed') | map(attribute='key') | list }}

# --- The apply — flag-gated END-OF-ROLE tasks, deliberately NOT a notify/handler pair. Two
# findings (2026-07-17) killed the handler mechanism: (a) a notify consumed by a when:-skipped
# handler is NOT deferred to the next run, so the documented render-then-apply two-command
# sequence could never apply — the flagged second run found every file unchanged, nothing
# re-notified, and the guarded handler never fired; (b) even a flagged converge missed
# entrypoint-only changes — `compose up -d` recreates a container only on a service-config-hash
# change, and a bind-mounted file's CONTENT is not part of that hash. So the flag itself is the
# trigger: under -e nas_apply_compose=true these tasks ALWAYS run, applying everything currently
# rendered — not just what changed this run. Idempotent-safe: restarting an already-current
# container is a harmless few seconds of downtime on best-effort loops.
- name: apply — converge the containers onto the rendered files
  ansible.builtin.shell: cd {{ nas_stack_dir }} && {{ nas_docker }} compose up -d
  when: nas_apply_compose | default(false) | bool
  changed_when: true

# The entrypoint is bind-mounted, so a content change never alters the compose hash; an
# unconditional restart under the apply flag is the only way a script edit reliably takes effect
# (finding, 2026-07-17).
- name: apply — restart archive-pull (bind-mounted entrypoint changes are invisible to `up -d`)
  ansible.builtin.shell: cd {{ nas_stack_dir }} && {{ nas_docker }} compose restart archive-pull
  when: nas_apply_compose | default(false) | bool
  changed_when: true

# T0048 CODIFIED: after any `up -d` that recreates a container, Alloy's docker tailer keeps
# following the DEAD container id and the recreated service's logs silently stop shipping until
# Alloy restarts. Baking the restart into the apply makes that runbook step impossible to forget.
- name: apply — restart alloy (T0048; recreated containers' logs stop shipping until it restarts)
  ansible.builtin.shell: cd {{ nas_stack_dir }} && {{ nas_docker }} compose restart alloy
  when: nas_apply_compose | default(false) | bool
  changed_when: true
