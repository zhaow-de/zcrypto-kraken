# The nas role (T0056): the Synology NAS's zcrypto payload — deploy the archive-pull + alloy
# stack files verbatim from infra/nas/ and render the two env files, applying via the flag-gated
# end-of-role tasks below (NOT a handler — see the apply section for why). DSM owns the OS:
# nothing here touches packages, sshd, the firewall, or Docker itself.

# THE TZ GUARD, the play's first act with `tags: [always]` so it fires even on a tag-scoped run.
# `docker logs --since` parses its argument in the host's LOCAL time, so on a non-UTC NAS a UTC
# timestamp silently selects a wider window and returns stale lines. Log-based evidence from this
# host cannot be trusted until the clock is UTC, so the play refuses to manage one (T0056).
- name: read the NAS clock's UTC offset (the TZ guard's evidence)
  ansible.builtin.command: date +%z
  register: nas_tz_offset
  changed_when: false
  # check_mode false: a read-only clock probe must run even under --check, or the assert below
  # evaluates a SKIPPED result and the guard fails for the wrong reason (found on the maiden dry-run).
  check_mode: false
  tags: [always]

- name: refuse to manage a non-UTC NAS (docker logs --since parses LOCAL time)
  ansible.builtin.assert:
    that: nas_tz_offset.stdout == '+0000'
    fail_msg: >-
      REFUSING to converge the NAS: its clock offset is {{ nas_tz_offset.stdout }}, not +0000.
      `docker logs --since` parses LOCAL time, so every log-window query against a non-UTC NAS is
      silently wrong — a local-time mismatch has already produced false review verdicts here.
      Fix: DSM Control Panel -> Regional Options -> Time Zone -> (GMT) Greenwich Mean
      Time, then re-run this play.
    success_msg: NAS clock is UTC (+0000) — proceeding.
  tags: [always]

# --- The stack files, verbatim from infra/nas/ (playbook_dir is infra/ansible, so ../nas is the
# canonical tree — the engine role's ../ src pattern). Deployed by copy, NEVER duplicated into
# this role: a second copy of these files is exactly the drift T0056 documents.
- name: deploy the pull-entrypoint (the in-container scheduler)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nas/pull-entrypoint.sh"
    dest: "{{ nas_stack_dir }}/pull-entrypoint.sh"
    owner: root
    group: root
    mode: "0755"
  register: nas_deploy_entrypoint

- name: deploy the compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nas/compose.yaml"
    dest: "{{ nas_stack_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: nas_deploy_compose

# In its OWN directory, which is what compose.yaml bind-mounts. A single-file bind mount binds the
# INODE, and this `copy` writes atomically, so the inode is replaced and a running container keeps
# reading the old one -- silently, for its whole lifetime, however many times the converge reports
# `changed`. Its own dir rather than the stack dir, which also holds the rendered .env with the
# image pins that must not appear inside the container at a second path.
- name: ensure the alloy config directory exists
  ansible.builtin.file:
    path: "{{ nas_stack_dir }}/conf"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: deploy the alloy pipeline config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nas/config.alloy"
    dest: "{{ nas_stack_dir }}/conf/config.alloy"
    owner: root
    group: root
    mode: "0644"
  register: nas_deploy_alloy_config

# Same pre-`conf/` leftover the capture and ops roles remove: a config.alloy one directory above the
# deployed one, mounted by nothing. Inert, but it answers a wrong-path guess with plausible data
# instead of an error, which is how a current host got reported as stale on 2026-09-01.
- name: remove the pre-conf layout's stale alloy config
  ansible.builtin.file:
    path: "{{ nas_stack_dir }}/config.alloy"
    state: absent

# A value --hash-scope would reject stops all five verified pulls -- refuse it here, before it
# reaches a running container (spec 00102).
- name: refuse an archive-pull hash scope the CLI would reject
  ansible.builtin.assert:
    that: nas_archive_pull_hash_scope in ['full', 'incremental']
    fail_msg: "nas_archive_pull_hash_scope must be full or incremental, got '{{ nas_archive_pull_hash_scope }}'"

# The deploy-time env: the image pins compose.yaml refuses to start without, the pull sources and
# ports, and the vaulted gate dead-man URL. no_log with diff false, because a healthchecks.io ping
# URL is a bearer capability, so neither the rendered content nor a diff may reach the terminal or a
# log capturing the run.
- name: render the stack .env (image pins, pull sources, the vaulted gate dead-man URL)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nas_stack_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  register: nas_deploy_env

# Grafana Cloud creds for the NAS's Alloy, rendered straight from group_vars/observed/vault.yml —
# the NAS joined the `observed` group when it came under Ansible (T0056), so the hand-placed
# out-of-band credentials file is dead. Same six GRAFANA_* names as the ops role's template; same
# no_log/diff discipline.
- name: render the alloy secrets env file
  ansible.builtin.template:
    src: alloy-secrets.env.j2
    dest: "{{ nas_stack_dir }}/alloy-secrets.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  register: nas_deploy_alloy_secrets

# The hot/ hub push channel (spec 00056 D2/D4): the ONE write path into custody. The workstation
# pushes over rsync-over-ssh, jailed by a vendored rrsync forced command pinned to hot/ -- never
# through the rw NFS mount, where a soft-mounted write can corrupt on timeout. Deploy-time only, so
# nothing restarts and it is NOT gated on nas_apply_compose. Ops-authored hot artifacts arrive by
# the separate pull channel, not this key.
#
# Four containment layers, each holding against a stolen key running its OWN rsync client rather
# than a cooperating one: `restrict` at the SSH level; the `command=` path jail pinning the
# destination under hot/; `-munge` mangling incoming symlink targets, so a pushed symlink cannot
# traverse OUT of hot/ -- the documented writable-rrsync escape; and `-no-del -no-overwrite`
# enforcing the append-only contract SERVER-SIDE, stripping every delete and remove flag and forcing
# --ignore-existing, which also neutralises --force's dir-replace delete. `-ro` is dropped because
# it would forbid writes, and it is the only flag implying -no-del, so both are named explicitly.
#
# 2775 is setgid because hot/ is the fleet's ONLY two-writer custody dir: the pull container writes
# as an explicit uid:gid, but an ssh login's egid is the account's PRIMARY group, which is not
# zcrypto. Without setgid the pushed subtrees drift group and break the custody-wide group-zcrypto
# invariant (spec 00048), which is the precondition for the exit-23 whole-pull failure class.
# Siblings are plain 0775 because each has one writer whose egid already is zcrypto.
- name: ensure the hot/ hub directory exists (setgid so both writers' children inherit group zcrypto)
  ansible.builtin.file:
    path: /volume1/ZhaoCrypto/hot
    state: directory
    # The custody data user was renamed zcrypto -> zcrypto-data (uid 1000 kept; fleet users/groups
    # regularization, spec 00057); the GROUP stayed zcrypto (gid 1000). Matches every sibling custody dir.
    owner: zcrypto-data
    group: zcrypto
    mode: "2775"

# T0056.
- name: deploy the vendored rrsync jailer (the NAS ships no rrsync -- rsync 3.4.1's python3 rrsync)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nas/rrsync"
    dest: "{{ nas_stack_dir }}/rrsync"
    owner: root
    group: root
    mode: "0755"
  register: nas_deploy_rrsync

# No rrsync-only login shell here, unlike ops: DSM accepts ONLY its own built-in shells and refuses
# a custom one at SESSION setup, authenticating the key and then denying before ever exec'ing the
# shell, at any path and regardless of /etc/shells. So zcrypto-data keeps DSM's /bin/sh and the jail
# comes SOLELY from the forced command on the key below, which fully confines it -- no shell, no
# arbitrary command. The ops host adds its wrapper as defence in depth; the NAS cannot.

# The inbound hot-push forced command lands on zcrypto-data, the m2m data user, NOT the admin
# account (spec 00057 keeps the admin out of the data path). `exclusive: false` so it ADDS without
# disturbing that user's other keys. Removing the old copy from the admin account is a host action
# registered in T0169, never role-enforced here, so the fallback survives until the cutover proves
# out.
- name: install the hot-push pubkey as a write-capable rrsync forced command jailed to hot/ (on zcrypto-data)
  ansible.posix.authorized_key:
    user: "{{ nas_data_user }}"
    exclusive: false
    key: "{{ nas_hot_push_authorized_key }}"
    key_options: 'command="{{ nas_stack_dir }}/rrsync -munge -no-del -no-overwrite /volume1/ZhaoCrypto/hot",restrict'

# Render-only report: an unflagged converge lands files and says which changed, and nothing
# restarts. Safe to print for the no_log tasks too -- but NOT because the framework censors them: a
# no_log task's REGISTERED variable keeps the full result dict, including dest, checksums and the
# temp source path, since no_log suppresses only the task's own output. This is safe because it
# projects key names and .changed booleans; never print those registers wholesale.
- name: report which stack files this converge changed
  ansible.builtin.debug:
    msg: >-
      Stack files changed this run:
      {{ nas_changed_files if nas_changed_files else '(none)' }}{{ '' if nas_apply_compose | default(false) | bool
      else ' — render-only (no restarts); apply with -e nas_apply_compose=true' }}
  vars:
    nas_changed_files: >-
      {{ {'pull-entrypoint.sh': nas_deploy_entrypoint,
          'compose.yaml': nas_deploy_compose,
          'config.alloy': nas_deploy_alloy_config,
          'rrsync': nas_deploy_rrsync,
          '.env': nas_deploy_env,
          'alloy-secrets.env': nas_deploy_alloy_secrets}
         | dict2items | selectattr('value.changed') | map(attribute='key') | list }}

# The apply: flag-gated END-OF-ROLE tasks, deliberately NOT a notify/handler pair. A notify consumed
# by a `when:`-skipped handler is NOT deferred to the next run, so a render-then-apply two-command
# sequence could never apply -- the flagged second run finds every file unchanged and nothing re-
# notifies. And even a flagged converge would miss entrypoint-only changes, because `compose up -d`
# recreates on a service-config-hash change and a bind-mounted file's CONTENT is not in that hash.
# So the flag itself is the trigger: these tasks ALWAYS run under it, applying everything currently
# rendered rather than what changed. Restarting an already-current container costs a few seconds on
# best-effort loops.
- name: apply — converge the containers onto the rendered files
  ansible.builtin.shell: cd {{ nas_stack_dir }} && {{ nas_docker }} compose up -d
  when: nas_apply_compose | default(false) | bool
  changed_when: true

# The entrypoint is bind-mounted, so a content change never alters the compose hash; an
# unconditional restart under the apply flag is the only way a script edit reliably takes effect
# (finding, 2026-07-17).
- name: apply — restart archive-pull (bind-mounted entrypoint changes are invisible to `up -d`)
  ansible.builtin.shell: cd {{ nas_stack_dir }} && {{ nas_docker }} compose restart archive-pull
  when: nas_apply_compose | default(false) | bool
  changed_when: true

# Restarts Alloy so it re-reads the config.alloy THIS converge deployed: the config dir is
# bind-mounted read-only, so a new file lands while the running process keeps the config it started
# with -- a drift the deployed-file assert cannot see. Added for T0048 (Alloy's docker tailer kept
# following a DEAD container id after a recreate); that mechanism is RETIRED here -- config.alloy
# runs `loki.source.journal` only, and the sole `discovery.docker` left in it is a comment.
- name: apply — restart alloy (re-reads the config.alloy this converge deployed)
  ansible.builtin.shell: cd {{ nas_stack_dir }} && {{ nas_docker }} compose restart alloy
  when: nas_apply_compose | default(false) | bool
  changed_when: true
