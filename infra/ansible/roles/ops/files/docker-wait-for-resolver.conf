# Installed by the `ops` role as a docker.service drop-in. A container keeps the resolver config it
# started with, so docker waits here until the host has a nameserver. The bound is the only one:
# docker's own unit sets TimeoutStartSec=0. The `-` keeps a failed or missing waiter from holding
# docker down.
[Service]
ExecStartPre=-/usr/local/sbin/zcrypto-wait-for-resolver /etc/resolv.conf 90
