ops_data_dir: /var/lib/zcrypto-ops
ops_compose_dir: /etc/zcrypto-ops

# The pinned image the ops-node containers run: always the DEFAULT (AVX) build — never `-compat`,
# never `:latest` (spec 00051). `ops_image_digest` deliberately has NO default: pass it per-run
# (-e ops_image_digest=sha256:<...>); every task that renders an image reference is guarded with
# `when: ops_image_digest is defined`, so a converge without it skips those installs rather than
# rendering units that point at a broken image reference.
ops_image: ghcr.io/zhaow-de/zcrypto-capture

# Canonical tree names, mirroring the NAS layout. Since T0058 the capture/journal trees are read
# from the NAS's NFS export (mounted at ops_nas_mount, container-visible as /nas); only the
# reconciled overlay lives under ops_data_dir (this host WRITES it, /data in the containers).
ops_capture_subdir: capture-segments
ops_reconciled_subdir: capture-reconciled
ops_journal_subdir: engine-journal

# The L2 primitive panel tree (spec 00052 D4/D6), under ops_data_dir; the panel-materialize timer
# mounts ops_data_dir at /data, so this is the container-visible tree name.
ops_panel_subdir: l2-panel

# The hot-out outbox (spec 00056 D2/D4), under ops_data_dir: what this node stages for the NAS to
# pull into its hot/ hub via the sync_hot -ro channel (infra/ops/README.md).
ops_hot_out_subdir: hot-out

# node-exporter-style textfile-collector dir the replay/archive-pull/panel timers publish their
# .prom files into.
ops_textfile_dir: "{{ ops_data_dir }}/textfile"

# healthchecks.io dead-man ping URLs, one per timer. Empty means the ping is simply skipped
# (mirroring the CLI's optional `ping_healthcheck` semantics).
ops_verify_replay_healthcheck_url: ""
ops_verified_replay_healthcheck_url: ""

# The liquidations poller's dead-man ping URL (LIQUIDATIONS_HEALTHCHECK_URL in the rendered
# compose). Empty means the recorder simply skips liveness pings, same as the capture daemon.
ops_liquidations_healthcheck_url: ""

# T0058: where the NAS's read-only NFS export (192.168.100.5:/volume1/ZhaoCrypto) is mounted. The
# canonical trees (capture-segments, capture-segments-red, engine-journal) are READ through this
# mount; it replaced the retired hourly NAS->ops rsync mirror (ops_nas_pull_source, now gone, and
# with it the pull's dead-man plumbing). The write-back direction is unchanged: overlay + panel
# still return via the NAS-initiated rrsync pulls.
ops_nas_mount: /mnt/zhao-crypto

ops_panel_healthcheck_url: ""

# --- Alloy (spec 00054 D1/D7): the ops node's telemetry stack. D1 is an ORDERING constraint --
# this lands, and its series are confirmed in Grafana, BEFORE the overlay writer moves here
# (plan 00054 Task 3 gates Task 7). Without it the node's four textfiles reach nobody, and moving
# the writer onto an unobservable host would be T0052's defect one level up.
ops_alloy_dir: /etc/zcrypto-ops/alloy
ops_alloy_image: grafana/alloy
# The secrets file (GRAFANA_PROM_URL/USERNAME/PASSWORD + GRAFANA_LOKI_URL/USERNAME/PASSWORD) has no
# role var: alloy-compose.yaml.j2 hardcodes its relative `env_file: ./alloy-secrets.env` (nothing
# else references the path, so a var would be dead config -- review finding 3). It is rendered by
# this role from group_vars/observed/vault.yml (tasks/main.yml), owned by zcrypto-alloy -- the same
# pattern the nas role uses for the NAS's copy since T0056 -- see infra/ops/README.md.

# --- OPS-5 (spec 00054 D2): the overlay writer's knobs, moved here with the writer from the NAS's
# compose (RECONCILE_MIN_GAP_SECONDS / RECONCILE_WINDOW_HOURS). DETECT-ONLY still applies -- the
# reconciler ledgers `would_mint` and writes no parquet until T0039's soak pins the gap threshold
# from real cross-host data. The default is deliberately 2x the measured 14.78 s single-host maximum
# natural quiescence: one secondary update row is enough to witness a gap, so a per-connection
# coalescing artifact could otherwise trip a phantom splice -- an unaudited data swap into an
# archive that cannot be backfilled. Flipping to --mint is T0039's call, not this role's.
# PINNED from data 2026-07-17, not asserted (spec 00050 Task 12 / T0039): 66 h of two-host soak,
# 217 primary-silence windows the secondary witnessed, max 12.08 s — every one of them natural
# (the primary never rebooted during the soak, so there were no real outages to exclude). 30 s is
# 2.03x the 14.78 s single-host max quiescence and 2.48x the measured cross-host max, and stays 2.8x
# below the smallest real outage on record (83 s), so it costs no detection power. The harness
# suggested 25 s (2x the cross-host max); 30 s is kept because the cost asymmetry errs high — a
# missed 20 s gap is a recorded residual, a phantom splice is an unaudited data swap into an archive
# that cannot be backfilled. The risk is not hypothetical: the soak's own max was a CLASSIFIED
# coalescing artifact (AVAX/EUR 06:36:45–57, 12.08 s of primary silence with 59 secondary rows
# inside, while 9 sibling pairs kept flowing on the same healthy host) — at a 10 s threshold the
# reconciler would have spliced it. Derivation: T0039.
ops_reconcile_min_gap_seconds: 30
ops_reconcile_window_hours: 48

# The --mint flip (spec 00050 Task 12's last step). DEFAULT FALSE: minting writes healed hours into
# custody and the ledger's dedupe means a wrong verdict is never revisited, so enabling it is a
# deliberate act with a name, never a silent default. Unlocked only once --min-gap-seconds is pinned
# from real cross-host data (above). false => --detect-only: the reconciler ledgers every would_mint
# and writes no parquet. The two correlated-loss detectors (both_streams_silent / total_loss) run
# regardless and are never minted from.
ops_reconcile_mint: false

# The writer cycle's dead-man ping (healthchecks.io — deliberately a SEPARATE failure domain from
# the Grafana observability stack, per CLAUDE.md). Restored 2026-07-17: the T0058 rewrite dropped it
# along with the retired pull concept, silently halving the writer's failure domains — the check
# starved from the last old-script cycle (11:21Z) and went DOWN at ~14:21Z while Grafana read
# healthy metrics the whole time. Empty = ping skipped (the CLI's optional semantics).
ops_archive_pull_healthcheck_url: ""
