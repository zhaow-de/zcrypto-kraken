ops_data_dir: /var/lib/zcrypto-ops
ops_compose_dir: /etc/zcrypto-ops

# The pinned image the ops-node containers run: always the DEFAULT (AVX) build, never `-compat` and
# never `:latest` (spec 00051). `ops_image_digest` deliberately has NO default and is passed per
# run, so a converge without it skips the image-rendering installs rather than pointing units at a
# broken reference.
ops_image: ghcr.io/zhaow-de/zcrypto-capture

# The liquidations poller's container name, a VARIABLE rather than two literals: the pins guard
# inspects this container while the compose template names it, and written independently they
# disagreed. The probe's `failed_when: false` plus `rc == 0` gate then skipped the assert on every
# converge -- a fail-OPEN guard on the only rollback operand this host has.
ops_liquidations_container: zcrypto-ops-liquidations

# Canonical tree names, mirroring the NAS layout. Since T0058 the capture/journal trees are read
# from the NAS's NFS export (mounted at ops_nas_mount, container-visible as /nas); only the
# reconciled overlay lives under ops_data_dir (this host WRITES it, /data in the containers).
ops_capture_subdir: capture-segments
ops_reconciled_subdir: capture-reconciled
ops_journal_subdir: engine-journal

# The L2 primitive panel tree (spec 00052 D4/D6), under ops_data_dir; the panel-materialize timer
# mounts ops_data_dir at /data, so this is the container-visible tree name.
ops_panel_subdir: l2-panel

# The tape-bars tree (spec 00087 D1/D2), under ops_data_dir; the tape-bars timer mounts ops_data_dir
# at /data, so this is the container-visible tree name.
ops_tape_bars_subdir: tape-bars

# The hot-out outbox (spec 00056 D2/D4), under ops_data_dir: what this node stages for the NAS to
# pull into its hot/ hub via the sync_hot -ro channel (infra/ops/README.md).
ops_hot_out_subdir: hot-out
# The liquidations tree (OPS-2), under ops_data_dir; the sync_liquidations pull pins this root.
ops_liquidations_subdir: liquidations

# Fleet users and groups (spec 00057): the machine-to-machine data user runs the data containers,
# owns the data trees and serves the NAS pulls via rrsync forced-command keys, with no sudo and no
# password. Its shell is the rrsync-only wrapper because a nologin shell would block the forced
# commands, which sshd runs through the login shell, while a general shell would grant more than
# needed.
ops_data_user: zcrypto-data
# The rrsync-only login shell for zcrypto-data (infra/ansible/files/rrsync-shell): serves the
# forced-command pulls, refuses interactive shells + any non-rrsync command. Defense-in-depth over
# the per-key command=/restrict jail.
ops_rrsync_shell: /usr/local/sbin/rrsync-shell
# hot-out's two-role handoff group (setgid): zcrypto-data owns + serves; zhaow authors into it.
ops_hot_group: zcrypto-hot
# The interactive-research user (workstation-aligned; created by the research role, NOT this pipeline
# role). Added to ops_hot_group only when it already exists, so this role never creates it.
ops_research_user: zhaow

# node-exporter-style textfile-collector dir the replay/archive-pull/panel timers publish their
# .prom files into.
ops_textfile_dir: "{{ ops_data_dir }}/textfile"

# The nightly verify-replay checkpoint (spec 00078 D9): the per-hour raw facts that let the sweep
# re-replay only what changed, bind-mounted at /state as the only writable mount the nightly run
# gets. Deliberately a sibling under ops_data_dir and NOT under any NAS rrsync pin, which are exact-
# subtree (T0057), so it is never replicated -- a stale replica would certify hours nobody verified.
# Deleting it costs one full re-verification.
ops_verify_replay_state_subdir: verify-replay-state

# healthchecks.io dead-man ping URLs, one per timer. Empty means the ping is simply skipped
# (mirroring the CLI's optional `ping_healthcheck` semantics).
ops_verify_replay_healthcheck_url: ""
ops_verified_replay_healthcheck_url: ""

# T0083 mutual watchdog: the zcrypto-grafana-watchdog check's ping URL (vaulted per host) and the
# Grafana health endpoint the pinger probes. Empty URL skips the ping, same semantics as above.
ops_grafana_watchdog_healthcheck_url: ""
ops_grafana_watchdog_probe_url: "https://zcrypto2026.grafana.net/api/health"

# The liquidations poller's dead-man ping URL (LIQUIDATIONS_HEALTHCHECK_URL in the rendered
# compose). Empty means the recorder simply skips liveness pings, same as the capture daemon.
ops_liquidations_healthcheck_url: ""

# T0058: where the NAS's read-only NFS export is mounted. The canonical trees are READ through this
# mount; the write-back direction is unchanged, with overlay and panel returning via the NAS-
# initiated rrsync pulls.
ops_nas_mount: /mnt/zhao-crypto

ops_panel_healthcheck_url: ""

# --- Alloy (spec 00054 D1/D7): the ops node's telemetry stack. D1 is an ORDERING constraint --
# this lands, and its series are confirmed in Grafana, BEFORE the overlay writer moves here
# (plan 00054 Task 3 gates Task 7). Without it the node's four textfiles reach nobody, and moving
# the writer onto an unobservable host would be T0052's defect one level up.
ops_alloy_dir: /etc/zcrypto-ops/alloy
# Alloy's container memory cap on THIS host. 1g, not the 512m the other three run: measured
# 2026-08-28, ops Alloy peaks at 399.1 MiB over 14 d against a 117 MiB swing.
# `zcrypto-fleet-alloy-memory-headroom` divides by this same number, so the two move together.
ops_alloy_memory_limit: 1g
# The Go runtime's soft limit -- 0.9 x ops_alloy_memory_limit on every Alloy host, so the headroom
# rule's 0.9 bar means the runtime lost its soft limit. The two move together; a test pins the ratio.
ops_alloy_gomemlimit: 920MiB
ops_alloy_image: grafana/alloy
# The secrets file has no role var: alloy-compose.yaml.j2 hardcodes its relative `env_file`, nothing
# else references the path, and a var would be dead config. This role renders it from
# group_vars/observed/vault.yml, owned by zcrypto-alloy -- the same pattern the nas role uses.

# OPS-5 (spec 00054 D2): the overlay writer's knobs. DETECT-ONLY is this role's default, and the
# flip to --mint is a named host_vars setting rather than a default change; T0039 records the
# cross-host evidence that unlocked it. The gap default is deliberately about twice the measured single-host maximum natural
# quiescence, because one secondary update row is enough to witness a gap, so a per-connection
# coalescing artifact could otherwise trip a phantom splice -- an unaudited data swap into an
# archive that cannot be backfilled. The cost asymmetry is why it errs high: a missed gap is a
# recorded residual, a phantom splice is not. Derivation, the soak and its classified artifact:
# T0039, and infra/scripts/gap_distribution.py re-runs it.
ops_reconcile_min_gap_seconds: 30
ops_reconcile_window_hours: 48

# The --mint flip (spec 00050 Task 12's last step). DEFAULT FALSE: minting writes healed hours into
# custody and the ledger's dedupe means a wrong verdict is never revisited, so enabling it is a
# deliberate act with a name, taken where the host is described rather than here. False means
# --detect-only: every would_mint is ledgered and no parquet is written. The two
# correlated-loss detectors run regardless and are never minted from.
ops_reconcile_mint: false

# The writer cycle's dead-man ping (healthchecks.io), deliberately a SEPARATE failure domain from
# the Grafana stack per CLAUDE.md: losing it halves the writer's failure domains silently, with
# Grafana still reading healthy metrics throughout. Empty skips the ping, per the CLI's optional
# semantics.
ops_archive_pull_healthcheck_url: ""
