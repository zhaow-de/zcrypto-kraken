---
- name: reload alloy
  # A reload, never a recreate: the DIRECTORY mount lands the new file in place. A reload re-reads
  # neither the image nor alloy-secrets.env (process-level); the role's recreate task takes a changed
  # digest or secrets file. `-1` is fetch_url's connection failure, so Alloy DOWN passes; a 4xx/5xx
  # from a RUNNING one must fail, or `copy` reports `ok` and nothing re-notifies.
  ansible.builtin.uri:
    url: http://127.0.0.1:12345/-/reload
    method: POST
    status_code: [200, -1]
  register: ops_alloy_reload
  changed_when: ops_alloy_reload.status | default(0) == 200
