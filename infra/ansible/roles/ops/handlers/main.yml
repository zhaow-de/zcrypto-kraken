---
- name: reload alloy
  # The config is bind-mounted as a DIRECTORY (see the compose template), so the container already
  # sees the new file the moment Ansible writes it -- but Alloy does not watch the file and will
  # keep serving the previously parsed config until told otherwise. This reload is what makes the
  # edit take effect. Deliberately a reload and NOT `docker compose up --force-recreate`: this role
  # renders the Alloy stack and has never owned its lifecycle, and a directory mount makes the
  # heavier option unnecessary.
  #
  # Tolerant by design: Alloy is started attended, so a converge onto a host where it is not yet
  # running must not fail. A non-running Alloy has nothing to reload, and the next attended
  # `docker compose up -d` reads the config fresh anyway.
  ansible.builtin.uri:
    url: http://127.0.0.1:12345/-/reload
    method: POST
    status_code: [200, -1]
  register: ops_alloy_reload
  failed_when: false
  changed_when: ops_alloy_reload.status | default(0) == 200
