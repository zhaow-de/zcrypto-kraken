# The ops role covers the whole ops-node stack (spec 00051, compute tier): OPS-1 provisions the
# directories + rsync, OPS-2 renders the liquidations-poller compose file, OPS-3 installs the
# continuity-replay/verified-path timers, OPS-4 installs the overlay-writer (historically the NAS
# archive-pull, re-plumbed onto NFS reads by T0058) + panel materialize timers — kept as one role,
# not split into four.

- name: ensure the ops data directory exists
  ansible.builtin.file:
    path: "{{ ops_data_dir }}"
    state: directory
    owner: "{{ ops_data_user }}"
    group: "{{ ops_data_user }}"
    mode: "0755"

- name: ensure the ops compose project directory exists
  ansible.builtin.file:
    path: "{{ ops_compose_dir }}"
    state: directory
    owner: zcrypto-deploy
    group: zcrypto-deploy
    mode: "0755"

# The zcrypto CLI's own Loki push creds for the ops-node LIQUIDATIONS container (spec 00068 D5/T6)
# -- distinct from the alloy secrets rendered further below, and NOT gated on `ops_image_digest`:
# this render is unrelated to whether the liquidations poller is deployed at all. Owned by
# zcrypto-deploy, not root: unlike capture (whose `docker compose up` runs as root via a systemd
# unit), nothing on this host starts the liquidations poller as root -- OPS-2 below is a manual,
# attended `docker compose up -d` by the zcrypto-deploy operator, the same account that already
# owns compose.yaml.j2 itself. `logship_loki_token is defined` is the structural safety net -- the
# vault already carries it fleet-wide (2026-07-22), so this renders on every `observed` host from
# the next converge; a converge landing before that vault change existed would simply skip this
# task, matching the same guard on the compose file's entrypoint/environment/env_file additions
# that reference this file.
- name: render the logship secrets env file
  ansible.builtin.template:
    src: logship-secrets.env.j2
    dest: "{{ ops_compose_dir }}/logship-secrets.env"
    owner: zcrypto-deploy
    group: zcrypto-deploy
    mode: "0600"
  when: logship_loki_token is defined
  no_log: true
  diff: false

# rsync STAYS after T0058 retired the ops-side pull loop: it ships /usr/bin/rrsync, which the
# NAS-initiated pull channels (liquidations, panel, reconciled overlay) force-command into — the
# write-back direction is unchanged, the NAS still pulls FROM this host. nfs-common is the client
# for the read-only NAS mount below.
- name: install rsync (rrsync for the NAS-initiated pull channels) + curl (dead-man pings) + nfs-common (NFS client)
  ansible.builtin.apt:
    name:
      - rsync
      - curl
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- T0058: the NAS custody export, mounted READ-ONLY over NFS. Replaces the retired hourly
# 3-tree rsync mirror (capture-segments, capture-segments-red, engine-journal are now READ through
# this mount); the overlay + panel still return to the NAS via its own rrsync pulls. Unguarded (no
# digest involved). Option reasoning (T0058 consensus, 2026-07-17):
#   * ro + soft: soft surfaces EIO on a hung server instead of a D-state hang, which is
#     categorically safe HERE because the mount is read-only and every consumer treats an
#     unreadable segment as a loud integrity fact, never as absence.
#   * timeo=100 is DECISECONDS (= 10 s), NOT seconds: rides out the Atom NAS's IO bursts (the
#     workstation's 1 s setting is too tight); retrans=3 bounds the worst case before EIO.
#   * nfsvers=3 + nolock: nothing here takes file locks, and nolock drops the statd dependency.
#   * noatime: no atime churn on a read-only workload. nosuid,nodev: free hardening.
#   * noauto + x-systemd.automount (+ 15 s mount-timeout): mounted on first access, so a NAS that
#     is down at boot cannot hang the boot path.
# state: present, NOT mounted — `mounted` would force an immediate mount at converge time, which
# is exactly what noauto+automount exist to avoid; `present` only writes the fstab entry and the
# daemon-reload below lets the systemd automount unit own the actual mounting.
#
# NOTE (attended step, deliberately NOT automated): once the NFS read path is verified live, the
# operator retires the old pull channel's credentials — the `sync_nas_archive` private key (+ the
# nas_known_hosts pin) under the admin home's ~/.ssh on this host and the matching authorized_keys
# entry on the NAS. (Credentials retired 2026-07-17, verified absent post-rename.) The `archive-pull` healthchecks.io check is NOT part
# of this retirement: the overlay writer pings it again since 2026-07-17 — it is live and
# load-bearing. Deleting live-looking keys is an irreversible, verify-first action, so no
# converge task does it.
# T0058.
- name: fstab entry for the NAS custody export (read-only NFS; the automount owns mounting)
  ansible.posix.mount:
    # IP, not the FQDN the ops channels use: this mount is on the NFS recovery path and has to
    # come up at boot with resolution unavailable.
    src: 192.168.100.5:/volume1/ZhaoCrypto
    path: "{{ ops_nas_mount }}"
    fstype: nfs
    opts: ro,nfsvers=3,nolock,soft,timeo=100,retrans=3,noatime,nosuid,nodev,noauto,x-systemd.automount,x-systemd.mount-timeout=15
    state: present
  register: ops_nas_mount_fstab

# `noqa: no-handler`: deliberately an inline task, not a notify/handler — this repo already ate a
# dropped-notify bug (nas role, 1ac9ccd: a notify consumed by a when:-skipped handler is dropped,
# not deferred), and the reload must precede the RequiresMountsFor-ordered units below in the same
# converge, not run at end of play.
- name: systemd daemon-reload so the fstab change (re)generates the automount unit  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ops_nas_mount_fstab is changed

# A generator-produced automount unit is pulled in by local-fs.target AT BOOT; on a live host a
# daemon-reload only LOADS it (inactive/dead), so the mount point never appears until the next
# reboot — found on the maiden converge, where /mnt/zhao-crypto did not exist despite a clean run.
# `systemctl start` is the missing half, and it is idempotent. systemd-escape derives the unit name
# from the path so the two cannot drift ("-" in the path escapes to \x2d).
- name: derive the automount unit name from the mount path
  ansible.builtin.command: systemd-escape -p --suffix=automount {{ ops_nas_mount }}
  register: ops_nas_automount_unit
  changed_when: false
  check_mode: false

- name: start the NAS custody automount (systemd creates the mount point on first start)
  ansible.builtin.systemd_service:
    name: "{{ ops_nas_automount_unit.stdout }}"
    state: started

- name: ensure the textfile-collector directory exists
  ansible.builtin.file:
    path: "{{ ops_textfile_dir }}"
    state: directory
    owner: "{{ ops_data_user }}"
    group: "{{ ops_data_user }}"
    mode: "0755"

# spec 00078 D8/D9: the nightly verify-replay checkpoint, bind-mounted at /state as the sweep's only
# writable mount. Ungated like the data dirs above -- the runner's container is the only writer and
# it fails loudly (summary withheld, run_ok=0) if this is missing or unwritable, so creating it must
# not depend on a digest being passed. 0750, owned by the user the container runs as: nothing else
# on the host reads it, and a world-readable checkpoint would widen the archive's verdict surface
# for nothing.
- name: ensure the verify-replay checkpoint directory exists
  ansible.builtin.file:
    path: "{{ ops_data_dir }}/{{ ops_verify_replay_state_subdir }}"
    state: directory
    owner: "{{ ops_data_user }}"
    group: "{{ ops_data_user }}"
    mode: "0750"

# OPS-6 (spec 00056 D2/D4): the hot-out outbox the NAS pulls into its hot/ hub via a new
# least-privilege `rrsync -ro` forced command (a 4th D9 pull channel -- the three existing roots
# are exact-subtree pinned, none a parent of hot-out; setup in infra/ops/README.md). Ungated, like
# the other data dirs above: the NAS pulls it irrespective of any image/alloy digest.
- name: ensure the ops hot-out outbox directory exists
  ansible.builtin.file:
    path: "{{ ops_data_dir }}/{{ ops_hot_out_subdir }}"
    state: directory
    owner: "{{ ops_data_user }}"
    group: "{{ ops_hot_group }}"
    mode: "2775"

# --- Fleet users/groups (spec 00057, ops phase): the zcrypto-data m2m identity + the hot-out
# authoring bridge. Created in the unconditional preamble (no digest gate) -- these accounts must
# exist before any data ownership or container-user change.
#
# Shell is the rrsync-only wrapper (ops_rrsync_shell), NOT nologin and NOT a general shell: this user
# SERVES the NAS pulls via `command="rrsync -ro ..."` forced-command keys, and sshd runs a forced
# command as `<login-shell> -c "<cmd>"`. A nologin shell swallows it ("account not available", every
# pull fails -- caught by the repoint pre-flight); a general shell (/bin/bash) works but grants more
# than needed. The wrapper permits ONLY rrsync and refuses everything else, so even a mis-added
# forced-command-less key still can't get a shell. With command=+restrict per key + no password, no
# interactive login is reachable. Deployed just below, BEFORE the account's shell points at it.
- name: install the rrsync-only login shell for zcrypto-data
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/rrsync-shell"
    dest: "{{ ops_rrsync_shell }}"
    owner: root
    group: root
    mode: "0755"

- name: create the zcrypto-data m2m user (no password; rrsync-only shell; owns the data + runs the containers)
  ansible.builtin.user:
    name: "{{ ops_data_user }}"
    system: true
    shell: "{{ ops_rrsync_shell }}"
    create_home: true
    state: present

- name: create the zcrypto-hot exchange group (bridges zcrypto-data + the research user zhaow)
  ansible.builtin.group:
    name: "{{ ops_hot_group }}"
    state: present

- name: add zcrypto-data to the exchange group (owns + serves hot-out; reads zhaow-authored files)
  ansible.builtin.user:
    name: "{{ ops_data_user }}"
    groups: "{{ ops_hot_group }}"
    append: true

- name: probe for the research user (created by the research role; optional to this pipeline role)
  ansible.builtin.command: "getent passwd {{ ops_research_user }}"
  register: ops_research_probe
  failed_when: false
  changed_when: false

- name: add the research user to the exchange group when it exists (authors into hot-out)
  ansible.builtin.user:
    name: "{{ ops_research_user }}"
    groups: "{{ ops_hot_group }}"
    append: true
  when: ops_research_probe.rc == 0

# --- The four NAS pull channels, now role-provisioned on zcrypto-data (spec 00057; they were
# hand-installed on deploy). Each `rrsync -ro` pins its own subtree -- least-privilege per channel,
# mirroring the capture/engine roles' sync forced commands. exclusive:false so these ADD to (do not
# replace) zcrypto-data's keys; deploy kept its copies through the NAS-repoint cutover, then dropped.
- name: install the liquidations pull key (rrsync -ro) on zcrypto-data
  ansible.posix.authorized_key:
    user: "{{ ops_data_user }}"
    exclusive: false
    key: "{{ ops_sync_liquidations_authorized_key }}"
    key_options: 'command="/usr/bin/rrsync -ro {{ ops_data_dir }}/{{ ops_liquidations_subdir }}",restrict'

- name: install the panel pull key (rrsync -ro) on zcrypto-data
  ansible.posix.authorized_key:
    user: "{{ ops_data_user }}"
    exclusive: false
    key: "{{ ops_sync_panel_authorized_key }}"
    key_options: 'command="/usr/bin/rrsync -ro {{ ops_data_dir }}/{{ ops_panel_subdir }}",restrict'

- name: install the reconciled pull key (rrsync -ro) on zcrypto-data
  ansible.posix.authorized_key:
    user: "{{ ops_data_user }}"
    exclusive: false
    key: "{{ ops_sync_reconciled_authorized_key }}"
    key_options: 'command="/usr/bin/rrsync -ro {{ ops_data_dir }}/{{ ops_reconciled_subdir }}",restrict'

- name: install the hot-out pull key (rrsync -ro) on zcrypto-data
  ansible.posix.authorized_key:
    user: "{{ ops_data_user }}"
    exclusive: false
    key: "{{ ops_sync_hot_authorized_key }}"
    key_options: 'command="/usr/bin/rrsync -ro {{ ops_data_dir }}/{{ ops_hot_out_subdir }}",restrict'

# Hoisted above ALL THREE digest-gated blocks below (spec 00054 Task 1 fix; extended by OPS-5 D2 to
# cover the archive-pull block too): these two tasks used to live inside the ops_image_digest
# block, but the Alloy block also needs ops_uid/ops_gid for its container `user:` mapping, and now
# the archive-pull block does too (its runner `docker run`s the pinned image as this uid/gid, see
# below). Without the hoist, an Alloy-only converge (ops_alloy_digest passed, ops_image_digest not)
# would render `user: ":"` -- a real coupling bug this hoist removes rather than works around, so
# any of the three digest-gated blocks can converge independently.
# spec 00057.
- name: look up the zcrypto-data account (the ops containers run as its uid/gid)
  ansible.builtin.getent:
    database: passwd
    key: "{{ ops_data_user }}"

- name: derive the zcrypto-data uid/gid for the container user mapping
  ansible.builtin.set_fact:
    ops_uid: "{{ ansible_facts['getent_passwd'][ops_data_user][1] }}"
    ops_gid: "{{ ansible_facts['getent_passwd'][ops_data_user][2] }}"

# --- spec 00082 converge guards (wave 1). Probe idiom: probes never fail or change; the assert
# --- refuses with the fix in the message. Tests: tests/test_infra_converge_guards.py.
#
# Every guard below is gated on `ops_image_digest is defined` — this role's own convention (see
# defaults/main.yml: that variable has NO default). A config- or Alloy-only converge legitimately
# carries no digest and skips every image-consuming task, so a guard that fired there would refuse
# exactly the runs it has nothing to say about. Placed after the account/directory groundwork the
# probes read, and before the first digest-gated block.
- name: probe — is the pinned digest already on this host
  ansible.builtin.command: docker image inspect "{{ ops_image }}@{{ ops_image_digest }}"
  register: ops_digest_probe
  failed_when: false
  changed_when: false
  check_mode: false
  when: ops_image_digest is defined

- name: preflight — refuse a digest the host has not pulled
  ansible.builtin.assert:
    that: ops_digest_probe.rc == 0
    fail_msg: >-
      {{ ops_image }}@{{ ops_image_digest }} is not on {{ inventory_hostname }} — every ops runner
      starts the image with `--pull never` and this role has no pull task, so an unpulled digest is
      not a slow start but a silent outage: every timer exits 125 from its next tick on. Pre-stage
      it first: sudo docker pull {{ ops_image }}@{{ ops_image_digest }}
  when: ops_image_digest is defined

# The liquidations compose file is the ONE artifact this converge repins that the role never
# restarts — the file moves, the container does not — so the repin sits armed until some later
# `docker compose up` rolls it unobserved. The guard refuses to leave that decision implicit; it
# reads the FILE deliberately, because the pin the file carries is its whole subject (the pins
# guard below reads the container instead, and the comment there says why).
- name: probe — the deployed liquidations compose file (existence vs readability)
  ansible.builtin.stat:
    path: "{{ ops_compose_dir }}/compose.yaml"
    follow: true
  register: ops_liquidations_compose_stat
  failed_when: false
  check_mode: false
  when: ops_image_digest is defined

# spec 00083 D9: grep answered 2 for BOTH "absent" (legitimate first-provision stand-down) and
# "present but unreadable" (a permission fault on the very file whose pin this converge would
# move). The stat probe splits them: absent skips, unreadable refuses. `follow: true` on the probe
# resolves symlinks, so a dangling compose.yaml reads as absent rather than as a permission fault.
#
# A FOURTH shape is the stat module's own failure — an unreadable PARENT dir stats EACCES, not
# ENOENT — which registers `{failed: false, msg: "Permission denied"}` with NO `stat` key
# (measured; `failed_when: false` rewrites the flag, so nothing can arm on `.failed` and the absent
# key is the only signal). Read through `stat.exists | default(false)` it is indistinguishable from
# "absent", which stood BOTH guards down and let the repin proceed undecided on the very file whose
# pin it moves. Hence the `stat is not defined` arm below: a failed probe REACHES this assert, and
# `stat.readable | default(false)` is false on that shape, so it refuses. Absent still registers
# `stat: {exists: false}` — key present — and still stands down.
- name: liquidations — an unreadable compose file is a fault, never a first-provision skip
  ansible.builtin.assert:
    that: ops_liquidations_compose_stat.stat.readable | default(false)
    fail_msg: >-
      {{ ops_compose_dir }}/compose.yaml exists but cannot be read — a permission fault on the very
      file whose pin this converge would move — or the probe itself could not stat the path (an
      unreadable parent directory does that). Either way, fix the filesystem fault first; neither
      roll-after nor defer addresses an unreadable pin.
  when: >-
    ops_image_digest is defined
    and ((ops_liquidations_compose_stat.stat is not defined)
         or (ops_liquidations_compose_stat.stat.exists | default(false)))

- name: probe — the digest the deployed liquidations compose file pins
  ansible.builtin.command: grep -E '@sha256:' {{ ops_compose_dir }}/compose.yaml
  register: ops_liquidations_pin_probe
  failed_when: false
  changed_when: false
  check_mode: false
  when: ops_image_digest is defined and ops_liquidations_compose_stat.stat.exists | default(false)

- name: liquidations — require an explicit roll-after/defer decision on a repin
  ansible.builtin.assert:
    that: >-
      (ops_image_digest in ops_liquidations_pin_probe.stdout | default(''))
      or (liquidations_decision | default('') in ['roll-after', 'defer'])
    fail_msg: >-
      This converge repins the liquidations compose file to {{ ops_image_digest }}, which it does
      not currently carry — and nothing here restarts the poller, so the file and the running
      container would disagree until someone else runs `docker compose up`. Decide now:
      -e liquidations_decision=roll-after (preferred — the poller re-fetches a 30 h window every
      cycle, so a converge-length restart self-heals within one cycle) or
      -e liquidations_decision=defer (accepting that the file points at the new digest while the
      container keeps running the old one). If the deployed file turns out to carry no
      digest-pinned image line at all, that is the anomaly to investigate first — a hand-edited or
      truncated compose file — not something either decision fixes.
  # Gated on existence alone, not rc: the stat probe above already split "absent" (skip, nothing
  # deployed to repin) from "present but unreadable" (refused one task up, before this guard is
  # even reached). Any file this guard sees is readable, so the grep probe's rc no longer needs to
  # carry that distinction — a compose file present with no `@sha256:` line at all still refuses
  # here (empty stdout fails the first disjunct), same as before.
  when: >-
    ops_image_digest is defined
    and ops_liquidations_compose_stat.stat.exists | default(false)

# Reads the liquidations CONTAINER, never the compose file the guard above reads: a converge that
# passed the wrong digest once left that file naming a digest the container was not running, so the
# file is not evidence of what this converge would replace. rc != 0 (no such container — first
# provision) skips the guard: there is nothing being replaced.
#
# The name comes from `ops_liquidations_container`, the same value the compose template renders --
# NOT a literal. Two independent literals is exactly how this guard silently died: it probed
# `liquidations-poll`, which is the entrypoint COMMAND and never a container, so the probe always
# returned rc=1 and the `rc == 0` gate below skipped the assert on every converge this host ever ran.
- name: probe — the currently-running digest this converge would replace (pins recording)
  ansible.builtin.command: docker inspect --format '{{ "{{" }}.Config.Image{{ "}}" }}' {{ ops_liquidations_container }}
  register: ops_running_digest_probe
  failed_when: false
  changed_when: false
  check_mode: false
  when: ops_image_digest is defined

- name: read fleet-pins.md from the controller tree
  ansible.builtin.set_fact:
    ops_fleet_pins_text: "{{ lookup('file', playbook_dir ~ '/../../docs/reference/fleet-pins.md') }}"
  when: ops_image_digest is defined and ops_running_digest_probe.rc == 0

# M3: regex_search yields None (not an error) on a tag-started image ref. default('') does NOT catch
# that -- None is defined, so the filter passes it through -- and replace() stringifies it, making the
# needle the literal 'None', which no pins row carries. Measured: such a ref fails CLOSED, never open.
- name: pins recording — refuse to replace a digest fleet-pins.md does not record
  ansible.builtin.assert:
    that: >-
      ((ops_running_digest_probe.stdout | default('') | regex_search('sha256:[0-9a-f]{12}') | default('') | replace('sha256:', '')) in ops_fleet_pins_text)
      or ((pins_override | default('') | string | length > 8)
          and (pins_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
    fail_msg: >-
      The digest this converge replaces ({{ ops_running_digest_probe.stdout }}) is not recorded in
      docs/reference/fleet-pins.md — ops_image_digest has no repo default, so that row is the only
      rollback operand this host has. Record the CURRENT digest there first (or pass
      -e pins_override="<reason>" and record it immediately after).
  when: ops_image_digest is defined and ops_running_digest_probe.rc == 0 and ops_fleet_pins_text is defined

# spec 00082 D1 (second half), same shape as the capture and engine roles' pins echo: the reason
# reaches the play log only when the override was actually ACCEPTED, i.e. the replaced digest is
# genuinely unrecorded. Gating on the override merely being PRESENT would print a "why" on runs that
# overrode nothing. The negated clause below is the assert's own first disjunct character-for-
# character, so a future edit to one that is not mirrored in the other shows up as a textual mismatch.
- name: pins override accepted — the reason, on the record
  ansible.builtin.debug:
    msg: "pins_override accepted: {{ pins_override }}"
  when: >-
    ops_image_digest is defined and ops_running_digest_probe.rc == 0 and ops_fleet_pins_text is defined
    and not ((ops_running_digest_probe.stdout | default('') | regex_search('sha256:[0-9a-f]{12}') | default('') | replace('sha256:', '')) in ops_fleet_pins_text)
    and (pins_override | default('') | string | length > 8)
    and (pins_override | default('') | string | lower not in ['true', 'false', '1', 'yes'])

# Corrects a one-time ownership mismatch left behind by the NOW-REMOVED NAS pull of this tree
# (spec 00054 D2): capture-reconciled arrived here via `rsync -a` run by a root systemd unit, and
# `-a` preserves NUMERIC ownership, so every file/dir under it still carries the NAS's uid/gid 1000
# -- not ops's `deploy` (1001). The reconcile container runs `--user {{ ops_uid }}:{{ ops_gid }}`
# (zcrypto-data since spec 00057), and `ledger_append` (cli/archive/mint.py) opens reconcile-ledger.jsonl in APPEND mode on
# EVERY cycle -- including detect-only, where the ledger is the entire point -- so without this,
# every reconcile run fails EACCES: the directory being 0777 is a red herring, the ledger FILE is
# 0664 owned by 1000, and appending needs write on the file, not just search on the directory.
# `recurse: true` (not just the ledger file) because a future flip out of detect-only will have the
# same container WRITE new/updated parquet into subdirectories that carry the same stale uid --
# narrowing this to the one known-failing file today would just relocate the next EACCES. Safe to
# leave unconditional and recursive on every converge: the tree is ops-produced from here on (this
# same commit dropped it from the ops pull list, so nothing re-imports uid 1000), so post-correction
# runs are a no-op scan, and a chown walk costs per INODE rather than per byte -- so what bounds it
# is the FILE COUNT, which tracks healed hours, not the tree's size on disk. Deliberately pinned to
# no figure: measure it (`find <tree> -type f | wc -l`) if this ever stops being cheap.
# Deliberately NOT inside the `ops_image_digest`-gated block below: ops_reconciled_subdir has a
# default (unlike the runner script, which needs the pinned image and would render an invalid
# `docker run` without it), and the mismatch is a filesystem fact independent of any digest -- gating
# it on the digest would leave a digest-less converge (or a host that never gets one) permanently
# stuck with the NAS's ownership. It must merely run before the archive-pull runner below, which
# Ansible's linear task order already guarantees.
# spec 00054 D2.
- name: ensure the overlay tree is owned by zcrypto-data
  ansible.builtin.file:
    path: "{{ ops_data_dir }}/{{ ops_reconciled_subdir }}"
    state: directory
    owner: "{{ ops_data_user }}"
    group: "{{ ops_data_user }}"
    recurse: true

# The overlay-writer runner (OPS-5, spec 00054 D2; re-plumbed by T0058): archive-pull.sh.j2
# `docker run`s "{{ ops_image }}@{{ ops_image_digest }}" for reconcile + trade-backfill, reading
# the canonical trees through the NFS mount above — the hourly NAS->ops rsync the unit was named
# for is RETIRED (T0058 consensus #2). The zcrypto-archive-pull unit name and ops_archive_pull_*
# metric names stay because the Grafana alerts are provisioned against them; renaming is
# registered follow-up cleanup. The WHOLE block is gated on the pinned digest, not just the
# script: arming a timer whose runner script was never installed would fire every slot against a
# missing /usr/local/sbin/zcrypto-archive-pull, which is worse than not arming it.
- name: install the overlay-writer runner + timer (needs the pinned image digest — historical archive-pull name)
  when: ops_image_digest is defined
  block:
    - name: install the archive-pull runner script
      ansible.builtin.template:
        src: archive-pull.sh.j2
        dest: /usr/local/sbin/zcrypto-archive-pull
        owner: root
        group: root
        mode: "0755"

    - name: render the archive-pull systemd service + timer
      ansible.builtin.template:
        src: "archive-pull.{{ item }}.j2"
        dest: "/etc/systemd/system/zcrypto-archive-pull.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]

    # Unconditional now (T0058): the enable used to TRACK ops_nas_pull_source (review I1(b) — an
    # emptied source genuinely disarmed the pull timer), but the source concept died with the
    # pull, and the writer cycle carries its own fail-closed gate (the NAS-written .pull-status),
    # so the timer is simply armed whenever the runner is installed.
    - name: enable + start the overlay-writer (archive-pull) timer
      ansible.builtin.systemd_service:
        name: zcrypto-archive-pull.timer
        daemon_reload: true
        enabled: true
        state: started

# --- T0083: the Grafana-availability pinger gating the zcrypto-grafana-watchdog dead-man --------
# No image digest needed (the runner is curl-only), so this block is unconditional: the script and
# its units install on every converge. The check itself tolerates a missing pinger by staleness
# (that IS the dead-man), but a timer without its runner script would fail every slot — install
# script before units, same discipline as the archive-pull block above.
- name: install the grafana-watchdog pinger (mutual watchdog, hc.io half)
  block:
    - name: install the grafana-watchdog runner script
      ansible.builtin.template:
        src: grafana-watchdog.sh.j2
        dest: /usr/local/sbin/zcrypto-grafana-watchdog
        owner: root
        group: root
        mode: "0755"
      no_log: true
      diff: false

    - name: render the grafana-watchdog systemd service + timer
      ansible.builtin.template:
        src: "grafana-watchdog.{{ item }}.j2"
        dest: "/etc/systemd/system/zcrypto-grafana-watchdog.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]

    # ignore_errors under check mode only: a `--check` preview never writes the unit files, so on
    # a host where the timer was never installed this enable cannot resolve the unit and would
    # abort the whole preview (observed 2026-07-21 — the fatal masked every later task's diff).
    # A real converge writes the units first and enables for real.
    - name: enable + start the grafana-watchdog timer
      ansible.builtin.systemd_service:
        name: zcrypto-grafana-watchdog.timer
        daemon_reload: true
        enabled: true
        state: started
      ignore_errors: "{{ ansible_check_mode }}"

# --- OPS-2/3/4 (specs 00051/00052): the liquidations-poller compose file + the daily
# continuity-replay/verified-path replay timers + the hourly panel-materialize and tape-bars
# (spec 00087 D6) materialize timers. Installed only when the pinned image digest is supplied
# (-e ops_image_digest=sha256:<...>): a converge
# without it skips this whole block rather than rendering artifacts that point at a broken image
# reference.
- name: install the ops stack — recorder compose + replay/panel timers (needs the pinned image digest)
  when: ops_image_digest is defined
  block:
    # OPS-2: render only — the poller is deliberately NOT auto-started here. First start (and
    # every deliberate restart) is an attended step (`docker compose up -d`): the
    # liquidations stream is not backfillable, so restarting it is never a converge side effect.
    #
    # mode 0600 (not 0644): the rendered file now carries COINALYZE_API_KEY in plaintext (
    # spec 00051 OPS-2) — zcrypto-deploy-only readable, matching the vault's own secrecy expectation.
    - name: render the ops compose file (liquidations poller)
      ansible.builtin.template:
        src: compose.yaml.j2
        dest: "{{ ops_compose_dir }}/compose.yaml"
        owner: zcrypto-deploy
        group: zcrypto-deploy
        mode: "0600"

    - name: install the replay + panel + tape-bars runner scripts
      ansible.builtin.template:
        src: "{{ item }}.sh.j2"
        dest: "/usr/local/sbin/zcrypto-{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop: [verify-replay, verified-replay, panel-materialize, tape-bars]

    - name: render the replay + panel + tape-bars systemd services + timers
      ansible.builtin.template:
        src: "{{ item.0 }}.{{ item.1 }}.j2"
        dest: "/etc/systemd/system/zcrypto-{{ item.0 }}.{{ item.1 }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ ['verify-replay', 'verified-replay', 'panel-materialize', 'tape-bars'] | product(['service', 'timer']) | list }}"
      register: ops_unit_install

    # Only the TIMERS are enabled: the services are the oneshots they trigger, and enabling those
    # too would run both replays on every boot (same rationale as the capture prune timer).
    #
    # The silent re-arm is the recorded trap: this task's enable-and-start turns the panel timer
    # back on after the operator stopped it, so a converge inside a panel-regeneration window fires
    # a materialize against a half-rebuilt tree. `-e ops_panel_timer_hold=true` drops ONLY
    # panel-materialize from the loop, leaving it stopped for the length of that window; the two
    # replay timers are unaffected, and so is tape-bars: it writes a different tree and reads
    # nothing the panel rebuild touches. Opt-in: an ordinary converge still arms all four.
    - name: enable + start the replay + panel + tape-bars timers
      ansible.builtin.systemd_service:
        name: "zcrypto-{{ item }}.timer"
        daemon_reload: true
        enabled: true
        state: started
      loop: "{{ ['verify-replay', 'verified-replay', 'tape-bars'] + ([] if ops_panel_timer_hold | default(false) | bool else ['panel-materialize']) }}"
      # A NEWLY ADDED timer's unit file was never really written under --check, so systemd cannot
      # find it and the preview fails -- and `converge.sh` refuses to run the real pass while the
      # preview fails, so without this guard no new timer can EVER be converged through the
      # sanctioned path. Same guard, same reasoning as the engine role's restart handler. Scoped to
      # check mode only: in a real run the render above has already written the unit, so a
      # not-found here stays a genuine failure.
      #
      # COARSER than the engine role's, and the difference is worth knowing: `ops_unit_install`
      # aggregates an 8-item loop, so in CHECK MODE any changed unit template -- even a mode or
      # comment edit to an existing timer -- suppresses this preview for all four timers, hiding
      # e.g. a manually-stopped verify-replay the real run would restart. Safe (real runs are never
      # gated) but the preview under-reports in a wider window than "first install".
      when: not (ansible_check_mode and ops_unit_install is changed)

# Deliberately OUTSIDE the digest gate above: this script consumes no image reference (it drives
# systemd and rm), and the operator needs it on the host regardless of whether the converge that
# put it there re-pinned anything -- a digestless config-only converge must still land it.
- name: install the panel regenerate flow (delete-and-rebuild with its refusals)
  ansible.builtin.template:
    src: panel-regenerate.sh.j2
    dest: /usr/local/sbin/zcrypto-panel-regenerate
    mode: "0755"
    owner: root
    group: root

# T0110: the gate above skips the config copy on any converge that omits the digest -- by design,
# and the reason both capture hosts silently ran a month-old keep-regex while the repo was correct.
# Every automated check in this repo compares the repo to ITSELF; nothing compared a host to it.
# This is that check, and it lives OUTSIDE the gate on purpose: inside, it would be skipped by
# exactly the converge that caused the drift. It asserts only when a config is already deployed, so
# a host that has never had Alloy (nothing to drift) passes, and the first real deploy creates it.
- name: read the deployed alloy config's checksum (drift check — never gated on the digest)
  ansible.builtin.stat:
    path: "{{ ops_alloy_dir }}/conf/config.alloy"
    checksum_algorithm: sha256
    get_checksum: true
  register: ops_deployed_alloy_config

# On the CONTROLLER, via stat rather than lookup+hash: the file lookup strips the trailing
# newline, so hashing its result never equals the file's real sha256 and the assert below would
# fail on every host forever -- a check that cannot pass is worse than none, because it gets
# disabled. stat on both sides hashes the same bytes.
- name: read the repo's alloy config checksum (controller-side, same algorithm)
  ansible.builtin.stat:
    path: "{{ role_path }}/files/config.alloy"
    checksum_algorithm: sha256
    get_checksum: true
  register: ops_repo_alloy_config
  delegate_to: localhost
  become: false
  changed_when: false

- name: assert the deployed alloy config matches the repo
  ansible.builtin.assert:
    that: "ops_deployed_alloy_config.stat.checksum == ops_repo_alloy_config.stat.checksum"
    fail_msg: >-
      The Alloy config on this host does NOT match the repo. A converge that omits
      `ops_alloy_digest` skips the config copy and still exits 0, so the host can serve a stale
      keep-regex indefinitely while every other check passes. Re-run this converge with
      `-e ops_alloy_digest=<currently-running>`, then recreate the container so the new file is
      read. Runbook context: docs/open-topics/archive/T0109-alloy-config-changes-never-reach-the-capture-hosts.md
    success_msg: "deployed Alloy config matches the repo"
  # Only on a converge that CANNOT reconcile the drift. A run carrying the digest is about to
  # copy the file, so asserting first would fail the host, drop it from every later task, and
  # leave the copy unreached -- making a legitimate config change unconvergeable and looping the
  # fail_msg's own remedy back into this assert. The drift-CAUSING converge is the one that omits
  # the digest, and that is exactly the case still checked.
  when:
    - ops_alloy_digest is not defined
    - ops_deployed_alloy_config.stat.exists

# spec 00054 D1.
- name: install the ops telemetry stack — Grafana Alloy (needs the pinned Alloy digest)
  when: ops_alloy_digest is defined
  block:
    # Review finding 1 (CRITICAL, corrected 2026-07-18): Alloy mounts /:/host/root:ro for
    # free-disk-space metrics, so running it as a user whose ~/.ssh held a private key would let it
    # read that key straight through the mount, no escalation -- the exact protection this stack
    # replicates from the NAS (T0030: uid 1031 there is deliberately NOT the key-owning uid 1000). The
    # acute case this originally guarded -- the `sync_nas_archive` pull key under the admin home -- is
    # now moot: that channel was retired (T0058, credentials removed 2026-07-17), and today neither the
    # admin (`zcrypto-deploy`) nor the m2m (`zcrypto-data`) home holds any private key (only public
    # authorized_keys). Running Alloy as a key-owning user would still be the wrong default, so
    # `zcrypto-alloy` is a dedicated, non-login system user that owns nothing under any such home -- the
    # direct-read path stays closed by construction, mirroring the NAS's uid-1031 choice.
    #
    # The Docker-socket grant this comment used to describe is GONE (spec 00068 D6): Alloy no longer
    # mounts /var/run/docker.sock nor carries the docker gid in `group_add`, because it no longer
    # reads container logs -- the CLI ships its own, and Alloy's remaining log job is the journal.
    # So the root-equivalent escalation residual that T0042 recorded for this host is CLOSED, not
    # merely mitigated by the dedicated uid. What `group_add` still carries is the systemd-journal
    # gid (alloy-compose.yaml.j2), derived below via `getent` -- numeric, NOT a named entry, because
    # Docker resolves a NAMED group_add against the CONTAINER's own /etc/group and the upstream
    # grafana/alloy image ships only `alloy:x:473:`, so a name would never resolve and the container
    # would fail to start. Journal-group membership confers log READ only; it is not an escalation
    # path.
    - name: create the zcrypto-alloy system user (nologin, non-key-owning, dedicated to Alloy)
      ansible.builtin.user:
        name: zcrypto-alloy
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: look up the zcrypto-alloy account
      ansible.builtin.getent:
        database: passwd
        key: zcrypto-alloy

    - name: derive the zcrypto-alloy uid/gid for the container user mapping
      ansible.builtin.set_fact:
        ops_alloy_uid: "{{ ansible_facts['getent_passwd']['zcrypto-alloy'][1] }}"
        ops_alloy_gid: "{{ ansible_facts['getent_passwd']['zcrypto-alloy'][2] }}"

    # Same numeric-gid derivation pattern as the zcrypto-alloy uid/gid above (a NAMED group_add entry
    # resolves against the CONTAINER's own /etc/group, not the host's, so a literal "systemd-journal"
    # name would never resolve): the host's persistent journal files are root:systemd-journal 0640,
    # and Alloy -- running as the non-root zcrypto-alloy user -- reads them through the
    # /var/log/journal:/host/journal:ro mount (alloy-compose.yaml.j2) for
    # the four zcrypto-*.service units' logs (T0060: the orchestration scripts' host-side lines
    # exist in no container log, so the docker socket can never ship them). Safe to look up here:
    # the `systemd-journal` group is created by the systemd package itself, so it exists on any
    # Debian host this role can converge. Same `getent group` field-layout caveat as above:
    # `name:passwd:gid:members`, so index 1 = gid -- NOT passwd's index-1 uid / index-2 gid.
    - name: look up the systemd-journal group (Alloy's journal-read group_add needs its numeric gid)
      ansible.builtin.getent:
        database: group
        key: systemd-journal

    - name: derive the systemd-journal group's numeric gid for the alloy container's group_add
      ansible.builtin.set_fact:
        ops_journal_gid: "{{ ansible_facts['getent_group']['systemd-journal'][1] }}"

    - name: ensure the alloy project directory exists
      ansible.builtin.file:
        path: "{{ ops_alloy_dir }}"
        state: directory
        owner: zcrypto-deploy
        group: zcrypto-deploy
        mode: "0755"

    # Owned by the dedicated Alloy user, not `zcrypto-deploy`: this holds the remote_write WAL + Loki log
    # read-positions, which must survive container replacement, or a redeploy re-ships the retained
    # log backlog into the ingest quota (00043) -- and Alloy (running as zcrypto-alloy) needs WRITE
    # here, unlike everything else under ops_alloy_dir.
    - name: ensure the alloy data directory exists, owned by the dedicated Alloy user
      ansible.builtin.file:
        path: "{{ ops_alloy_dir }}/alloy-data"
        state: directory
        owner: zcrypto-alloy
        group: zcrypto-alloy
        mode: "0755"

    # Review finding 2: plain `copy`, not `template` -- this file is 100% static (see the file's own
    # header comment for why `template:` would be the wrong tool here).
    # In its OWN directory, which is what the compose file bind-mounts. A single-file bind mount
    # binds the inode, and this `copy` writes atomically (temp file + rename), so the inode is
    # replaced and a running container keeps reading the old one -- forever, silently, however many
    # times the converge reports `changed`. Mounting the directory makes the new file visible
    # through the path instead. The directory holds ONLY the config: the project dir also carries
    # alloy-secrets.env, which must not appear inside the container at a second path.
    - name: ensure the alloy config directory exists
      ansible.builtin.file:
        path: "{{ ops_alloy_dir }}/conf"
        state: directory
        owner: zcrypto-deploy
        group: zcrypto-deploy
        mode: "0755"

    - name: install the alloy pipeline config
      ansible.builtin.copy:
        src: config.alloy
        dest: "{{ ops_alloy_dir }}/conf/config.alloy"
        owner: zcrypto-deploy
        group: zcrypto-deploy
        mode: "0644"
      notify: reload alloy

    # Renders straight from the vault (group_vars/observed/vault.yml) -- the NAS's copy is rendered
    # the same way by the `nas` role since T0056, so no hand-placed, out-of-band secrets file
    # exists anywhere in the fleet any more. no_log +
    # diff: false: without both, a converge prints the six Grafana Cloud credentials to the terminal
    # and to any log capturing the run's output (the established pattern -- see docs/plans/00043 --
    # applied wherever this role renders a secret, e.g. the liquidations compose file above). Owned
    # by zcrypto-alloy (not zcrypto-deploy): the container runs as that uid (`user:` in
    # alloy-compose.yaml.j2) and must be able to read a 0600 file it does not own by default.
    - name: render the alloy secrets env file
      ansible.builtin.template:
        src: alloy-secrets.env.j2
        dest: "{{ ops_alloy_dir }}/alloy-secrets.env"
        owner: zcrypto-alloy
        group: zcrypto-alloy
        mode: "0600"
      no_log: true
      diff: false

    - name: render the alloy compose file
      ansible.builtin.template:
        src: alloy-compose.yaml.j2
        dest: "{{ ops_alloy_dir }}/compose.yaml"
        owner: zcrypto-deploy
        group: zcrypto-deploy
        mode: "0644"
