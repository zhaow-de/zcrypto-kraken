# host_vars/zcrypto — the PRIMARY capture host (also the engine host).
#
# The reboot slot lives here, not only in the base role's default, because the fleet-collision
# assert (roles/base/tasks/main.yml) reads every capture host's slot out of `hostvars` — which sees
# inventory vars but NOT role defaults. Declaring it per host is what lets the assert see the whole
# fleet even under `--limit <one-host>`.
#
# 21:25 UTC: measured from 6 days of archive (2026-07-14) — the book-row trough is 20:00-21:00 UTC;
# >= 1 h from any 4h bar boundary, off the hour boundary. The secondary sits +1 h at 22:25.
# (Derivation: spec 00050; policy: .claude/rules/capture-deploys.md.)
base_unattended_upgrades_reboot_time: "21:25"

# This machine's OWN deploy pubkey (per-machine keys, 2026-07-16): rotation edits files/ once.
deploy_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/deploy_zcrypto_ed25519.pub') }}"

# Post-rename identity override (spec 00057 D1, T0068): `deploy` was renamed to `zcrypto-deploy` on
# this host (2026-07-19), so Ansible connects as — and the docker role's admin user is — zcrypto-deploy.
# Per-host override (both capture hosts are now migrated); consolidate into group_vars/capture_host and
# drop the per-host overrides in a follow-up cleanup.
ansible_user: zcrypto-deploy
docker_deploy_user: zcrypto-deploy
