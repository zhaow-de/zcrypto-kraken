# The PRIMARY capture host, and the engine host. The reboot slot is declared here rather than in the
# base role's default: the fleet-collision assert in roles/base/tasks/main.yml reads every host's
# slot from `hostvars`, which sees inventory vars but not role defaults. Slot derivation: spec
# 00050's measured 20:00-21:00 UTC book-row trough.
base_unattended_upgrades_reboot_time: "21:25"

# This machine's OWN deploy pubkey: rotation edits files/ once.
deploy_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/deploy_zcrypto_ed25519.pub') }}"

# No ansible_user here on purpose: zcrypto-deploy is the group default (group_vars/capture_host;
# docker_deploy_user in the docker role).
