# host_vars/zcrypto-ops — SECRETS for the home ops node (compute tier, spec 00051).
#
# Per-VALUE vault encryption (not whole-file): the variable NAMES stay readable so anyone can see
# what this host needs, while every value stays `!vault`-encrypted at rest. Same shape and same
# read/write recipes as host_vars/zcrypto-red/vault.yml — see that file's header.
#
# `ansible_host` overrides the group's (host_vars beats group_vars): z-home-zcrypto.zhaow.pro.
#
# NEVER run `ansible-inventory --host/--list` from infra/ansible/: ansible.cfg supplies the vault
# password, so both silently print every value below in cleartext.

ansible_host: !vault |
          $ANSIBLE_VAULT;1.1;AES256
