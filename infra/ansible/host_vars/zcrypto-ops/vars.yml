# host_vars/zcrypto-ops — the home ops node: compute tier (spec 00051). ops_host ONLY — it must
# never join engine_host, or the live Kraken trade key would be rendered onto a host that has no
# business holding it (D10).
#
# The box currently calls itself zcrypto-red (collision with the secondary capture host); this pins
# the inventory name + on-host hostname to zcrypto-ops instead.
# Converge as the deploy user (same as the capture fleet, which sets this in
# group_vars/capture_host). The bootstrap play overrides this with `-e ansible_user=root` to create
# the deploy user in the first place; every run.sh converge afterward connects as deploy.
ansible_user: deploy

base_hostname: zcrypto-ops

# Provisional: >= 1 h from every 4h bar boundary, off the hour boundary, >= 1 h from the capture
# fleet's 21:25/22:25 slots. The fleet reboot-window assert in the base role reads this out of
# hostvars alongside the capture hosts' slots (see host_vars/zcrypto/vars.yml,
# host_vars/zcrypto-red/vars.yml) and asserts all of `capture_host + ops_host` are pairwise distinct.
base_unattended_upgrades_reboot_time: "02:25"

# Wire the vaulted dead-man ping URL (host_vars/zcrypto-ops/vault.yml) into the role var the
# rendered compose reads as LIQUIDATIONS_HEALTHCHECK_URL.
ops_liquidations_healthcheck_url: "{{ liquidations_healthcheck_url }}"

# Same wiring for the replay/panel timers' dead-men (vault.yml holds the encrypted URLs). The
# archive-pull dead-man wiring is GONE (T0058): the pull it watched is retired and the overlay
# writer that inherited the unit name pings nothing -- pausing/removing the healthchecks.io check
# itself is an attended step, or the
# check pages on the missing pings.
ops_verify_replay_healthcheck_url: "{{ verify_replay_healthcheck_url }}"
ops_verified_replay_healthcheck_url: "{{ verified_replay_healthcheck_url }}"
ops_archive_pull_healthcheck_url: "{{ archive_pull_healthcheck_url }}"
ops_panel_healthcheck_url: "{{ panel_healthcheck_url }}"

# The operator's fleet-wide deploy pubkey, loaded from the same file group_vars/capture_host reads
# (single source: infra/ansible/files/ -- a key rotation edits the .pub file once). The bootstrap
# play installs it for the `deploy` user; `run.sh` then converges over it.
deploy_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/deploy_zcrypto-ops_ed25519.pub') }}"

# THE --mint FLIP (spec 00050 Task 12's final step; flipped 2026-07-17, owner present). Unlocked by
# the 66 h cross-host soak: 217 witnessed silence windows, max 12.08 s (a hand-classified coalescing
# artifact — 9 sibling pairs flowing on a healthy primary), threshold pinned at 30 s = 2.48x that
# max. The ledger held ZERO would_mint entries at flip time, so this applied no backlog — the first
# mint ever will be spec 00050 Task 13's Leg-A drill gap, deliberately created and fully observed.
# Derivation: T0039. To disable: set false (or override -e ops_reconcile_mint=false) + converge.
ops_reconcile_mint: true
