# host_vars/zcrypto-ops — the home ops node: compute tier (spec 00051). ops_host ONLY — it must
# never join engine_host, or the live Kraken trade key would be rendered onto a host that has no
# business holding it (D10).

# The bootstrap play overrides this with `-e ansible_user=root` to create zcrypto-deploy in the
# first place; every run.sh converge afterward connects as zcrypto-deploy.
ansible_user: zcrypto-deploy

# The base role defaults to "zcrypto"; without this the ops node would converge to the capture
# primary's hostname.
base_hostname: zcrypto-ops

# >= 1 h from every 4h bar boundary, off the hour boundary, >= 1 h from the capture fleet's
# 21:25/22:25 slots. The fleet-collision assert reads this out of hostvars alongside them (see
# host_vars/zcrypto/vars.yml).
base_unattended_upgrades_reboot_time: "02:25"

# Wire the vaulted dead-man ping URLs (vault.yml beside this file) into the role vars the rendered
# compose and the timers read.
ops_liquidations_healthcheck_url: "{{ liquidations_healthcheck_url }}"
ops_verify_replay_healthcheck_url: "{{ verify_replay_healthcheck_url }}"
ops_verified_replay_healthcheck_url: "{{ verified_replay_healthcheck_url }}"
# Do NOT pause or remove the `zcrypto-archive-pull` check — it is this unit's independent failure
# domain, and it once went DOWN silently while Grafana stayed green on fresh metrics (T0058). The
# overlay writer pings on rc=0 INCLUDING gate-skips: a skip means alive and refusing stale input.
ops_archive_pull_healthcheck_url: "{{ archive_pull_healthcheck_url }}"
ops_panel_healthcheck_url: "{{ panel_healthcheck_url }}"
ops_grafana_watchdog_healthcheck_url: "{{ grafana_watchdog_healthcheck_url }}"

# The operator's fleet-wide deploy pubkey, from the same files/ dir group_vars/capture_host reads —
# a key rotation edits the .pub once. The bootstrap play installs it for zcrypto-deploy.
deploy_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/deploy_zcrypto-ops_ed25519.pub') }}"

# The four NAS pull-channel public keys the ops role installs on zcrypto-data as `rrsync -ro` forced
# commands (spec 00057). Public material only — the private halves live on the NAS under
# /volume1/docker/zcrypto-archive/keys. The forced-command roots are in roles/ops/tasks/main.yml.
ops_sync_liquidations_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/sync_liquidations_ed25519.pub') }}"
ops_sync_panel_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/sync_panel_ed25519.pub') }}"
ops_sync_reconciled_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/sync_reconciled_ed25519.pub') }}"
ops_sync_hot_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/sync_hot_ed25519.pub') }}"

# Lets the reconciler mint healed hours (flipped 2026-07-17, owner present; derivation T0039). The
# silence threshold that governs a mint is ops_reconcile_min_gap_seconds in
# roles/ops/defaults/main.yml, where its derivation lives. To disable: set false (or
# -e ops_reconcile_mint=false) + converge.
ops_reconcile_mint: true

# Enables + starts zaccess-agentboard; live since 2026-07-30 (spec 00075 D13). agentboard is safe on
# the shared tmux socket: it does not crash the server and refuses to kill a discovered session. The
# config pin that DID crash it is documented at roles/access_ops/templates/tmux.conf.j2 and guarded
# by tests/test_infra_tmux_conf_no_window_size_manual.py.
access_ops_agentboard_live: true
