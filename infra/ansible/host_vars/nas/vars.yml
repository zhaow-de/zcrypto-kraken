# host_vars/nas — the Synology NAS: the archive/custody tier (spec 00048 Role A), Ansible-managed
# since T0056. DSM owns the OS; the nas role manages ONLY the zcrypto payload under nas_stack_dir.
# The secrets sibling (vault.yml) holds nas_gate_healthcheck_url. Deploy background and the
# image-identifier pitfalls live in infra/nas/README.md.

ansible_host: z-home-storage.zhaow.pro
ansible_user: zcrypto-deploy

# The m2m data user (spec 00057, uid 1000): it owns the custody trees and receives the inbound
# hot-push, so the channel belongs here rather than on the admin `zcrypto-deploy`. DSM refuses a
# custom login shell, so — unlike ops — there is no rrsync-only wrapper: the key's
# `command="...",restrict` forced command is the sole jail.
nas_data_user: zcrypto-data

# DSM's own /usr/bin/python3 is 3.8.15, below ansible-core 2.21's 3.9 floor; the `python314`
# package provides this one.
ansible_python_interpreter: /usr/local/bin/python3.14

# DSM CHROOTS sftp to the shared folders, so sftp/scp cannot write arbitrary paths (a module upload
# to /tmp fails "failed to upload"). Piped transfer over plain ssh stdin works.
ansible_ssh_transfer_method: piped
ansible_pipelining: true

# /usr/local/bin is NOT on sudo's PATH, so a bare `sudo docker` fails command-not-found — and an
# empty result from that reads as a false all-clear. Everything touching Docker here uses this var.
nas_docker: /usr/local/bin/docker

nas_stack_dir: /volume1/docker/zcrypto-archive

# ALWAYS the `-compat` (no-AVX) build: this Atom dies instantly on the default build with `Illegal
# instruction` (T0029). Prove it by RUNNING polars in the pulled image, never by reading the label.
# Verify a re-pin off the CONTAINER, never off this file -- the .env task is no_log with diff false,
# so `--check --diff` reports .env changed with the digest invisible.
# The NAS converges BEFORE the engine: gate-export scores the ratified streak here, and a reader
# meeting a record it cannot parse zeroes that streak with the engine deploy fully correct. Moving
# this pin replays the whole gate export COLD -- budget the better part of an hour, not a restart --
# and every converge that RECREATES the container does it, because the cache is /tmp/gate-cache.json
# and /tmp is on no mount. Compare fingerprints across two images with:
#   docker run --rm --entrypoint python <image> -c \
#     'from cli.engine.gate_cache import replay_fingerprint; print(replay_fingerprint())'
# `cache_invalidated` reads 0 across such a re-pin and that is CORRECT: no cache file exists and
# `load_cache` returns rejected=False for an absent path, so read `cache_hits` instead. Gate metrics
# describe the PREVIOUS image for about an hour after a roll -- check the textfile's mtime first.
# ROLLBACK rolls the REPO STATE, not just this pin: `pull-entrypoint.sh` is a bind mount, so an
# image roll leaves it in place passing `--hash-scope`, which older images reject, and flipping the
# scope to `full` does not help because the flag is still sent. Converge from a pre-spec-00102 state
# WITH `-e nas_apply_compose=true`; without the flag the role is render-only and still reports
# success. Delete the `archive-pull-*.prom` textfiles on the way out, or their gauges stay frozen
# and keep feeding the dashboard. What a rollout cost belongs in that rollout's fleet-pins row,
# never here.
nas_capture_image: ghcr.io/zhaow-de/zcrypto-capture@sha256:ee5ba1d92b461e74859ff766c4992f791021be605138796dc8ac962f64506470
# Was running as an UNPINNED `:latest` that merely happened to resolve to this digest — the trap the
# committed pin kills. Alloy v1.18.0 (2026-07-20); previous pin 4f6ddc56ffdc (v1.17.1).
nas_alloy_image: grafana/alloy@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308

# Spec 00102 D7: `full` re-hashes every segment each cycle, `incremental` hashes rsync's transfers
# plus a rotating slice. Flipping it is a config-only converge on the running digest, and so is the
# rollback. The entrypoint that reads it needs an image that knows `--hash-scope`, so it lands with
# that image pin in ONE applied converge, never render-only against an older image.
nas_archive_pull_hash_scope: incremental

# Pull sources + per-channel SSH ports, rendered into {{ nas_stack_dir }}/.env by the nas role
# (roles/nas/templates/env.j2; the env-var contract is in infra/nas/README.md). GATE_HEALTHCHECK_URL
# is deliberately absent — it is a secret, vaulted as nas_gate_healthcheck_url in vault.yml.
nas_capture_source: "zcrypto-data@zcrypto.zhaow.me:"
nas_archive_ssh_port: 10022
nas_journal_source: "zcrypto-data@zcrypto.zhaow.me:"
nas_capture_red_source: "zcrypto-data@zcrypto-red.zhaow.me:"
# The four ops channels below address the host by FQDN. The pull loop runs StrictHostKeyChecking=yes
# with CheckHostIP=no against a pre-seeded known_hosts, so it matches on the HOSTNAME STRING alone
# and an unseeded name fails the pull CLOSED. Both names are pinned there, with key material copied
# from the trusted IP lines rather than re-scanned, so either spelling works and a revert needs no
# host-key change.
nas_liquidations_source: "zcrypto-data@z-home-zcrypto.zhaow.pro:"
nas_liquidations_ssh_port: 22
nas_panel_source: "zcrypto-data@z-home-zcrypto.zhaow.pro:"
nas_panel_ssh_port: 22
nas_reconciled_source: "zcrypto-data@z-home-zcrypto.zhaow.pro:"
nas_reconciled_ssh_port: 22
# OPS-6 (spec 00056 D2/D4): the ops node's hot-out outbox, pulled into the hot/ hub, with its own
# least-privilege read-only key (sync_hot).
nas_hot_source: "zcrypto-data@z-home-zcrypto.zhaow.pro:"
nas_hot_ssh_port: 22

# Public key material only — the private half lives on the workstation
# (~/.ssh/zcrypto-hot-push_ed25519), vaulted as a backup in files/. The nas role installs this as a
# write-capable rrsync forced command jailed to hot/ (spec 00056 D2).
nas_hot_push_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/zcrypto_hot_push_ed25519.pub') }}"
