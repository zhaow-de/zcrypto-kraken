# host_vars/zcrypto-mon -- SECRETS for the observability node (spec 00121). Per-VALUE vault encryption: the
# variable NAMES stay readable, every value stays `!vault`-encrypted at rest. Generated once, by script, and
# stable across rebuilds of the node: Grafana takes its admin's name from this file when it creates its
# database, the role resets the admin password from it, and the two hashes are the bcrypt hashes of the
# ingest passwords in group_vars/observed/vault.yml, which the fleet's shippers present. Replacing one:
# infra/runbooks/mon.md's mon-secrets.
#
# NEVER run `ansible-inventory --host/--list` from infra/ansible/: ansible.cfg supplies the vault
