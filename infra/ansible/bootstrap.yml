- name: Bootstrap capture host — deploy user + SSH lockdown (keep 22 until converge proves 10022)
  hosts: capture_host
  gather_facts: false
  vars:
    ansible_user: root
    ansible_port: 22
  tasks:
    - name: deploy sudo user
      ansible.builtin.user: {name: deploy, groups: sudo, shell: /bin/bash, create_home: true}
    - name: passwordless sudo for deploy (automation)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'
    - name: install deploy authorized key
      ansible.posix.authorized_key: {user: deploy, key: "{{ deploy_authorized_key }}", state: present}
    - name: ensure python3 + sudo
      ansible.builtin.apt: {name: [python3, sudo], state: present, update_cache: true}
    - name: sshd drop-in — add 10022, disable root + password, key-only
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-zcrypto.conf
        content: |
          Port 22
          Port 10022
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
        mode: '0644'
        validate: 'sshd -t -f %s'
    - name: reload sshd
      ansible.builtin.service: {name: ssh, state: reloaded}
