- name: Bootstrap capture host — deploy user + SSH lockdown (keep 22 until converge proves 10022)
  hosts: capture_host
  gather_facts: false
  vars:
    ansible_user: root
    ansible_port: 22
  tasks:
    # Same guard as site.yml: bootstrapping the primary would rewrite its sshd drop-in to
    # `PermitRootLogin no`, undoing the deliberate key-only root break-glass. It would in practice
    # fail unreachable first, since the primary's sshd no longer listens on 22 -- but "it would
    # probably fail anyway" is not a safety property.
    - name: refuse to bootstrap the live primary unless explicitly asked
      ansible.builtin.assert:
        that: converge_primary | default(false) | bool
        fail_msg: >-
          REFUSING to bootstrap {{ inventory_hostname }} — it is the live host, already bootstrapped.
          Re-running this would rewrite its sshd drop-in and disable the root break-glass. Bootstrap
          the secondary with `--limit zcrypto-red`. If you are genuinely rebuilding the primary from
          scratch, pass `-e converge_primary=true`.
      when: inventory_hostname in groups['engine_host'] | default([])
      tags: [always]

    # Generalises the refusal above to the SECONDARY: bootstrap is first-provision only, re-running
    # it rewrites the sshd drop-in below, and the deploy user is the evidence that provisioning
    # already happened. Capture play only, deliberately -- the ops and access plays are LAN-side and
    # write no drop-in, so the refusal's own message would be false there.
    - name: probe — the zcrypto-deploy user (re-bootstrap refusal)
      ansible.builtin.command: getent passwd zcrypto-deploy
      register: bootstrap_deploy_user_probe
      failed_when: false
      changed_when: false
      check_mode: false
      tags: [always]

    # A BOOLEAN flag is deliberate here (unlike the free-text overrides on the digest guards, which
    # substitute for absent evidence): the refusal names concrete shown state — the existing user — so
    # the flag acknowledges something the operator has been told, not something they must assert.
    - name: refuse to re-bootstrap an already-provisioned host
      ansible.builtin.assert:
        that: bootstrap_deploy_user_probe.rc != 0 or rebootstrap | default(false) | bool
        fail_msg: >-
          zcrypto-deploy already exists on {{ inventory_hostname }} — this host is bootstrapped, and
          re-running would rewrite its sshd drop-in. Converge with site.yml instead, or pass
          -e rebootstrap=true if you are genuinely rebuilding it.
      tags: [always]

    - name: zcrypto-deploy sudo user
      ansible.builtin.user: {name: zcrypto-deploy, groups: sudo, shell: /bin/bash, create_home: true}
    - name: passwordless sudo for zcrypto-deploy (automation)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/zcrypto-deploy
        content: "zcrypto-deploy ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'
    # spec 00057 D1.
    - name: install zcrypto-deploy authorized key (exclusive — one key, no drift)
      ansible.posix.authorized_key: {user: zcrypto-deploy, key: "{{ deploy_authorized_key }}", state: present, exclusive: true}
    - name: ensure python3 + sudo
      ansible.builtin.apt: {name: [python3, sudo], state: present, update_cache: true}
    - name: sshd drop-in — add 10022, disable root + password, key-only
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-zcrypto.conf
        content: |
          Port 22
          Port 10022
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
        mode: '0644'
        validate: 'sshd -t -f %s'
    - name: reload sshd
      ansible.builtin.service: {name: ssh, state: reloaded}

- name: Bootstrap ops node — zcrypto-deploy user only (home-LAN box, no SSH hardening per owner)
  # Deliberately minimal beside the capture play: the ops node is a home-LAN box behind NAT, so it
  # gets NO sshd drop-in -- SSH stays on 22 with Debian's defaults and the box keeps its root break-
  # glass. It never touches engine_host, so no converge_primary guard belongs here.
  hosts: ops_host
  gather_facts: false
  vars:
    ansible_user: root
    ansible_port: 22
  tasks:
    - name: zcrypto-deploy sudo user
      ansible.builtin.user: {name: zcrypto-deploy, groups: sudo, shell: /bin/bash, create_home: true}
    - name: passwordless sudo for zcrypto-deploy (automation)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/zcrypto-deploy
        content: "zcrypto-deploy ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'
    - name: install zcrypto-deploy authorized key (exclusive — one key, no drift)
      ansible.posix.authorized_key: {user: zcrypto-deploy, key: "{{ deploy_authorized_key }}", state: present, exclusive: true}
    - name: ensure python3 + sudo
      ansible.builtin.apt: {name: [python3, sudo], state: present, update_cache: true}

- name: Bootstrap access bridgehead — zcrypto-deploy user only (sshd stays as the interim drop-in left it)
  hosts: access_host
  gather_facts: false
  vars:
    ansible_user: root
    ansible_port: 10022
  tasks:
    - name: zcrypto-deploy sudo user
      ansible.builtin.user: {name: zcrypto-deploy, groups: sudo, shell: /bin/bash, create_home: true}
