# Versions of nautilus-trader whose ATTENDED ~EUR 0.20 order-semantics pass has actually happened —
# zero-fill resting limits cancelled after acknowledgement, a crossing post-only expecting the
# venue's protection, and one tiny round-trip proving submit -> fill -> reconcile.
#
# This file is the record, and ADDING A VERSION HERE IS THE ACT that says the re-run happened. It is
# a reviewed repo diff rather than a memory or a sentence in a doc. The engine role reads it and
# REFUSES a converge that would render `exec_armed = true` on a version absent from this list
# (bypass: -e arming_override="<reason>"). A bump alone never trades; this list is what lets it.
#
# The adapter's margin/short/post-only and reconciliation behaviour is native and is exercised by no
# test in this repo — none of them places an order — so a version's absence here is not a paperwork
# gap, it is an unmeasured order path.
#
# Exact strings, matched by equality against the `nautilus-trader==` pin in pyproject.toml. Never
# add a version without the verification doc that records its PASS.
verified_nautilus_versions:
