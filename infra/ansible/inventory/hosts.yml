all:
  children:
    # A container group, never a play target: it exists so group_vars/observed/vault.yml holds the
    # Alloy credentials once, readable by exactly the hosts that need them, and membership is the
    # claim "this host runs Alloy". The ops node is here and NOT in engine_host: it ships telemetry
    # and must never hold the trade key (spec 00051 D10).
    observed:
      children:
        capture_host: {}
        ops_host: {}
        nas_host: {}
        access_host: {}
    # Every capture host: base -> hardening -> ... -> capture roles converge here.
    capture_host:
      hosts:
        zcrypto: {}
        # The spec-00050 redundant secondary. capture_host ONLY -- it must never join engine_host,
        # or the live Kraken trade key would be rendered onto a host that has no business holding it.
        zcrypto-red: {}
    # The engine (and its LIVE Kraken trade key) converges ONLY here. Kept separate from
    # capture_host so a capture-only host (the spec-00050 secondary) can join capture_host
    # without ever having the trade key rendered onto it.
    engine_host:
      hosts:
        zcrypto: {}
    # The home ops node: compute tier (spec 00051); NEVER add to engine_host — the trade key must
    # not render here (D10).
    ops_host:
      hosts:
        zcrypto-ops: {}
    # The Synology NAS -- the archive/custody tier (spec 00048 Role A). DSM owns the OS and the
    # `nas` role manages ONLY the zcrypto payload; the measured DSM quirks live in
    # host_vars/nas/vars.yml.
    nas_host:
      hosts:
        nas: {}
    # The internet bridgehead (spec 00075): access tier only. NEVER engine_host/capture_host —
    # no trade key, no capture data; everything on it is re-issuable.
    access_host:
      hosts:
        zaccess: {}
    workstation:
      hosts:
        localhost:
          ansible_connection: local
