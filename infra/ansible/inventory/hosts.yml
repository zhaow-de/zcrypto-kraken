all:
  children:
    # Hosts that ship telemetry to Grafana Cloud (spec 00054). A container group, not a play
    # target: nothing converges against `observed` — it exists so group_vars/observed/vault.yml can
    # hold the Alloy credentials once, readable by exactly the hosts that need them. Membership is
    # the claim "this host runs Alloy". The ops node is here and NOT in engine_host: it ships
    # telemetry and must never hold the trade key (spec 00051 D10). capture_host is a member for
    # when T0020 gives the capture VPSes their own Alloy. The NAS is a member and Ansible-managed
    # (T0056): the nas role renders its alloy-secrets.env straight from these vaulted values, so
    # the out-of-band hand-placed credentials file it used to read is dead.
    observed:
      children:
        capture_host: {}
        ops_host: {}
        nas_host: {}
        access_host: {}
    # Every capture host: base -> hardening -> ... -> capture roles converge here.
    capture_host:
      hosts:
        zcrypto: {}
        # The spec-00050 redundant secondary. capture_host ONLY -- it must never join engine_host,
        # or the live Kraken trade key would be rendered onto a host that has no business holding it.
        zcrypto-red: {}
    # The engine (and its LIVE Kraken trade key) converges ONLY here. Kept separate from
    # capture_host so a capture-only host (the spec-00050 secondary) can join capture_host
    # without ever having the trade key rendered onto it.
    engine_host:
      hosts:
        zcrypto: {}
    # The home ops node: compute tier (spec 00051); NEVER add to engine_host — the trade key must
    # not render here (D10).
    ops_host:
      hosts:
        zcrypto-ops: {}
    # The Synology NAS — the archive/custody tier (spec 00048 Role A), Ansible-managed since T0056
    # (hand-deploys drifted for days; a committed `:latest` placeholder killed the pull loop for
    # ~90 s on 2026-07-16). DSM owns the OS — the nas role manages ONLY the zcrypto payload; the
    # measured DSM quirks (python3.14 interpreter, piped transfer, docker path) live in
    # host_vars/nas/vars.yml.
    nas_host:
      hosts:
        nas: {}
    # The internet bridgehead (spec 00075): access tier only. NEVER engine_host/capture_host —
    # no trade key, no capture data; everything on it is re-issuable.
    access_host:
      hosts:
        zaccess: {}
    workstation:
      hosts:
        localhost:
          ansible_connection: local
