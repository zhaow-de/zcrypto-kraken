# three of these DO render onto managed hosts, so this is not a workstation-only file.
#
# MIXED CUSTODY — do not read this file as workstation-only. Three of the eight values ARE
# rendered onto managed hosts through inventory: `zaccess_wg_bridgehead_private_key` and
