# group_vars/all — PROJECT-LEVEL SECRETS that belong to no host group.
#
# Unlike group_vars/observed/ (Alloy's credentials, which managed hosts render) and
# group_vars/capture_host/ (the live trade key + per-host URLs), nothing here is consumed by a
# managed host at all: both values below are read by `infra/scripts/grafana-push.sh` from the
# WORKSTATION, by file path, never through inventory. `all` is therefore the honest scope — it is
# the only group that includes `workstation`, where the script actually runs.
#
# Moved here from group_vars/capture_host/ (spec 00054, 2026-07-16, owner's call): neither is
# capture-specific, and parking a project-level tooling secret in a host group misstates who owns
# it. The ciphertext is UNCHANGED — same vault password, so the blocks moved verbatim and were
# never decrypted.
#
# Per-VALUE vault encryption (not whole-file): the variable NAMES stay readable, every value stays
# `!vault`-encrypted at rest. Read/write mechanics: see group_vars/capture_host/vault.yml's header.
#
# NEVER run `ansible-inventory --host/--list` from infra/ansible/: ansible.cfg supplies the vault
# password, so both silently print every value below in cleartext.

grafana_sa_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          62616661616432366262346462653239633965353265333635663632366236303838643631643739
          6633383431323066666362613438353839353538386435350a656631343235663931346232336165
