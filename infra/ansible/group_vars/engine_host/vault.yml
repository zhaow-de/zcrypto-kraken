# group_vars/engine_host — the LIVE TRADING SECRETS.
#
# `engine_host` is `zcrypto` alone, and it exists precisely so that adding a capture host can never
# put the live Kraken trade key on it (inventory/hosts.yml). Each variable here is consumed by exactly
# one template: roles/engine/templates/engine.env.j2, rendered 0600 root-only with `no_log: true` +
# `diff: false`.
#
# Adding a host to engine_host therefore GRANTS IT THE LIVE TRADE KEY. That is the whole point of
# the group, and the reason it has exactly one member.
#
# The boundary rests on ABSENCE OF COLLISION, not on precedence — know this before "helpfully"
# re-adding a trade-key var anywhere else. `capture_host` is a CHILD of `observed` (depth 2) while
# `engine_host` is a direct child of `all` (depth 1), and Ansible merges group vars parent-first:
# a same-named var re-introduced into capture_host would OVERRIDE this file *and* be resolvable by
# zcrypto-red again — silently undoing T0061 while every file here still looks correct. The same
# caveat applies to adding a GROUP under engine_host, not just a host: the inventory's warning names
# only hosts.
#
# Per-VALUE vault encryption (not whole-file): the variable NAMES stay readable so anyone can see
# what this host group needs, while every value stays `!vault`-encrypted at rest. Read/write
# mechanics: see the header of group_vars/capture_host/vault.yml.
#
# NEVER run `ansible-inventory --host/--list` from infra/ansible/: ansible.cfg supplies the vault
# password, so both silently print every value below in cleartext.

