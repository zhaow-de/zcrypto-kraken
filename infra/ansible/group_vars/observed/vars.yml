# The node's ingest: the public name and the two paths roles/edge/templates/Caddyfile.j2 authenticates, the user
# it admits on both for the fleet's Alloys, and the user it admits on the Loki path alone for the applications' own
# log push. Their passwords are `mon_ingest_fleet_password` and `mon_ingest_logship_password` in vault.yml beside
# this file. The two users repeat the mon role's defaults, which no other role's template can read.
mon_ingest_prom_url: https://zcrypto-mon.zhaow.me/api/v1/write
mon_ingest_loki_url: https://zcrypto-mon.zhaow.me/loki/api/v1/push
mon_ingest_fleet_user: fleet
mon_ingest_logship_user: logship

# The dead-man service's project on the clone (spec 00122 D4): the uuid its project settings page shows, which
# hc_metrics_path below puts in the ops Alloy's scrape path.
hc_project_uuid: a613c0be-ad8a-4c32-8c47-bffc6b294f4b
# Every pinger's URL is this base and its check's name as the slug, set in the pinging host's vars.yml.
hc_hostname: zcrypto-hc.zhaow.me
hc_ping_base: "https://{{ hc_hostname }}/ping/{{ hc_ping_key }}"
hc_metrics_path: "/projects/{{ hc_project_uuid }}/metrics/"
