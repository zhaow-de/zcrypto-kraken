# group_vars/observed — SECRETS shared by every host that ships telemetry.
#
# The `observed` group (inventory/hosts.yml) is every host that runs Alloy. The telemetry
# credentials below are NOT host-specific, so scoping them to a group states exactly who
# may read them. The ops node is deliberately in THIS group and NOT in engine_host: it ships
# telemetry, and it must never hold the trade key (spec 00051 D10).
#
# Per-VALUE vault encryption (not whole-file): the variable NAMES stay readable so anyone can see
# what this group needs, while every value stays `!vault`-encrypted at rest. Read/write mechanics:
# see the header of group_vars/capture_host/vault.yml.

# `/projects/<code>/metrics/<key>` — the ops Alloy's healthchecks.io scrape path, kept for that
# scrape's rollback alone: no template reads it, the scrape and the daily pass both reading the
# dead-man service with `hc_readonly_api_key` below. Its LAST SEGMENT is the `hcr_` read-only key,
# the SAME secret as `healthchecks_readonly_api_key` in group_vars/all/vault.yml, which
# hc-provision.py reads until retirement: rotate them AS ONE, so a rollback presents the key
# healthchecks.io holds. Full recipe in the T0085 topic.
