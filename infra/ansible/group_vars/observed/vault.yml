# vaulted on its own as `healthchecks_readonly_api_key` in group_vars/all/vault.yml, where
# ops_daily.py reads it. Nothing keeps the two in sync: rotate them AS ONE. Rewriting only this
# path leaves the daily pass presenting a revoked key; rewriting only the other leaves the Alloy
