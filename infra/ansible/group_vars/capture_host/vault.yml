# group_vars/capture_host — SECRETS.
#
# Per-VALUE vault encryption (not whole-file): the variable NAMES stay readable so anyone can see
# what this host group needs, while every value stays `!vault`-encrypted at rest.
#
# Read ONE value (the block must be de-indented — ansible-vault needs the ciphertext at column 0,
# so piping the lines as they appear here fails with "Input is not vault encrypted data"):
#   VPF=infra/ansible/scripts/vault-pass.sh; V=ansible_host
#   awk -v v="$V:" '$1==v{f=1;next} /^[^ ]/{f=0} f && NF' infra/ansible/group_vars/capture_host/vault.yml \
#     | sed 's/^ *//' | uv run ansible-vault decrypt --vault-password-file "$VPF" --output -
#
# (`/^[^ ]/` — ANY unindented line ends the block, not just the next `var:`. The old `/^[a-z_]+:/`
# form worked only for a var with another var beneath it: for the LAST var in a file the trailing
# comments got slurped into the ciphertext and ansible-vault died unhexlifying `#`. That failure
# invites the operator to reach for `ansible-inventory --host` — the one command this header forbids.
# `f && NF` drops the blank separator line for the same reason.)
#
# Write ONE value (stdin, so it never lands in shell history or `ps`), then paste the block below:
#   uv run ansible-vault encrypt_string --vault-password-file infra/ansible/scripts/vault-pass.sh \
#     --stdin-name <var>
#
# NEVER run `ansible-inventory --host/--list` from infra/ansible/: ansible.cfg supplies the vault
# password, so both silently print every value below in cleartext.

ansible_host: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          31376431393339373363623935336238376131373638613365666362643937626161376331303062
          6339313364656566353234393539363533643666333036310a376434656634663163353765653536
          30383164333532386161303838323763656634633931666564373865646637333432653836356461
          3038636439393062370a623965396239656336633037313434363362646539396663353065656537
          64616666363761663332323832333830343462623262326338373039616339613264
