# group_vars/capture_host — SECRETS.
#
# Per-VALUE vault encryption (not whole-file): the variable NAMES stay readable so anyone can see
# what this host group needs, while every value stays `!vault`-encrypted at rest.
#
# Read ONE value (the block must be de-indented — ansible-vault needs the ciphertext at column 0,
# so piping the lines as they appear here fails with "Input is not vault encrypted data"):
#   VPF=infra/ansible/scripts/vault-pass.sh; V=kraken_trade_api_key
#   awk -v v="$V:" '$1==v{f=1;next} /^[a-z_]+:/{f=0} f' infra/ansible/group_vars/capture_host/vault.yml \
#     | sed 's/^ *//' | uv run ansible-vault decrypt --vault-password-file "$VPF" --output -
#
# Write ONE value (stdin, so it never lands in shell history or `ps`), then paste the block below:
#   uv run ansible-vault encrypt_string --vault-password-file infra/ansible/scripts/vault-pass.sh \
#     --stdin-name <var>
#
# NEVER run `ansible-inventory --host/--list` from infra/ansible/: ansible.cfg supplies the vault
# password, so both silently print every value below in cleartext.

