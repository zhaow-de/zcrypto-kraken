capture_depth: 100
# The universe's twelve selected symbols. The two BTC-quoted legs start 2026-07-23 (T0092) — L2 book
# data is unbackfillable, so a leg's add date IS the start of its history.
capture_pairs: [ADA/EUR, AVAX/EUR, BTC/EUR, DOGE/EUR, DOT/EUR, ETH/EUR, LINK/EUR, LTC/EUR, SOL/EUR, XRP/EUR, ETH/BTC, SOL/BTC]
capture_data_dir: /var/lib/zcrypto-capture
capture_image: ghcr.io/zhaow-de/zcrypto-capture
healthchecks_project_id: "32eaee6f-cb82-4773-9471-4b802136adc1"
sync_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/sync_ed25519.pub') }}"
sync_capture_authorized_key: "{{ lookup('file', playbook_dir ~ '/files/sync_capture_ed25519.pub') }}"
# Exempt zcrypto-data from devsec.os_hardening's "Remove shell for linux system accounts" task
# (tasks/user_accounts.yml): it is a uid-999 SYSTEM account, so that task would reset its rrsync-only
# login shell to nologin and swallow the NAS pull's forced command. zcrypto-engine stays nologin (it
# serves no pull) and is deliberately NOT exempted; vagrant/kitchen are the devsec defaults, kept for
# parity.
os_ignore_users: [zcrypto-data, vagrant, kitchen]
# Both capture hosts converge as zcrypto-deploy (spec 00057 D1). bootstrap.yml still overrides with
# `ansible_user: root` at play scope — a virgin host has no zcrypto-deploy yet, and play vars beat
# group_vars.
ansible_user: zcrypto-deploy
ansible_port: 10022

# Attended reboots on BOTH capture VPSes (owner ruling, T0027): a kernel update must not reboot the
# unbackfillable L2 capture -- and, on the primary, the live trade engine -- unwatched. Patches still
# auto-install; only the reboot becomes a human act, made visible by the node_reboot_required alert
# (spec 00071). Quoted string, never a bare YAML boolean -- see the base role's default for why.
base_unattended_upgrades_automatic_reboot: "false"
