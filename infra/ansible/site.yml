- name: converge the capture hosts — hardening, host config, docker, capture (steady state)
  hosts: capture_host
  become: true
  pre_tasks:
    # The primary runs LIVE, UNBACKFILLABLE L2 capture: a converge that restarts it loses data that
    # can never be re-fetched. Before the secondary existed, `capture_host` held only `zcrypto`, so
    # every run of this play self-evidently MEANT "converge the primary". Now that `zcrypto-red` has
    # joined the group, a bare `site.yml` would sweep the primary up alongside it and silently apply
    # whatever role changes were written for the secondary. This guard makes that impossible to do by
    # accident: touching the primary requires saying so.
    #
    #   secondary only : ./scripts/run.sh site.yml --limit zcrypto-red -e capture_image_digest=...
    #   primary        : ./scripts/run.sh site.yml --limit zcrypto --tags capture -e converge_primary=true -e ...
    #   engine only    : ./scripts/run.sh site.yml --tags engine -e converge_primary=true -e engine_image_digest=...
    #
    # It is a per-host assert, so a bare run fails ONLY the primary and still converges the rest --
    # loud and safe rather than aborting the fleet. Keep it after the embargo lifts: the flag costs
    # one argument and buys an explicit "yes, touch the live host".
    #
    # The flag gates the ENGINE play too, not just capture. This assert carries `tags: [always]`, so it
    # fires even on a tag-scoped run; a failed host is dropped from every SUBSEQUENT play, so a bare
    # `site.yml --tags engine` would skip the engine play entirely rather than deploy it. That fails
    # closed (nothing converges), but it is the reason the message below talks about the host, not just
    # the capture daemon.
    #
    # Keyed on engine_host membership, not a hardcoded name: the engine host IS the live primary by
    # construction (it is where the live Kraken trade key renders), so this cannot drift if a third
    # capture host joins or the primary is rebuilt under another inventory name.
    - name: refuse to converge the live primary unless explicitly asked
      ansible.builtin.assert:
        that: converge_primary | default(false) | bool
        fail_msg: >-
          REFUSING to converge {{ inventory_hostname }} — it is the live host: unbackfillable L2
          capture AND the trading engine. `site.yml` targets the whole capture fleet now that the
          secondary has joined, so a bare run would restart the primary's capture daemon as a side
          effect of converging the secondary. Pass `-e converge_primary=true` if you mean it (this
          gates the engine play too — `--tags engine` needs it as well), and re-read
          .claude/rules/capture-deploys.md first. To converge ONLY the secondary: `--limit zcrypto-red`.
        success_msg: "converge_primary=true — this run WILL restart the primary's live capture and/or engine."
      when: inventory_hostname in groups['engine_host'] | default([])
      tags: [always]

    # spec 00082 guard 4: even with converge_primary granted, an UN-TAGGED run on the primary pulls
    # in the engine play, whose digest assert fails the host closed — and "fixing" that with
    # -e engine_image_digest=... restarts the LIVE trade engine. Tags must be named explicitly.
    - name: refuse an un-tagged run on the live primary
      ansible.builtin.assert:
        that: ansible_run_tags != ['all'] or 'engine' in ansible_skip_tags
        fail_msg: >-
          This run names no tags — on the live primary that sweeps in every play, including the
          engine play. Scope it explicitly: --tags capture, --tags engine, or --skip-tags engine.
      when: inventory_hostname in groups['engine_host']
      tags: [always]

    - name: note — assumes bootstrap.yml already ran
      ansible.builtin.debug:
        msg: >-
          This play targets deploy@{{ ansible_port }} and assumes bootstrap.yml already
          created the deploy user and opened port 10022 for verification (root + password
          login still enabled at that point). The hardening role below removes the
          bootstrap's temporary sshd drop-in and makes 10022 the only SSH port — run this
          play only once deploy@10022 access is confirmed. Idempotent: changed=0 on a
          clean second run.
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: hardening
      tags: [hardening]
    - role: firewall
      tags: [firewall]
    - role: fail2ban
      tags: [fail2ban]
    - role: chrony
      tags: [chrony]
    - role: docker
      tags: [docker]
    - role: capture
      tags: [capture]

- name: converge the engine host — the trading engine and its live trade key (steady state)
  hosts: engine_host
  become: true
  pre_tasks:
    - name: note — engine_host is deliberately narrower than capture_host
      ansible.builtin.debug:
        msg: >-
          The engine role renders the LIVE Kraken trade key. It targets engine_host, not
          capture_host, so a capture-only host (spec 00050's redundant secondary) can join
          capture_host without the key ever landing on it. Adding a host here is a
          deliberate act — never a side effect of adding a capture host.
      tags: [always]

    # spec 00082 guard 5: the inter-cycle window, re-read from the TARGET's clock at execution time
    # (chrony-disciplined) — a converge backgrounded for hours re-asserts the window when it fires,
    # by construction. Skipped under check mode so --check --diff previews run at any hour.
    - name: probe — the engine host's clock (window guard)
      ansible.builtin.command: date +%s
      register: engine_epoch_probe
      failed_when: false
      changed_when: false
      check_mode: false
      when: not ansible_check_mode
      tags: [engine]  # I2: NOT always — a --tags capture primary run must not be window-blocked; guard 4 covers untagged runs

    # spec 00083 D6: when the boundary's cycle already completed, the fixed B+30 floor is
    # conservative for no reason — the running cycle it protects is over. The probe computes the
    # boundary and reads its journal artifact ON the engine host; any failure (missing file, parse
    # error) lands rc!=0 and the guard keeps the conservative floor. Journal day-dirs are %Y-%m-%d,
    # files cycle-%H.json, field completed_at (cli/engine/cycle.py's own naming).
    - name: probe — the boundary cycle's completion time (window floor)
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import datetime, json, time
            b = int(time.time()) // 14400 * 14400
            d = datetime.datetime.fromtimestamp(b, datetime.timezone.utc)
            p = "/var/lib/zcrypto-engine/journal/%s/cycle-%02d.json" % (d.strftime("%Y-%m-%d"), d.hour)
            c = json.load(open(p))["completed_at"]
            t = datetime.datetime.fromisoformat(c.replace("Z", "+00:00"))
            print(int(t.timestamp()))
      register: engine_cycle_epoch_probe
      failed_when: false
      changed_when: false
      check_mode: false
      when: not ansible_check_mode
      tags: [engine]

    - name: engine window — refuse a converge outside the inter-cycle gap
      ansible.builtin.assert:
        that: >-
          (((engine_epoch_probe.stdout | int) >= (
              ((engine_cycle_epoch_probe.stdout | default('') | trim | int) + 300)
              if ((engine_cycle_epoch_probe.rc | default(1)) == 0
                  and ((engine_cycle_epoch_probe.stdout | default('') | trim) | regex_search('^[0-9]{10}$')))
              else ((((engine_epoch_probe.stdout | int) // 14400) * 14400) + 1800)
            ))
           and (14400 - ((engine_epoch_probe.stdout | int) % 14400) >= 600))
          or ((engine_window_override | default('') | string | length > 8)
              and (engine_window_override | default('') | string | lower not in ['true', 'false', '1', 'yes']))
        fail_msg: >-
          Outside the engine's inter-cycle gap (boundaries 00/04/08/12/16/20 UTC: the first 30 min
          belong to the running cycle — or 5 min past its journaled completion when that is sooner —
          and the last 10 min are too close to the next). Wait for the gap, or pass
          -e engine_window_override="<why this cannot wait>" (a reason, not a boolean).
      when: not ansible_check_mode and engine_epoch_probe.stdout is defined
      tags: [engine]

    # spec 00082 D1 (second half), same shape as the capture role's two override echoes: an ACCEPTED
    # override lands its reason in the play log. Gated on acceptance — the assert's own scoping AND
    # the window condition NEGATED (its first disjunct, character-for-character — a folded scalar
    # keeps both the break and the EXTRA indent of every more-indented line, so the mirror below
    # shifts each line 2 columns left, preserving its indent RELATIVE to its own block key, which is
    # what keeps the two folded texts byte-identical) AND the override fragment — never on the
    # override merely being PRESENT, which would print a "why" on runs that overrode nothing. The
    # scoping half is load-bearing, not decoration: under --check the probe is skipped, so `.stdout`
    # is undefined and an unscoped `when:` would error instead of skipping.
    - name: engine window override accepted — the reason, on the record
      ansible.builtin.debug:
        msg: "engine_window_override accepted: {{ engine_window_override }}"
      when: >-
        not ansible_check_mode and engine_epoch_probe.stdout is defined
        and not (((engine_epoch_probe.stdout | int) >= (
            ((engine_cycle_epoch_probe.stdout | default('') | trim | int) + 300)
            if ((engine_cycle_epoch_probe.rc | default(1)) == 0
                and ((engine_cycle_epoch_probe.stdout | default('') | trim) | regex_search('^[0-9]{10}$')))
            else ((((engine_epoch_probe.stdout | int) // 14400) * 14400) + 1800)
          ))
         and (14400 - ((engine_epoch_probe.stdout | int) % 14400) >= 600))
        and (engine_window_override | default('') | string | length > 8)
        and (engine_window_override | default('') | string | lower not in ['true', 'false', '1', 'yes'])
      tags: [engine]
  roles:
    - role: engine
      tags: [engine]

- name: converge the ops node — compute tier (spec 00051)
  hosts: ops_host
  become: true
  pre_tasks:
    - name: note — the ops node's charter
      ansible.builtin.debug:
        msg: >-
          The ops node is the compute tier (spec 00051): no trade key, never engine_host,
          pull-only transport (D10). It is a home-LAN box behind NAT, NOT a public-IP host,
          so it deliberately omits the internet-facing hardening/firewall/fail2ban roles the
          capture/engine hosts run — it reuses only base/chrony/docker plus the new `ops` role.
          Unlike the capture/engine plays above, this play has no `converge_primary` guard —
          that guard keys on engine_host membership, and the ops node never joins that group.
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: chrony
      tags: [chrony]
    - role: docker
      tags: [docker]
    - role: ops
      tags: [ops]
    - role: access_ops
      tags: [access]

- name: converge the NAS — the zcrypto payload only (T0056)
  hosts: nas_host
  become: true
  pre_tasks:
    - name: note — the NAS play's charter
      ansible.builtin.debug:
        msg: >-
          DSM owns the OS: no base/hardening/firewall/fail2ban/chrony/docker roles here —
          Synology manages the platform, and this play manages ONLY the zcrypto payload under
          the stack dir (the archive-pull + alloy compose stack, its .env, and the alloy
          secrets). The nas role's first act is the UTC clock guard — it FAILS on a non-UTC NAS
          (docker logs --since parses LOCAL time; T0056) — and render-only is the default:
          restarts happen only with -e nas_apply_compose=true.
      tags: [always]
  roles:
    - role: nas
      tags: [nas]

- name: converge the access bridgehead — the internet edge (spec 00075)
  hosts: access_host
  become: true
  pre_tasks:
    - name: note — the bridgehead's charter
      ansible.builtin.debug:
        msg: >-
          Internet edge (spec 00075): no trade key, no capture data, no containers. Everything
          on it is re-issuable (certs re-ACME, keys vaulted) — losing the VPS is re-provisioning,
          not data loss. Never in engine_host/capture_host; ordinary runs are --limit zaccess.
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: hardening
      tags: [hardening]
    - role: firewall
      tags: [firewall]
    - role: fail2ban
      tags: [fail2ban]
    - role: chrony
      tags: [chrony]
    - role: access
      tags: [access]
