# Grafana alert-rule provisioning source (spec 00049, Role B / Task 4; boards split four ways by
# spec 00084 -- every *-dashboard.json beside this file ships). Pushed by infra/scripts/grafana-push.sh,
# ONE rule per `POST`/`PUT /api/v1/provisioning/alert-rules[/:uid]` call against Grafana's
# **Alerting Provisioning HTTP API** -- that endpoint takes a single alert-rule JSON object per
# call; it is NOT the `apiVersion: 1` / `groups:` file-provisioning shape (that shape is for
# Grafana's config-file provisioner only and is rejected by this HTTP endpoint, which isn't
# usable on Grafana Cloud SaaS anyway). This file is YAML (superset of JSON) purely for the
# inline comments -- the script converts it to the API's per-rule JSON before each push. See:
#   https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/http-api-provisioning/
#   https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/alerting_provisioning/
#
# Each rule's `data` array is a query node (refId A, the Prometheus/Loki datasource, an instant
# query so it already reduces to one number) feeding a `type: threshold` expression node (refId
# C, datasourceUid `__expr__`). The threshold node's own model field is **`expression`**, not
# `expr` -- Grafana's threshold expression (pkg/expr `ThresholdCommand`) reads `expression` to
# find which prior refId to compare; an empty/misnamed field errors "no variable specified to
# reference" and hard-fails the rule's condition on every evaluation.
#
# Placeholders wired at deploy time (see infra/nas/README.md for the vaulted Grafana Cloud creds
# this instance already uses). These are literal `${VAR}` tokens that infra/scripts/grafana-push.sh
# substitutes from its own environment before sending each rule -- Grafana's alert-rule
# provisioning API has no server-side template substitution (unlike the dashboard JSON's
# `${DS_PROMETHEUS}`/`${DS_LOKI}` variables, which Grafana itself resolves on dashboard import):
#   - `${GRAFANA_PROM_DS_UID}` / `${GRAFANA_LOKI_DS_UID}` -- the two datasource UIDs on the
#     already-provisioned Grafana Cloud instance.
#   - `${GRAFANA_ALERT_FOLDER_UID}` -- the folder UID the rules provision into (the API needs
#     the folder's UID, not its display name).
#   - `notification_settings.receiver: metrics` (or `logs` for Loki-sourced rules; the `logs`
#     receiver disables resolve messages -- log alerts resolve by aging, a resolve ping is noise)
#     (both receivers' underlying Slack webhook is provisioned separately, not committed here).
#
# Per-rule noDataState/execErrState reasoning: the four gate rules and the two host-resource
# rules default to Alerting on both no-data and exec-error -- for these, a vanished series
# (Alloy down, textfile exporter dead, cadvisor/node-exporter dead) is itself the failure worth
# paging on, same posture as docs/specs/00043-observability-design.md's disk/memory/CPU rules.
# The ERROR-logs rule uses `or on() vector(0)` (00043's own pattern) so a clean window evaluates
# to 0 rather than NoData, and is marked noDataState: OK to match -- a blanket no-data->alert
# would otherwise leave it permanently firing when healthy.
rules:
  - uid: zcrypto-gate-streak-reset
    title: "Gate · streak reset"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # SUPERSEDES the old "Gate · not MET" rule (uid zcrypto-gate-not-met), which alerted on
    # `zcrypto_gate_status == 0`. That rule's own NOTE conceded the flaw and it duly bit: the gate
    # is MET only after >=14 consecutive clean days, so `status == 0` is the CORRECT, EXPECTED state
    # for the entire accumulation window -- it would have emailed daily for ~12 days to report that
    # we were, correctly, still waiting. That is alarm fatigue, and it trains the reader to ignore
    # gate alerts exactly when one of them matters. It was also redundant: the real failure modes
    # already have their own rules (mismatch / exporter stale / journal pull lag).
    #
    # The signal that actually means something BROKE is the streak going BACKWARDS. `streak_days`
    # only ever increments (a clean complete UTC day) or resets to 0 (a day failed), so a negative
    # delta IS the failure, and nothing else produces one. It fires once on the break and
    # auto-resolves as the 6h window rolls past -- one alert per broken run, not a drumbeat.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}  # 6h, matching the delta window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: delta(zcrypto_gate_streak_days[6h])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0]}  # the streak went BACKWARDS == a clean run broke
    # OK, not Alerting: a missing metric means the exporter is dead, which `Gate · exporter stale`
    # already pages for. Alerting here too would just double-page the same fault.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The Stage-6a clean-day streak went BACKWARDS — a clean run broke and the >=14-day gate clock
        has restarted. (The gate merely being not-MET while it accumulates is normal and no longer alerts.)
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "502"
      unit: "days of streak change"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-mismatch
    title: "Gate · mismatch in the last day"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: increase(zcrypto_gate_mismatch_total[1d])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "At least one replay mismatch/validation failure in the last 24h of journaled cycles."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "502"
      unit: "mismatches in the last day"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-pull-lag
    title: "Gate · journal pull lag high"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_gate_journal_pull_lag_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [21600]}  # 6h. DERIVED (T0069), not copied: the metric is now-minus-newest-journaled-cycle, so
            # its floor is the ENGINE's 4h cycle cadence, not pull health -- measured 30d ceiling 14767s (4.10h), p99 14512s, 175 samples
            # above 4h and ZERO above 4.5h. A pull period is 3600s + work (work p95 78s, max 791s on a post-recreate cold rebuild), so the
            # old 18000 sat only ~0.9 periods above the ceiling: one slow or missed cycle at a near-ceiling moment paged with nothing wrong.
            # 21600 = ceiling + one worst-case missed cycle + margin. A genuinely stalled pull grows lag without bound, so detection costs
            # ~1h, not correctness. Keep in lockstep with gate-export's --lag-fail-seconds default -- that one gates the hc.io dead-man ping.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The newest journaled cycle is more than 6h old -- the NAS journal pull is stuck or the VPS engine has stalled."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "503"
      unit: "seconds of journal pull lag"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-exporter-stale
    title: "Gate · exporter stale"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_gate_export_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [7200]}  # 2h -- no successful gate-export run in that window
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful `zcrypto engine gate-export` run in over 2h -- the NAS archive-pull loop or the gate-export step itself is broken."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "503"
      unit: "seconds since the gate exporter last published"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-cache-reverify-stalled
    title: "Gate · cache re-verification stalled"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    # The gate cache (spec 00060) skips replay_cycle on a fingerprint hit -- and that replay is the
    # ONLY place the journal's parquet bytes are re-hashed (the NAS pull uses --no-verify and
    # delegates to it). Spec 00062 therefore force-replays a rotating ~1/24 slice each run so the
    # whole journal is re-verified about daily. THIS RULE IS THAT MECHANISM'S ONLY WITNESS: if the
    # rotation stops, a stalled cache is indistinguishable from a healthy one except through this
    # number. Note save_cache logs a warning and continues on write failure, so a full disk presents
    # as a working cache with invalidated=0 and a quietly-ageing age here (T0077).
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_gate_cache_oldest_verification_age_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 3d. A full rotation is ~24h, so this is ~3 sweeps of slack: late enough that a skipped
            # hour or a restart never pages, early enough that a genuinely stopped rotation surfaces
            # long before the evidence is meaningfully stale.
            - evaluator: {type: gt, params: [259200]}
    # OK, NOT Alerting -- deliberately unlike its zcrypto-gate siblings. gate-export emits this
    # metric only when --cache is active and non-empty. It IS deployed on the NAS as of 2026-07-20,
    # so the series normally exists there; OK still stands because the metric is legitimately absent
    # whenever the cache is off (any other invocation, or the first run after a container recreate
    # discards the ephemeral cache), and paging on those is noise. "The exporter vanished entirely"
    # is already owned by zcrypto-gate-exporter-stale above, so nothing is lost by this choice.
    noDataState: OK
    execErrState: Alerting
    # 15m rather than the 5m its zcrypto-gate siblings use: the underlying value is monotonic and the
    # threshold is 3-day-scale, so a longer window costs no meaningful detection time while absorbing
    # a restart or a skipped hour without a transient page.
    for: 15m
    annotations:
      summary: "The gate cache's oldest cycle has not been re-verified for over 3 days -- the rotating re-verification has stopped, so cached gate verdicts are being served against parquet bytes nobody has re-hashed. Check zcrypto_gate_cache_replayed (should be >0 every run) and the NAS disk."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "504"
      unit: "seconds since the oldest cached cycle was re-verified"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-sleeve-count-changed
    title: "Engine · sleeve composition changed"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # NOT `zcrypto-engine-sleeve-composition-changed`, the name this rule is called everywhere else:
    # that string is 41 chars and Grafana's uid column is varchar(40), so the create call 400s (the
    # same failure that cost an attended round-trip on 2026-07-20). The uid is immutable once the
    # rule exists -- do not "restore" the longer spelling later.
    #
    # T0124: the deployable combines three sleeves at fixed 1/3 weights, and two of them (B, A1)
    # have held exactly zero for months -- correct behaviour for long-only sleeves in a sustained
    # downtrend, but it means the live book is structurally a ONE-sleeve book at a sixth of that
    # sleeve's gross. The reversal is the event: B or A1 re-arming roughly TRIPLES gross, moves the
    # placeability arithmetic, and invalidates the drift band derived under the one-sleeve state.
    # Nothing observed the original transition -- it was found ~9 months later by a measurement
    # iteration that happened to decompose the book. This rule exists so the next one is announced.
    #
    # `changes()` over a 26h window, not `delta()`: the count is not monotone (a sleeve can arm and
    # go flat again) and the DIRECTION does not matter -- both directions move gross materially, so
    # any step is the event. 26h spans more than six 4h cycles, wide enough that a change is never
    # missed between evaluations and narrow enough that the page ages out within a day.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 93600, to: 0}  # 26h, matching the changes() window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: changes(zcrypto_engine_active_sleeves[26h])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}  # the active-sleeve count stepped, either way == the event
    # OK, not Alerting -- the same posture as the verify-replay rules. The series does not exist at
    # all until the engine converge that ships it lands, and it is deliberately left unpublished
    # until the first cycle actually measures a composition (an unlabelled Gauge would otherwise
    # publish 0.0 from process start, i.e. "every sleeve is flat", which is a claim and a false
    # one). Absence is the dead-man's business: the engine going dark is already owned by the
    # healthchecks.io switch and the cycle-completed staleness, not by this rule.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The engine's sleeve composition changed — a dormant sleeve armed, or an active one went flat.
        Portfolio gross moves materially with the number of active sleeves, so re-derive the drift band
        and re-read order placeability before the next go-live gate reads either of them. Read
        zcrypto_engine_sleeve_gross to see which sleeve moved.
        Runbook: infra/runbooks/engine.md#zcrypto-engine-sleeve-count-changed
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "31"
      unit: "changes to the active sleeve count in the last 26 hours"
    # Warning, not critical: this is an announcement, not a fault. Nothing is broken -- the book is
    # doing what it was built to do; what changed is the object the go-live gate is about to judge.
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-cycle-stale
    title: "Engine · cycles have stopped"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The larger of the two engine holes this file used to carry: NOTHING watched
      # `zcrypto_engine_cycle_completed_at_seconds`. The only engine rule was the sleeve-composition
      # one above, which is about composition, not liveness -- and a crash-looping engine leaves
      # `active_sleeves` frozen at its last published value, so no page ever fired while cycles
      # silently stopped.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_engine_cycle_completed_at_seconds{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 16500 s is cadence arithmetic, not a generic staleness number: boundaries are
            # 00/04/08/12/16/20 UTC and a completion lands inside [B, B+30 min], so the worst
            # HEALTHY age is 4h30m = 16200 s, reached legitimately just before the next cycle
            # lands. 16500 leaves five minutes of margin; a flat 1h/2h bar would sit red through
            # most of every inter-cycle gap.
            - evaluator: {type: gt, params: [16500]}
    # Alerting, and it is the only rule on this subject that takes that posture. The gauge is seeded
    # at engine startup from the newest journal artifact (falling back to process start), so it is
    # never legitimately absent while the engine runs -- absence means the engine container is gone,
    # and nothing else owns that: `Fleet · Alloy dark — Capture primary` reads `count(up{host=...})`,
    # which stays >= 1 while Alloy is up and the engine target merely scrapes `up = 0`. Accepted cost,
    # named rather than discovered: a genuine Alloy-dark event on the primary double-pages.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The trading engine has not completed a cycle in over 4h35m — the 4-hourly loop has stopped
        turning. A healthy cycle completes within 30 minutes of its boundary, so the worst legitimate
        age is 4h30m and anything past that is a stopped or crash-looping engine, not a slow one.
        This also fires when the metric has vanished entirely: either the engine's exporter is gone or
        this host's telemetry plane is dark. Check `Fleet · Alloy dark — Capture primary` before
        assuming the engine, then the engine container on the capture primary and its newest cycle
        journal artifact for how far the last cycle got.
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "11"
      unit: "seconds since the last completed cycle"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-cycle-failed
    title: "Engine · the last cycle failed"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Liveness cannot cover this, and the reason is load-bearing: the metrics sink runs after every
      # cycle, success OR failure, and it refreshes `cycle_completed_at` unconditionally -- so an
      # engine whose every cycle fails on schedule keeps the staleness rule above silent forever.
      # Two questions, two rules.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'zcrypto_engine_cycle_success{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}  # the gauge is 1 on success, 0 on failure
    # OK, not Alerting: this gauge is DELIBERATELY left unregistered until an outcome is actually
    # known (an unlabelled Gauge would otherwise publish 0.0 from process start, i.e. "the last cycle
    # failed", which is a claim and a false one), so a fresh deploy or an unreadable journal must not
    # page. Absence is the staleness rule above's business.
    noDataState: OK
    execErrState: Alerting
    # 0s: the outcome is already final the instant this gauge reads 0, so any pending period is pure
    # delay. The mechanism, read from the source rather than assumed -- `cli/engine/cycle.py::_failed`
    # writes `failed-cycle-<HH>.json` BEFORE it calls `_update_metrics`, and
    # `cli/engine/node.py::startup_action` returns None for any boundary that already has a journal
    # artifact (success record OR failed sidecar), a check independent of the [B, B+25 min] window it
    # sits behind. So `cycle_success == 0` implies the sidecar exists implies no re-run is possible,
    # ever, and the next boundary is 4 h away. `for: 35m` shipped first on the opposite premise --
    # that a restart inside B+25 min could still flip the gauge back -- which bought 35 minutes of
    # silence and a summary telling a 03:00 responder the engine had already retried and failed again.
    for: 0s
    annotations:
      summary: >-
        The engine's most recent cycle finished UNSUCCESSFULLY. The outcome is final — the engine never
        re-runs a boundary that already has a journal artifact, so only
        `zcrypto engine cycle --at` the failed boundary's timestamp `--replace` can re-run it. The
        cycle-staleness rule cannot see this: the metrics sink refreshes the completion timestamp after
        a FAILED cycle too. Read the engine log and the newest cycle journal artifact for which step
        failed.
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "12"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-error-logs
    title: "Engine · ERROR logs"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The engine direct-ships its logs exactly as the capture daemon does -- `level` =
      # `record.levelname` at the source and `container` = ZCRYPTO_LOG_SERVICE, set to `engine` in
      # infra/ansible/roles/engine/templates/compose.yaml.j2 -- and NOTHING selected them: the
      # capture ERROR rule is `container="capture"` and the ops one is scoped to `host="ops"`, so an
      # ERROR line from the process holding the live trade key paged nobody. The engine runs only on
      # the capture primary, hence `host="zcrypto"` alongside the container label; `sum by (host,
      # ...)` keeps the label the notification template maps to a display name.
      #
      # Shape is `zcrypto-capture-error-logs`'s, deliberately identical rather than re-derived: the
      # `msg` hoist puts the log MESSAGE on the page -- the whole reason a log alert exists, since
      # without it the page says "3" and the responder goes hunting -- `printf "%.200s"` bounds one
      # message and `topk(5, ...)` bounds how many; `| json message="message"` parses the
      # direct-ship JSON body (cli/logging/ship.py's JsonLineFormatter) instead of reading
      # `__line__`, which would spend ~150 of the 200 characters on the JSON preamble; and `| drop
      # __error__, __error_details__` is required, not decorative -- `| json` stamps
      # `__error__="JSONParserErr"` on any line it cannot parse and the query then 400s, taking the
      # whole rule to execErrState. `or on() vector(0)` keeps a clean window an explicit 0, and the
      # rule fires on the COUNT arm only, so its labels are genuinely populated when it pages.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            topk(5, sum by (host, container, level, msg) (count_over_time({host="zcrypto", container="engine", level=~"ERROR|CRITICAL"} | json message="message" | drop __error__, __error_details__ | label_format msg=`{{ if .message }}{{ printf "%.200s" .message }}{{ else }}{{ printf "%.200s" __line__ }}{{ end }}` [15m]))) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR/CRITICAL log lines from the trading engine on the capture primary in the last 15 minutes -- the cycle rules see only a cycle's final outcome, so everything that goes wrong between boundaries (key or API failures, refresh errors, order-path exceptions) surfaces here first, on the host that holds the live trade key. Zero is the healthy baseline. One alert instance per distinct line, and at most 5 of them -- a storm may carry more lines than are shown here."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "102"
      unit: "ERROR or CRITICAL log lines in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  # The dead canary that makes `zcrypto-engine-error-logs` above trustworthy (T0128). That rule is
  # presence-fired, so it is silent in two states that look identical from outside: the engine is
  # healthy, or its log-shipping path regressed and no line arrives at all. Mirrors
  # `zcrypto-capture-log-dead-primary` in shape; the WINDOW is derived differently and deliberately.
  #
  # THE ENGINE IS A BURST EMITTER, NOT A CONTINUOUS ONE -- the whole reason this window is derived
  # rather than copied from the capture canary. Measured 2026-08-08 over the FULL 12.6 days Loki
  # serves for this selector (974 lines): it emits ~11 lines within ~90 s of each 4-hourly cycle
  # boundary and nothing between, so most hours carry zero lines and no gap anywhere exceeds 4.5 h.
  # A window at or under 4 h would false-fire on every healthy inter-cycle gap.
  #
  # 6h against a measured 4.00 h period = 2.00 h of slack, and the rolling 6 h count never dropped
  # below 11 over those 12.6 days (max 34). Note this is by far the TIGHTEST window/period ratio of
  # any log canary here (~1.5x, against capture's ~210x) -- it is sized to the cycle, and it
  # tolerates exactly zero missed cycles. Do NOT tighten it toward the 15m of the ERROR rule above:
  # they watch different things.
  #
  # ACCEPTED COST, named rather than discovered: a genuinely missed cycle double-pages. The engine's
  # own `zcrypto-engine-cycle-stale` fires first and correctly (B+40m..B+1h10m, receiver `metrics`);
  # this rule then fires at ~B+2h01m on receiver `logs` with a title saying the LOG PIPELINE is dead
  # when it is fine. The summary's last sentence tells the responder how to tell them apart, but the
  # phone shows the title first.
  #
  # MEASURING THIS NEEDS CARE, and the trap is not what it looks like. `count_over_time` emits NO
  # sample for a step whose range window is empty, so on a burst emitter the surviving points are
  # just the burst hours -- 4 h apart -- and a range query reads back as a flat "every hour has
  # lines", the exact opposite of the truth. The `step` is honored; Loki is not at fault. The cheap
  # fix is the `or on() vector(0)` this rule already carries: with it, step=1h returns the zero hours
  # (11,0,0,0,11,0,0,0,21,...). Without it, page raw entries and bucket them locally.
  #
  # `level=~".+"` verified present on this stream (values: INFO) before being relied on -- an absent
  # label would make the selector match nothing and park the rule permanently firing.
  - uid: zcrypto-engine-log-dead
    title: "Engine · log pipeline dead"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="zcrypto", container="engine", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, matching the other dead-men: the `or on() vector(0)` fallback keeps the query
    # returning data while intact, and this is the belt-and-braces layer for the day an edit drops
    # that fallback or Loki maps an empty response to NoData. With OK it would park green in exactly
    # the blind state it exists to page on.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one log line of any level from the trading engine on host zcrypto (container `engine`) in 6h. The engine logs in bursts at its 4-hourly cycle boundaries, so 6h means at least one whole cycle produced nothing -- its log-shipping path is dead (Loki credentials, the ship handler, or the container gone). The Engine · ERROR logs rule is blind until this is fixed, on the host that holds the live trade key. Check whether cycles are still completing: if they are, this is the log plane alone; if they are not, the engine itself is down and the cycle rules are the ones to read."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
      unit: "engine log lines of any level in the last 6 hours"
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  # The execution safety envelope (cli/engine/execgate.py, `_ExecGauges` in cli/engine/command.py):
  # three rules over the six `zcrypto_exec_*` gauges. `reasons` never reaches Grafana and
  # `zcrypto_exec_armed` deliberately conflates its two arming keys into one gauge, so every
  # summary below sends the responder to `zcrypto engine exec-status` on the engine host for the
  # breakdown remote telemetry cannot show. `zcrypto_exec_gate_level`, `zcrypto_exec_venue_ok` and
  # `zcrypto_exec_restart_hold` are deliberately NOT alerted here -- every value each can take is
  # legitimate on its own (see the panel descriptions on the Engine board's execution-envelope row
  # and NOT_A_FAULT_SIGNAL in tests/test_infra_alert_rules.py), and venue_ok's underlying condition
  # already has a page from the capture side (zcrypto-capture-venue-not-online).
  - uid: zcrypto-engine-exec-armed-too-long
    title: "Engine · order submission has been armed for over six hours"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # min_over_time == 1 means it was armed for the WHOLE window: a single dip to 0 (a disarm)
    # clears it. `> 0` on an average would fire on a brief, correct probe window.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}  # 6h, matching the min_over_time window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min_over_time(zcrypto_exec_armed{host="zcrypto"}[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}  # stands in for == 1 -- this file's evaluators are gt/lt only
    # OK, not Alerting: absence means the engine itself is down, which zcrypto-engine-cycle-stale
    # already pages on. This rule's job is the ARMED-too-long condition specifically, and a fresh
    # process (or one between restarts) legitimately starts disarmed with no history to alarm on.
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "The engine has been armed to submit orders continuously for more than six hours. Arming is expected only inside an attended probe window and is normally removed when it ends, so this most likely means an arm was left on. Deleting the arm file on the engine host disarms it immediately, with no deploy and no restart. This is not itself an incident — several other conditions must also be permissive before anything could be submitted — but an engine left armed removes one of the two keys that are supposed to stand between a mistake and real money. Runbook: infra/runbooks/engine.md#zcrypto-engine-exec-armed-too-long"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "52"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-exec-kill-tripped
    title: "Engine · the execution kill switch is engaged"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'zcrypto_exec_kill_tripped{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}  # stands in for == 1 -- this file's evaluators are gt/lt only
    # OK, not Alerting: absence means the engine itself is down (owned by zcrypto-engine-cycle-stale),
    # and this eager gauge always carries a real 0/1 sample once the engine has started.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The execution kill switch is engaged, so the engine will refuse to submit any order until it is removed. This is a deliberate state and firing does not mean anything is broken — the alert exists because the failure mode is forgetting, not tripping. If the switch was engaged deliberately and the reason still holds, silence this for the expected duration; otherwise remove the kill file on the engine host. Runbook: infra/runbooks/engine.md#zcrypto-engine-exec-kill-tripped"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "53"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-exec-not-evaluated
    title: "Engine · the execution safety gate has stopped being evaluated"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # The rule that catches the one failure nothing else can see: a regression that drops the
    # gate evaluation from the cycle path freezes all six gauges at their last values, cycle
    # telemetry stays healthy, and every dashboard reads green while the envelope is gone.
    # Follows zcrypto-gate-exporter-stale's shape. Threshold = one cycle interval plus slack.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_exec_last_evaluation_timestamp_seconds{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [17100]}  # 4h45m
    # noDataState MUST be Alerting: a gate that never published at all is this rule's worst
    # case, not an exemption from it.
    noDataState: Alerting
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The engine has not evaluated its execution safety gate for more than four and three quarter hours, so every published value describing whether it may trade is frozen at whatever it last read. Nothing else reports this: the cycle metrics can look perfectly healthy while the safety gate is no longer consulted at all, and a stale reading of `disarmed` is indistinguishable from a live one. Check that cycles are still completing, then read the current state directly on the engine host with the exec-status command rather than trusting the dashboard. Runbook: infra/runbooks/engine.md#zcrypto-engine-exec-not-evaluated"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "56"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-venue-concordance-failed
    title: "Engine · venue concordance failed"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'zcrypto_venue_concordance_failures{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: absence means the engine itself is down, which zcrypto-engine-cycle-stale
    # already pages on -- this eager gauge always carries a real sample once the engine has started,
    # seeded at startup from the newest venue-<HH>.json on disk (_seed_venue_state) so a restart
    # never leaves it parked at the eager 0 default, masking a real failure count as healthy.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "A ratified instrument went missing or unparseable at the venue on the most recent cycle. Check the newest venue snapshot record on the engine host for which leg and why. Runbook: infra/runbooks/engine.md#zcrypto-venue-concordance-failed"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "73"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-venue-snapshot-stale
    title: "Engine · venue snapshot is stale"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_venue_snapshot_timestamp_seconds{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [18000]}  # one 4h cycle + 1h slack
    # OK, not Alerting: absence means the engine itself is down, which zcrypto-engine-cycle-stale
    # already pages on -- this eager gauge always carries a real sample once the engine has started,
    # seeded at startup from the newest venue-<HH>.json on disk (_seed_venue_state) so a routine
    # restart never leaves it at its 0.0 (1970) default and false-pages this very rule.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The venue snapshot writer has stopped producing -- no successful venue-truth snapshot in over five hours. Check the engine log and the newest venue snapshot record on the engine host. Runbook: infra/runbooks/engine.md#zcrypto-venue-snapshot-stale"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "71"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-disk-low
    title: "NAS · /volume1 free space low"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_filesystem_avail_bytes{mountpoint="/volume1"}
            / node_filesystem_size_bytes{mountpoint="/volume1"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.1]}  # < 10% free
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "/volume1 has less than 10% free space -- the archive keeps growing into it."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "301"
      unit: "of the volume still free (a fraction, not a percent)"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-load-high
    title: "NAS · load high"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # Scoped to host="nas" (re-keyed from the old empty-value matcher, spec 00069 D7):
          # ops's Alloy also ships node_load1 (it sets `external_labels = { host = "ops" }` on
          # prometheus.remote_write), and ops is a 24-thread box whose normal working load would
          # trip this Atom-sized `gt 4` threshold constantly. The NAS's config.alloy now sets
          # `external_labels = { host = "nas" }` too (it used to carry no `host` label at all,
          # selected via an empty-value "label absent" matcher instead), so an explicit
          # `host="nas"` selects the NAS's copy of the series only, same partition as before.
          expr: node_load1{host="nas"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # The NAS Atom has 4 cores (infra/nas/README.md) -- 1-min load above that is
            # sustained saturation, not a transient burst.
            - evaluator: {type: gt, params: [4]}
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "1-minute load average exceeds the NAS's 4 cores."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "201"
      unit: "as a 1-minute load average"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-archive-pull-errors
    title: "NAS · archive-pull ERROR logs"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Selects on the `level` LABEL, not a `|= "ERROR"` grep of the line. Alloy now parses our
      # Python log format at ingest (infra/nas/config.alloy) and strips the level out of the message,
      # so a text grep for "ERROR" would match NOTHING — silently blind, exactly the failure this rule
      # already had once. The label also catches `critical`, which the grep never did.
      # `queryType: instant` is load-bearing and Loki-specific: the `instant: true` MODEL field that
      # the Prometheus rules above use is a Prometheus-datasource setting, and Loki ignores it. Without
      # this the query ran as a RANGE query and returned a time series, so the threshold node rejected
      # it with "invalid format of evaluation results ... looks like time series data, only reduced
      # data can be alerted on" -- the rule was erroring instead of evaluating.
      #
      # `by (host)` and not `by (host, container)`: the selector already pins the container to one
      # literal, so carrying it would add a label whose value the rule already knows. This rule fires
      # on the COUNT arm -- `or on() vector(0)` yields 0, which fails `gt 0` -- so the labels it
      # raises are genuinely populated, unlike the dead-man below.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({container="archive-pull", level=~"ERROR|CRITICAL"} [15m])) or on() vector(0)
          queryType: instant
          refId: A
      # Reduce A to a single value before the threshold. Belt-and-braces alongside the instant query:
      # this is the canonical A -> B(reduce) -> C(threshold) chain Grafana's own UI emits, and it keeps
      # the rule valid even if the datasource ever hands back a series again.
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR-level log lines from the archive-pull container on the NAS in the last 15 minutes."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "102"
      unit: "ERROR or CRITICAL log lines in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  - uid: zcrypto-nas-archive-pull-stalled
    title: "NAS · archive-pull stalled (dead-man)"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The DEAD-MAN, and the only rule that fires on SILENCE. Every other rule needs the archive-pull
      # container to still be alive and talking: `NAS · archive-pull ERROR logs` fires on an ERROR
      # line, so it is green when the container is gone, the pull loop has exited, or the NAS is down
      # -- i.e. exactly when nothing is protecting the unbackfillable archive any more. This one
      # inverts that: it fires when the loop STOPS saying it succeeded.
      #
      # `failed=0` is load-bearing, not decoration. Matching `pull complete` alone would ALSO be
      # satisfied by (a) the JOURNAL pull -- "archive pull complete (no verify) ..."
      # (cli/archive/command.py:104) -- and (b) a CAPTURE pull whose hash verification FAILED, because
      # :109 logs "pull complete ... failed=N" *before* the :118 check raises. Either would hold this
      # rule quiet while the capture mirror -- the unbackfillable thing it exists to protect -- was not
      # advancing at all. The journal line carries no `failed=` field, and a verify failure carries a
      # non-zero one -- but `failed=0` is NOT capture-specific any more: the LIQUIDATIONS, PANEL, and
      # (since the OPS-5 cutover, spec 00054 D4) RECONCILED pulls all run `zcrypto archive pull` WITH
      # verification in this same
      # container and emit the identical clean line, so any one of them keeps this dead-man green
      # even if BOTH capture channels are broken. Known, accepted gap: a broken capture pull fails
      # LOUDLY every cycle, so capture-specific failure is deliberately delegated to the
      # warning-severity ERROR-logs rule above; this rule owns total silence (loop dead, container
      # gone, NAS down, log pipeline dark). Tightening the LogQL to a capture-tree match (the line
      # carries source= naming the tree -- source only; dest= appears on the --no-verify journal
      # line, never on this one) would make it capture-specific again if that gap is
      # ever deemed worth closing.
      #
      # 3h window against a pull that runs hourly (`${ARCHIVE_PULL_INTERVAL:-3600}` in
      # infra/nas/pull-entrypoint.sh): the loop gets three chances to report before this pages, so a
      # single slow or restarted cycle is not enough to wake anyone.
      #
      # `or on() vector(0)` is what makes the dead-man work at all: when the container is gone Loki
      # returns NO series, and a bare `sum(count_over_time(...))` would then evaluate to NoData
      # rather than to zero -- the rule would sit in NoData instead of firing, which is the precise
      # failure it exists to catch. The `or` substitutes an explicit 0, which trips the `lt 1` below.
      #
      # `by (host)` is carried for the notification's label line and is INERT at exactly fire time:
      # the fire path IS the `or on() vector(0)` arm, which is unlabelled, so an interpolated
      # `$labels.host` would render empty on the page. The summary therefore names the host and the
      # container as literal words. Same shape on every dead-man in this file.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 10800, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({container="archive-pull"} |= "pull complete" |= "failed=0" [3h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting  # NoData here means the log pipeline itself died -- that IS the alarm
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "The archive-pull container on the NAS has not reported a successful pull for 3h -- the loop, the container, the NAS, or the log pipeline is down. The L2 archive is unbackfillable; the NAS mirror is going stale."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  # --- Reconciler: the redundant capture secondary + gap healing (spec 00050 Role C, task 11) -------
  # Pushed only after the `zcrypto_reconcile_*` series were confirmed VISIBLE in Grafana Cloud. A rule
  # armed before its metric exists evaluates against nothing and sits silent forever, looking healthy
  # -- the same class of failure as T0034. Alloy's keep-regex must carry `zcrypto_reconcile_.*` or the
  # series never leave the NAS (infra/nas/config.alloy).

  - uid: zcrypto-reconcile-exporter-stale
    title: "Reconciler · exporter stale"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for the reconciler itself. Every other rule below reads a metric the reconciler
      # publishes, so all of them go quiet -- not red -- if it simply stops running. This one inverts
      # that: it fires on the silence. The textfile is scraped in place, so a dead reconciler leaves the
      # last value being scraped forever; only the TIMESTAMP reveals it, which is why the gauge exists.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_reconcile_last_success_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h. Since the OPS-5 cutover the series comes from the ops half-hourly overlay-writer (:12/:42), so this is ~6 missed cycles -- kept as provisioned deliberately (T0058 consensus: thresholds stay), and it doubles as the persistent-gate-skip pager (a skipped cycle never rewrites reconcile.prom)
    noDataState: Alerting  # no series at all = the ops node, its Alloy, or the writer cycle is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful `zcrypto archive reconcile` cycle in over 3h. The reconciler is the only thing that heals primary gaps from the secondary -- while it is down, gaps accumulate unhealed and unmeasured."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "201"
      unit: "seconds since the reconciler last completed a run"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-residual-gap
    title: "Reconciler · residual gap increased (permanent loss)"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # PERMANENT LOSS. Residual seconds are silence that NEITHER mirror covered -- both_streams_silent
      # (the fleet went dark together) or total_loss (the hour is on neither host). No later cycle can
      # heal it: there is no witness, and L2 is unbackfillable. Any increase at all is worth waking up
      # for, hence `> 0` rather than a tolerance.
      #
      # The counter is derived by SUMMING an append-only ledger, so it normally only grows. The one
      # thing that DECREASES it is a deliberate ledger correction (e.g. the classifier-bug record purged
      # with the owner's approval on 2026-07-14, 6261.8 -> 2661.8 s). Prometheus reads that decrease as a
      # counter reset, and a bare `increase()` would then report the whole post-reset value as fresh
      # permanent loss -- paging the highest-severity alert in the system on an artifact of a correction.
      # The `and resets(...) == 0` guard suppresses exactly that: the rule fires only on an increase with
      # NO reset in the window. A genuine new loss is monotone (no reset) and still fires; a correction
      # (reset) is silenced for one window. Cost: a real loss in the same window as a correction is
      # delayed until the reset ages out -- and that window is now 24h, not 1h, so the blind spot after
      # any ledger correction or rebuild is a full day. Accepted deliberately, because at 1h the page
      # self-resolved to MissingSeries an hour after firing on a real 2,437 s loss; the dashboard panel
      # shows the trend regardless. The other side of the same widening: a SECOND event inside the same
      # 24h produces no state transition, so this pages once per day rather than once per event -- the
      # ledger is the per-event record, the page only has to reach a human.
      # `or on() vector(0)` keeps the healthy state an explicit 0 rather than NoData. See T0044.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: "(increase(zcrypto_reconcile_residual_gap_seconds_total[24h]) > 0 and resets(zcrypto_reconcile_residual_gap_seconds_total[24h]) == 0) or on() vector(0)"
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # the exporter-stale rule above owns "the reconciler is gone"; this one owns loss.
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Permanent L2 loss: silence that NEITHER capture host covered. This cannot be healed or backfilled -- the data is gone. Check the reconcile ledger for the records behind it: both_streams_silent or total_loss for correlated loss, or a minted/would_mint hour whose splice left seconds unfilled -- any of the three can drive this."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "202"
      unit: "seconds of unrecoverable silence"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-source-lag
    title: "Reconciler · capture mirror lagging"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Per-mirror, so the alert instance names WHICH host went quiet -- `source="primary"` and
      # `source="secondary"` fire independently. This is dataflow-based and therefore independent of
      # both hosts' healthchecks.io dead-men: a host can keep pinging while its capture writes nothing.
      #
      # Threshold 3h against a measured normal of ~1h: a final only commits after its hour closes and
      # the NAS pulls hourly, so ~1-2h of lag is the healthy steady state. 3h means a mirror has missed
      # a whole cycle beyond that.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: max by (source) (zcrypto_reconcile_source_lag_seconds)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h
    noDataState: OK  # owned by the exporter-stale rule above
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "A capture mirror's newest committed final is over 3h old -- that host has stopped producing data, or its pull channel is broken. If it is the SECONDARY, the fleet has no witness and the next primary gap is permanent."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "201"
      unit: "seconds of mirror lag"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-healable-gap-rate
    title: "Reconciler · primary gap rate high (degrading host)"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The degrading-primary detector, and T0003's outstanding gap-rate-alert item.
      #
      # A primary that is quietly falling apart -- reconnecting constantly, dropping seconds at a time --
      # trips NOTHING else: every gap is healed by the secondary, so residual stays flat; it keeps
      # pinging, so its dead-man stays green; it keeps producing finals, so source-lag stays low. The
      # RATE at which it needs healing is the only thing that reveals it.
      #
      # Reads `healable`, not `healed`: minting is OFF for the whole T0039 soak, so `healed_gap_seconds`
      # (minted only) is pinned at 0 exactly when this signal is most needed. `healable` counts the
      # seconds the secondary WITNESSED and could cover, in both modes.
      #
      # 600s/24h is a starting threshold, not a measured one: ~10 minutes of primary silence a day that
      # the secondary had to cover. Divided by the live pair count, so 600 really is 600 WALL-CLOCK
      # seconds -- undivided it was a cross-stream sum, i.e. ~50 s at 12 pairs, tightening silently with
      # every pair added. The number itself is re-derived only once the counters carry trustworthy
      # steady-state history; until then treat a firing as "look at the ledger", not as a verdict.
      #
      # `and resets(...) == 0` guards the same counter-reset hazard as the residual-gap rule, and MORE so
      # here: this window is 24h, so without the guard a ledger correction would false-page for a full
      # day. A rebuild of the ledger resets this counter too. See T0044.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: "((increase(zcrypto_reconcile_healable_gap_seconds_total[24h]) > 0 and resets(zcrypto_reconcile_healable_gap_seconds_total[24h]) == 0) or on() vector(0)) / scalar(count(count by (pair) (zcrypto_capture_book_desynced)) or vector(1))"
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [600]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "The primary needed more than 10 minutes of healing in the last 24h. Every gap was covered, so nothing else fires -- but a host that needs this much healing is degrading. Check the reconcile ledger's would_mint/minted records for the pattern."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "202"
      unit: "seconds of healable silence per live pair over the last day"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  # --- Trade backfill: daily trade_id-contiguous healing over Kraken's public REST /Trades ---------
  # (spec 00053, iter-100; T0052). Provisioned in this file BEFORE the NAS deploy that will first
  # emit `zcrypto_trade_backfill_*` -- unlike the reconciler block above (pushed only once its
  # series were already confirmed visible), these two rules must not be pushed yet either, for the
  # opposite-looking but equally bad reason: `zcrypto-trade-backfill-stale` below sets
  # `noDataState: Alerting`, and with no series at all yet that would page immediately and forever
  # until the NAS deploy happens. Push only after that deploy confirms the series are visible.

  - uid: zcrypto-trade-backfill-stale
    title: "Trade backfill · last success stale"
    ruleGroup: zcrypto-trade-backfill
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for this step, same shape as Gate/Reconciler `exporter stale` above: the step is
      # DAILY, so a healthy pass can be up to ~24h old between successes -- the threshold must clear
      # that cadence with room for one missed day, hence ~2 days rather than ~2x the gate/reconciler
      # hourly-cadence thresholds.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_trade_backfill_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}  # ~2 days -- tolerates the daily cadence plus one miss
    # Alerting: a vanished series here means the step stopped succeeding (or stopped running
    # altogether), which is itself the failure worth paging on -- same reasoning as the gate/reconciler
    # exporter-stale rules. See the block comment above for the pre-deploy push-order caveat this implies.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No clean `zcrypto archive backfill-trades` run in over ~2 days -- the daily step has been failing every cycle or has stopped running."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "402"
      unit: "seconds since the trade backfill last succeeded"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-trade-backfill-exit-nonzero
    title: "Trade backfill · non-zero exit code"
    ruleGroup: zcrypto-trade-backfill
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # This is the ONLY signal for a run that recorded errors (exit 1) or found the primary root
      # missing (exit 2) -- T0053's fix stamps the UTC day unconditionally (success or failure), so a
      # failed run no longer retries hourly; this metric, not a retry, is what carries the failure.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_trade_backfill_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the exporter-stale rule above already owns "the step stopped running/succeeding
    # at all" -- this one owns "it ran and recorded a failure", same split as the reconciler's
    # source-lag/healable-gap-rate rules deferring the dead-man case to their own exporter-stale rule.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The daily trade-backfill run recorded a non-zero exit code (1 = errors recorded, 2 = primary root missing). It no longer retries hourly -- this alert is the only signal."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "401"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  # --- Ops node (spec 00054): the timer jobs, the logs pipeline, and the host itself ---------------
  # Pushed only after Task 3 (the attended Alloy deploy) confirms the underlying series VISIBLE in
  # Grafana Cloud -- same push-order caveat as the Reconciler/Trade-backfill blocks above: a rule armed
  # before its metric exists sits silent forever, looking healthy. noDataState is per-rule, not
  # boilerplate, and the split is a RULE, not a count (counts go stale as rules are added): a rule
  # whose job is to detect silence -- the dead-men and staleness rules, where no data at all means the
  # host, Alloy, a transport, or a timer is gone -- uses Alerting, because for it silence IS the
  # alarm; a rule that grades an outcome (exit codes, ERROR log lines, load) uses OK, because it must
  # not page a brand-new host for a job that has simply never run yet. Exactly the
  # `zcrypto-trade-backfill-stale`/`zcrypto-trade-backfill-exit-nonzero` split above, applied here.

  - uid: zcrypto-ops-archive-pull-stalled
    title: "Ops · archive-pull stalled (dead-man)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for the ops node's overlay-WRITER cycle (T0058: the rsync mirror pull this
      # rule was written for is retired; the unit/metric names are historical, kept because these
      # rules are provisioned against them). archive-pull.timer fires at :12 and :42
      # (infra/ansible/roles/ops/templates/archive-pull.timer.j2) -- 3h is ~6 missed half-hourly
      # cycles of headroom (kept as provisioned at the cadence doubling, deliberately), same
      # reasoning as the Gate/Reconciler exporter-stale rules above. A clean cycle AND a
      # fail-closed gate-skip both bump last_success (a skip is a state, not a fault); a
      # PERSISTENT skip pages via the reconcile exporter-stale rule instead, which a skipped cycle
      # never refreshes.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - ops_archive_pull_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h; half-hourly timer at :12/:42, so ~6 missed cycles
    noDataState: Alerting  # no series at all = the host, Alloy, or the timer is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The ops overlay-writer cycle (historical name: archive-pull) has not completed for 3h --
        the host, the timer, or Alloy is gone. Reconcile + trade-backfill are not running, and
        nothing else owns that silence (a gate-skip still bumps this metric, so this is not a skip).
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "402"
      unit: "seconds since the archive pull last succeeded"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-archive-pull-exit-nonzero
    title: "Ops · archive-pull non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_archive_pull_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the dead-man rule above already owns "the cycle stopped running/succeeding
    # at all" -- this one owns "it ran and the reconcile step failed", same split as the
    # trade-backfill pair. T0058: rsync is gone, so the reconcile `docker run` (including a
    # leftover-container name conflict after a dockerd crash -- archive-pull.sh.j2's T0060 comment
    # names this alert as that failure's loud path) is the only thing that sets rc non-zero; a
    # gate-skip and a trade-backfill failure both leave rc at 0 (the backfill's loud path is its
    # own exit-code alert above).
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last ops overlay-writer cycle (historical name: archive-pull) recorded a non-zero exit code -- the reconcile step failed (image/digest problem, dockerd down, a leftover zcrypto-reconcile container, or the reconciler itself erroring). Gate-skips and trade-backfill failures do NOT trip this rule."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "401"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verified-replay-stale
    title: "Ops · verified-replay stale"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # D9's rule. verified-replay.timer fires daily at 05:23 UTC
      # (infra/ansible/roles/ops/templates/verified-replay.timer.j2) -- 48h is 2 missed days, matching
      # the trade-backfill staleness rule's reasoning for a daily-cadence job.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - ops_verified_replay_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}  # 48h -- 2 missed daily cycles
    noDataState: Alerting  # no series at all = the host, Alloy, or the timer is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      # 48h = two daily replay cycles; the invariant is D9 in the spec vocabulary.
      summary: "No successful verified-path journal replay in over 48h -- the daily replay has stopped running or has not succeeded in two cycles."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "402"
      unit: "seconds since the verified replay last succeeded"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verified-replay-exit-nonzero
    title: "Ops · verified-replay non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verified_replay_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the stale rule above already owns "the replay stopped running/succeeding at
    # all" -- this one owns "it ran and found a mismatch or a validation failure" -- critical, not
    # warning, because a verified-path mismatch means the canonical replay itself disagrees with the
    # journal, the same class of failure the Gate's mismatch rule pages critical for.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last verified-path journal replay recorded a non-zero exit code -- a replay mismatch or validation failure against yesterday's journaled cycles."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "401"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verify-replay-new-breakage
    title: "Ops · verify-replay NEW hours stopped replaying"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # SUPERSEDES `Ops · verify-replay non-zero exit` (uid zcrypto-ops-verify-replay-exit-nonzero,
    # removed here): ops_verify_replay_exit_code stays 1 forever once any hour has ever failed, so
    # that rule paged nightly for an already-triaged, unchanged finding exactly as often as for a
    # real new one. Split into two rules instead (spec 00077 D1/D4): this one owns "a NEW hour
    # stopped replaying that did not fail in the prior sweep" (mode i); `Ops · verify-replay run
    # broken` below owns "the sweep itself did not complete" (mode iii). exit_code is deliberately
    # no longer alerted on -- do not "restore" this rule against it; the two new rules are strictly
    # more precise than it was.
    #
    # A known bad hour is a CONSTANT in ops_verify_replay_failed_hours, so it contributes zero to
    # the delta; only a new failure moves the count. Same delta-over-a-window shape as `Gate ·
    # streak reset` above.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 90000, to: 0}  # 25h, matching the delta window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: delta(ops_verify_replay_failed_hours[25h])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}  # the failed-hour count went UP == a new hour broke
    # OK, not Alerting: the dead-man already owns "did the sweep run at all" -- a missing series
    # here is absence, not breakage. `Ops · verify-replay run broken` below pages on a broken
    # EVALUATION (the sweep ran but did not report), which is the other half of that distinction.
    noDataState: OK
    execErrState: Alerting
    for: 0s
    annotations:
      summary: >-
        The canonical archive replay found hour(s) that failed today which did NOT fail in the prior
        sweep -- a known bad hour re-failing does not trigger this. Read the per-hour warnings in the
        run's journal to see which hours, triage them, and record the finding durably: this alert
        ages out after 25h and is not itself a record.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-verify-replay-new-breakage
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "304"
      unit: "newly failed hours in the last 25 hours"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verify-replay-run-broken
    title: "Ops · verify-replay run broken"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # Mode (iii): the sweep itself did not complete, regardless of what it found -- a crashed
    # container, an EIO from the read-only NAS mount, or a container that never started (the T0060
    # name-conflict case). ops_verify_replay_run_ok is 1 iff the run produced a parseable summary;
    # on a broken run failed_hours/hours_total are carried forward unchanged (spec 00077 D2/D3), so
    # this rule -- not the one above -- is what stays loud while a run keeps failing to complete.
    # exit_code is deliberately no longer alerted on for this timer either (spec 00077 D1/D4).
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verify_replay_run_ok
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # OK, not Alerting: a missing series is the dead-man's job, not this rule's -- a brand-new host
    # must not page for a job that has simply never run yet, same reasoning the exit-code split
    # this supersedes already used.
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: >-
        The last canonical archive replay sweep did not run to completion, so today's findings are
        unknown, not clean. Likely causes: the container crashed, or the read-only NAS mount
        returned an I/O error.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-verify-replay-run-broken
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "301"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verify-replay-backlog-stuck
    title: "Ops · verify-replay backlog stuck"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # The incremental sweep (spec 00078) replays hours it has never seen unconditionally and drains
    # older CHANGED hours under a wall-clock budget; whatever the budget did not reach is reported as
    # `pending`. A backlog is normal and self-clearing -- a deliberate re-verification creates one by
    # design. What is not normal is one that stops SHRINKING, which means the instrument is degraded
    # (budget mis-set to 0, the drain broken, the state dir lost nightly), not that the data is bad.
    # Hence warning: nothing here says the archive is wrong. This is why spec 00077 D8's "no standing
    # known-bad-hours alert" precedent does not apply.
    #
    # The shape. 26h spans EXACTLY the last two nightly runs -- wide enough that night two's sample is
    # always inside it (24h plus slack for a late start), narrow enough that a third night's history
    # never is, so the sign of `delta` means "did the last run make progress" and nothing else.
    #
    # `for: 27h` is arithmetic, not taste, and getting it wrong is how the first draft of this rule
    # paged on healthy drains. `pending` is a PERSISTENT textfile gauge -- the runner prints it every
    # run, so it is scraped continuously and holds its value between runs. The condition goes true at
    # the bump night's publish T1 and CANNOT go false until the window's left edge passes T1: before
    # then the window still contains a pre-bump sample, so `delta` stays positive even after night
    # two's decrease has landed. A healthy drain therefore holds this condition true for exactly
    # max(24h, window) = 26h, and `for` must STRICTLY exceed that -- `for: 25h` fires an hour after
    # night two, identically to a stuck backlog, and even `for: 26h` trips on a 26h-long true run.
    # 27h leaves an hour of margin. Do not shorten it, and if you widen the window, widen this too.
    #
    # Two query nodes rather than this file's usual one, because the condition is a conjunction:
    # without `$A > 0` a backlog drained to zero reads `delta == 0` forever and pages permanently on a
    # healthy fleet; without `$B >= 0` every night of a legitimate multi-night drain pages.
    condition: D
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verify_replay_pending_hours
          instant: true
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 93600, to: 0}  # 26h, matching the delta window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: delta(ops_verify_replay_pending_hours[26h])
          instant: true
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: math
          expression: "$A > 0 && $B >= 0"
          refId: C
      - refId: D
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "C"
          refId: D
          conditions:
            - evaluator: {type: gt, params: [0]}  # the math node is 1 iff BOTH halves hold
    # OK, not Alerting: a host that has never run the sweep publishes no pending series at all, and
    # the dead-man already owns "did it run" -- same posture as the two rules above.
    noDataState: OK
    execErrState: Alerting
    for: 27h
    annotations:
      summary: >-
        The nightly archive re-verification backlog is not shrinking. The sweep still runs, but hours
        queued for re-verification have not decreased across two nightly runs — the drain budget may
        be zero, the state directory lost, or the drain broken.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-verify-replay-backlog-stuck
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "304"
      unit: "hours still pending replay"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-tapebars-permanent-gap
    title: "Ops · tape-bars permanent gap"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The ONLY durable report of this event. A settled day that stayed unpublished until the
      # sweep window moved past it is gone from every other counter at exactly the moment its
      # absence became final -- days_unhealed stops counting it, the exit code stays 0, and the
      # dataset simply reads short forever. days_gap is computed from the calendar and the
      # published set, so it keeps reporting after the fact; this rule is what says it out loud.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 7200, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_tapebars_days_gap
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: before the first sweep the series does not exist, and the dead-man below
    # already owns "did it run at all".
    noDataState: OK
    execErrState: Alerting
    for: 1h
    annotations:
      summary: >-
        A settled tape-bars day was never published and has now fallen outside the re-scan window --
        it is a permanent hole in the dataset, and no other signal reports it. Read the runner log for
        the day and pair, then decide whether the trade archive can still be healed for it.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-tapebars-permanent-gap
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "405"
      unit: "days permanently missing"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-tapebars-not-advancing
    title: "Ops · tape-bars not advancing"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Deliberately LAST_PUBLISH, not last_success. The unhealed path exits 0 by design, so a
      # stalled healer would advance a success stamp hourly while the dataset froze -- the exact
      # green silence this timer's failure mode produces. last_publish moves only when a day is
      # actually written. A day becomes eligible ~26h after it ends, so publishing is ~daily;
      # 48h means two consecutive days produced nothing.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_tapebars_last_publish_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}
    noDataState: OK
    execErrState: Alerting
    for: 1h
    annotations:
      summary: >-
        tape-bars has published no new day for over 48 hours. The sweep may still be exiting 0 --
        an incomplete trade tape defers a day without failing -- so check the trade backfill and the
        archive before the materializer itself.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-tapebars-not-advancing
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "402"
      unit: "seconds since the last published day"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-panel-exit-nonzero
    title: "Ops · panel non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Warning, not critical: the panel is DERIVED data, recomputable from the mirror on the next
      # healthy run -- a failed materialize costs freshness, not truth.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_panel_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last hourly panel materialize recorded a non-zero exit code -- the L2 panel is going stale (derived data; recomputable once the cause is fixed)."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "401"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-load-high
    title: "Ops · node load high"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Scoped to host="ops": infra/ansible/roles/ops/files/config.alloy sets
      # `external_labels = { host = "ops" }` on prometheus.remote_write, so every metrics series
      # this Alloy ships carries host="ops" -- that's what makes this selector resolve. The NAS's
      # own node_load1 now carries `host="nas"` too (infra/nas/config.alloy, spec 00069 D7), so
      # `NAS · load high` above scopes itself with `{host="nas"}` (see that rule's own comment) --
      # the two rules partition the metric between the two hosts.
      #
      # Threshold: the ops box has 24 threads (infra/ansible/roles/ops/defaults/main.yml), so the NAS
      # rule's `gt 4` (100% of its 4 cores) would not mean the same thing here. `gt 20` is ~83% of 24
      # threads rather than 100%: ops runs several concurrent services (Alloy, the four timers, and
      # soon the overlay writer) whose transient overlaps are normal, so full-saturation would be
      # noisier than the NAS's single-purpose box; 20 keeps the same "sustained saturation, not a
      # transient burst" intent with headroom for that cross-service scheduling noise.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: node_load1{host="ops"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [20]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "1-minute load average on the ops node exceeds 20 of its 24 threads -- sustained saturation, not a transient burst."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "201"
      unit: "as a 1-minute load average"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-error-logs
    title: "Ops · ERROR logs"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Same shape as `NAS · archive-pull ERROR logs` above (level LABEL, not a text grep -- the
      # parse stages strip the level out of the message line, so a grep would be silently blind;
      # `queryType: instant` for the same Loki-specific reason). It covers every container that ships
      # from the ops node -- the four zcrypto-* units, Alloy's own logs, and the liquidations poller,
      # a long-lived daemon whose errors flip NO exit-code metric, so this rule is its ONLY error
      # channel.
      #
      # The container selector is ENUMERATED, not host-wide, and the enumeration was measured rather
      # than guessed (`sum by (container) (count_over_time({host="ops"}[7d]))`): alloy, liquidations,
      # zcrypto-archive-pull, zcrypto-panel-materialize, zcrypto-verified-replay, zcrypto-verify-replay.
      # `zcrypto-.*` rather than the four unit names so a fifth unit is watched the day its journal
      # keep-regex admits it. The bound matters twice: a host-wide selector cannot say WHICH service
      # errored, and under a storm it is a distinct-line cardinality hazard in Loki query cost as well
      # as in Slack message length. The cost is stated: a container outside this list ships errors
      # nothing watches -- but nothing ships from this host without an Alloy or compose change, and
      # that change is where the list is extended. A 30d read shows several dead container labels
      # (`alloy-alloy`, `zcrypto-ops-liquidations`, docker's random names) from the retired
      # docker-socket path; none has produced a line in 7d and the enumeration deliberately omits them.
      #
      # The `msg` label hoists the log MESSAGE onto the page, which is the whole reason a log alert
      # exists -- without it the page says "7" and the responder goes hunting. `printf "%.200s"`
      # bounds one message and `topk(5, ...)` bounds how many; topk is NOT optional, since without it
      # a log storm mints one alert instance per distinct line and blows past Slack's length limit.
      #
      # Two stages stand between the line and the label, and both are load-bearing:
      #
      #   `| json message="message"` -- NOT a bare `__line__`. This selector spans both line shapes on
      #   this host: the liquidations poller direct-ships a JSON BODY (cli/logging/ship.py's
      #   JsonLineFormatter: ts/level/logger/file/line/message), while the journal units arrive already
      #   flattened by Alloy's parse stage. Reading `__line__` raw spends ~150 of the 200 characters on
      #   the JSON preamble and truncates the message mid-sentence -- a page that LOOKS like it answered
      #   the question. Measured, not theorised. The `{{ if .message }}` fallback keeps the raw line for
      #   the already-flat streams, so one expression serves both shapes.
      #
      #   `| drop __error__, __error_details__` -- required, and do not simplify it away. `| json` stamps
      #   `__error__="JSONParserErr"` on every non-JSON line, and the query then fails with HTTP 400 the
      #   moment one journal-unit line enters the pipeline; the whole rule goes to execErrState. Clearing
      #   the label instead is impossible -- Loki rejects `label_format __error__=...` with "__error__
      #   cannot be formatted" -- and `| __error__=""` would DROP the journal units rather than admit
      #   them. `drop` is the only stage that keeps both shapes. All three behaviours confirmed against
      #   live Loki before this shipped.
      #
      # The `level` label reaches this rule via TWO independent paths (00068 T6/T7/T8 review): the
      # four zcrypto-* units and Alloy's own logs get it from config.alloy's parse stages at ingest;
      # the liquidations poller now direct-ships (spec 00068 D3/T6) and stamps `level` itself at the
      # source (cli/logging/ship.py: `level` = `record.levelname`, always present) -- Alloy is not in
      # that path at all. T0060: before this branch's fix both config.alloy stages' selectors were
      # the NAS's container names, so the label was absent on every ops stream and this rule could
      # never have fired -- which is why it lands together with that fix. NoData is normal here
      # (quiet logs = healthy; liveness is owned by the dead-men below), and `or on() vector(0)`
      # keeps a clean window an explicit 0 anyway.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            topk(5, sum by (host, container, level, msg) (count_over_time({host="ops", container=~"alloy|liquidations|zcrypto-.*", level=~"ERROR|CRITICAL"} | json message="message" | drop __error__, __error_details__ | label_format msg=`{{ if .message }}{{ printf "%.200s" .message }}{{ else }}{{ printf "%.200s" __line__ }}{{ end }}` [15m]))) or on() vector(0)
          queryType: instant
          refId: A
      # Reduce A to a single value before the threshold -- same belt-and-braces A -> B(reduce) ->
      # C(threshold) chain as the NAS rule.
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "{{ if $labels.container }}ERROR/CRITICAL log lines from `{{ $labels.container }}` on the ops node in the last 15 minutes.{{ else }}ERROR/CRITICAL log lines from a container on the ops node in the last 15 minutes.{{ end }} One alert instance per distinct line, and at most 5 of them -- a storm may carry more lines than are shown here. For the liquidations poller this is the only error signal -- its failures flip no exit-code metric."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "102"
      unit: "ERROR or CRITICAL log lines in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-log-pipeline-dead
    title: "Ops · log pipeline dead (no parsed lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The canary that closes the ERROR-logs rule's green-when-blind gap for the Alloy-fed half of
      # its scope (Alloy's own logs + the four zcrypto-* units). Scoped to `container="alloy"`
      # (review finding, 00068 T6/T7/T8 review Critical 2) -- NOT host-wide any more: the liquidations
      # poller now direct-ships (spec 00068 D3/T6) with its OWN `level` stamped at the source
      # (cli/logging/ship.py), completely bypassing Alloy, so its ~5-min heartbeat alone would have
      # kept a host-wide query green forever even if Alloy/loki.write died outright -- a dead-man
      # pinned green is strictly worse than NoData, because NoData is visible. Alloy's own logfmt
      # stream (config.alloy's `{container="alloy"}` parse stage) is continuous while Alloy lives, is
      # Alloy-produced end to end, and cannot be faked by anything the poller does -- so THIS rule
      # fires on the absence of ANY parsed Alloy-stream line in 6h, which means Alloy itself (or its
      # own parse/ship path) is dead. Deliberately NOT `container=~"zcrypto-.*"` either: on a
      # fail-closed skip-gate streak (archive-pull.sh.j2) the unit emits only unleveled echoes, so a
      # level-filtered 6h query on the units alone would false-fire during a legitimate long skip
      # streak -- `zcrypto-ops-unit-parse-dead` below covers that stream instead, at a wider 26h
      # window sized to tolerate it. This rule is structurally blind to a journal-transport-only
      # death (Alloy alive, journal reader wedged); `zcrypto-ops-journal-transport-dead` below owns
      # that failure mode, and `zcrypto-ops-poller-log-dead` below owns the poller's own direct-ship
      # path, which this rule can no longer see at all now that it is Alloy-scoped.
      # `or on() vector(0)` keeps the query returning data while it is intact; execErrState
      # Alerting still covers "Loki unreachable".
      #
      # `by (host)` is for the notification's label line and is INERT at fire time -- the fire path is
      # the unlabelled `or on() vector(0)` arm -- so the summary names host and container literally.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="ops", container="alloy", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK (review finding): this is a fires-on-silence dead-man of critical severity,
    # the same class as zcrypto-nas-archive-pull-stalled above ("NoData here means the log pipeline
    # itself died -- that IS the alarm"). While the `or on() vector(0)` fallback is intact the query
    # always returns data, so Alerting never fires falsely; it is the belt-and-braces layer for the
    # day a future edit drops the fallback, or a Grafana/Loki edge maps an empty response to NoData
    # -- with OK the canary would park green in exactly the blind state it exists to page on.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED Alloy log line (any level label) from the ops node in 6h -- Alloy is quiet but never silent while alive, so this means Alloy itself is dead, its parse stage has regressed to level=-, or it cannot reach Loki. The margin here is thin and deliberately so: a healthy 6h window measured 7 to 9 lines over 14 days, roughly 1.5 an hour, so read a low count on this stream as a signal to look rather than as headroom. Scoped to Alloy only: the liquidations poller direct-ships and is watched separately (`Ops · poller log pipeline dead`), and the four zcrypto-* units' own level-parse health is watched separately too (`Ops · unit log parse dead`)."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-poller-log-dead
    title: "Ops · poller log pipeline dead (no lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The liquidations poller is now the ONLY ops workload that bypasses Alloy entirely
      # (direct-ship, spec 00068 D3/T6) -- nothing watched its own shipping path in isolation until
      # this rule (review finding, 00068 T6/T7/T8 review Critical 2): `zcrypto-ops-log-pipeline-dead`
      # above is now scoped to Alloy only and structurally cannot see this container at all. Mirrors
      # the capture hosts' own per-container canaries (`zcrypto-capture-log-dead-primary/secondary`):
      # `level` comes from the poller's OWN direct-ship handler (cli/logging/ship.py: `level` =
      # `record.levelname`, always present, no regex, Alloy not involved), so <1 line in 6h means the
      # poller's ship path is dead (the --ship-logs flag lost at render time, its Loki credentials
      # dead, or the container gone) -- not a quiet host, since the poller runs continuously on a
      # ~5-min cycle. `or on() vector(0)` keeps the query returning data while intact.
      #
      # `by (host)` is for the notification's label line and is INERT at fire time -- the fire path is
      # the unlabelled `or on() vector(0)` arm -- so the summary names host and container literally.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="ops", container="liquidations", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK: same fires-on-silence dead-man reasoning as the rules around it -- the
    # vector(0) fallback means this never evaluates NoData while intact, and if that ever breaks,
    # silence stays the alarm rather than parking green.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED log line from the liquidations poller (container=liquidations) on the ops node in 6h -- it direct-ships and runs continuously on a ~5-min cycle, so silence means its ship path is dead (the --ship-logs flag, its Loki credentials, or the container itself), not a quiet host."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-unit-parse-dead
    title: "Ops · unit log parse dead (no leveled lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Restores the T0060 coverage `zcrypto-ops-log-pipeline-dead` used to carry for the four
      # zcrypto-* units before this rework scoped that rule to Alloy only (review finding, 00068
      # T6/T7/T8 review Critical 2) -- without this, a parse regression on config.alloy's zcrypto
      # stage (the stage.regex line-shape, the container selector, the label scheme) would go
      # completely undetected: Alloy itself stays alive and its OWN logfmt stream (watched by
      # `zcrypto-ops-log-pipeline-dead` above) keeps flowing, so that canary would never notice, and
      # `Ops · ERROR logs` would read 0 = healthy forever for the unit streams specifically.
      # Deliberately level-filtered AND a wide 26h window (matching `zcrypto-ops-journal-transport-
      # dead`'s own window below, for the same reason): during a fail-closed skip-gate streak
      # archive-pull emits only unleveled echoes, but panel-materialize (hourly) and verify-replay/
      # verified-replay (daily) run on independent schedules unaffected by that gate, so at least one
      # of the four units produces a leveled line well within 26h even through an extended streak --
      # a 6h window on this same selector would false-fire and was rejected for that reason.
      #
      # `by (host, container)` -- container is a REGEX here, so it is real information on the label
      # line rather than something the rule already knows. It does not change when this rule fires:
      # `count_over_time` yields no series at all for a silent container (never a zero), so one live
      # unit still leaves every series >= 1 and the `lt 1` false, exactly as the bare `sum()` did.
      # And it is INERT at fire time for the same reason as its siblings -- all four units going
      # quiet empties the left arm and the unlabelled `or on() vector(0)` is what crosses the
      # threshold -- so the summary names host and containers literally.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 93600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host, container) (count_over_time({host="ops", container=~"zcrypto-.*", level=~".+"} [26h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK: same fires-on-silence dead-man reasoning as the rules around it.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one LEVEL-PARSED line from any of the four zcrypto-* ops units in 26h -- the four run on independent schedules (half-hourly/hourly/daily) so at least one always produces a leveled line inside that window while Alloy's zcrypto parse stage is intact; silence means that stage regressed (the line-shape regex, the container selector, or the label scheme) even though Alloy itself and its own logs (watched by `Ops · log pipeline dead`) stay healthy."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-journal-transport-dead
    title: "Ops · journal transport dead (no unit lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The journal-scoped companion to the canary above. `zcrypto-ops-log-pipeline-dead` is scoped to
      # `container="alloy"` (00068 T6/T7/T8 review) -- it proves Alloy's OWN journald-driver stream
      # is flowing, not that the SEPARATE journal-reader path carrying the four zcrypto-* units is
      # intact, so it cannot see a journal-transport-only death either -- and loki.source.journal is
      # the SOLE carrier of those units' logs, including the reconcile skip-gate warning this
      # pipeline exists to ship. The unit failure modes it covers are all silent everywhere else: a
      # rebuilt host where /var/log/journal does not exist (docker CREATES an empty dir for the bind
      # mount, so Alloy starts fine and tails an empty journal forever), journald flipping to volatile
      # storage (/run/log/journal, outside the mount), systemd-journal gid drift after an OS
      # reinstall, or the keep regex going stale after a unit rename. The units' exit-code and
      # staleness metrics don't cover log SHIPPING, so no other rule fires for any of these.
      #
      # Scoping: `container="zcrypto-archive-pull"` can ONLY come from the journal path -- not
      # because a docker-discovery drop rule filters it out (there is no docker path left at all,
      # discovery.docker retired fleet-wide, 00068 D6/D8), but because these four units run their
      # work as an ephemeral `docker run --rm` ATTACHED to the unit (T0060, config.alloy) -- their
      # stdout is journal-stamped as part of the unit's own log stream, never a separately
      # discoverable container. So 26h of silence from this stream isolates the journal transport
      # specifically. Count ANY line, NOT level-parsed: the hourly archive-pull unit writes at
      # least one line in every code path
      # (reconcile CLI INFO on the happy path, the skip-gate/failure echoes otherwise), but its own
      # echoes carry no level label, so a level-filtered query would false-fire during a
      # pull-failure streak. 26h = a full day of hourly runs plus headroom.
      #
      # `by (host)` is for the notification's label line and is INERT at fire time -- the fire path is
      # the unlabelled `or on() vector(0)` arm -- so the summary names host and container literally.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 93600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="ops", container="zcrypto-archive-pull"} [26h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting for the same dead-man reason as the canary above: the vector(0) fallback means this
    # never evaluates NoData while intact, and if that ever breaks, silence stays the alarm.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one journal-path log line from zcrypto-archive-pull on the ops node in 26h -- the hourly unit writes at least one line every run, so the journal transport (loki.source.journal) is dead: empty/volatile host journal, gid drift, or a stale keep regex. The four systemd units' logs -- including the reconcile skip-gate warning -- are invisible until this is fixed."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  # ---- Capture hosts (zcrypto = primary + engine, zcrypto-red = secondary) --------------------
  # First alert rules for the capture VPSes. They ship host metrics + container logs via Alloy only
  # since iter-105 (spec 00057 D5); before that no rule selected host="zcrypto"/"zcrypto-red", so the
  # unbackfillable L2 spool's disk-free and the capture daemon's ERROR logs were unwatched in Grafana.
  # The three CONTENT rules (disk/load/error) carry host=~"zcrypto|zcrypto-red" (external_labels
  # host=<hostname>, roles/capture/files/config.alloy) and fire per host. They are noDataState: OK,
  # deliberately UNLIKE the NAS host-resource rules' Alerting -- and stay OK permanently, because
  # "this host's telemetry went dark" is owned by the two per-host log-dead CANARIES below
  # (noDataState: Alerting), not by making each content rule page on NoData (which would false-page on
  # a transient Alloy remote_write gap, like the ops-node DNS incident). Division of labor: the content
  # rules own "bad while alive"; the canaries own "this host's capture log plane is dark" -- a
  # parse-chain regression on a live daemon (the T0060 class, which silently blinds the ERROR rule) OR
  # that host's Alloy dying; the healthchecks.io dead-man (withheld-ping, T0032; independent domain)
  # owns "the daemon itself died / the disk actually filled". The canaries are PER-HOST (not one
  # collective) because a SINGLE host's Alloy death is otherwise invisible to everything: the content
  # rules go NoData->OK and the daemon keeps pinging the dead-man.
  - uid: zcrypto-capture-disk-low
    title: "Capture · spool disk low"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The unbackfillable L2 spool (/var/lib/zcrypto-capture) is on the root fs -- mountpoint="/"
      # resolves live for both hosts (verified 2026-07-19; free ratio 0.70 primary / 0.79 secondary).
      # 10% free is ~8 GB / ~16 days of runway at the measured 0.48 GB/day -- a wide EARLY warning that
      # fires long before the daemon's own 1 GiB DiskWatermark (whose breach withholds the dead-man
      # ping, T0032) and the ~14-day prune ring (spec 00050 D8). Firing here means the ring broke or an
      # unexpected consumer appeared.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_filesystem_avail_bytes{host=~"zcrypto|zcrypto-red", mountpoint="/"}
            / node_filesystem_size_bytes{host=~"zcrypto|zcrypto-red", mountpoint="/"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.1]}  # < 10% free
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "A capture host's root filesystem (the unbackfillable L2 spool, /var/lib/zcrypto-capture) is below 10% free. Early warning -- the daemon's 1 GiB watermark + healthchecks dead-man are the last line. Check both prune timers (zcrypto-capture-prune for the spool, zcrypto-engine-journal-prune for the engine journal) and for an unexpected disk consumer."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "301"
      unit: "of the spool filesystem still free (a fraction, not a percent)"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-reboot-pending
    title: "Capture · reboot pending (attended)"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The capture VPSes run unattended-upgrades with Automatic-Reboot "false" (T0027, spec 00071):
      # patches install, the reboot is a human act. That closes the risk of an unwatched reboot of
      # unbackfillable L2 capture -- and, on the primary, the live trade engine -- and opens the
      # opposite one: a kernel flag nobody notices. THIS rule is the whole reason the flip is safe.
      # It keeps firing until the human reboots; that persistence is the point, not a nuisance.
      # Published by the zcrypto-reboot-check timer as an explicit 0/1 -- never an absent series,
      # which would be indistinguishable from a dead exporter.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'node_reboot_required{host=~"zcrypto|zcrypto-red"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}  # == 1, pending
    noDataState: OK
    execErrState: Alerting
    # 15m: long enough that one failed publish does not page, short enough that a real pending
    # reboot surfaces the same hour. The collector re-serves the file on every scrape, so there is
    # no gap between 15-minute publishes to ride out.
    for: 15m
    annotations:
      summary: "A capture host has a pending reboot (/run/reboot-required) and will NOT reboot itself -- these hosts are attended. Schedule it: secondary first, verify it boots and captures, then the primary; off any 4h engine-cycle boundary, in the traffic trough, hosts >= 1h apart. Expect a ~83s capture gap; containers self-restart. Guidance in .claude/rules/capture-deploys.md."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "503"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-textfile-missing
    title: "Capture · a one-off timer stopped publishing entirely"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The gap that hid a real defect: a STALENESS rule cannot fire on a series that never exists.
      # If a timer is disabled, its script fails every run, or its .prom is unreadable, the metric is
      # simply ABSENT -- and with noDataState: OK that reads green forever. count() over the expected
      # publishers turns absence into a value, which is the only shape that alerts on nothing.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'count(node_reboot_required{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [2]}  # both capture hosts must publish
    noDataState: OK
    execErrState: Alerting
    for: 20m
    annotations:
      summary: "A capture host has stopped publishing node_reboot_required entirely -- not stale, ABSENT. The attended-reboot safety net is down on at least one host: a pending kernel reboot would now go unseen. Check `systemctl status zcrypto-reboot-check.timer` on both hosts, then that the .prom exists in /var/lib/zcrypto-node-textfile and is mode 0644 (Alloy reads it as a non-root user)."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "503"
      unit: "of the two capture machines still publishing the probe"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-textfile-unreadable
    title: "Capture · node-exporter textfile unreadable or malformed"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Raised when the collector cannot parse OR cannot OPEN a .prom. The open case is not
      # theoretical: mktemp creates 0600 and `mv` preserves it, so a publisher missing an explicit
      # chmod publishes root-only and the non-root collector gets EACCES -- metrics silently gone.
      # This series was admitted to the keep-list before any rule watched it; this is that rule.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'max by (host) (node_textfile_scrape_error{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "Alloy's textfile collector cannot read or parse a .prom on a capture host, so that timer's metrics are absent while everything else looks healthy. Most likely the file is mode 0600 (mktemp's default -- the publisher needs an explicit chmod 0644) or was written malformed. Check /var/lib/zcrypto-node-textfile on that host."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "502"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reboot-probe-stale
    title: "Capture · reboot probe is stale"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The reboot probe republishes every 15 min, so it gets its OWN threshold: sharing the daily
      # prune's 26h window would let the attended-reboot safety net sit dead for a day while
      # node_reboot_required served a frozen 0. 1h is ~4 missed runs.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - max by (host) (node_textfile_mtime_seconds{host=~"zcrypto|zcrypto-red", file=~".*/reboot.prom"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [3600]}  # 1 h ~= 4 missed runs
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The pending-reboot probe on a capture host has not refreshed in over an hour (it runs every 15 min), so node_reboot_required is a frozen last-known value, not current state. A kernel reboot could be pending and unreported. Check `systemctl list-timers zcrypto-reboot-check.timer` on that host."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "501"
      unit: "seconds since the reboot probe last wrote its file"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-oneoff-textfile-stale
    title: "Capture · daily one-off timer stopped publishing"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Staleness for the DAILY publishers only -- the journal prune (01:23 UTC). 26h = one missed
      # run plus margin. A stale .prom is NOT a scrape_error: the collector keeps serving the last
      # values forever, so without this the gauge reads healthy indefinitely.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - max by (host) (node_textfile_mtime_seconds{host=~"zcrypto|zcrypto-red", file=~".*/engine-journal-prune.prom"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [93600]}  # 26 h
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "The engine journal prune has not refreshed its .prom in over 26h -- its last run is more than a day old, so the retention it reports is a frozen value. Check `systemctl list-timers zcrypto-engine-journal-prune.timer` and the unit's journal on the primary."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "501"
      unit: "seconds since the daily timer last wrote its file"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-book-desync-stuck
    title: "Capture · book desync stuck on a pair"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Recovery from a checksum desync is a SINGLE fire-and-forget resubscribe, fired only on the
      # not-was_desynced TRANSITION (deliberately -- retrying in a loop trips Kraken's rate limit).
      # So if that one attempt does not take, `desynced` stays True, the transition guard never
      # re-fires, and the pair is stuck. min_over_time, not max: a desync that HEALED within the
      # window has a 0 in it, so only a pair desynced for the whole 15 min fires -- the stuck shape,
      # not the transient one the daemon handles by itself 234/234 times.
      #
      # This is not one pair's problem. `gap_monitor.is_healthy()` is False while ANY pair has an
      # open gap and the healthcheck ping is gated on it, so one stuck pair silences this host's
      # dead-man for ALL 12 -- the hc.io watchdog then fires and STAYS fired, and any later, worse
      # fault on the same host produces no new page while that signal is saturated. This rule is
      # what names the pair; the dead-man only says the host went quiet.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min_over_time(zcrypto_capture_book_desynced{host=~"zcrypto|zcrypto-red"}[15m])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "A capture pair's order book has been desynced for 15 min straight (paged after 20 min: a 15m window plus a 5m hold) -- its single fire-and-forget resubscribe did not take, and the transition guard will not retry. That pair's L2 is not being captured, AND it silences this host's dead-man for all 12 pairs (is_healthy gates the ping), so hc.io is now saturated and will not page for anything else on this host. Fix: `docker restart zcrypto-capture` on the named host. The `pair` label names the stuck pair."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "101"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-resubscribe-rate
    title: "Capture · book resubscribe rate re-elevating"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The second half of T0008's trigger, self-evaluating. The ~200/day desync rate was OUR bug
      # (an unpruned book resurfacing phantom levels, fixed 2026-07-13: replaying a real hour went
      # 482/117/398 CRC failures to ZERO with the depth prune), so any post-fix resubscribe is a
      # genuine venue/network event and should be rare. More than one in a day means either the rate
      # is re-elevating or a pair is flapping desync/heal -- neither is visible in the stuck-pair
      # rule above, which only sees a pair that never recovers. (At a 60 s scrape a fast flapper is
      # invisible to both as a heal; this rule catches it through the counter, not the gauge.)
      #
      # NOTE: this counter carries no `pair` label (one series per host), so it says THAT the rate
      # rose, not which pair. Cross-reference zcrypto_capture_book_desynced to find it.
      # `increase()` handles the counter reset on container recreate.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_capture_resubscribes_total{host=~"zcrypto|zcrypto-red"}[1d])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # NOT [1]: increase() extrapolates to the window edges, so a SINGLE increment
            # returns ~1.0007 for any nonzero sample offset -- `> 1` would page on one genuine
            # self-healed venue desync, asserting a re-elevating rate that is not happening, and
            # stay firing for a day. 1.5 is silent at one and fires at two.
            - evaluator: {type: gt, params: [1.5]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "A capture host has resubscribed a book more than once in 24h. Post-2026-07-13 these should be rare genuine venue events, so a re-elevating rate suggests a regression or a pair flapping desync/heal. This counter has no pair label -- check zcrypto_capture_book_desynced by pair on that host to find which."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "103"
      unit: "resubscribes in the last day"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-resubscribe-failing
    title: "Capture · book resubscribe is failing (recovery degraded)"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The recovery ladder's resubscribe leg has an alert for how OFTEN it runs (above) and, until
      # now, none for whether it WORKS. Both counters mean the ladder is degraded, differently:
      # a rejected frame (the venue answered subscribe/unsubscribe error, correlated by req_id) means
      # the desync recovery did not happen at all and the book stays stale; a missing unsubscribe ack
      # means the subscribe was sent blind into the race the ack exists to close, so the resubscribe
      # may be silently rejected downstream. Summed because the response is the same -- read the
      # capture log for which, the lines carry the pair.
      #
      # A rejection also logs at ERROR and so already reaches the capture ERROR-log rule; this exists
      # because the ack TIMEOUT logs at WARNING and reaches nothing, and because a rate is what
      # distinguishes one venue hiccup from a recovery path that has stopped working.
      # `increase()` handles the counter reset on container recreate.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'sum(increase(zcrypto_capture_resubscribe_errors_total{host=~"zcrypto|zcrypto-red"}[1d]) + increase(zcrypto_capture_resubscribe_ack_timeouts_total{host=~"zcrypto|zcrypto-red"}[1d]))'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 1.5, not 1: increase() extrapolates a single increment to ~1.0007, so `> 1` would page
            # on one transient rejection -- the same arithmetic recorded on the resubscribe-rate rule.
            - evaluator: {type: gt, params: [1.5]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "A capture host's book resubscribe is failing: the venue rejected the frames, or the unsubscribe acks are not arriving. The desync recovery ladder depends on this leg -- while it fails, a desynced book cannot heal and the pair keeps writing from a stale state. Check the capture log for the pair and the venue reply."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "103"
      unit: "failed resubscribes -- errors plus ack timeouts -- in the last day"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-all-streams-silent
    title: "Capture · every book stream on a host is silent"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The blackout class, and it is measured rather than imagined: on 2026-07-27 all 12 pairs went
      # silent for ~209 s on BOTH hosts while the WS reported connected, the keepalive completed >=11
      # round trips, and the cumulative gap counter read 0.0 -- so the dead-man, the desync rule and
      # the gap counter all sat green through a total blackout.
      #
      # The MINIMUM across pairs is the discriminator, and that is the whole design: one thin leg
      # being quiet is normal at any hour, all twelve simultaneously is not, and no natural cause
      # produces it -- so the bar can be tight here where a per-pair bar cannot be. The gauge reads
      # 0 for every pair at process start, so a restart cannot false-fire it either.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min by (host) (zcrypto_capture_seconds_since_last_book_message{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 120 s, WIDENED from 60 on 2026-08-05 against measurement. The pending period is NOT
            # free here: the gauge is scraped every 60 s
            # (infra/ansible/roles/capture/files/config.alloy), so it advances one sample per minute
            # and the real silence at firing time is the bar + up to 60 s of scrape granularity +
            # the pending period + the group's eval interval. That is why `for` is 0s below.
            # Why 120 and not 60: `max_over_time(min by (host) (...)[30d:1m])` measured a fleet-wide
            # silence of 30.261266 s on the primary -- all twelve pairs quiet at once.
            # THE BASE IS ONE WEEK, NOT A MONTH, and the `[30d]` selector hides it: this gauge only
            # started reaching Cloud with the 2026-07-29 converges, so
            # `count_over_time(zcrypto_capture_seconds_since_last_book_message[30d])` returns 10435
            # (primary) / 10838 (secondary) samples at 60 s each = 7.2 d / 7.5 d. So 120 is 4x the
            # worst event in the series' whole LIFE so far -- materially thinner than 4x a month's
            # worst, which is why re-derivation on a genuinely full window is registered as T0129.
            # NOT a converge artefact, and better localized than "hours after": a 6 h bisection puts
            # the event inside 2026-07-29 19:14-01:14 UTC, >=11.6 h after the primary's 07:36:13Z
            # converge, with the adjacent 6 h windows maxing 0.12 / 0.20 / 0.14 s. Cause
            # unexplained, which is the point: an unexplained 30 s event cannot be bounded, so 60
            # left only a 2x margin on the fleet's highest-severity capture signal. 120 is 4x it and
            # the 209 s motivating event is still caught -- but the slack is ~29 s, not the 89 s a
            # bar-only subtraction suggests: with a 60 s scrape the guaranteed detection floor is
            # ~180 s of silence, not 120. Every other day of the series' life maxed between 0.18 s
            # and 10.4 s on the primary.
            - evaluator: {type: gt, params: [120]}
    # OK: absence is owned by the dead-man and by `Fleet · Alloy dark`, matching every sibling
    # capture rule here.
    noDataState: OK
    execErrState: Alerting
    # 0s, and it is arithmetic rather than impatience. `for: 2m` shipped first and put the GUARANTEED
    # detection floor at 300 s against a 209 s motivating event: a phase sweep over scrape x eval
    # alignments caught that event in only 12.1% of them, and a 180 s blackout in 0%. `for: 1m` is not
    # the fix either -- it still misses 209 s in 12.9% of alignments. Nothing but real silence can put
    # this minimum over 120: `_run` seeds last_seen for every pair before the collector registers, so a
    # restart reads 0.0; a stop->start window replays the last healthy pre-stop sample through
    # Prometheus' lookback; a longer stop goes NoData, which `noDataState: OK` swallows; and
    # remote-write lag can only delay firing, never advance it. `zcrypto-capture-log-dead-primary`
    # already carries 0s for the same reason.
    for: 0s
    annotations:
      summary: >-
        EVERY book stream on this capture host has been silent for minutes — not one message on
        any pair, so this is the whole feed rather than one quiet leg. The last time this happened the
        socket still reported connected, the keepalive kept completing round trips, and the cumulative
        gap counter stayed at 0.0, so nothing else saw it. L2 is unbackfillable and every second here is
        permanent loss: check the capture container on the named host and restart the daemon if the
        streams do not resume on their own.
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "102"
      unit: "seconds since ANY book stream on that machine last delivered"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-stream-silent
    title: "Capture · a book stream has stopped delivering"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The single-stuck-stream class, which nothing else catches: one pair has stopped delivering
      # while every other stream keeps flowing, so the dead-man pings, the all-streams rule above
      # reads its minimum off a healthy pair, and the desync rule sees no checksum failure. Nor does
      # the daemon heal it -- recovery is desync-driven only, so a stream that is silent while still
      # in sync stays silent (the evaluator's comment below reads both loops).
      #
      # Deliberately NOT aggregated: Grafana raises one instance per (host, pair) with both labels
      # intact, which is what lets the page name the stream. That is also why this rule can raise many
      # instances at once during a wide event -- the all-streams rule above is the one that says
      # "everything", this one says "which".
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'zcrypto_capture_seconds_since_last_book_message{host=~"zcrypto|zcrypto-red"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # DERIVED 2026-08-05, replacing a provisional 900. Measured
            # `max_over_time(zcrypto_capture_seconds_since_last_book_message[30d])` per pair per
            # host -- and THE BASE IS ONE WEEK, NOT A MONTH, which the `[30d]` selector hides: this
            # gauge only started reaching Cloud with the 2026-07-29 converges, so
            # `count_over_time(...[30d])` returns 10435 (primary) / 10838 (secondary) samples at
            # 60 s each = 7.2 d / 7.5 d. The window is the series' whole life, and re-derivation on
            # a genuinely full 30 d is registered as T0129.
            # All twelve primary maxima (30.26-31.59 s) are ONE simultaneous fleet-wide event, not
            # per-pair spacing, and the proof is exact rather than inferred: the min-by-host maximum
            # is 30.261266, which equals AVAX/EUR's per-pair maximum to the digit, so at that
            # instant every pair was silent. Excluding it, the BINDING natural per-pair maximum is
            # the primary's 12.068981 s (AVAX/EUR) -- above the secondary's worst of 11.125801 s
            # (ETH/BTC), and matching the 12.196 s worst NATURAL spacing the daemon's own
            # BOOK_STALENESS_SECONDS comment records. 300 is ~25x that natural maximum and ~10x the
            # daemon's own 30 s mark. It deliberately SUPERSEDES the ~2.4x margin the design
            # prescribed, which would have put this page bar at ~29 s: at the daemon's own
            # gap-booking threshold, and BELOW the 30.26 s event above -- twelve false warning
            # instances on 07-29 alone.
            # What 30 s actually is, read from the source, because the bar's warrant depends on it:
            # `_staleness_loop` BOOKS the silence (`monitor.start_silence`) and does nothing else.
            # Recovery -- resubscribe, then a forced reconnect -- is `_desync_recovery_loop`, which
            # skips every pair whose book is not `desynced`, and `is_healthy()` deliberately ignores
            # silence. So a silent-but-SYNCED stream is never resubscribed, never reconnected, and
            # never withholds the dead-man ping, at any age: it does not self-heal, which is exactly
            # why this rule is the only thing that catches it.
            # NO pending period, deliberately: the gauge advances one sample per minute, so a `for`
            # spends the notice budget rather than buying confidence -- the same arithmetic that
            # took `for: 2m` off the all-streams rule. Notice period is `300 + up to 60 s of scrape
            # granularity + the group's eval interval`, ~5-7 min, so the summary's "over five
            # minutes" is its floor. Four surfaces carry this number and move together: this
            # evaluator, the `for`, the summary's duration, and the data-integrity board's per-pair
            # panel.
            - evaluator: {type: gt, params: [300]}
    # OK: absence is owned by the dead-man and by `Fleet · Alloy dark`, matching every sibling
    # capture rule here.
    noDataState: OK
    execErrState: Alerting
    for: 0s
    annotations:
      summary: >-
        One capture book stream has delivered nothing for over five minutes while its siblings keep
        flowing — the single-stuck-stream shape, which no other rule catches: the dead-man still pings,
        the desync rule sees no checksum failure, and a fleet-wide silence rule reads its minimum off a
        healthy pair. The `pair` label names the stuck stream. Check whether that pair's resubscribe went
        through; restarting the capture daemon re-establishes every stream.
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "102"
      unit: "seconds since that stream last delivered a book message"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-watermark-breached
    title: "Capture · disk watermark breached -- DISCARDING data"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The most consequential unwatched signal on these hosts, and it was unwatched for months.
      # A breached watermark does not merely warn: cli/capture/command.py's book and trade handlers
      # `continue`/`return` past the writers while it holds, so incoming L2 and trades are DROPPED.
      # That data is unbackfillable -- every second breached is permanent loss.
      #
      # It also gates the dead-man ping, so hc.io does fire -- but that page says "this host went
      # quiet", not "the disk hit the watermark and capture is discarding". Without this rule the
      # operator has no way to tell those apart, and the 1 GiB watermark sits BELOW the
      # `Capture - spool disk low` early warning (10% free), so that rule fires first only if the
      # fill is gradual; a sudden consumer can breach the watermark with disk-low still green.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'max by (host) (zcrypto_capture_disk_watermark_breached{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    # 0s, and it is arithmetic rather than impatience. The pending period is NOT free on this rule:
    # the daemon re-checks the watermark every 30 s in-process
    # (cli/capture/command.py's DISK_WATERMARK_INTERVAL_SECONDS) and Alloy scrapes the gauge every
    # 60 s (infra/ansible/roles/capture/files/config.alloy), so a true breach is already up to 90 s
    # old before its first `1` sample exists, before Grafana evaluates anything. `for: 2m` shipped
    # first and added >=2 further minutes of GUARANTEED discard to every real page, on a stream that
    # is unbackfillable -- and at one sample per minute the condition has to hold across enough
    # consecutive scrapes to fill that window, so the rule was also blind to any breach shorter than
    # roughly 3 min. A breach that clears first is not a non-event: it dropped every message it
    # lasted, and the only thing that would have spoken is the dead-man saying "this host went
    # quiet". Nothing false-fires at 0s: the collector publishes the gauge straight off
    # `watermark.breached`, so a `1` sample means the handlers are ALREADY dropping messages.
    for: 0s
    annotations:
      summary: "CAPTURE IS DISCARDING DATA on this host: the disk watermark is breached, so the book and trade handlers drop every incoming message instead of writing it, and L2 is unbackfillable. This also withholds the dead-man ping, so hc.io is saturated and will not page for anything else here. Free space on the capture spool NOW -- check both prune timers and for an unexpected consumer."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "108"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-rows-quarantined
    title: "Capture · rows quarantined to .held"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Rows that arrived after their hour was finalized and were spilled to a `.held` sidecar
      # rather than written in place. Measured baseline over 7 d: ZERO on both hosts, so any
      # nonzero value is a real event, not noise. Held rows are not lost, but they are not in the
      # canonical tree either -- the reconciler has to fold them, and nobody knows to look.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_capture_rows_quarantined_total{host=~"zcrypto|zcrypto-red"}[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "A capture host quarantined rows to .held in the last 6h -- rows arrived after their hour was finalized. Baseline is zero, so this is a real event: check for clock skew, a late-delivering stream, or a stalled writer on that host."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "105"
      unit: "rows quarantined in the last 6 hours"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-logship-lines-dropped
    title: "Logs · lines dropped before reaching Loki"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The log transport's own loss counter. Measured baseline over 7 d: ZERO on every host. A
      # nonzero value means log lines were discarded before Loki -- so the Loki-based rules
      # (capture-error-logs, log-dead-primary/secondary) are reasoning over an incomplete stream and
      # can go quiet for the wrong reason. This is the one fault that makes OTHER alerts unreliable.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_logship_dropped_lines_total[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "Log lines were dropped before reaching Loki in the last 6h. Baseline is zero. This matters beyond the lost lines: the Loki-based alert rules now reason over an incomplete stream, so their silence no longer means healthy. Check the shipper's backlog and the Loki push credentials on the named host."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "601"
      unit: "log lines dropped in the last 6 hours"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-venue-not-online
    title: "Capture · Kraken reports the venue is not online"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Deliberately a NEGATIVE match rather than an enumeration of known states: the payload shape
      # for a real outage is unobserved, and a rule listing `maintenance|cancel_only|...` would be a
      # guess that silently misses whatever Kraken actually sends. `!= "online"` cannot miss.
      # The daemon's counting path IS validated for unseen values -- tests/test_capture_upstream_silence.py
      # feeds synthetic `maintenance` and `cancel_only` frames and asserts a series per system value.
      #
      # PRESENCE, not increase(). The daemon emits a series only for `system` values it has actually
      # seen, so a non-online series is BORN at 1 -- and Prometheus inserts no implicit zero before a
      # series' first sample, so increase() over it returns nothing on one sample and 0 on N equal
      # samples. Kraken pushes `status` on connect and on state change, so a clean online->maintenance
      # transition is exactly ONE frame per host: an increase() form would sit green through the very
      # event this rule exists for. The sibling increase() rules work because their counters already
      # exist at 0 and only step; that idiom does not transfer to a label that materialises on the event.
      #
      # This LATCHES: the counter never decreases until the daemon restarts. That is deliberate -- the
      # point is to capture the first observation of a shape this fleet has never seen, and a
      # self-resolving rule can retire it before anyone reads the value.
      #
      # `by (host, system)`, not a bare sum(): collapsing `system` discarded the one label the
      # responder acts on -- `maintenance` (planned, wait) versus `cancel_only`/`post_only` (degraded,
      # act) demand opposite responses. Grouping preserves every property above: the negative match
      # still cannot miss an unobserved payload shape, presence-not-increase() is unchanged, and the
      # latch is unchanged. The host scope every sibling capture rule carries is added at the same time.
      #
      # The grouping is also why the fallback carries `on()`, and dropping it is the tempting edit:
      # `vector(0)` produces an UNLABELLED element, so a bare `or vector(0)` suppresses it only while
      # the left arm is unlabelled too. Once `by (host, system)` gives the left arm labels the two stop
      # sharing a signature, and the 0 rides through as a permanent extra series beside the real one
      # instead of being a mutually-exclusive fallback. `on()` matches on the empty label set, which
      # every element has, so the fallback is dropped whenever the left arm is non-empty and supplied
      # when it is empty -- keeping a clean fleet out of NoData, which is the only job it ever had.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'sum by (host, system) (zcrypto_capture_venue_status_total{host=~"zcrypto|zcrypto-red", system!="online"}) or on() vector(0)'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "{{ if $labels.system }}Kraken reported the trading venue is in state `{{ $labels.system }}` rather than `online`.{{ else }}This fired with no venue state attached, so treat the state as UNKNOWN rather than observed: either the query could not be evaluated, or a non-`online` state arrived without its label. Read the capture log's `venue status` line before acting on anything below.{{ end }} The state decides the response: `maintenance` is planned and you wait, `cancel_only`/`post_only` mean the venue is degraded and trading is restricted. Capture may be unaffected either way: a venue in maintenance can still stream book updates, and loss would show on the reconciler's counters, not this one. Do not restart or converge on this signal alone. Runbook: infra/runbooks/capture.md#zcrypto-capture-venue-not-online"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "108"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-venue-state-recurrence
    title: "Capture · Kraken reported a degraded venue state again"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The deliberate COMPLEMENT to zcrypto-capture-venue-not-online, which latches. That rule fires
      # on PRESENCE and never falls until the daemon restarts, so once a state has been seen its alert
      # instance sits in Alerting indefinitely -- and a SECOND occurrence of that same state merely
      # increments a counter whose instance is already firing, producing no new notification. On the
      # primary the latch has no scheduled clearing event at all: capture there is deliberately parked
      # on its digest, so a standing latch would mask every repeat for as long as that holds.
      #
      # increase() is exactly wrong as the PRIMARY form and exactly right as the SECOND one. The
      # sibling's comment explains why it cannot lead: a non-online series is BORN at 1 and Prometheus
      # inserts no implicit zero before a series' first sample, so increase() returns nothing on the
      # very transition that rule exists to catch. That argument does not transfer to a series ALREADY
      # sitting at a non-zero value -- a 1 -> 2 step is an ordinary counter increase and increase()
      # reports it. The two rules therefore partition the space: presence catches the first sighting
      # (including the first after any restart, since the counter is in-memory and resets with the
      # process), and this one catches every sighting thereafter. Neither alone covers both, which is
      # why this supplements rather than replaces -- swapping the sibling out for this form would lose
      # first-observation detection entirely.
      #
      # This one SELF-RESOLVES, the behavioural opposite of the latch, and that is the point: it
      # answers "is it happening again, right now?", so it must be able to say no. The [15m] window is
      # how long it stays up after the last sighting; `for: 5m` inside that leaves 10 minutes of margin
      # against the group's evaluation cadence. The window and `relativeTimeRange.from` must agree --
      # the sibling increase()/delta() rules carry a test pinning exactly that coupling, and so does
      # this one.
      #
      # `by (host, system)` and the `on()` fallback carry over from the sibling for the reasons
      # documented there: the responder acts on `system` (planned `maintenance` versus degraded
      # `cancel_only`/`post_only`), and `vector(0)` is unlabelled, so a bare `or` would ride through as
      # a permanent extra series beside the real one once the left arm carries labels.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'sum by (host, system) (increase(zcrypto_capture_venue_status_total{host=~"zcrypto|zcrypto-red", system!="online"}[15m])) or on() vector(0)'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "{{ if $labels.system }}Kraken reported the trading venue in state `{{ $labels.system }}` rather than `online` within the last 15 minutes -- a NEW sighting, not a standing latch.{{ else }}This fired with no venue state attached, so nothing was observed to recur: either the query could not be evaluated, or a non-`online` state arrived without its label. Read the capture log's `venue status` line before treating this as a recurrence at all.{{ end }} The sibling venue alert latches on the first sighting of each state and stays red until the capture daemon restarts, so it cannot tell you a degradation is recurring; this one clears itself once 15 minutes pass with no further sighting. The state decides the response: `maintenance` is planned and you wait, `cancel_only`/`post_only` mean the venue is degraded and trading is restricted. Capture may be unaffected either way: a venue in maintenance can still stream book updates, and loss would show on the reconciler's counters, not this one. Do not restart or converge on this signal alone. Runbook: infra/runbooks/capture.md#zcrypto-capture-venue-not-online"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "108"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-logship-worker-stalled
    title: "Logs · the shipping worker has stopped cycling"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Liveness, and deliberately NOT the ship-success gauge: the worker skips the push when the
      # buffer is empty, so last_success goes stale whenever logging is merely quiet -- which is
      # what a healthy capture daemon looks like. This gauge advances on an idle cycle too, and
      # stalls only while the worker is stuck RETRYING (5xx/429/network) or wedged. The worker
      # cycles every second; 5 min is ~300 missed cycles.
      #
      # What it deliberately does NOT catch: a permanently-rejected batch (non-429 4xx -- a revoked
      # token, a wrong path) still completes a cycle and still advances this gauge, so logs can be
      # discarded at full rate while this reads green. That fault belongs to
      # zcrypto-logship-lines-dropped, which counts exactly those discards. Two questions, two
      # rules -- conflating them is what left last_success unable to answer either.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_logship_last_cycle_timestamp_seconds'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [300]}
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The log-shipping worker on the named host has not completed a cycle for over 15 minutes -- either it is stuck retrying a push it cannot complete, or the worker thread is wedged, so logs are queueing and every Loki-based alert on this host is now silent for the wrong reason. Look for a Loki endpoint that is unreachable or erroring, not for rejected credentials: a rejected push still completes a cycle and would leave this rule green, showing up instead as dropped log lines."
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "602"
      unit: "seconds since the shipping worker last cycled"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-node-collector-failed
    title: "Node · a node-exporter collector is failing"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # 0 means that collector errored on its last scrape, so its whole metric family goes quietly
      # ABSENT -- and every rule keyed on those series then evaluates NoData, which this fleet maps
      # to OK. A failed `filesystem` collector silently disarms the disk-low rule; a failed
      # `textfile` collector silently disarms every one-off timer alert. Baseline: 1 on all five
      # hosts. This is the rule that keeps the other rules honest.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min by (host) (node_scrape_collector_success)'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "A node-exporter collector is failing on this host, so its entire metric family is absent -- and rules keyed on those series evaluate NoData, which this fleet maps to OK. Any alert depending on them is silently disarmed right now. Check Alloy's logs on the named host for the failing collector."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "402"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-load-high
    title: "Capture · node load high"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # NORMALIZED per core, because the two boxes differ: the primary has 2 vCPU, the secondary 1
      # (measured live). Dividing load1 by the host's core count (count of idle-mode
      # node_cpu_seconds_total series) makes one threshold mean the same on both. `on(host)
      # group_left()` matches the per-host core count onto load1's richer label set. Baseline is
      # ~0.02-0.11 per core; > 1.5 per core sustained 10m is clear saturation (a runaway/thrashing
      # process), not the seconds-long hourly NAS rsync-pull spike (`for: 10m` outlasts that).
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_load1{host=~"zcrypto|zcrypto-red"}
            / on(host) group_left()
            count by (host) (node_cpu_seconds_total{host=~"zcrypto|zcrypto-red", mode="idle"})
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [1.5]}  # > 1.5x per core, sustained
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "1-minute load average per core on a capture host exceeds 1.5x its cores, sustained 10m -- runaway/thrashing, not the transient hourly pull (the capture daemon is light, ~0.1/core baseline)."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "201"
      unit: "as a 1-minute load average per core"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-error-logs
    title: "Capture · daemon ERROR logs"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Loki, level LABEL not a text grep -- no regex anywhere in this path (D4). The capture daemon's
      # logs get their level label from its OWN direct-ship handler (cli/logging/ship.py, spec 00068
      # D3/D4: `level` = `record.levelname` at the source, pushed straight to Grafana Cloud Loki --
      # Alloy is not in this path at all any more) (verified live pre-rework: INFO/WARNING present,
      # ZERO ERROR/CRITICAL in 7d -- a clean baseline; the label VALUES are unchanged by the rework, so
      # this selector still holds). Scoped to container="capture": the daemon on both hosts, whose
      # errors (desync storms, ENOSPC, reconnect failures) are the soak-critical signal. (Out of scope
      # here: Alloy self-errors -- a separate instrument-health concern; and the engine's logs, which
      # ship with the same labels today and are owned by `zcrypto-engine-error-logs`.)
      # `sum by (host, ...)` names the firing host; `or on() vector(0)` keeps a clean window an
      # explicit 0. This rule fires on the COUNT arm only (the vector(0) fallback is 0, which fails
      # `gt 0`), so unlike the two dead-men below its labels are genuinely populated when it pages.
      #
      # The `msg` label hoists the log MESSAGE onto the page -- the whole reason a log alert exists;
      # without it the page says "3" and the responder goes hunting on the unbackfillable stream.
      # `printf "%.200s"` bounds one message and `topk(5, ...)` bounds how many; topk is NOT optional,
      # because a desync storm emits one distinct line per pair per event and without the bound each
      # mints its own alert instance and blows past Slack's length limit.
      #
      # `| json message="message"` and NOT a bare `__line__`: this daemon direct-ships a JSON BODY
      # (cli/logging/ship.py's JsonLineFormatter -- ts/level/logger/file/line/message), so the raw line
      # spends ~150 of the 200 characters on the JSON preamble and truncates the message mid-sentence.
      # A page carrying metadata and no message is worse than one carrying no line at all: it LOOKS
      # like it answered the question. Measured against live Loki, not theorised.
      #
      # `| drop __error__, __error_details__` is required even though EVERY line on this selector is
      # JSON today, and it must not be simplified away: `| json` stamps `__error__="JSONParserErr"` on
      # any line it cannot parse and the query then fails with HTTP 400 -- one unparseable line takes
      # the whole rule to execErrState. Clearing the label instead is impossible (Loki rejects
      # `label_format __error__=...` outright) and `| __error__=""` would silently DROP the offending
      # lines, which on this rule are exactly the ones worth seeing. The `{{ if .message }}` fallback
      # is the same insurance one stage later. Sibling `Ops · ERROR logs` needs both for a live reason.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            topk(5, sum by (host, container, level, msg) (count_over_time({host=~"zcrypto|zcrypto-red", container="capture", level=~"ERROR|CRITICAL"} | json message="message" | drop __error__, __error_details__ | label_format msg=`{{ if .message }}{{ printf "%.200s" .message }}{{ else }}{{ printf "%.200s" __line__ }}{{ end }}` [15m]))) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR/CRITICAL log lines from the capture daemon (container=capture) on a capture host in the last 15 minutes -- desync storms, ENOSPC, or reconnect failures on the unbackfillable stream. Zero is the healthy baseline. One alert instance per distinct line, and at most 5 of them -- a storm may carry more lines than are shown here."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "102"
      unit: "ERROR or CRITICAL log lines in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  # Two per-host canaries that make the ERROR rule above trustworthy (mirror zcrypto-ops-log-pipeline-dead).
  # The ERROR rule selects on the `level` label, which exists ONLY because the capture daemon's OWN
  # direct-ship handler attaches it at the source (cli/logging/ship.py, spec 00068 D3/D4: `level` =
  # `record.levelname`, no regex anywhere in this path -- Alloy is not involved) -- so if the daemon's
  # ship path regresses (the T0060 class: the label scheme drifting, or the handler/formatter itself
  # breaking), its lines stop arriving with a usable level and the ERROR rule reads 0 = healthy FOREVER.
  # These fire on the absence of ANY parsed capture line (level matching anything). Scoped to
  # container="capture" -- NOT host-wide -- on purpose: a capture-side regression leaves Alloy's OWN
  # leveled lines (its journald-driver stream) flowing, so a host-wide canary would stay green in
  # exactly the blind state this exists to page on. The capture daemon emits ~35 parsed lines/hr
  # (evidence: 342/341 INFO + 499/497 WARNING per 24h, pre-rework baseline), so <1 in 6h means the
  # capture log plane is dead (the daemon's --ship-logs path down, its Loki credentials dead, or the
  # container gone), not a quiet daemon. One rule per host: Loki cannot synthesize a per-host zero (an
  # absent stream is no series, not a 0 series), so `or on() vector(0)` only injects a 0 for a
  # SINGLE-host query -- a `sum by(host)` would fire only when BOTH hosts go dark and miss a single
  # host's outage. The `by (host)` each of the two carries is NOT that: each selector still names one
  # host, so the aggregation cannot span the pair. It is there for the notification's label line only,
  # and it is INERT at exactly fire time -- the fire path is the unlabelled `or on() vector(0)` arm --
  # which is why each summary names its host in words rather than interpolating `$labels.host`.
  - uid: zcrypto-capture-log-dead-primary
    title: "Capture · log pipeline dead — Capture primary"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="zcrypto", container="capture", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting (not OK): this is a fires-on-silence dead-man -- the `or on() vector(0)` fallback keeps
    # the query returning data while intact, and Alerting is the belt-and-braces layer for the day an
    # edit drops the fallback or Loki maps an empty response to NoData; with OK it would park green in
    # exactly the blind state it exists to page on.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED capture-daemon log line (any level) from the capture PRIMARY in 6h -- the daemon emits ~35/hr, so its log plane is dead (the daemon's --ship-logs path down, its Loki credentials dead, or the container gone). The Capture · daemon ERROR logs rule is blind on this host until fixed."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  - uid: zcrypto-capture-log-dead-secondary
    title: "Capture · log pipeline dead — Capture secondary"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="zcrypto-red", container="capture", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED capture-daemon log line (any level) from the capture SECONDARY in 6h -- the daemon emits ~35/hr, so its log plane is dead (the daemon's --ship-logs path down, its Loki credentials dead, or the container gone). The Capture · daemon ERROR logs rule is blind on this host until fixed."
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  # Fleet · Alloy dark (T0079) -- five rules, one per host, all `critical`.
  # Uniform severity is deliberate: the responder's action is identical on every host (SSH, check the
  # container, restart), so a differentiated severity would imply a differentiated response that does
  # not exist. What differs is only what accumulates unseen meanwhile, which the per-host summary
  # states. These own "not shipping" only -- a rule for "shipping but wedged" (`zcrypto-alloy-docker-
  # sd-wedged`, T0048 defect 1: the T0048 incident was Alloy alive, discovery frozen) used to cover
  # the other case, but it is *removed from this file*, retired on all four hosts once D7's
  # converges run (spec 00068 D6/D8/D7) -- once that rollout completes, nothing re-detects that
  # failure mode.

  - uid: zcrypto-alloy-dark-nas
    title: "Fleet · Alloy dark — NAS"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # `{host="nas"}` (re-keyed from an empty-value matcher, spec 00069 D7 -- this comment
          # used to forbid exactly this re-key; it is now the deliberate, done thing). ops and both
          # capture hosts already set `external_labels = { host = ... }` on their
          # prometheus.remote_write; the NAS's config.alloy now does too. The old empty-value
          # matcher existed because adding a label to an already-live series changes its identity,
          # which can read as a value jump under an `increase()`/`resets()` rule -- i.e. a FALSE
          # permanent-data-loss page -- but the one series that risk was about,
          # zcrypto_reconcile_residual_gap_seconds_total, no longer publishes from the NAS (the
          # writer moved to ops at spec 00054 D2), so nothing left here sits under that shape of
          # rule. The smaller seam this rule itself carries -- `up`'s own identity changing at the
          # labeling moment -- is the accepted cost (D7): a possible one-off false page at this
          # attended rollout window, cheap to dismiss.
          # Fires on SILENCE: when this host's Alloy stops shipping, its `up` series goes stale and
          # then absent, `count()` yields no vector, and `or on() vector(0)` supplies the 0 that trips
          # the threshold. `count()`, not `sum()`: `up` is a scrape-health gauge whose VALUE can be 0
          # while Alloy is alive and shipping -- presence of the series is the "shipping" signal, and
          # count() reads presence regardless of value. The fallback (rather than a bare `absent()`)
          # is what lets noDataState stay Alerting -- a raw `absent()` returns NO data while healthy,
          # so it would need noDataState: OK and would then park green if the datasource itself went
          # away.
          expr: >-
            count(up{host="nas"}) or on() vector(0)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting
    execErrState: Alerting
    # 10m tolerates a deploy restart (Alloy is down for seconds, but the series can gap a minute or
    # two) while still beating the ~3h the logs dead-man took to notice the 2026-07-15/16 T0048
    # incident. Prometheus staleness alone is ~5m, so the effective notice is ~15m.
    for: 10m
    annotations:
      summary: "The NAS's Alloy has shipped no metrics for >10m — its telemetry plane is dark, taking out the gate metrics the Stage-6a soak verdict is read from and the NAS archive-pull's log stream (the reconciler is unaffected: its series publish from ops since 2026-07-16). Every OTHER rule scoped to this host is now blind, so their silence means nothing until this clears. First checks: `docker ps` on the host, then `docker logs grafana-alloy`; a restart is the usual fix."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "101"
