  # T0083 mutual watchdog, Grafana half. Owns two failures in one rule: (a) any healthchecks.io
  # check is DOWN -- a dead-man fired, and hc.io's own notification channel may itself be the
  # broken part, so Grafana pages too (the deliberate double-page is the cross-watchdog); (b) the
  # hc.io scrape is DARK (endpoint unreachable, read-only key revoked, Alloy scrape broken) -- the
  # or-on()-vector(999) fallback makes silence read as 999, far over the threshold, so
  # green-when-blind is impossible; a value of 999 in the page means "the watchdog's own eyes went
  # dark", not "a check is down". The reverse direction (Grafana down -> hc.io pages) is the ops
  # grafana-watchdog pinger, NOT this rule.
  - uid: zcrypto-hcio-watchdog
    title: "Fleet · healthchecks.io watchdog (check down, or hc.io dark)"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # hc_checks_down_total is the endpoint's real aggregate name (read live 2026-07-21);
          # there is no bare hc_checks_down.
          expr: >-
            max(hc_checks_down_total) or on() vector(999)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: Alerting
    execErrState: Alerting
    # 5m rides out a single scrape blip; hc.io's own grace periods already buffer check lateness,
    # so a `down` state here is post-grace and real.
    for: 5m
    annotations:
      summary: "Either a healthchecks.io dead-man check is DOWN (value = how many), or the hc.io scrape itself went dark (value 999 — endpoint unreachable, read-only key revoked, or the ops Alloy scrape broken). hc.io's own notification may be the broken half — check https://healthchecks.io first, then the ops Alloy. The Grafana-down direction is covered by the zcrypto-grafana-watchdog check on hc.io, not this rule. Runbook: infra/runbooks/observability.md#zcrypto-hcio-watchdog"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "103"
      unit: "checks down -- 999 means healthchecks.io itself is unreachable"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  # ---- Access bridgehead (zaccess) --------------------------------------------------------------
  # Content rules for the internet edge (spec 00075) own "bad while alive"; zcrypto-alloy-dark-zaccess
  # above owns "this host's telemetry plane is dark" -- which is why noDataState stays OK here rather
  # than paging on a transient remote_write gap the canary already covers.
  - uid: zaccess-disk-high
    title: "Access · bridgehead disk high"
    ruleGroup: zcrypto-access
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The whole host is one small root filesystem (Linode 25 GB) -- everything on it (Alloy,
      # Caddy's ACME state, the WireGuard config) lives under mountpoint="/", so there is no
      # separate spool to watch the way the capture hosts' unbackfillable L2 spool needs one.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_filesystem_avail_bytes{host="zaccess", mountpoint="/"}
            / node_filesystem_size_bytes{host="zaccess", mountpoint="/"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.15]}  # < 15% free
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "The bridgehead's root filesystem is below 15% free. On a 25 GB VPS running only Alloy, Caddy, and WireGuard, this is most likely accumulated logs or an ACME/cert-renewal artifact rather than data growth. Runbook: infra/runbooks/zaccess.md#zaccess-disk-high"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "301"
      unit: "of the bridgehead root filesystem still free (a fraction, not a percent)"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  # Either end reporting a stale handshake is the failure -- PersistentKeepalive=25 means a healthy
  # tunnel handshakes well under 300s from BOTH sides, so max() (not min()) catches whichever end
  # went stale first. `by (host)` because this family is published by BOTH ends (the bridgehead's own
  # probe and the ops-side probe): a bare max() collapses them, so the page could not name which end
  # lost the link -- the first question asked. Grouping raises one instance per end instead, and the
  # summary names it. A fully dark bridgehead is zcrypto-alloy-dark-zaccess's job, not this rule's;
  # a fully dark ops node is zcrypto-alloy-dark-ops's -- a live-but-stale tunnel keeps reporting a
  # growing age (wg show's last-handshake timestamp doesn't vanish), so this fires via the normal
  # threshold path, not NoData.
  - uid: zaccess-tunnel-stale
    title: "Access · WireGuard tunnel stale"
    ruleGroup: zcrypto-access
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: max by (host) (zaccess_wireguard_handshake_age_seconds)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [300]}
    noDataState: OK  # owned by zcrypto-alloy-dark-zaccess / zcrypto-alloy-dark-ops
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The WireGuard tunnel's handshake age has been over 300s for 10+ minutes -- PersistentKeepalive=25 means a healthy tunnel handshakes well under that, so the link is down or degraded. This fires once per END rather than once for the tunnel, so the host this notification names is the end that lost the link. Runbook: infra/runbooks/zaccess.md#zaccess-tunnel-stale"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "701"
      unit: "seconds since the last WireGuard handshake"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  # min across every zaccess_tls_not_after_seconds series -- both edge probes (target="tmux"|
  # "nas", written by this host's own probe timer) and the ops node's DSM probe (target="nas-dsm")
  # -- so whichever certificate is closest to expiry trips it first, regardless of which host
  # measured it. Same noDataState reasoning as zaccess-tunnel-stale: this metric is multi-host too.
  #
  # `by (host, target)`, not a bare min(): collapsing both labels told the operator that A certificate
  # was expiring and not WHICH, across three tracked endpoints. Grouping makes each certificate its
  # own alert instance and the summary names it.
  - uid: zaccess-cert-expiring
    title: "Access · edge cert expiring"
    ruleGroup: zcrypto-access
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: min by (host, target) (zaccess_tls_not_after_seconds) - time()
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1209600]}  # < 14*86400s (14 days)
    noDataState: OK  # owned by zcrypto-alloy-dark-zaccess / zcrypto-alloy-dark-ops
    execErrState: Alerting
    for: 1h
    annotations:
      summary: "{{ if $labels.target }}The TLS certificate for `{{ $labels.target }}` is under 14 days from expiry.{{ else }}A tracked TLS certificate is under 14 days from expiry.{{ end }} Each tracked endpoint (the tmux and nas edge vhosts, plus the NAS admin console) is its own alert instance, so this names the one certificate that needs renewing rather than only the soonest. Runbook: infra/runbooks/zaccess.md#zaccess-cert-expiring"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "702"
      unit: "seconds until that certificate expires"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics
