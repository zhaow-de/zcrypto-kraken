# Grafana alert-rule provisioning source (spec 00049; boards split by spec 00084 -- every
# *-dashboard.json beside this file ships). Pushed by infra/scripts/grafana-push.sh, ONE rule per
# `POST`/`PUT /api/v1/provisioning/alert-rules[/:uid]` call against Grafana's **Alerting
# Provisioning HTTP API** -- that endpoint takes a single alert-rule JSON object per call and
# REJECTS the `apiVersion: 1` / `groups:` file-provisioning shape, which is for Grafana's
# config-file provisioner and is not usable on Grafana Cloud SaaS anyway. This file is YAML
# (superset of JSON) purely for the inline comments -- the script converts it to the API's per-rule
# JSON before each push. See:
#   https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/http-api-provisioning/
#   https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/alerting_provisioning/
#
# Each rule's `data` array is a query node (refId A, the Prometheus/Loki datasource, an instant
# query so it already reduces to one number) feeding a `type: threshold` expression node (refId
# C, datasourceUid `__expr__`). The threshold node's own model field is **`expression`**, not
# `expr` -- Grafana's threshold expression (pkg/expr `ThresholdCommand`) reads `expression` to
# find which prior refId to compare; an empty/misnamed field errors "no variable specified to
# reference" and hard-fails the rule's condition on every evaluation.
#
# Placeholders are literal `${VAR}` tokens that infra/scripts/grafana-push.sh substitutes from its
# own environment before sending each rule -- the alert-rule provisioning API has no server-side
# template substitution (unlike the dashboard JSON's `${DS_PROMETHEUS}`/`${DS_LOKI}` variables,
# which Grafana itself resolves on dashboard import):
#   - `${GRAFANA_PROM_DS_UID}` / `${GRAFANA_LOKI_DS_UID}` -- the two datasource UIDs.
#   - `${GRAFANA_ALERT_FOLDER_UID}` -- the folder UID the rules provision into (the API needs
#     the folder's UID, not its display name).
#   - `notification_settings.receiver: metrics` (or `logs` for the Loki-sourced ERROR-log rules;
#     the `logs` receiver disables resolve messages -- a log alert resolves by ageing, so a
#     resolve ping is noise) (both receivers' Slack webhook is provisioned separately, not here).
#
# noDataState is per-rule, not boilerplate: Alerting only where nothing else owns the series'
# absence; OK wherever a dead-man or canary already does, or where absence is legitimate.
rules:
  - uid: zcrypto-gate-streak-reset
    title: "Gate · streak reset"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # SUPERSEDES the removed `Gate · not MET` rule (uid zcrypto-gate-not-met, `zcrypto_gate_status
    # == 0`): status 0 is the CORRECT, EXPECTED state for the whole >=14-day accumulation window, so
    # that rule would have paged daily while nothing was wrong, and the real failure modes already
    # have their own rules (mismatch / exporter stale / journal pull lag).
    #
    # `streak_days` only ever increments (a clean complete UTC day) or resets to 0 (a day failed),
    # so a negative delta IS the failure and nothing else produces one. It fires once on the break
    # and auto-resolves as the 6h window rolls past -- one alert per broken run, not a drumbeat.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}  # 6h, matching the delta window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: delta(zcrypto_gate_streak_days[6h])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0]}  # the streak went BACKWARDS == a clean run broke
    # OK, not Alerting: a missing metric means the exporter is dead, which `Gate · exporter stale`
    # already pages for. Alerting here too would just double-page the same fault.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The Stage-6a clean-day streak went BACKWARDS — a clean run broke and the >=14-day gate clock
        has restarted. (The gate merely being not-MET while it accumulates is normal and no longer alerts.)
        Runbook: infra/runbooks/gate.md#zcrypto-gate-streak-reset
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "502"
      unit: "days of streak change"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-mismatch
    title: "Gate · mismatch in the last day"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: increase(zcrypto_gate_mismatch_total[1d])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "At least one replay mismatch/validation failure in the last 24h of journaled cycles. Runbook: infra/runbooks/gate.md#zcrypto-gate-mismatch"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "502"
      unit: "mismatches in the last day"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-pull-lag
    title: "Gate · journal pull lag high"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_gate_journal_pull_lag_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [21600]}  # 6h. DERIVED (T0069), not copied: the metric is now-minus-newest-journaled-cycle, so
            # its floor is the ENGINE's 4h cycle cadence, not pull health. 21600 = the measured
            # ceiling + one worst-case missed cycle + margin; a genuinely stalled pull grows lag
            # without bound, so that margin costs ~1h of detection, not correctness, and a
            # re-derivation gains nothing until the engine's cadence changes. Keep in lockstep with
            # gate-export's --lag-fail-seconds default -- that one gates the hc.io dead-man ping.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The newest journaled cycle is more than 6h old -- the NAS journal pull is stuck or the VPS engine has stalled. Runbook: infra/runbooks/gate.md#zcrypto-gate-pull-lag"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "503"
      unit: "seconds of journal pull lag"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-exporter-stale
    title: "Gate · exporter stale"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_gate_export_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [7200]}  # 2h -- no successful gate-export run in that window
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful `zcrypto engine gate-export` run in over 2h -- the NAS archive-pull loop or the gate-export step itself is broken. Runbook: infra/runbooks/gate.md#zcrypto-gate-exporter-stale"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "503"
      unit: "seconds since the gate exporter last published"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-cache-reverify-stalled
    title: "Gate · cache re-verification stalled"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    # The gate cache (spec 00060) skips replay_cycle on a fingerprint hit -- and that replay is the
    # ONLY place the journal's parquet bytes are re-hashed (the NAS pull uses --no-verify and
    # delegates to it). Spec 00062 therefore force-replays a rotating ~1/24 slice each run so the
    # whole journal is re-verified about daily. THIS RULE IS THAT MECHANISM'S ONLY WITNESS: if the
    # rotation stops, a stalled cache is indistinguishable from a healthy one except through this
    # number. Note save_cache logs a warning and continues on write failure, so a full disk presents
    # as a working cache with invalidated=0 and a quietly-ageing age here (T0077).
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_gate_cache_oldest_verification_age_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 3d. A full rotation is ~24h, so this is ~3 sweeps of slack: late enough that a skipped
            # hour or a restart never pages, early enough that a genuinely stopped rotation surfaces
            # long before the evidence is meaningfully stale.
            - evaluator: {type: gt, params: [259200]}
    # OK, NOT Alerting -- deliberately unlike its zcrypto-gate siblings. gate-export emits this
    # metric only when --cache is active and non-empty (the NAS archive-pull loop passes `--cache`,
    # infra/nas/pull-entrypoint.sh), so absence is legitimate whenever the cache is off or a
    # container recreate has discarded it; "the exporter vanished" is zcrypto-gate-exporter-stale's.
    noDataState: OK
    execErrState: Alerting
    # 15m rather than the 5m its zcrypto-gate siblings use: the underlying value is monotonic and the
    # threshold is 3-day-scale, so a longer window costs no meaningful detection time while absorbing
    # a restart or a skipped hour without a transient page.
    for: 15m
    annotations:
      summary: "The gate cache's oldest cycle has not been re-verified for over 3 days -- the rotating re-verification has stopped, so cached gate verdicts are being served against parquet bytes nobody has re-hashed. Check zcrypto_gate_cache_replayed (should be >0 every run) and the NAS disk. Runbook: infra/runbooks/gate.md#zcrypto-gate-cache-reverify-stalled"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "504"
      unit: "seconds since the oldest cached cycle was re-verified"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-sleeve-count-changed
    title: "Engine · sleeve composition changed"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # NOT `zcrypto-engine-sleeve-composition-changed`, the name this rule is called everywhere else:
    # that string is 41 chars and Grafana's uid column is varchar(40), so the create call 400s. The
    # uid is immutable once the rule exists -- do not "restore" the longer spelling later.
    #
    # T0124: the deployable combines three sleeves at fixed 1/3 weights, and a sleeve arming or going
    # flat moves the placeability arithmetic and invalidates a drift band derived under the previous
    # composition. The composition change is the event; the gross change is a separate measurement
    # (docs/reference/sleeve-composition-ledger.md) and does not follow from the count -- a sleeve's
    # own gross can fall as others arm.
    #
    # `changes()` over a 26h window, not `delta()`: the count is not monotone (a sleeve can arm and
    # go flat again) and the DIRECTION does not matter -- both directions move gross materially, so
    # any step is the event. 26h spans more than six 4h cycles, wide enough that a change is never
    # missed between evaluations and narrow enough that the page ages out within a day.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 93600, to: 0}  # 26h, matching the changes() window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: changes(zcrypto_engine_active_sleeves[26h])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}  # the active-sleeve count stepped, either way == the event
    # OK, not Alerting -- the same posture as the verify-replay rules. The gauge is deliberately left
    # unpublished until the first cycle actually measures a composition (an unlabelled Gauge would
    # otherwise publish 0.0 from process start, i.e. "every sleeve is flat", which is a claim and a
    # false one). Absence is the dead-man's business: the engine going dark is owned by the
    # healthchecks.io switch and the cycle-completed staleness, not by this rule.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The engine's sleeve composition changed — a dormant sleeve armed, or an active one went flat.
        Nothing is broken: this announces a change in what the book IS. It does NOT tell you gross
        moved — each sleeve's gross is its own and they can move in opposite directions (measured
        2026-08-22: the count went 1 to 3 while the book rose x1.15 and then fell below where it
        started). Re-derive the drift band and re-read order placeability before the next go-live
        gate reads either of them, and measure the gross rather than inferring it from the count.
        Read zcrypto_engine_sleeve_gross to see which sleeve moved.
        Runbook: infra/runbooks/engine.md#zcrypto-engine-sleeve-count-changed
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "31"
      unit: "changes to the active sleeve count in the last 26 hours"
    # Warning, not critical: this is an announcement, not a fault. Nothing is broken -- the book is
    # doing what it was built to do; what changed is the object the go-live gate is about to judge.
    labels:
      severity: warning
    notification_settings:
      receiver: metrics
      # An ANNOUNCEMENT, not a fault. Without this it inherits the default repeat and re-notifies
      # every 4 h across the whole 26 h window, so ONE composition change pages about seven times.
      #
      # 12h, not the full 26h window: a SECOND composition step does not mint a new alert instance --
      # the labels are identical and the count lives in an annotation, invisible to Alertmanager's
      # dedup -- so the repeat interval IS the detection latency for a second step. 12h caps one
      # event at three pages while bounding that latency at half a window; raising it further needs a
      # distinguishing label so a second step mints its own instance.
      repeat_interval: 12h

  # If you are here to add SCRAPE-level engine liveness (`up{job="engine_app"}`), scope it
  # `host="zcrypto"` or derive the host from `engine_host`. The capture role renders ONE
  # config.alloy to BOTH capture hosts, so `engine_app` is scraped on zcrypto-red too, where no
  # engine runs and nothing listens on 9102 -- that series reads 0 permanently and an unscoped rule
  # would page forever on the secondary. An UNSCOPED, unconditional scrape-liveness rule is refused
  # outright: unattended engine liveness rides zcrypto-engine-cycle-stale below, zcrypto-engine-log-
  # dead, and the healthchecks.io dead-man switch, and a bare `up == 0` page would only add detection
  # latency nothing needs. What the scrape-level signal DOES buy is a conjunction nothing else can
  # express -- zcrypto-engine-dark-with-exposure below pairs it with a non-zero position at last
  # sight, scoped `host="zcrypto"` on both halves for exactly the reason above.
  - uid: zcrypto-engine-cycle-stale
    title: "Engine · cycles have stopped"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Cycle liveness is its own rule because a crash-looping engine leaves `active_sleeves` frozen
      # at its last published value, so the sleeve-composition rule above stays green while cycles
      # silently stop.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_engine_cycle_completed_at_seconds{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 16500 s is cadence arithmetic, not a generic staleness number: boundaries are
            # 00/04/08/12/16/20 UTC and a completion lands inside [B, B+30 min], so the worst
            # HEALTHY age is 4h30m = 16200 s, reached legitimately just before the next cycle
            # lands. 16500 leaves five minutes of margin; a flat 1h/2h bar would sit red through
            # most of every inter-cycle gap.
            - evaluator: {type: gt, params: [16500]}
    # Alerting, and it is the only rule on this subject that takes that posture. The gauge is seeded
    # at engine startup from the newest journal artifact (falling back to process start), so it is
    # never legitimately absent while the engine runs -- absence means the engine container is gone,
    # and nothing else owns that: `Fleet · Alloy dark — Capture primary` reads `count(up{host=...})`,
    # which stays >= 1 while Alloy is up and the engine target merely scrapes `up = 0`. Accepted
    # cost: a genuine Alloy-dark event on the primary double-pages.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The trading engine has not completed a cycle in over 4h35m — the 4-hourly loop has stopped
        turning. A healthy cycle completes within 30 minutes of its boundary, so the worst legitimate
        age is 4h30m and anything past that is a stopped or crash-looping engine, not a slow one.
        This also fires when the metric has vanished entirely: either the engine's exporter is gone or
        this host's telemetry plane is dark. Check `Fleet · Alloy dark — Capture primary` before
        assuming the engine, then the engine container on the capture primary and its newest cycle
        journal artifact for how far the last cycle got.
        Runbook: infra/runbooks/engine.md#zcrypto-engine-cycle-stale
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "11"
      unit: "seconds since the last completed cycle"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-dark-with-exposure
    title: "Engine · position open at last report and the engine is not reporting"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # The conjunction the comment above zcrypto-engine-cycle-stale describes: the engine unreachable
    # AND money exposed. Neither obvious spelling of either half can fire -- a first-sample read taken
    # while the engine scrapes normally is green over both defects -- so the discrimination replay in
    # tests/test_infra_alert_rules.py is what holds the two forms below in place.
    #
    # Node A reads the position BACKWARDS. `zcrypto_exec_position` is published by the very engine
    # this rule detects the absence of, so an instant read holds its value only for Prometheus's ~5
    # min staleness and then goes away -- the condition dies before `for` elapses; and the naive
    # `zcrypto_exec_position != 0 unless up{...}` spelling is worse still, since the right-hand side
    # is present-at-0 rather than gone, so it subtracts on every sample and the rule fires on nothing
    # at all. `last_over_time`, not `max_over_time`: the question is the exposure AT LAST SIGHT, and
    # a max would keep paging over a position closed hours before the engine went dark. `abs`,
    # because a short is exposure too.
    #
    # Node B reads the scrape's VALUE, not its presence -- the one place this rule must NOT copy the
    # zcrypto-alloy-dark-* rules. `engine_app` is a STATIC scrape target (see the capture role's
    # config.alloy), so nothing removes it when the container stops: the series stays present reading
    # 0, `count()` would read 1, and the threshold could never go true on the one event this rule
    # exists for. `host="zcrypto"` is load-bearing on BOTH halves, for the reason the comment above
    # zcrypto-engine-cycle-stale gives.
    #
    # `min` is 0 on a dead exporter and, through the `or on() vector(0)` fallback, 0 again when the
    # primary's Alloy takes the series away, so BOTH darkness routes trip it. That double-page is
    # accepted, not a defect: a dark telemetry plane and a dead host remove the series identically, so
    # silencing the Alloy route would make this rule blind to losing the primary outright, and the
    # summary and runbook give the responder the discriminator instead. The fallback is also what lets
    # noDataState stay Alerting -- a healthy fleet sits at an explicit 1, so NoData here can only mean
    # the datasource itself is gone.
    #
    # `for: 10m` is the only thing between a single missed scrape and a critical page: `up` falls to 0
    # on the FIRST failed scrape at a 60 s scrape interval, so this is ten attempts, and it is the
    # posture zcrypto-alloy-dark-ops already takes on this same signal.
    #
    # The 24h lookback is a decision, and it is also this page's HORIZON: the alert self-resolves when
    # the last position reading ages out of it, while the engine may still be dark and the position
    # still open. Sized to outlast a full daily ops pass; the runbook section says in those words that
    # a resolve here is not an all-clear.
    condition: D
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}  # 24h, matching the last_over_time window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'max(abs(last_over_time(zcrypto_exec_position{host="zcrypto"}[24h]))) or on() vector(0)'
          instant: true
          refId: A
      - refId: B
        queryType: ""
        # 600, as the zcrypto-alloy-dark-* rules carry on this same instant read -- NOT a copy of A's
        # 24h: B has no range selector at all, and a wider window would advertise a horizon it does
        # not have and invite the two to be maintained as one setting.
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min(up{job="engine_app",host="zcrypto"}) or on() vector(0)'
          instant: true
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: math
          expression: "$A > 0 && $B < 1"
          refId: C
      - refId: D
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "C"
          refId: D
          conditions:
            - evaluator: {type: gt, params: [0]}  # the math node is 1 iff BOTH halves hold
    # `condition: D`, not the `C` every two-node rule in this file ends at. Spelling it `C` parses
    # fine and satisfies test_every_rule_has_the_fields_the_api_requires, and evaluates the math
    # node's raw output instead of the threshold.
    noDataState: Alerting
    execErrState: Alerting
    for: 10m
    annotations:
      summary: >-
        The engine's last reported position was non-zero and its scrape has read 0, or been gone, for
        over 10 minutes — either the engine is dark with exposure open, or the capture primary's
        telemetry plane is dark and the engine is fine. Check `Fleet · Alloy dark — Capture primary`
        FIRST: it counts the host's series instead of reading this scrape's value, so it stays >= 1
        while Alloy is up and co-fires only on the telemetry route — where the position stands and
        flattening it would pay spread and fees for a telemetry incident. Confirm the engine is
        actually dark on the host before acting on the position. This page self-resolves when the last
        position reading ages out of its 24h lookback, which is NOT an all-clear: the engine may still
        be dark and the position still open.
        Runbook: infra/runbooks/engine.md#zcrypto-engine-dark-with-exposure
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "64"
      unit: "base units of exposure at the last position report"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-cycle-failed
    title: "Engine · the last cycle failed"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Liveness cannot cover this, and the reason is load-bearing: the metrics sink runs after every
      # cycle, success OR failure, and it refreshes `cycle_completed_at` unconditionally -- so an
      # engine whose every cycle fails on schedule keeps the staleness rule above silent forever.
      # Two questions, two rules.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'zcrypto_engine_cycle_success{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}  # the gauge is 1 on success, 0 on failure
    # OK, not Alerting: this gauge is DELIBERATELY left unregistered until an outcome is actually
    # known (an unlabelled Gauge would otherwise publish 0.0 from process start, i.e. "the last cycle
    # failed", which is a claim and a false one), so a fresh deploy or an unreadable journal must not
    # page. Absence is the staleness rule above's business.
    noDataState: OK
    execErrState: Alerting
    # 0s: the outcome is already final the instant this gauge reads 0, so any pending period is pure
    # delay. The mechanism, read from the source rather than assumed -- `cli/engine/cycle.py::_failed`
    # writes `failed-cycle-<HH>.json` BEFORE it calls `_update_metrics`, and
    # `cli/engine/node.py::startup_action` returns None for any boundary that already has a journal
    # artifact (success record OR failed sidecar), a check independent of the [B, B+25 min] window it
    # sits behind. So `cycle_success == 0` implies the sidecar exists implies no re-run is possible,
    # ever, and the next boundary is 4 h away.
    for: 0s
    annotations:
      summary: >-
        The engine's most recent cycle finished UNSUCCESSFULLY. The outcome is final — the engine never
        re-runs a boundary that already has a journal artifact, so only
        `zcrypto engine cycle --at` the failed boundary's timestamp `--replace` can re-run it. The
        cycle-staleness rule cannot see this: the metrics sink refreshes the completion timestamp after
        a FAILED cycle too. Read the engine log and the newest cycle journal artifact for which step
        failed.
        Runbook: infra/runbooks/engine.md#zcrypto-engine-cycle-failed
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "12"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-error-logs
    title: "Engine · ERROR logs"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The engine direct-ships its logs exactly as the capture daemon does -- `level` =
      # `record.levelname` at the source and `container` = ZCRYPTO_LOG_SERVICE, set to `engine` in
      # infra/ansible/roles/engine/templates/compose.yaml.j2. The engine runs only on the capture
      # primary, hence `host="zcrypto"` alongside the container label; `sum by (host, ...)` keeps the
      # label the notification template maps to a display name.
      #
      # Shape is `zcrypto-capture-error-logs`'s, deliberately identical rather than re-derived --
      # that rule's comment below carries why the `msg` hoist, `topk(5, ...)`, `| json
      # message="message"` and `| drop __error__, __error_details__` are each load-bearing. `or on()
      # vector(0)` keeps a clean window an explicit 0, and this rule fires on the COUNT arm only, so
      # its labels are genuinely populated when it pages.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            topk(5, sum by (host, container, level, msg) (count_over_time({host="zcrypto", container="engine", level=~"ERROR|CRITICAL"} | json message="message" | drop __error__, __error_details__ | label_format msg=`{{ if .message }}{{ printf "%.200s" .message }}{{ else }}{{ printf "%.200s" __line__ }}{{ end }}` [15m]))) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR/CRITICAL log lines from the trading engine on the capture primary in the last 15 minutes -- the cycle rules see only a cycle's final outcome, so everything that goes wrong between boundaries (key or API failures, refresh errors, order-path exceptions) surfaces here first, on the host that holds the live trade key. Zero is the healthy baseline. One alert instance per distinct line, and at most 5 of them -- a storm may carry more lines than are shown here. Runbook: infra/runbooks/engine.md#zcrypto-engine-error-logs"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "102"
      unit: "ERROR or CRITICAL log lines in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  # The dead canary that makes `zcrypto-engine-error-logs` above trustworthy (T0128). That rule is
  # presence-fired, so it is silent in two states that look identical from outside: the engine is
  # healthy, or its log-shipping path regressed and no line arrives at all. Mirrors
  # `zcrypto-capture-log-dead-primary` in shape; the WINDOW is derived differently and deliberately.
  #
  # THE ENGINE IS A BURST EMITTER, NOT A CONTINUOUS ONE -- the whole reason this window is derived
  # rather than copied from the capture canary. It emits its lines within ~90 s of each 4-hourly
  # cycle boundary and nothing between, so most hours carry zero lines. A window at or under 4 h
  # would false-fire on every healthy inter-cycle gap; 6h against the 4.00 h period is 2.00 h of
  # slack and tolerates exactly zero missed cycles. Do NOT tighten it toward the 15m of the ERROR
  # rule above: they watch different things.
  #
  # ACCEPTED COST: a genuinely missed cycle double-pages. `zcrypto-engine-cycle-stale` fires first and
  # correctly, both on receiver `metrics`; this rule then follows with a title saying the
  # LOG PIPELINE is dead when it is fine. The summary's last sentence tells the responder how to tell
  # them apart, but the phone shows the title first.
  #
  # MEASURING THIS NEEDS CARE: `count_over_time` emits NO sample for a step whose range window is
  # empty, so on a burst emitter the surviving points are just the burst hours and a range query
  # reads back as "every hour has lines", the exact opposite of the truth. The `or on() vector(0)`
  # this rule already carries is the fix -- with it, step=1h returns the zero hours.
  - uid: zcrypto-engine-log-dead
    title: "Engine · log pipeline dead"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="zcrypto", container="engine", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, matching the other dead-men: the `or on() vector(0)` fallback keeps the query
    # returning data while intact, and this is the belt-and-braces layer for the day an edit drops
    # that fallback or Loki maps an empty response to NoData. With OK it would park green in exactly
    # the blind state it exists to page on.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one log line of any level from the trading engine on host zcrypto (container `engine`) in 6h. The engine logs in bursts at its 4-hourly cycle boundaries, so 6h means at least one whole cycle produced nothing -- its log-shipping path is dead (Loki credentials, the ship handler, or the container gone). The Engine · ERROR logs rule is blind until this is fixed, on the host that holds the live trade key. Check whether cycles are still completing: if they are, this is the log plane alone; if they are not, the engine itself is down and the cycle rules are the ones to read. Runbook: infra/runbooks/engine.md#zcrypto-engine-log-dead"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
      unit: "engine log lines of any level in the last 6 hours"
    labels:
      severity: critical
    # `metrics`, not `logs` -- as for every dead-man in this file. `grafana-push.sh` mints `logs`
    # with disableResolveMessage: true, which is right for a burst that ages out of its own window
    # (T0047) and wrong where the clear is the news. Enforced by
    # tests/test_infra_alert_rules.py::test_a_rule_that_fires_on_absence_can_notify_its_clear.
    notification_settings:
      receiver: metrics

  # The execution safety envelope (cli/engine/execgate.py, `_ExecGauges` in cli/engine/command.py):
  # three rules over the six `zcrypto_exec_*` gauges. `reasons` never reaches Grafana and
  # `zcrypto_exec_armed` deliberately conflates its two arming keys into one gauge, so every summary
  # below sends the responder to `zcrypto engine exec-status` on the engine host for the breakdown
  # remote telemetry cannot show. The three gauges carrying no rule are recorded with their reason in
  # NOT_A_FAULT_SIGNAL (tests/test_infra_alert_rules.py).
  - uid: zcrypto-engine-exec-armed-too-long
    title: "Engine · order submission has been armed for over six hours"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # min_over_time == 1 means it was armed for the WHOLE window: a single dip to 0 (a disarm)
    # clears it. `> 0` on an average would fire on a brief, correct probe window.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}  # 6h, matching the min_over_time window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min_over_time(zcrypto_exec_armed{host="zcrypto"}[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}  # stands in for == 1 -- this file's evaluators are gt/lt only
    # OK, not Alerting: absence means the engine itself is down, which zcrypto-engine-cycle-stale
    # already pages on. This rule's job is the ARMED-too-long condition specifically, and a fresh
    # process (or one between restarts) legitimately starts disarmed with no history to alarm on.
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "The engine has been armed to submit orders continuously for more than six hours. Arming is expected only inside an attended probe window and is normally removed when it ends, so this most likely means an arm was left on. Deleting the arm file on the engine host disarms it immediately, with no deploy and no restart. This is not itself an incident — several other conditions must also be permissive before anything could be submitted — but an engine left armed removes one of the two keys that are supposed to stand between a mistake and real money. Runbook: infra/runbooks/engine.md#zcrypto-engine-exec-armed-too-long"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "52"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-exec-kill-tripped
    title: "Engine · the execution kill switch is engaged"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'zcrypto_exec_kill_tripped{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}  # stands in for == 1 -- this file's evaluators are gt/lt only
    # OK, not Alerting: absence means the engine itself is down (owned by zcrypto-engine-cycle-stale),
    # and this eager gauge always carries a real 0/1 sample once the engine has started.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The execution kill switch is engaged, so the engine will refuse to submit any order until it is removed. This is a deliberate state and firing does not mean anything is broken — the alert exists because the failure mode is forgetting, not tripping. If the switch was engaged deliberately and the reason still holds, silence this for the expected duration; otherwise remove the kill file on the engine host. Runbook: infra/runbooks/engine.md#zcrypto-engine-exec-kill-tripped"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "53"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-engine-exec-not-evaluated
    title: "Engine · the execution safety gate has stopped being evaluated"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # The rule that catches the one failure nothing else can see: a regression that drops the
    # gate evaluation from the cycle path freezes all six gauges at their last values, cycle
    # telemetry stays healthy, and every dashboard reads green while the envelope is gone.
    # Follows zcrypto-gate-exporter-stale's shape. Threshold = one cycle interval plus slack.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_exec_last_evaluation_timestamp_seconds{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [17100]}  # 4h45m
    # noDataState MUST be Alerting: a gate that never published at all is this rule's worst
    # case, not an exemption from it.
    noDataState: Alerting
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The engine has not evaluated its execution safety gate for more than four and three quarter hours, so every published value describing whether it may trade is frozen at whatever it last read. Nothing else reports this: the cycle metrics can look perfectly healthy while the safety gate is no longer consulted at all, and a stale reading of `disarmed` is indistinguishable from a live one. Check that cycles are still completing, then read the current state directly on the engine host with the exec-status command rather than trusting the dashboard. Runbook: infra/runbooks/engine.md#zcrypto-engine-exec-not-evaluated"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "56"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-venue-concordance-failed
    title: "Engine · venue concordance failed"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'zcrypto_venue_concordance_failures{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: absence means the engine itself is down, which zcrypto-engine-cycle-stale
    # already pages on -- this eager gauge always carries a real sample once the engine has started,
    # seeded at startup from the newest venue-<HH>.json on disk (_seed_venue_state) so a restart
    # never leaves it parked at the eager 0 default, masking a real failure count as healthy.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "A ratified instrument went missing or unparseable at the venue on the most recent cycle. Check the newest venue snapshot record on the engine host for which leg and why. Runbook: infra/runbooks/engine.md#zcrypto-venue-concordance-failed"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "73"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-venue-snapshot-stale
    title: "Engine · venue snapshot is stale"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_venue_snapshot_timestamp_seconds{host="zcrypto"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [18000]}  # one 4h cycle + 1h slack
    # OK, not Alerting: absence means the engine itself is down, which zcrypto-engine-cycle-stale
    # already pages on -- this eager gauge always carries a real sample once the engine has started,
    # seeded at startup from the newest venue-<HH>.json on disk (_seed_venue_state) so a routine
    # restart never leaves it at its 0.0 (1970) default and false-pages this very rule.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The venue snapshot writer has stopped producing -- no successful venue-truth snapshot in over five hours. Check the engine log and the newest venue snapshot record on the engine host. Runbook: infra/runbooks/engine.md#zcrypto-venue-snapshot-stale"
      __dashboardUid__: "zcrypto-engine"
      __panelId__: "71"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-disk-low
    title: "NAS · /volume1 free space low"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_filesystem_avail_bytes{mountpoint="/volume1"}
            / node_filesystem_size_bytes{mountpoint="/volume1"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.1]}  # < 10% free
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "/volume1 has less than 10% free space -- the archive keeps growing into it. Runbook: infra/runbooks/nas.md#zcrypto-nas-disk-low"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "301"
      unit: "of the volume still free (a fraction, not a percent)"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-load-high
    title: "NAS · load high"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # Scoped to host="nas" (spec 00069 D7): ops's Alloy also ships node_load1 (it sets
          # `external_labels = { host = "ops" }` on prometheus.remote_write), and ops is a 24-thread
          # box whose normal working load would trip this Atom-sized `gt 4` threshold constantly. The
          # NAS's config.alloy sets `external_labels = { host = "nas" }`, so an explicit `host="nas"`
          # selects the NAS's copy of the series only.
          expr: node_load1{host="nas"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # The NAS Atom has 4 cores -- 1-min load above that is
            # sustained saturation, not a transient burst.
            - evaluator: {type: gt, params: [4]}
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "1-minute load average exceeds the NAS's 4 cores. Runbook: infra/runbooks/nas.md#zcrypto-nas-load-high"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "201"
      unit: "as a 1-minute load average"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-archive-pull-errors
    title: "NAS · archive-pull ERROR logs"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Selects on the `level` LABEL, not a `|= "ERROR"` grep of the line: Alloy parses our Python
      # log format at ingest (infra/nas/config.alloy) and strips the level out of the message, so a
      # text grep for "ERROR" would match NOTHING -- silently blind -- and would miss CRITICAL too.
      # `queryType: instant` is load-bearing and Loki-specific: the `instant: true` MODEL field that
      # the Prometheus rules above use is a Prometheus-datasource setting and Loki ignores it, so
      # without this the query runs as a RANGE query and the threshold node rejects the time series
      # it returns -- the rule errors instead of evaluating.
      #
      # `by (host)` and not `by (host, container)`: the selector already pins the container to one
      # literal, so carrying it would add a label whose value the rule already knows. This rule fires
      # on the COUNT arm -- `or on() vector(0)` yields 0, which fails `gt 0` -- so the labels it
      # raises are genuinely populated, unlike the dead-man below.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({container="archive-pull", level=~"ERROR|CRITICAL"} [15m])) or on() vector(0)
          queryType: instant
          refId: A
      # Reduce A to a single value before the threshold. Belt-and-braces alongside the instant query:
      # this is the canonical A -> B(reduce) -> C(threshold) chain Grafana's own UI emits, and it keeps
      # the rule valid even if the datasource ever hands back a series again.
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR-level log lines from the archive-pull container on the NAS in the last 15 minutes. Runbook: infra/runbooks/nas.md#zcrypto-nas-archive-pull-errors"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "102"
      unit: "ERROR or CRITICAL log lines in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  - uid: zcrypto-nas-archive-pull-stalled
    title: "NAS · archive-pull stalled (dead-man)"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The DEAD-MAN, and the only rule that fires on SILENCE. Every other rule needs the archive-pull
      # container to still be alive and talking: `NAS · archive-pull ERROR logs` fires on an ERROR
      # line, so it is green when the container is gone, the pull loop has exited, or the NAS is down
      # -- i.e. exactly when nothing is protecting the unbackfillable archive any more. This one
      # inverts that: it fires when the loop STOPS saying it succeeded.
      #
      # `failed=0` is load-bearing, not decoration. Matching `pull complete` alone would ALSO be
      # satisfied by the JOURNAL pull -- "archive pull complete (no verify) ..."
      # (cli/archive/command.py) -- and by a CAPTURE pull whose hash verification FAILED, because the
      # "pull complete ... failed=N" line is logged BEFORE the check raises. Either would hold this
      # rule quiet while the capture mirror was not advancing at all. It is NOT capture-specific: the
      # liquidations, panel and reconciled pulls all run `zcrypto archive pull` WITH verification in
      # this same container and emit the identical clean line, so capture-specific failure is
      # deliberately delegated to the warning-severity ERROR-logs rule above, which fails loudly every
      # cycle; this rule owns total silence (loop dead, container gone, NAS down, log pipeline dark).
      # A capture-specific tightening would match `source=` naming the tree -- `dest=` appears on the
      # --no-verify journal line, never on this one.
      #
      # 3h window against a pull that runs hourly (`${ARCHIVE_PULL_INTERVAL:-3600}` in
      # infra/nas/pull-entrypoint.sh): the loop gets three chances to report before this pages, so a
      # single slow or restarted cycle is not enough to wake anyone.
      #
      # `or on() vector(0)` is what makes the dead-man work at all: when the container is gone Loki
      # returns NO series, and a bare `sum(count_over_time(...))` would then evaluate to NoData rather
      # than to zero -- the rule would sit in NoData instead of firing, which is the precise failure it
      # exists to catch. The `or` substitutes an explicit 0, which trips the `lt 1` below.
      #
      # Keep the bare `sum()`: both arms are unlabelled, so an interpolated `$labels.host` renders
      # EMPTY -- which is why the summary names the host and container as literal words.
      #
      # Receiver `metrics`, not `logs`: a dead-man's clear IS the news, and `logs` suppresses resolve
      # notices -- the mechanism and its enforcing test are at `zcrypto-engine-log-dead` above (T0162).
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 10800, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({container="archive-pull"} |= "pull complete" |= "failed=0" [3h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting  # NoData here means the log pipeline itself died -- that IS the alarm
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "The archive-pull container on the NAS has not reported a successful pull for 3h -- the loop, the container, the NAS, or the log pipeline is down. The L2 archive is unbackfillable; the NAS mirror is going stale. Runbook: infra/runbooks/nas.md#zcrypto-nas-archive-pull-stalled"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  # --- Reconciler: the redundant capture secondary + gap healing (spec 00050 Role C) ---------------
  # A rule armed before its metric exists evaluates against nothing and sits silent forever, looking
  # healthy (T0034) -- push only once the series are visible. Alloy's keep-regex on the WRITER's host
  # must carry `zcrypto_reconcile_.*` or the series never ship; the overlay writer runs on ops
  # (infra/ansible/roles/ops/files/config.alloy).

  - uid: zcrypto-reconcile-exporter-stale
    title: "Reconciler · exporter stale"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for the reconciler itself. Every other rule below reads a metric the reconciler
      # publishes, so all of them go quiet -- not red -- if it simply stops running. This one inverts
      # that: it fires on the silence. The textfile is scraped in place, so a dead reconciler leaves the
      # last value being scraped forever; only the TIMESTAMP reveals it, which is why the gauge exists.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_reconcile_last_success_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h. Since the OPS-5 cutover the series comes from the ops half-hourly overlay-writer (:12/:42), so this is ~6 missed cycles -- kept as provisioned deliberately (T0058 consensus: thresholds stay), and it doubles as the persistent-gate-skip pager (a skipped cycle never rewrites reconcile.prom)
    noDataState: Alerting  # no series at all = the ops node, its Alloy, or the writer cycle is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful `zcrypto archive reconcile` cycle in over 3h. The reconciler is the only thing that heals primary gaps from the secondary -- while it is down, gaps accumulate unhealed and unmeasured. Runbook: infra/runbooks/ops.md#zcrypto-reconcile-exporter-stale"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "201"
      unit: "seconds since the reconciler last completed a run"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-ledger-scan-slow
    title: "Reconciler · the ledger scan has become the cost driver"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The ledger scan is O(ledger) and invisible inside cycle_duration until it dominates, which is
      # far too late to be a warning. 10 s is comparable to a whole cycle, so the ledger has stopped
      # being a rounding error and become the cost driver; it is not an outage (0.6% of the 1800 s
      # tick). PROVISIONAL -- a linear fit from infra/scripts/bench-ledger-scan.py, not a ledger ever
      # observed at that size.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_reconcile_ledger_scan_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10]}
    noDataState: OK  # absence = the cycle did not publish = zcrypto-reconcile-exporter-stale's page, not this one's
    execErrState: Alerting
    for: 0s  # the gauge only updates twice an hour -- one reading is already the signal
    annotations:
      summary: "Reading and summing the append-only ledger now takes over 10 s a cycle, which is comparable to what an entire cycle costs today. Nothing is broken and nothing is at risk yet: this is well under 1% of the 30-minute tick, and well under a tenth of the memory the host had available when the bar was set. It means the ledger has grown into the thing that dominates cycle cost, so the append-only-forever design is now worth revisiting rather than assumed. Re-measure first: infra/scripts/bench-ledger-scan.py reproduces the curve at any size, so the question is a command rather than an estimate. Runbook: infra/runbooks/ops.md#reconcile-ledger-scan-cost"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "207"
      unit: "seconds spent reading and summing the ledger"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-ledger-scan-critical
    title: "Reconciler · the ledger scan is approaching the memory it can spend"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Why a SECOND rule rather than a higher threshold on the one above: this is the memory failure,
      # and zcrypto-reconcile-cycle-duration structurally cannot see it. Every record is held as a dict
      # in a list at several times the file's on-disk size, so memory binds long before time does --
      # and a cycle the OOM reaper kills publishes nothing, leaving cycle_duration STALE rather than
      # high. PROVISIONAL -- the same fit as the rule above, and the bar also encodes ops's
      # MemAvailable, which moves independently of this repo: read it live as
      # node_memory_MemAvailable_bytes{host="ops"}, never MemFree, which is ~10x smaller.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_reconcile_ledger_scan_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [30]}
    noDataState: OK  # absence = the cycle did not publish = zcrypto-reconcile-exporter-stale's page, not this one's
    execErrState: Alerting
    for: 0s  # the gauge only updates twice an hour -- one reading is already the signal
    annotations:
      summary: "Reading and summing the append-only ledger now takes over 30 s a cycle. Time is not the problem -- memory is, and at this scan cost the ledger is holding roughly a quarter of the memory the host had available when the bar was set. Every record is held in memory at several times its size on disk, so at this scan cost the reconciler is claiming a large share of a host it shares with the panel materialiser and the replay jobs, and the failure when it arrives is abrupt: a cycle killed for memory publishes nothing, so the cycle-duration alert goes stale rather than high and cannot warn you. Act on this one rather than waiting for a louder signal. Runbook: infra/runbooks/ops.md#reconcile-ledger-scan-cost"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "207"
      unit: "seconds spent reading and summing the ledger"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-cycle-duration
    title: "Reconciler · cycle approaching its own tick"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The overlay-writer runs every 30 min; a cycle at 1500 s is 83% of that interval. Past 1800 s
      # the timer's trigger fires against a still-activating unit and is DROPPED, so the cadence
      # silently halves -- and nothing else pages below the exporter-stale rule's 3 h. This gauge is
      # published by the cycle itself, so absence is that rule's page, not this one's (noDataState OK).
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_reconcile_cycle_duration_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [1500]}
    noDataState: OK  # absence = exporter/cycle gone = zcrypto-reconcile-exporter-stale's page; double-paging one failure helps nobody
    execErrState: Alerting
    for: 0s  # one slow cycle is already the signal -- the gauge only updates twice an hour
    annotations:
      summary: "A reconcile cycle took over 1500 s against its 1800 s half-hourly tick. Past the tick the timer's next trigger is silently dropped and the booking cadence halves. Usually market-volume growth in the 48 h window. The linked panel charts the duration trend beside the count of window hours the cycle skipped -- that count is the discriminator: a healthy one means volume, a steady zero means the skip cache stopped engaging. Runbook: infra/runbooks/ops.md#zcrypto-reconcile-cycle-duration"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "201"
      unit: "seconds the last completed cycle took"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-residual-gap
    title: "Reconciler · residual gap increased (permanent loss)"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # PERMANENT LOSS. Residual seconds are silence that NEITHER mirror covered -- both_streams_silent
      # (the fleet went dark together) or total_loss (the hour is on neither host). No later cycle can
      # heal it: there is no witness, and L2 is unbackfillable. Any increase at all is worth waking up
      # for, hence `> 0` rather than a tolerance.
      #
      # The counter is derived by SUMMING an append-only ledger, so it normally only grows. The one
      # thing that DECREASES it is a deliberate ledger correction. Prometheus reads that decrease as a
      # counter reset, and a bare `increase()` would then report the whole post-reset value as fresh
      # permanent loss -- paging the highest-severity alert in the system on an artifact of a
      # correction. `and resets(...) == 0` fires only on an increase with NO reset in the window: a
      # genuine new loss is monotone and still fires; a correction is silenced for one window.
      # Cost of the 24h window, accepted deliberately: a real loss in the same window as a correction
      # or a ledger rebuild is delayed until the reset ages out, and a SECOND event inside one window
      # produces no state transition -- so this pages once per day rather than once per event. The
      # ledger is the per-event record; the page only has to reach a human. `or on() vector(0)` keeps
      # the healthy state an explicit 0 rather than NoData. See T0044.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: "(increase(zcrypto_reconcile_residual_gap_seconds_total[24h]) > 0 and resets(zcrypto_reconcile_residual_gap_seconds_total[24h]) == 0) or on() vector(0)"
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # the exporter-stale rule above owns "the reconciler is gone"; this one owns loss.
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Permanent L2 loss: silence NEITHER capture host covered -- unhealable, the data is gone. The counter books ABSENCE of data, not fault: a venue outage lands here exactly like a capture failure. TRIAGE FIRST -- read the verdict on the hour's both_streams_silent ledger record, or zcrypto_reconcile_dark_episode_seconds_total by verdict: venue_silent = the silence was upstream of both hosts; capture_divergent = one host missed what the other got, investigate the fleet; undetermined = treat as loss. Full steps, including the venue-status cross-check: Runbook: infra/runbooks/ops.md#zcrypto-reconcile-residual-gap"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "202"
      unit: "seconds of unrecoverable silence"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-source-lag
    title: "Reconciler · capture mirror lagging"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Per-mirror, so the alert instance names WHICH host went quiet -- `source="primary"` and
      # `source="secondary"` fire independently. This is dataflow-based and therefore independent of
      # both hosts' healthchecks.io dead-men: a host can keep pinging while its capture writes nothing.
      #
      # Threshold 3h against a measured normal of ~1h: a final only commits after its hour closes and
      # the NAS pulls hourly, so ~1-2h of lag is the healthy steady state. 3h means a mirror has missed
      # a whole cycle beyond that.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: max by (source) (zcrypto_reconcile_source_lag_seconds)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h
    noDataState: OK  # owned by the exporter-stale rule above
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "A capture mirror's newest committed final is over 3h old -- that host has stopped producing data, or its pull channel is broken. If it is the SECONDARY, the fleet has no witness and the next primary gap is permanent. Runbook: infra/runbooks/ops.md#zcrypto-reconcile-source-lag"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "201"
      unit: "seconds of mirror lag"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-healable-gap-rate
    title: "Reconciler · primary gap rate high (degrading host)"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The degrading-primary detector (T0003, resolved, records the origin).
      #
      # A primary that is quietly falling apart -- reconnecting constantly, dropping seconds at a time
      # -- trips NOTHING else: every gap is healed by the secondary, so residual stays flat; it keeps
      # pinging, so its dead-man stays green; it keeps producing finals, so source-lag stays low. The
      # RATE at which it needs healing is the only thing that reveals it.
      #
      # Reads `healable`, not `healed`: `healed_gap_seconds` counts minted repair only, so it reads 0
      # wherever minting is off, and `ops_reconcile_mint` selects the mode -- this signal must not
      # depend on the mode. `healable` counts the seconds the secondary WITNESSED and could cover, in
      # both modes.
      #
      # 600s/24h is a starting threshold, not a measured one: ~10 minutes of primary silence a day
      # that the secondary had to cover. Divided by the live pair count, so 600 really is 600
      # WALL-CLOCK seconds -- undivided it is a cross-stream sum that tightens silently with every
      # pair added. Re-derive the number only once the counters carry trustworthy steady-state
      # history; until then treat a firing as "look at the ledger", not as a verdict.
      #
      # `and resets(...) == 0` guards the same counter-reset hazard as the residual-gap rule (T0044),
      # and MORE so here: this window is 24h, so a ledger correction would false-page for a full day.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: "((increase(zcrypto_reconcile_healable_gap_seconds_total[24h]) > 0 and resets(zcrypto_reconcile_healable_gap_seconds_total[24h]) == 0) or on() vector(0)) / scalar(count(count by (pair) (zcrypto_capture_book_desynced)) or vector(1))"
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [600]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "The primary needed more than 10 minutes of healing in the last 24h. Every gap was covered, so nothing else fires -- but a host that needs this much healing is degrading. Check the reconcile ledger's would_mint/minted records for the pattern. Runbook: infra/runbooks/ops.md#zcrypto-reconcile-healable-gap-rate"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "202"
      unit: "seconds of healable silence per live pair over the last day"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  # --- Trade backfill: daily trade_id-contiguous healing over Kraken's public REST /Trades ---------
  # (spec 00053; T0052.) `zcrypto-trade-backfill-stale` below sets `noDataState: Alerting`, so it
  # pages immediately and continuously while no `zcrypto_trade_backfill_*` series exists -- push
  # these two only once the deploy that emits them has landed.

  - uid: zcrypto-trade-backfill-stale
    title: "Trade backfill · last success stale"
    ruleGroup: zcrypto-trade-backfill
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for this step, same shape as Gate/Reconciler `exporter stale` above: the step is
      # DAILY, so a healthy pass can be up to ~24h old between successes -- the threshold must clear
      # that cadence with room for one missed day, hence ~2 days rather than ~2x the gate/reconciler
      # hourly-cadence thresholds.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_trade_backfill_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}  # ~2 days -- tolerates the daily cadence plus one miss
    # Alerting: a vanished series here means the step stopped succeeding (or stopped running
    # altogether), which is itself the failure worth paging on -- same reasoning as the gate/reconciler
    # exporter-stale rules. See the block comment above for the pre-deploy push-order caveat this implies.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No clean `zcrypto archive backfill-trades` run in over ~2 days -- the daily step has been failing every cycle or has stopped running. Runbook: infra/runbooks/ops-node.md#zcrypto-trade-backfill-stale"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "402"
      unit: "seconds since the trade backfill last succeeded"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-trade-backfill-exit-nonzero
    title: "Trade backfill · non-zero exit code"
    ruleGroup: zcrypto-trade-backfill
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # This is the ONLY signal for a run that recorded errors (exit 1) or found the primary root
      # missing (exit 2) -- T0053's fix stamps the UTC day unconditionally (success or failure), so a
      # failed run no longer retries hourly; this metric, not a retry, is what carries the failure.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_trade_backfill_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the exporter-stale rule above already owns "the step stopped running/succeeding
    # at all" -- this one owns "it ran and recorded a failure", same split as the reconciler's
    # source-lag/healable-gap-rate rules deferring the dead-man case to their own exporter-stale rule.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The daily trade-backfill run recorded a non-zero exit code (1 = errors recorded, 2 = primary root missing). It no longer retries hourly -- this alert is the only signal. Runbook: infra/runbooks/ops-node.md#zcrypto-trade-backfill-exit-nonzero"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "401"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  # --- Ops node (spec 00054): the timer jobs, the logs pipeline, and the host itself ---------------
  # A rule armed before its metric exists sits silent forever, looking healthy -- push after the
  # deploy that emits the series. noDataState is per-rule, not boilerplate, and the split is a RULE,
  # not a count (counts go stale as rules are added): a rule whose job is to detect silence -- the
  # dead-men and staleness rules, where no data at all means the host, Alloy, a transport, or a timer
  # is gone -- uses Alerting, because for it silence IS the alarm; a rule that grades an outcome (exit
  # codes, ERROR log lines, load) uses OK, because it must not page a brand-new host for a job that
  # has simply never run yet.

  - uid: zcrypto-ops-archive-pull-stalled
    title: "Ops · archive-pull stalled (dead-man)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for the ops node's overlay-WRITER cycle. The unit and metric names are
      # historical -- the rsync mirror pull they were written for is retired (T0058) -- and are kept
      # because these rules are provisioned against them. archive-pull.timer fires at :12 and :42
      # (infra/ansible/roles/ops/templates/archive-pull.timer.j2), so 3h is ~6 missed half-hourly
      # cycles of headroom, the same reasoning as the Gate/Reconciler exporter-stale rules above. A
      # clean cycle AND a fail-closed gate-skip both bump last_success (a skip is a state, not a
      # fault); a PERSISTENT skip pages via the reconcile exporter-stale rule instead, which a
      # skipped cycle never refreshes.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - ops_archive_pull_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h; half-hourly timer at :12/:42, so ~6 missed cycles
    noDataState: Alerting  # no series at all = the host, Alloy, or the timer is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The ops overlay-writer cycle (historical name: archive-pull) has not completed for 3h --
        the host, the timer, or Alloy is gone. Reconcile + trade-backfill are not running, and
        nothing else owns that silence (a gate-skip still bumps this metric, so this is not a skip).
        Runbook: infra/runbooks/ops-node.md#zcrypto-ops-archive-pull-stalled
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "402"
      unit: "seconds since the archive pull last succeeded"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-archive-pull-exit-nonzero
    title: "Ops · archive-pull non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_archive_pull_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the dead-man rule above already owns "the cycle stopped running/succeeding
    # at all" -- this one owns "it ran and the reconcile step failed", same split as the
    # trade-backfill pair. T0058: rsync is gone, so the reconcile `docker run` (including a
    # leftover-container name conflict after a dockerd crash -- archive-pull.sh.j2's T0060 comment
    # names this alert as that failure's loud path) is the only thing that sets rc non-zero; a
    # gate-skip and a trade-backfill failure both leave rc at 0 (the backfill's loud path is its
    # own exit-code alert above).
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last ops overlay-writer cycle (historical name: archive-pull) recorded a non-zero exit code -- the reconcile step failed (image/digest problem, dockerd down, a leftover zcrypto-reconcile container, or the reconciler itself erroring). Gate-skips and trade-backfill failures do NOT trip this rule. Runbook: infra/runbooks/ops-node.md#zcrypto-ops-archive-pull-exit-nonzero"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "401"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verified-replay-stale
    title: "Ops · verified-replay stale"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Spec 00054 D9's rule. verified-replay.timer fires daily at 05:23 UTC
      # (infra/ansible/roles/ops/templates/verified-replay.timer.j2) -- 48h is 2 missed days, matching
      # the trade-backfill staleness rule's reasoning for a daily-cadence job.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - ops_verified_replay_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}  # 48h -- 2 missed daily cycles
    noDataState: Alerting  # no series at all = the host, Alloy, or the timer is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful verified-path journal replay in over 48h -- the daily replay has stopped running or has not succeeded in two cycles. Runbook: infra/runbooks/ops-node.md#zcrypto-ops-verified-replay-stale"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "402"
      unit: "seconds since the verified replay last succeeded"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verified-replay-exit-nonzero
    title: "Ops · verified-replay non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verified_replay_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the stale rule above already owns "the replay stopped running/succeeding at
    # all" -- this one owns "it ran and found a mismatch or a validation failure" -- critical, not
    # warning, because a verified-path mismatch means the canonical replay itself disagrees with the
    # journal, the same class of failure the Gate's mismatch rule pages critical for.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last verified-path journal replay recorded a non-zero exit code -- a replay mismatch or validation failure against yesterday's journaled cycles. Runbook: infra/runbooks/ops-node.md#zcrypto-ops-verified-replay-exit-nonzero"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "401"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verify-replay-new-breakage
    title: "Ops · verify-replay NEW hours stopped replaying"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # SUPERSEDES `Ops · verify-replay non-zero exit` (uid zcrypto-ops-verify-replay-exit-nonzero):
    # ops_verify_replay_exit_code stays 1 forever once any hour has ever failed, so that rule could
    # not tell a new finding from an already-triaged one and paged nightly for both. Split into two
    # rules instead (spec 00077 D1/D4): this one owns "a NEW hour stopped replaying that did not fail
    # in the prior sweep" (mode i); `Ops · verify-replay run broken` below owns "the sweep itself did
    # not complete" (mode iii). exit_code is deliberately no longer alerted on -- do not "restore" a
    # rule against it.
    #
    # A known bad hour is a CONSTANT in ops_verify_replay_failed_hours, so it contributes zero to the
    # delta; only a new failure moves the count. Same delta-over-a-window shape as `Gate · streak
    # reset` above.
    #
    # Known blind spot, deliberate: NO rule watches ops_verify_replay_reused (nor duration /
    # audit_mismatches) -- a busted checkpoint silently reverts every sweep to a full rescan while
    # all three rules read healthy. Reading `reused` stays a deliberately-human check on the ops host.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 90000, to: 0}  # 25h, matching the delta window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: delta(ops_verify_replay_failed_hours[25h])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}  # the failed-hour count went UP == a new hour broke
    # OK, not Alerting: the dead-man already owns "did the sweep run at all" -- a missing series
    # here is absence, not breakage. `Ops · verify-replay run broken` below pages on a broken
    # EVALUATION (the sweep ran but did not report), which is the other half of that distinction.
    noDataState: OK
    execErrState: Alerting
    for: 0s
    annotations:
      summary: >-
        The canonical archive replay found hour(s) that failed today which did NOT fail in the prior
        sweep -- a known bad hour re-failing does not trigger this. Read the per-hour warnings in the
        run's journal to see which hours, triage them, and record the finding durably: this alert
        ages out after 25h and is not itself a record.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-verify-replay-new-breakage
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "304"
      unit: "newly failed hours in the last 25 hours"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verify-replay-run-broken
    title: "Ops · verify-replay run broken"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # Mode (iii): the sweep itself did not complete, regardless of what it found -- a crashed
    # container, an EIO from the read-only NAS mount, or a container that never started (the T0060
    # name-conflict case). ops_verify_replay_run_ok is 1 iff the run produced a parseable summary;
    # on a broken run failed_hours/hours_total are carried forward unchanged (spec 00077 D2/D3), so
    # this rule -- not the one above -- is what stays loud while a run keeps failing to complete.
    # exit_code is deliberately no longer alerted on for this timer either (spec 00077 D1/D4).
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verify_replay_run_ok
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # OK, not Alerting: a missing series is the dead-man's job, not this rule's -- a brand-new host
    # must not page for a job that has simply never run yet, same reasoning the exit-code split
    # this supersedes already used.
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: >-
        The last canonical archive replay sweep did not run to completion, so today's findings are
        unknown, not clean. Likely causes: the container crashed, or the read-only NAS mount
        returned an I/O error.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-verify-replay-run-broken
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "301"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verify-replay-backlog-stuck
    title: "Ops · verify-replay backlog stuck"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # The incremental sweep (spec 00078) replays hours it has never seen unconditionally and drains
    # older CHANGED hours under a wall-clock budget; whatever the budget did not reach is reported as
    # `pending`. A backlog is normal and self-clearing -- a deliberate re-verification creates one by
    # design. What is not normal is one that stops SHRINKING, which means the instrument is degraded
    # (budget mis-set to 0, the drain broken, the state dir lost nightly), not that the data is bad.
    # Hence warning: nothing here says the archive is wrong, which is why spec 00077 D8's "no standing
    # known-bad-hours alert" precedent does not apply.
    #
    # The shape. 26h spans EXACTLY the last two nightly runs -- wide enough that night two's sample is
    # always inside it (24h plus slack for a late start), narrow enough that a third night's history
    # never is, so the sign of `delta` means "did the last run make progress" and nothing else.
    #
    # `for: 27h` is arithmetic, not taste. `pending` is a PERSISTENT textfile gauge -- the runner
    # prints it every run, so it is scraped continuously and holds its value between runs. The
    # condition goes true at the bump night's publish T1 and CANNOT go false until the window's left
    # edge passes T1: before then the window still contains a pre-bump sample, so `delta` stays
    # positive even after night two's decrease has landed. A healthy drain therefore holds this
    # condition true for exactly max(24h, window) = 26h, and `for` must STRICTLY exceed that -- even
    # `for: 26h` trips on a 26h-long true run. 27h leaves an hour of margin. Do not shorten it, and if
    # you widen the window, widen this too.
    #
    # Two query nodes rather than this file's usual one, because the condition is a conjunction:
    # without `$A > 0` a backlog drained to zero reads `delta == 0` forever and pages permanently on a
    # healthy fleet; without `$B >= 0` every night of a legitimate multi-night drain pages.
    condition: D
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verify_replay_pending_hours
          instant: true
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 93600, to: 0}  # 26h, matching the delta window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: delta(ops_verify_replay_pending_hours[26h])
          instant: true
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: math
          expression: "$A > 0 && $B >= 0"
          refId: C
      - refId: D
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "C"
          refId: D
          conditions:
            - evaluator: {type: gt, params: [0]}  # the math node is 1 iff BOTH halves hold
    # OK, not Alerting: a host that has never run the sweep publishes no pending series at all, and
    # the dead-man already owns "did it run" -- same posture as the two rules above.
    noDataState: OK
    execErrState: Alerting
    for: 27h
    annotations:
      summary: >-
        The nightly archive re-verification backlog is not shrinking. The sweep still runs, but hours
        queued for re-verification have not decreased across two nightly runs — the drain budget may
        be zero, the state directory lost, or the drain broken.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-verify-replay-backlog-stuck
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "304"
      unit: "hours still pending replay"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-tapebars-permanent-gap
    title: "Ops · tape-bars permanent gap"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The ONLY durable report of this event. A settled day that stayed unpublished until the
      # sweep window moved past it is gone from every other counter at exactly the moment its
      # absence became final -- days_unhealed stops counting it, the exit code stays 0, and the
      # dataset simply reads short forever. days_gap is computed from the calendar and the
      # published set, so it keeps reporting after the fact; this rule is what says it out loud.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 7200, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_tapebars_days_gap
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: before the first sweep the series does not exist, and the dead-man below
    # already owns "did it run at all".
    noDataState: OK
    execErrState: Alerting
    for: 1h
    annotations:
      summary: >-
        A settled tape-bars day was never published and has now fallen outside the re-scan window --
        it is a permanent hole in the dataset, and no other signal reports it. Read the runner log for
        the day and pair, then decide whether the trade archive can still be healed for it.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-tapebars-permanent-gap
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "405"
      unit: "days permanently missing"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-tapebars-not-advancing
    title: "Ops · tape-bars not advancing"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Deliberately LAST_PUBLISH, not last_success. The unhealed path exits 0 by design, so a
      # stalled healer would advance a success stamp hourly while the dataset froze -- the exact
      # green silence this timer's failure mode produces. last_publish moves only when a day is
      # actually written. A day becomes eligible ~26h after it ends, so publishing is ~daily;
      # 48h means two consecutive days produced nothing.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_tapebars_last_publish_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}
    noDataState: OK
    execErrState: Alerting
    for: 1h
    annotations:
      summary: >-
        tape-bars has published no new day for over 48 hours. The sweep may still be exiting 0 --
        an incomplete trade tape defers a day without failing -- so check the trade backfill and the
        archive before the materializer itself.
        Runbook: infra/runbooks/ops.md#zcrypto-ops-tapebars-not-advancing
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "402"
      unit: "seconds since the last published day"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-panel-exit-nonzero
    title: "Ops · panel non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Warning, not critical: the panel is DERIVED data, recomputable from the mirror on the next
      # healthy run -- a failed materialize costs freshness, not truth.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_panel_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last hourly panel materialize recorded a non-zero exit code -- the L2 panel is going stale (derived data; recomputable once the cause is fixed). Runbook: infra/runbooks/ops-node.md#zcrypto-ops-panel-exit-nonzero"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "401"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-load-high
    title: "Ops · node load high"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Scoped to host="ops": infra/ansible/roles/ops/files/config.alloy sets
      # `external_labels = { host = "ops" }` on prometheus.remote_write, so every metrics series this
      # Alloy ships carries host="ops" -- and `NAS · load high` above scopes itself `{host="nas"}`,
      # so the two rules partition the metric between the two hosts.
      #
      # Threshold: the ops box has 24 threads (specs 00050 and 00054), so the NAS rule's `gt 4` (100%
      # of its 4 cores) would not mean the same thing here. `gt 20` is ~83% of 24 threads rather than
      # 100%: ops runs several concurrent services (Alloy, the ops timers, the overlay writer) whose
      # transient overlaps are normal, so full-saturation would be noisier than on the NAS's
      # single-purpose box; 20 keeps the same "sustained saturation, not a transient burst" intent.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: node_load1{host="ops"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [20]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "1-minute load average on the ops node exceeds 20 of its 24 threads -- sustained saturation, not a transient burst. Runbook: infra/runbooks/ops-node.md#zcrypto-ops-load-high"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "201"
      unit: "as a 1-minute load average"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-error-logs
    title: "Ops · ERROR logs"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Same shape as `NAS · archive-pull ERROR logs` above (level LABEL, not a text grep -- the parse
      # stages strip the level out of the message line, so a grep would be silently blind;
      # `queryType: instant` for the same Loki-specific reason). It covers every container that ships
      # from the ops node: Alloy's own logs, the `zcrypto-*` units, and the liquidations poller, a
      # long-lived daemon whose errors flip NO exit-code metric, so this rule is its ONLY error channel.
      #
      # The container selector is BOUNDED rather than host-wide, and `zcrypto-.*` rather than an
      # enumerated unit list so a new unit is watched the day the journal keep-regex admits it. The
      # bound matters twice: a host-wide selector cannot say WHICH service errored, and under a storm
      # it is a distinct-line cardinality hazard in Loki query cost as well as in Slack message
      # length. Nothing ships from this host without an Alloy or compose change, and that change is
      # where the selector is extended.
      #
      # The `msg` label hoists the log MESSAGE onto the page, which is the whole reason a log alert
      # exists -- without it the page says "7" and the responder goes hunting. `printf "%.200s"`
      # bounds one message and `topk(5, ...)` bounds how many; topk is NOT optional, since without it
      # a log storm mints one alert instance per distinct line and blows past Slack's length limit.
      #
      # `| json message="message"` and NOT a bare `__line__`, because this selector spans BOTH line
      # shapes on this host: the liquidations poller direct-ships a JSON BODY (cli/logging/ship.py's
      # JsonLineFormatter) while the journal units arrive already flattened by Alloy's parse stage.
      # Reading `__line__` raw spends most of the 200 characters on the JSON preamble; the
      # `{{ if .message }}` fallback keeps the raw line for the already-flat streams, so one
      # expression serves both shapes. `| drop __error__, __error_details__` is required for the
      # reason `Capture · daemon ERROR logs` below records, and here it is also what ADMITS the
      # journal units at all -- `| __error__=""` would drop them instead.
      #
      # The `level` label reaches this rule via TWO independent paths: config.alloy's parse stages at
      # ingest for the `zcrypto-*` units and Alloy's own logs, and the poller's own direct-ship
      # handler at the source (cli/logging/ship.py: `level` = `record.levelname`, always present),
      # which Alloy is not in at all. NoData is normal here (quiet logs = healthy; liveness is owned
      # by the dead-men below), and `or on() vector(0)` keeps a clean window an explicit 0 anyway.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            topk(5, sum by (host, container, level, msg) (count_over_time({host="ops", container=~"alloy|liquidations|zcrypto-.*", level=~"ERROR|CRITICAL"} | json message="message" | drop __error__, __error_details__ | label_format msg=`{{ if .message }}{{ printf "%.200s" .message }}{{ else }}{{ printf "%.200s" __line__ }}{{ end }}` [15m]))) or on() vector(0)
          queryType: instant
          refId: A
      # Reduce A to a single value before the threshold -- same belt-and-braces A -> B(reduce) ->
      # C(threshold) chain as the NAS rule.
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "{{ if $labels.container }}ERROR/CRITICAL log lines from `{{ $labels.container }}` on the ops node in the last 15 minutes.{{ else }}ERROR/CRITICAL log lines from a container on the ops node in the last 15 minutes.{{ end }} One alert instance per distinct line, and at most 5 of them -- a storm may carry more lines than are shown here. For the liquidations poller this is the only error signal -- its failures flip no exit-code metric. Runbook: infra/runbooks/ops-node.md#zcrypto-ops-error-logs"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "102"
      unit: "ERROR or CRITICAL log lines in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-log-pipeline-dead
    title: "Ops · log pipeline dead (no parsed lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The canary that closes the ERROR-logs rule's green-when-blind gap for the Alloy-fed half of
      # its scope (Alloy's own logs plus the `zcrypto-*` units). Scoped to `container="alloy"`, NOT
      # host-wide: the liquidations poller direct-ships with its OWN `level` stamped at the source
      # (cli/logging/ship.py), bypassing Alloy entirely, so its ~5-min heartbeat alone would keep a
      # host-wide query green even if Alloy/loki.write died outright -- and a dead-man pinned green is
      # strictly worse than NoData, because NoData is visible. Alloy's own logfmt stream
      # (config.alloy's `{container="alloy"}` parse stage) is continuous while Alloy lives and cannot
      # be faked by anything the poller does, so the absence of ANY parsed line on it in 6h means
      # Alloy itself, or its own parse/ship path, is dead. Deliberately NOT `container=~"zcrypto-.*"`
      # either: on a fail-closed skip-gate streak (archive-pull.sh.j2) the unit emits only unleveled
      # echoes, so a level-filtered 6h query on the units alone would false-fire during a legitimate
      # long streak -- `zcrypto-ops-unit-parse-dead` below covers that stream at a wider 26h window.
      # `zcrypto-ops-journal-transport-dead` and `zcrypto-ops-poller-log-dead` below own the journal
      # transport and the poller's direct-ship path respectively. `or on() vector(0)` keeps the query
      # returning data while it is intact; execErrState Alerting still covers "Loki unreachable".
      #
      # `by (host)` is for the notification's label line and is INERT at fire time -- the fire path is
      # the unlabelled `or on() vector(0)` arm -- so the summary names host and container literally.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="ops", container="alloy", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK: a fires-on-silence dead-man of critical severity -- same posture and reason as
    # `zcrypto-engine-log-dead` above, where it is recorded in full.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED Alloy log line (any level label) from the ops node in 6h -- Alloy is quiet but never silent while alive, so this means Alloy itself is dead, its parse stage has regressed to level=-, or it cannot reach Loki. The margin here is thin and deliberately so: a healthy 6h window measured 7 to 9 lines over 14 days, roughly 1.5 an hour, so read a low count on this stream as a signal to look rather than as headroom. Scoped to Alloy only: the liquidations poller direct-ships and is watched separately (`Ops · poller log pipeline dead`), and the `zcrypto-*` units' own level-parse health is watched separately too (`Ops · unit log parse dead`). Runbook: infra/runbooks/observability.md#zcrypto-ops-log-pipeline-dead"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-poller-log-dead
    title: "Ops · poller log pipeline dead (no lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The liquidations poller is the ONLY ops workload that bypasses Alloy entirely (direct-ship,
      # spec 00068 D3/T6), and `zcrypto-ops-log-pipeline-dead` above is scoped to Alloy and so
      # structurally cannot see this container at all. Mirrors the capture hosts' own per-container
      # canaries: `level` comes from the poller's OWN direct-ship handler (cli/logging/ship.py:
      # `level` = `record.levelname`, always present, no regex, Alloy not involved), so <1 line in 6h
      # means the poller's ship path is dead (the --ship-logs flag lost at render time, its Loki
      # credentials dead, or the container gone) -- not a quiet host, since the poller runs
      # continuously on a ~5-min cycle. `or on() vector(0)` keeps the query returning data while
      # intact; `by (host)` is inert at fire time -- see `zcrypto-ops-log-pipeline-dead` above.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="ops", container="liquidations", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK: same fires-on-silence dead-man reasoning as the rules around it -- the
    # vector(0) fallback means this never evaluates NoData while intact, and if that ever breaks,
    # silence stays the alarm rather than parking green.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED log line from the liquidations poller (container=liquidations) on the ops node in 6h -- it direct-ships and runs continuously on a ~5-min cycle, so silence means its ship path is dead (the --ship-logs flag, its Loki credentials, or the container itself), not a quiet host. Runbook: infra/runbooks/observability.md#zcrypto-ops-poller-log-dead"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-unit-parse-dead
    title: "Ops · unit log parse dead (no leveled lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Covers the `zcrypto-*` units, which `zcrypto-ops-log-pipeline-dead` above cannot: a parse
      # regression on config.alloy's zcrypto stage (the stage.regex line-shape, the container
      # selector, the label scheme) leaves Alloy itself alive and its OWN logfmt stream flowing, so
      # that canary never notices while `Ops · ERROR logs` reads 0 = healthy for the unit streams.
      #
      # Deliberately level-filtered AND a wide 26h window (matching `zcrypto-ops-journal-transport-
      # dead`'s window below, for the same reason): during a fail-closed skip-gate streak archive-pull
      # emits only unleveled echoes, but panel-materialize (hourly) and verify-replay/verified-replay
      # (daily) run on independent schedules unaffected by that gate, so at least one `zcrypto-*` unit
      # produces a leveled line well within 26h even through an extended streak -- a 6h window on this
      # same selector would false-fire and was rejected for that reason.
      #
      # `by (host, container)` -- container is a REGEX here, so it is real information on the label
      # line rather than something the rule already knows. It does not change when this rule fires:
      # `count_over_time` yields no series at all for a silent container (never a zero), so one live
      # unit still leaves every series >= 1 and the `lt 1` false, exactly as a bare `sum()` would. It
      # is INERT at fire time like its siblings, so the summary names host and containers literally.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 93600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host, container) (count_over_time({host="ops", container=~"zcrypto-.*", level=~".+"} [26h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK: same fires-on-silence dead-man reasoning as the rules around it.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one LEVEL-PARSED line from any zcrypto-* ops unit in 26h -- they run on independent schedules (half-hourly/hourly/daily) so at least one always produces a leveled line inside that window while Alloy's zcrypto parse stage is intact; silence means that stage regressed (the line-shape regex, the container selector, or the label scheme) even though Alloy itself and its own logs (watched by `Ops · log pipeline dead`) stay healthy. Runbook: infra/runbooks/observability.md#zcrypto-ops-unit-parse-dead"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-journal-transport-dead
    title: "Ops · journal transport dead (no unit lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The journal-scoped companion to the canary above, which is scoped to `container="alloy"` and
      # so proves Alloy's OWN journald-driver stream is flowing, not that the SEPARATE journal-reader
      # path carrying the `zcrypto-*` units is intact. loki.source.journal is the SOLE carrier of those
      # units' logs, including the reconcile skip-gate warning this pipeline exists to ship, and the
      # failure modes are silent everywhere else -- a rebuilt host where /var/log/journal does not
      # exist (docker CREATES an empty dir for the bind mount, so Alloy starts fine and tails an empty
      # journal forever), journald flipping to volatile storage (/run/log/journal, outside the mount),
      # systemd-journal gid drift after an OS reinstall, or the keep regex going stale after a unit
      # rename -- because the units' exit-code and staleness metrics do not cover log SHIPPING.
      #
      # Scoping: `container="zcrypto-archive-pull"` can ONLY come from the journal path, because these
      # units run their work as an ephemeral `docker run --rm` ATTACHED to the unit (T0060,
      # config.alloy) -- their stdout is journal-stamped as part of the unit's own log stream, never a
      # separately discoverable container. So 26h of silence from this stream isolates the journal
      # transport specifically. Count ANY line, NOT level-parsed: the unit writes at least one line in
      # every code path (reconcile CLI INFO on the happy path, the skip-gate/failure echoes
      # otherwise), but its own echoes carry no level label, so a level-filtered query would
      # false-fire during a pull-failure streak. 26h = a full day of runs plus headroom. `by (host)`
      # is inert at fire time -- see `zcrypto-ops-log-pipeline-dead` above.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 93600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="ops", container="zcrypto-archive-pull"} [26h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting for the same dead-man reason as the canary above: the vector(0) fallback means this
    # never evaluates NoData while intact, and if that ever breaks, silence stays the alarm.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one journal-path log line from zcrypto-archive-pull on the ops node in 26h -- the half-hourly unit writes at least one line every run, so the journal transport (loki.source.journal) is dead: empty/volatile host journal, gid drift, or a stale keep regex. The `zcrypto-*` units' logs -- including the reconcile skip-gate warning -- are invisible until this is fixed. Runbook: infra/runbooks/observability.md#zcrypto-ops-journal-transport-dead"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  # ---- Capture hosts (zcrypto = primary + engine, zcrypto-red = secondary) --------------------
  # These hosts ship host metrics + container logs via Alloy (spec 00057 D5). The three CONTENT rules
  # (disk/load/error) carry host=~"zcrypto|zcrypto-red" (external_labels host=<hostname>,
  # roles/capture/files/config.alloy) and fire per host. They are noDataState: OK, deliberately UNLIKE
  # the NAS host-resource rules' Alerting, and stay OK permanently, because "this host's telemetry
  # went dark" is owned by the two per-host log-dead CANARIES below (noDataState: Alerting), not by
  # making each content rule page on NoData -- which would false-page on a transient Alloy
  # remote_write gap. Division of labor: the content rules own "bad while alive"; the canaries own
  # "this host's capture log plane is dark" -- a parse-chain regression on a live daemon (the T0060
  # class, which silently blinds the ERROR rule) OR that host's Alloy dying; the healthchecks.io
  # dead-man (withheld-ping, T0032; an independent failure domain) owns "the daemon itself died / the
  # disk actually filled". The canaries are PER-HOST (not one collective) because a SINGLE host's
  # Alloy death is otherwise invisible to everything: the content rules go NoData->OK and the daemon
  # keeps pinging the dead-man.
  - uid: zcrypto-capture-disk-low
    title: "Capture · spool disk low"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The unbackfillable L2 spool (/var/lib/zcrypto-capture) is on the root fs, which is why the
      # selector is mountpoint="/". 10% free is a wide EARLY warning that fires long before the
      # daemon's own 1 GiB DiskWatermark (whose breach withholds the dead-man ping, T0032) and the
      # ~14-day prune ring (spec 00050 D8): firing here means the ring broke or an unexpected
      # consumer appeared.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_filesystem_avail_bytes{host=~"zcrypto|zcrypto-red", mountpoint="/"}
            / node_filesystem_size_bytes{host=~"zcrypto|zcrypto-red", mountpoint="/"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.1]}  # < 10% free
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "A capture host's root filesystem (the unbackfillable L2 spool, /var/lib/zcrypto-capture) is below 10% free. Early warning -- the daemon's 1 GiB watermark + healthchecks dead-man are the last line. Check both prune timers (zcrypto-capture-prune for the spool, zcrypto-engine-journal-prune for the engine journal) and for an unexpected disk consumer. Runbook: infra/runbooks/hosts.md#zcrypto-capture-disk-low"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "301"
      unit: "of the spool filesystem still free (a fraction, not a percent)"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-reboot-pending
    title: "Capture · reboot pending (attended)"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The capture VPSes run unattended-upgrades with Automatic-Reboot "false" (T0027, spec 00071):
      # patches install, the reboot is a human act. That closes the risk of an unwatched reboot of
      # unbackfillable L2 capture -- and, on the primary, the live trade engine -- and opens the
      # opposite one: a kernel flag nobody notices. THIS rule is the whole reason the flip is safe.
      # It keeps firing until the human reboots; that persistence is the point, not a nuisance.
      # Published by the zcrypto-reboot-check timer as an explicit 0/1 -- never an absent series,
      # which would be indistinguishable from a dead exporter.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'node_reboot_required{host=~"zcrypto|zcrypto-red"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}  # == 1, pending
    noDataState: OK
    execErrState: Alerting
    # 15m: long enough that one failed publish does not page, short enough that a real pending
    # reboot surfaces the same hour. The collector re-serves the file on every scrape, so there is
    # no gap between 15-minute publishes to ride out.
    for: 15m
    annotations:
      summary: "A capture host has a pending reboot (/run/reboot-required) and will NOT reboot itself -- these hosts are attended. Schedule it: secondary first, verify it boots and captures, then the primary; off any 4h engine-cycle boundary, in the traffic trough, hosts >= 1h apart. Expect a ~83s capture gap; containers self-restart. Guidance in docs/reference/fleet.md. Runbook: infra/runbooks/hosts.md#zcrypto-capture-reboot-pending"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "503"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-textfile-missing
    title: "Capture · a one-off timer stopped publishing entirely"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The gap that hid a real defect: a STALENESS rule cannot fire on a series that never exists.
      # If a timer is disabled, its script fails every run, or its .prom is unreadable, the metric is
      # simply ABSENT -- and with noDataState: OK that reads green forever. count() over the expected
      # publishers turns absence into a value, which is the only shape that alerts on nothing.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'count(node_reboot_required{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [2]}  # both capture hosts must publish
    noDataState: OK
    execErrState: Alerting
    for: 20m
    annotations:
      summary: "A capture host has stopped publishing node_reboot_required entirely -- not stale, ABSENT. The attended-reboot safety net is down on at least one host: a pending kernel reboot would now go unseen. Check `systemctl status zcrypto-reboot-check.timer` on both hosts, then that the .prom exists in /var/lib/zcrypto-node-textfile and is mode 0644 (Alloy reads it as a non-root user). Runbook: infra/runbooks/hosts.md#zcrypto-capture-textfile-missing"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "503"
      unit: "of the two capture machines still publishing the probe"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-textfile-unreadable
    title: "Capture · node-exporter textfile unreadable or malformed"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Raised when the collector cannot parse OR cannot OPEN a .prom. The open case is not
      # theoretical: mktemp creates 0600 and `mv` preserves it, so a publisher missing an explicit
      # chmod publishes root-only and the non-root collector gets EACCES -- metrics silently gone.
      # This series was admitted to the keep-list before any rule watched it; this is that rule.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'max by (host) (node_textfile_scrape_error{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "Alloy's textfile collector cannot read or parse a .prom on a capture host, so that timer's metrics are absent while everything else looks healthy. Most likely the file is mode 0600 (mktemp's default -- the publisher needs an explicit chmod 0644) or was written malformed. Check /var/lib/zcrypto-node-textfile on that host. Runbook: infra/runbooks/hosts.md#zcrypto-capture-textfile-unreadable"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "502"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reboot-probe-stale
    title: "Capture · reboot probe is stale"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The reboot probe republishes every 15 min, so it gets its OWN threshold: sharing the daily
      # prune's 26h window would let the attended-reboot safety net sit dead for a day while
      # node_reboot_required served a frozen 0. 1h is ~4 missed runs.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - max by (host) (node_textfile_mtime_seconds{host=~"zcrypto|zcrypto-red", file=~".*/reboot.prom"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [3600]}  # 1 h ~= 4 missed runs
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The pending-reboot probe on a capture host has not refreshed in over an hour (it runs every 15 min), so node_reboot_required is a frozen last-known value, not current state. A kernel reboot could be pending and unreported. Check `systemctl list-timers zcrypto-reboot-check.timer` on that host. Runbook: infra/runbooks/hosts.md#zcrypto-reboot-probe-stale"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "501"
      unit: "seconds since the reboot probe last wrote its file"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-clock-exporter-stale
    title: "Capture · the clock reading has stopped refreshing"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # NOT covered: the .prom being DELETED. The mtime series then vanishes rather than
      # staling -- noDataState OK swallows a whole-query empty, and one host disappearing is not
      # noData at all, since `max by (host)` simply drops that dimension. The skew rule reads empty
      # as healthy too, so neither fires. Left as-is because the 5-min timer recreates the file:
      # persistent silence needs the textfile DIRECTORY gone, which also fails the script's mktemp.
      # Closing it properly is per-host absent() legs, not noDataState: Alerting, which would page
      # on any datasource blip. Both precedent staleness rules share this gap.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - max by (host) (node_textfile_mtime_seconds{host=~"zcrypto|zcrypto-red", file=~".*/clock-offset.prom"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [1800]}  # 30 min ~= 6 missed runs at the 5-min cadence
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The clock reading on a capture host has not refreshed in over 30 min (it writes every 5 min), so the offset and synchronised gauges are frozen at their last values and still look healthy. While this fires, the clock-skew alert is BLIND -- and that is the only detector for a leading clock. Check `systemctl list-timers zcrypto-clock-offset` on the host. Runbook: infra/runbooks/capture.md#zcrypto-capture-clock-exporter-stale"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "501"
      unit: "seconds since the clock exporter last wrote its file"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-oneoff-textfile-stale
    title: "Capture · daily one-off timer stopped publishing"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Staleness for the DAILY publishers only -- the journal prune (01:23 UTC). 26h = one missed
      # run plus margin. A stale .prom is NOT a scrape_error: the collector keeps serving the last
      # values forever, so without this the gauge reads healthy indefinitely.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - max by (host) (node_textfile_mtime_seconds{host=~"zcrypto|zcrypto-red", file=~".*/engine-journal-prune.prom"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [93600]}  # 26 h
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "The engine journal prune has not refreshed its .prom in over 26h -- its last run is more than a day old, so the retention it reports is a frozen value. Check `systemctl list-timers zcrypto-engine-journal-prune.timer` and the unit's journal on the primary. Runbook: infra/runbooks/hosts.md#zcrypto-oneoff-textfile-stale"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "501"
      unit: "seconds since the daily timer last wrote its file"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-book-desync-stuck
    title: "Capture · book desync stuck on a pair"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Recovery from a checksum desync is a BOUNDED LADDER (`cli/capture/desync_recovery.py`):
      # rung 1 resubscribes the pair on the not-was_desynced transition, then a grace, then rung 2
      # and a backoff, then a cooldown -- deliberately bounded, because retrying in a loop trips
      # Kraken's rate limit. So a pair still desynced at 15 min is one the whole ladder failed to
      # recover, not one attempt that went unretried. min_over_time, not max: a desync that HEALED
      # within the window has a 0 in it, so only a pair desynced for the whole 15 min fires -- the
      # stuck shape, not the transient one the daemon handles by itself.
      #
      # This is not one pair's problem. `gap_monitor.is_healthy()` is False while ANY pair has an
      # open gap and the healthcheck ping is gated on it, so one stuck pair silences this host's
      # dead-man for every pair -- the hc.io watchdog then fires and STAYS fired, and any later,
      # worse fault on the same host produces no new page while that signal is saturated. This rule
      # is what names the pair; the dead-man only says the host went quiet.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min_over_time(zcrypto_capture_book_desynced{host=~"zcrypto|zcrypto-red"}[15m])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "A capture pair's order book has been desynced for 15 min straight (paged after 20 min: a 15m window plus a 5m hold) -- the bounded recovery ladder ran and did not recover it. That pair's L2 is still being written but is no longer certified against Kraken's checksum, AND the desync silences this host's dead-man for all 12 pairs (is_healthy gates the ping), so hc.io is now saturated and will not page for anything else on this host. Fix: `docker restart zcrypto-capture` on the named host. The `pair` label names the stuck pair. Runbook: infra/runbooks/capture-daemon.md#zcrypto-capture-book-desync-stuck"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "101"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-resubscribe-rate
    title: "Capture · book resubscribe rate re-elevating"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The second half of T0008's trigger, self-evaluating. The desync rate this was written against
      # was OUR bug -- an unpruned book resurfacing phantom levels, fixed by the depth prune -- so a
      # resubscribe now is a genuine venue/network event and should be rare. More than one in a day
      # means either the rate is re-elevating or a pair is flapping desync/heal, neither of which the
      # stuck-pair rule above can see: it only catches a pair that never recovers, and at a 60 s
      # scrape a fast flapper reads as a heal.
      #
      # This counter carries no `pair` label (one series per host), so it says THAT the rate rose, not
      # which pair -- cross-reference zcrypto_capture_book_desynced to find it. `increase()` handles
      # the counter reset on container recreate.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_capture_resubscribes_total{host=~"zcrypto|zcrypto-red"}[1d])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # NOT [1]: increase() extrapolates to the window edges, so a SINGLE increment
            # returns ~1.0007 for any nonzero sample offset -- `> 1` would page on one genuine
            # self-healed venue desync, asserting a re-elevating rate that is not happening, and
            # stay firing for a day. 1.5 is silent at one and fires at two.
            - evaluator: {type: gt, params: [1.5]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "A capture host has resubscribed a book more than once in 24h. Post-2026-07-13 these should be rare genuine venue events, so a re-elevating rate suggests a regression or a pair flapping desync/heal. This counter has no pair label -- check zcrypto_capture_book_desynced by pair on that host to find which. Runbook: infra/runbooks/capture-daemon.md#zcrypto-capture-resubscribe-rate"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "103"
      unit: "resubscribes in the last day"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-resubscribe-failing
    title: "Capture · book resubscribe is failing (recovery degraded)"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The recovery ladder's resubscribe leg has an alert for how OFTEN it runs (above) and this one
      # for whether it WORKS. Both counters mean the ladder is degraded, differently: a rejected frame
      # (the venue answered subscribe/unsubscribe error, correlated by req_id) means the desync
      # recovery did not happen at all and the book stays stale; a missing unsubscribe ack means the
      # subscribe was sent blind into the race the ack exists to close, so the resubscribe may be
      # silently rejected downstream. Summed because the response is the same -- read the capture log
      # for which, the lines carry the pair.
      #
      # A rejection also logs at ERROR and so already reaches the capture ERROR-log rule; this exists
      # because the ack TIMEOUT logs at WARNING and reaches nothing, and because a rate is what
      # distinguishes one venue hiccup from a recovery path that has stopped working. `increase()`
      # handles the counter reset on container recreate.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'sum by (host) (increase(zcrypto_capture_resubscribe_errors_total{host=~"zcrypto|zcrypto-red"}[1d]) + increase(zcrypto_capture_resubscribe_ack_timeouts_total{host=~"zcrypto|zcrypto-red"}[1d]))'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 1.5, not 1: increase() extrapolates a single increment to ~1.0007, so `> 1` would page
            # on one transient rejection -- the same arithmetic recorded on the resubscribe-rate rule.
            - evaluator: {type: gt, params: [1.5]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "A capture host's book resubscribe is failing: the venue rejected the frames, or the unsubscribe acks are not arriving. The desync recovery ladder depends on this leg -- while it fails, a desynced book cannot heal and the pair keeps writing from a stale state. Check the capture log for the pair and the venue reply. Runbook: infra/runbooks/capture-daemon.md#zcrypto-capture-resubscribe-failing"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "103"
      unit: "failed resubscribes -- errors plus ack timeouts -- in the last day"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-all-streams-silent
    title: "Capture · every book stream on a host is silent"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The blackout class: every pair on a host silent at once while the WS reports connected, the
      # keepalive keeps completing round trips and the cumulative gap counter reads 0.0 -- so the
      # dead-man, the desync rule and the gap counter all sit green through a total blackout.
      #
      # The MINIMUM across pairs is the discriminator, and that is the whole design: one thin leg
      # being quiet is normal at any hour, every leg simultaneously is not, and nothing in the capture
      # path produces it -- so the bar can be tight here where a per-pair bar cannot be. The gauge
      # reads 0 for every pair at process start, so a restart cannot false-fire it either. What DOES
      # produce it is the venue, on a published calendar, which is why the answer is a runbook that
      # says "read the venue calendar first" rather than a wider bar.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min by (host) (zcrypto_capture_seconds_since_last_book_message{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 120 s. The pending period is NOT free here: the gauge is scraped every 60 s
            # (infra/ansible/roles/capture/files/config.alloy), so it advances one sample per minute
            # and the real silence at firing time is the bar + up to 60 s of scrape granularity + the
            # pending period + the group's eval interval. That is why `for` is 0s below, and why the
            # slack over the ~209 s motivating event is ~29 s rather than the 89 s a bar-only
            # subtraction suggests: the guaranteed detection floor is ~180 s of silence, not 120.
            # 120 is roughly twenty times the fleet-wide natural quiescence this gauge measures
            # outside venue windows. The platform's metric retention caps THIS GAUGE, never the
            # phenomenon: the parquet archive holds the whole capture era at full resolution and
            # `infra/scripts/gap_distribution.py` measures book silence from it, which is where a
            # future re-derivation starts. The two instruments BRACKET the envelope rather than pin
            # it -- neither is a basket-wide maximum for today's pairs, and none is owed.
            - evaluator: {type: gt, params: [120]}
    # OK: absence is owned by the dead-man and by `Fleet · Alloy dark`, matching every sibling
    # capture rule here.
    noDataState: OK
    # OK, and it is the SAME blindness class as noDataState above rather than a relaxation. When the
    # datasource errors the query never ran, so `Alerting` cannot report a blackout -- it asserts one,
    # in this rule's own words ("EVERY book stream ... silent for minutes"), about a fleet nothing
    # observed, and Grafana Cloud failing to reach its own Prometheus produced far more such firings
    # than genuine ones. `for: 0s`, load-bearing below, is what made a one-minute hiccup page instantly.
    #
    # Why not the guarded-summary form used on `zcrypto-capture-venue-state-recurrence`, which fixes
    # the same falseness with a `{{ if $labels.<x> }}...{{ else }}...{{ end }}` branch: it removes the
    # false CLAIM but not the volume, and here volume is the dominant term -- the per-pair rule mints
    # one instance per pair per host on every affected evaluation where that rule mints one or two.
    # Both halves matter, so the stronger instrument wins on these two specifically. A correlated
    # datasource outage is still reported by the sibling rules in this group that keep `Alerting`.
    #
    # THE RESIDUAL, stated rather than implied: a RULE-SCOPED evaluation error -- an expression
    # broken by a later edit, a permission or cardinality failure on this query alone -- pages
    # nothing, because the siblings above are only correlated cover. Nothing in the repo watches for
    # that, deliberately; the runbook section names the shape so it is recognizable.
    execErrState: OK
    # 0s, and it is arithmetic rather than impatience: a pending period is added directly to the
    # guaranteed detection floor, which a phase sweep over scrape x eval alignments showed already
    # misses the ~209 s motivating event at `for: 1m`. Nothing but real silence can put this minimum
    # over 120: `_run` seeds last_seen for every pair before the collector registers, so a restart
    # reads 0.0; a stop->start window replays the last healthy pre-stop sample through Prometheus'
    # lookback; a longer stop goes NoData, which `noDataState: OK` swallows; and remote-write lag can
    # only delay firing, never advance it. `zcrypto-capture-log-dead-primary` already carries 0s for
    # the same reason.
    for: 0s
    annotations:
      summary: >-
        EVERY book stream on this capture host has been silent for minutes — not one message on
        any pair, so this is the whole feed rather than one quiet leg. The socket stays connected, the
        keepalive keeps completing round trips and the dead-man keeps pinging right through this —
        none of them can see it. L2 is unbackfillable and every
        second here is permanent loss. Check the venue's published maintenance calendar FIRST — every
        firing of this rule so far has been one — then the capture container on the named host. The
        reconciler cannot say what was lost for about two hours; until then the capture log's gap start
        and gap end lines are the sharpest bound available, and both hosts showing the same window is
        the venue rather than the fleet.
        Runbook: infra/runbooks/capture.md#zcrypto-capture-all-streams-silent
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "102"
      unit: "seconds since ANY book stream on that machine last delivered"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-stream-silent
    title: "Capture · a book stream has stopped delivering"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The single-stuck-stream class, which nothing else catches: one pair has stopped delivering
      # while every other stream keeps flowing, so the dead-man pings, the all-streams rule above
      # reads its minimum off a healthy pair, and the desync rule sees no checksum failure. Nor does
      # the daemon heal it -- recovery is desync-driven only, so a stream that is silent while still
      # in sync stays silent (the evaluator's comment below reads both loops).
      #
      # Deliberately NOT aggregated: Grafana raises one instance per (host, pair) with both labels
      # intact, which is what lets the page name the stream. That is also why this rule can raise many
      # instances at once during a wide event -- the all-streams rule above is the one that says
      # "everything", this one says "which".
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'zcrypto_capture_seconds_since_last_book_message{host=~"zcrypto|zcrypto-red"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 300 s -- roughly twenty times the natural per-pair maximum, and ~10x the daemon's own
            # 30 s BOOK_STALENESS_SECONDS mark. Two independent instruments bracket that envelope:
            # this 60 s-sampled gauge, and the full-resolution parquet archive
            # (`infra/scripts/gap_distribution.py`, T0039), which is the binding one -- a 60 s scrape
            # censors short silences and is biased low, and the platform's retention caps THIS GAUGE
            # while the archive holds the whole capture era, so a future re-derivation starts there.
            # What 30 s actually is, read from the source, because the bar's warrant depends on it:
            # `_staleness_loop` BOOKS the silence (`monitor.start_silence`) and does nothing else.
            # Recovery -- resubscribe, then a forced reconnect -- is `_desync_recovery_loop`, which
            # skips every pair whose book is not `desynced`, and `is_healthy()` deliberately ignores
            # silence. So a silent-but-SYNCED stream is never resubscribed, never reconnected, and
            # never withholds the dead-man ping, at any age: it does not self-heal, which is exactly
            # why this rule is the only thing that catches it.
            # NO pending period, deliberately: the gauge advances one sample per minute, so a `for`
            # spends the notice budget rather than buying confidence -- the same arithmetic that took
            # `for: 2m` off the all-streams rule. Notice period is `300 + up to 60 s of scrape
            # granularity + the group's eval interval`, ~5-7 min, so the summary's "over five
            # minutes" is its floor. Four surfaces carry this number and move together: this
            # evaluator, the `for`, the summary's duration, and the data-integrity board's per-pair
            # panel.
            - evaluator: {type: gt, params: [300]}
    # OK: absence is owned by the dead-man and by `Fleet · Alloy dark`, matching every sibling
    # capture rule here.
    noDataState: OK
    # OK, for the reason given in full on the all-streams rule above. This rule is the volume half of
    # that reading: an execution error means the query never ran, yet `Alerting` here mints one
    # instance per pair per host on every affected evaluation, each naming a stuck stream that nothing
    # had observed.
    execErrState: OK
    for: 0s
    annotations:
      summary: >-
        One capture book stream has delivered nothing for over five minutes while its siblings keep
        flowing — the single-stuck-stream shape, which no other rule catches: the dead-man still pings,
        the desync rule sees no checksum failure, and a fleet-wide silence rule reads its minimum off a
        healthy pair. The `pair` label names the stuck stream. Check whether that pair's resubscribe went
        through; restarting the capture daemon re-establishes every stream. If every pair on both hosts
        raised this at once it is a whole-feed halt, not many stuck streams.
        Runbook: infra/runbooks/capture.md#zcrypto-capture-stream-silent
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "102"
      unit: "seconds since that stream last delivered a book message"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-watermark-breached
    title: "Capture · disk watermark breached -- DISCARDING data"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # A breached watermark does not merely warn: cli/capture/command.py's book and trade handlers
      # `continue`/`return` past the writers while it holds, so incoming L2 and trades are DROPPED.
      # That data is unbackfillable -- every second breached is permanent loss.
      #
      # It also gates the dead-man ping, so hc.io does fire -- but that page says "this host went
      # quiet", not "the disk hit the watermark and capture is discarding", and without this rule the
      # operator cannot tell those apart. The 1 GiB watermark sits BELOW the `Capture · spool disk
      # low` early warning (10% free), so that rule fires first only if the fill is gradual; a sudden
      # consumer can breach the watermark with disk-low still green.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'max by (host) (zcrypto_capture_disk_watermark_breached{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    # 0s, and it is arithmetic rather than impatience. The pending period is NOT free on this rule:
    # the daemon re-checks the watermark every 30 s in-process
    # (cli/capture/command.py's DISK_WATERMARK_INTERVAL_SECONDS) and Alloy scrapes the gauge every
    # 60 s (infra/ansible/roles/capture/files/config.alloy), so a true breach is already up to 90 s
    # old before its first `1` sample exists, before Grafana evaluates anything. A pending period adds
    # that much more GUARANTEED discard to every real page on an unbackfillable stream, and at one
    # sample per minute it would also blind the rule to any breach shorter than the window -- and a
    # breach that clears first is not a non-event: it dropped every message it lasted, and the only
    # thing that would have spoken is the dead-man saying "this host went quiet". Nothing false-fires
    # at 0s: the collector publishes the gauge straight off `watermark.breached`, so a `1` sample
    # means the handlers are ALREADY dropping messages.
    for: 0s
    annotations:
      summary: "CAPTURE IS DISCARDING DATA on this host: the disk watermark is breached, so the book and trade handlers drop every incoming message instead of writing it, and L2 is unbackfillable. This also withholds the dead-man ping, so hc.io is saturated and will not page for anything else here. Free space on the capture spool NOW -- check both prune timers and for an unexpected consumer. Runbook: infra/runbooks/capture-daemon.md#zcrypto-capture-watermark-breached"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "108"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-rows-quarantined
    title: "Capture · rows quarantined to .held"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Held rows spilled to a `.held` sidecar for an hour the oracle never CONFIRMED (spec 00103 D6).
      # NOT rows that "arrived after their hour was finalized" -- that is the opposite direction in
      # time, and such a row is dropped by the late-event guard and counted nowhere. The two real
      # causes: a lone stream in a sparse hour, where nothing ever seconds its hour, and a capture
      # process stopping inside CLOCK_WITNESS_MARGIN of a boundary. Baseline is zero, hence `gt 0`
      # with no rate bar. Spilled rows are kept and never deleted, but they sit OUTSIDE the canonical
      # tree -- the sweep, the merge, the recovery floor and `verify_tree` all skip a `.held` part --
      # and they are redeemed only when a live, quorum-confirmed stream next opens their hour.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_capture_rows_quarantined_total{host=~"zcrypto|zcrypto-red"}[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "A capture host spilled rows to a .held quarantine file in the last 6h -- rows parked for an archive hour that nothing ever corroborated, so they were written to a sidecar instead of into the canonical tree. Baseline is zero, so this is a real event. It is NOT rows arriving late: a genuinely late row is dropped, never spilled. Look for an hour carrying only one live stream, or a capture process that stopped within five minutes of an hour boundary. Nothing is lost -- the rows are kept and re-enter the tree when a corroborated stream next opens that hour. Runbook: infra/runbooks/capture.md#zcrypto-capture-rows-quarantined"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "105"
      unit: "rows spilled to .held in the last 6 hours"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  # --- The hour-rotation residuals (T0037, spec 00103) -------------------------------------------
  # Three rules, and they do NOT partition the space evenly: the early-finalization counter sees a
  # bogus stamp truncating an hour and a merely lagging clock IDENTICALLY, and it cannot see a
  # LEADING clock's truncation at all (spec 00103 D1b) -- the skew rule below is that fault's only
  # detector. The runbook entry `bogus-timestamp-hour-rotation` carries the whole map.

  - uid: zcrypto-capture-hour-finalized-early
    title: "Capture · an archive hour closed before the clock said it was over"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # T0037's residual (a) made visible (spec 00103 D1/D2/D3). Two streams each taking a
      # guard-passing but bogus stamp inside one hour's closing MAX_TS_AHEAD window meet the oracle's
      # quorum early; each stamped stream's live hour then publishes truncated, and permanently, since
      # a committed final is never reopened.
      #
      # WARNING, and `gt 0` with no rate bar, both deliberate. A clock LAGGING by less than
      # MAX_TS_AHEAD (5 min) closes every genuine boundary that early, which spec 00103 D3 rules a
      # true positive rather than noise to engineer away. No threshold separates the two causes: any
      # bar low enough to catch a two-stamp event sits far below the benign rate. The DISAMBIGUATOR
      # is zcrypto-capture-clock-skew read beside this rule, which is why the summary sends the
      # operator there instead of naming one cause.
      #
      # Earliness is structurally bounded by MAX_TS_AHEAD, so there is no second band and no
      # `beyond_window` sibling: such a rule would sit unfirable forever.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_capture_hour_finalized_early_total{host=~"zcrypto|zcrypto-red"}[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    # 15m keeps this out of the `for: 0s` set a one-minute datasource hiccup can fire, and costs no
    # detection -- the 6 h increase() window holds the condition true long after the event itself.
    for: 15m
    annotations:
      summary: "A capture host closed at least one archive hour before its own clock said that hour was over, in the last 6h. This signal alone CANNOT tell the two causes apart: either a bogus exchange timestamp closed the hour early and that stream's remaining rows for it were dropped -- permanent, unbackfillable loss -- or the host clock is simply running behind, which closes every genuine boundary early and costs nothing. Read zcrypto-capture-clock-skew beside this one before concluding either. It is also blind to the opposite fault, a clock running AHEAD, which hides its own truncation from this measurement: silence here is never a clean bill for the archive's hour boundaries. Runbook: infra/runbooks/capture.md#zcrypto-capture-hour-finalized-early"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "110"
      unit: "archive hours closed early in the last 6 hours"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-ts-past-dated-hour
    title: "Capture · a stream opened a past archive hour that held no captured data"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # T0037's past-dated residual (spec 00109 D1, which narrows spec 00103 D5's predicate). The
      # plausibility guard bounds the FUTURE direction only, so a stamp dated into a past, unpublished
      # hour is still trusted -- and a capture process's FIRST event is the only place one can act,
      # because from then on `floor` is the open hour and the late-event guard refuses anything behind
      # it. Acting means opening that past hour and committing a manifest-certified "complete" final
      # for a period nothing was captured in, possibly redeeming a quarantined `.held` spill on the way.
      #
      # ABSOLUTE VALUE, not increase(). The counter's only step lands on a stream's FIRST event,
      # seconds after the capture process starts, so its reset to 0 is never scraped: at 60 s scrapes
      # the series' first sample already carries the step and never re-enters any window below it, so
      # increase() over that shape reads 0 through a standing count. The value itself is therefore the
      # detection, and no rate bar belongs on it -- the counter can advance at most once per stream
      # per process, so a bar would measure how many streams were poisoned rather than whether one
      # was. CRITICAL is proportionate on the worst shape rather than the common one: a count can be
      # a benign restart that opened a past hour holding no parts, but where it is the fabrication
      # that hour is already certified on disk and nothing repairs it.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'max by (host) (zcrypto_capture_ts_past_dated_hour_total{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    # 5m absorbs the one-minute datasource transients and no more. A longer wait buys nothing rather
    # than costing detection: the counter never falls back inside a capture process's life, so a
    # condition true at 5m is still true later, and the wait would only delay the read.
    for: 5m
    annotations:
      summary: "A capture host opened an archive hour that was ALREADY PAST and held NO CAPTURED PARTS on disk when the stream's first event arrived -- the shape a bogus, past-dated exchange timestamp leaves. Committing such an hour publishes a manifest-certified 'complete' final for a period during which nothing was actually captured, and it can pull a quarantined .held sidecar in with it. A count is not by itself that fabrication: a restart whose first event replays a pre-restart print can open a part-less past hour too, so work the runbook's shape discrimination before concluding one. The value is cumulative over the capture process's life and does not decay: it clears when that capture process restarts, or when the host stops reporting at all, which pages on its own. While this page stands, a further open on the same host raises no second page -- one instance per host, and another step moves the measured value without changing a label -- so a measured value above the last page's is itself a new event. Do not attempt to repair the hour by hand. Runbook: infra/runbooks/capture.md#zcrypto-capture-ts-past-dated-hour"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "110"
      unit: "first events that opened a past hour holding no captured parts, since this capture process started"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-clock-skew
    title: "Capture · the host clock cannot be trusted"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # CRITICAL, and not because a drifting clock is itself an emergency. Spec 00103 D1b makes this
      # rule the SOLE detector for T0037's residual (b): a clock leading the true hour lets a bogus
      # stamp close an hour early AND subtracts its own lead back out of every clock-referenced
      # measurement, so zcrypto-capture-hour-finalized-early counts nothing while the archive is being
      # truncated. Only the precondition is observable -- and observable BEFORE the damage.
      #
      # 10 s is structural, not fitted: orders of magnitude above a disciplined clock's steady state,
      # and 30x below CLOCK_WITNESS_MARGIN (5 min), the lead at which the clock witness can start
      # seconding a bogus stamp.
      #
      # The host matcher is spelled out on BOTH legs on purpose: an unqualified selector would claim
      # the whole fleet and read NoData for every host that does not publish these families.
      #
      # `== bool 0` rather than a bare `== 0` on the sync leg is load-bearing: a bare filter
      # comparison returns the LEFT operand's VALUE, so an unsynchronised clock would arrive at the
      # threshold node as the number 0, which no `gt` evaluator can ever see. `== bool 0` yields 1
      # instead. The offset leg needs no such treatment: it returns `abs(...)`, already positive.
      # Healthy on both legs is an EMPTY result, hence noDataState: OK.
      #
      # A vanished series is not covered here: the textfile collector re-serves the last file
      # forever, so a dead exporter reads healthy. zcrypto-capture-clock-exporter-stale watches the
      # .prom's mtime for exactly that, and this rule is blind while that one fires.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'abs(zcrypto_clock_offset_seconds{host=~"zcrypto|zcrypto-red"}) > 10 or (zcrypto_clock_synchronised{host=~"zcrypto|zcrypto-red"} == bool 0) > 0'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    # 10m: a clock stepped once by a correction is not the fault this watches, and 30x below the
    # level where damage becomes possible there is no cost to waiting a transient out.
    for: 10m
    annotations:
      summary: "A capture host's clock is more than 10 seconds away from true time, or the host reports its clock unsynchronised. Nothing is lost yet -- this is a PRECONDITION, and it is the only signal that can see the archive fault a clock running AHEAD causes: it lets a bogus exchange timestamp close an archive hour early while hiding that earliness from every counter measured against the same wrong clock, so the early-close signal stays silent through it. The bar sits 30x below the skew at which that becomes possible, so there is time. Restore the host's time discipline, then check whether any archive hour closed short while the clock was off. Runbook: infra/runbooks/capture.md#zcrypto-capture-clock-skew"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "110"
      unit: "seconds of clock offset (or 1 when the host reports itself unsynchronised)"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-logship-lines-dropped
    title: "Logs · lines dropped before reaching Loki"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The log transport's own loss counter. Measured baseline over 7 d: ZERO on every host. A
      # nonzero value means log lines were discarded before Loki -- so the Loki-based rules
      # (capture-error-logs, log-dead-primary/secondary) are reasoning over an incomplete stream and
      # can go quiet for the wrong reason. This is the one fault that makes OTHER alerts unreliable.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_logship_dropped_lines_total[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "Log lines were dropped before reaching Loki in the last 6h. Baseline is zero. This matters beyond the lost lines: the Loki-based alert rules now reason over an incomplete stream, so their silence no longer means healthy. Check the shipper's backlog and the Loki push credentials on the named host. Runbook: infra/runbooks/observability.md#zcrypto-logship-lines-dropped"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "601"
      unit: "log lines dropped in the last 6 hours"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-venue-not-online
    title: "Capture · Kraken reports the venue is not online"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Deliberately a NEGATIVE match rather than an enumeration of known states: the payload shape
      # for a real outage is unobserved, and a rule listing `maintenance|cancel_only|...` would be a
      # guess that silently misses whatever Kraken actually sends. `!= "online"` cannot miss. The
      # daemon's counting path IS validated for unseen values -- tests/test_capture_upstream_silence.py
      # feeds synthetic `maintenance` and `cancel_only` frames and asserts a series per system value.
      #
      # PRESENCE, not increase(). An increase() form reads a counter only where a 0 sample precedes
      # the step INSIDE the window, and that needs three things at once: the series already exists,
      # the host has already published it at 0, and the step lands far enough after process start to
      # be scraped at 0 first. A label that materialises on the event fails the first; a host new to
      # an eagerly-published metric fails the second, its first sample already carrying the step; and
      # a start-correlated step fails the third, landing seconds after start where scrapes are 60 s
      # apart. The daemon emits a series only for `system` values it has actually seen and the frame
      # count per transition is not fixed, so whether an increase() form found a step would be decided
      # by scrape phase rather than by what the host saw -- it would sit green through the very event
      # this rule exists for, on whichever hosts the scrape happened not to favour.
      #
      # This LATCHES: the counter never decreases until the daemon restarts. That is deliberate -- the
      # point is to capture the first observation of a shape this fleet has never seen, and a
      # self-resolving rule can retire it before anyone reads the value.
      #
      # `by (host, system)`, not a bare sum(): collapsing `system` discarded the one label the
      # responder acts on -- `maintenance` (planned, wait) versus `cancel_only`/`post_only` (degraded,
      # act) demand opposite responses. Grouping preserves every property above, and the host scope
      # every sibling capture rule carries is added at the same time.
      #
      # The grouping is also why the fallback carries `on()`, and dropping it is the tempting edit:
      # `vector(0)` produces an UNLABELLED element, so a bare `or vector(0)` suppresses it only while
      # the left arm is unlabelled too. Once `by (host, system)` gives the left arm labels the two stop
      # sharing a signature, and the 0 rides through as a permanent extra series beside the real one
      # instead of being a mutually-exclusive fallback. `on()` matches on the empty label set, which
      # every element has, so the fallback is dropped whenever the left arm is non-empty and supplied
      # when it is empty -- keeping a clean fleet out of NoData, which is the only job it ever had.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'sum by (host, system) (zcrypto_capture_venue_status_total{host=~"zcrypto|zcrypto-red", system!="online"}) or on() vector(0)'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "{{ if $labels.system }}Kraken reported the trading venue is in state `{{ $labels.system }}` rather than `online`.{{ else }}This fired with no venue state attached, so treat the state as UNKNOWN rather than observed: either the query could not be evaluated, or a non-`online` state arrived without its label. Read the capture log's `venue status` line before acting on anything below.{{ end }} The state decides the response: `maintenance` is planned and you wait, `cancel_only`/`post_only` mean the venue is degraded and trading is restricted. Capture may be unaffected either way: a venue in maintenance can still stream book updates, and loss would show on the reconciler's counters, not this one. Do not restart or converge on this signal alone. Runbook: infra/runbooks/capture.md#zcrypto-capture-venue-not-online"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "108"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-venue-state-recurrence
    title: "Capture · Kraken reported a degraded venue state again"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The deliberate COMPLEMENT to zcrypto-capture-venue-not-online, which latches. That rule fires
      # on PRESENCE and never falls until the daemon restarts, so once a state has been seen its alert
      # instance sits in Alerting indefinitely -- and a SECOND occurrence of that same state merely
      # increments a counter whose instance is already firing, producing no new notification. On the
      # primary the latch has no scheduled clearing event at all: capture there is deliberately parked
      # on its digest, so a standing latch would mask every repeat for as long as that holds.
      #
      # increase() is exactly wrong as the PRIMARY form and exactly right as the SECOND one. The
      # sibling's comment explains why it cannot lead; that argument does not transfer to a series
      # ALREADY sitting at a non-zero value -- a 1 -> 2 step is an ordinary counter increase and
      # increase() reports it. So the split is NOT a clean partition and BOTH are needed: presence
      # catches every first sighting unconditionally (including the first after any restart, since the
      # counter is in-memory and resets with the process), while this form catches a first sighting
      # only where a scrape happens to land mid-burst, and every sighting thereafter. Swapping the
      # sibling out for this form would lose first-observation detection entirely.
      #
      # This one SELF-RESOLVES, the behavioural opposite of the latch, and that is the point: it
      # answers "is it happening again, right now?", so it must be able to say no. The [15m] window is
      # how long it stays up after the last sighting; `for: 5m` inside that leaves 10 minutes of margin
      # against the group's evaluation cadence. The window and `relativeTimeRange.from` must agree --
      # a test pins exactly that coupling, here and on the sibling increase()/delta() rules.
      #
      # `by (host, system)` and the `on()` fallback carry over from the sibling for the reasons
      # documented there.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'sum by (host, system) (increase(zcrypto_capture_venue_status_total{host=~"zcrypto|zcrypto-red", system!="online"}[15m])) or on() vector(0)'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "{{ if $labels.system }}Kraken reported the trading venue in state `{{ $labels.system }}` rather than `online` within the last 15 minutes -- a NEW sighting, not a standing latch.{{ else }}This fired with no venue state attached, so nothing was observed to recur: either the query could not be evaluated, or a non-`online` state arrived without its label. Read the capture log's `venue status` line before treating this as a recurrence at all.{{ end }} The sibling venue alert latches on the first sighting of each state and stays red until the capture daemon restarts, so it cannot tell you a degradation is recurring; this one clears itself once 15 minutes pass with no further sighting. The state decides the response: `maintenance` is planned and you wait, `cancel_only`/`post_only` mean the venue is degraded and trading is restricted. Capture may be unaffected either way: a venue in maintenance can still stream book updates, and loss would show on the reconciler's counters, not this one. Do not restart or converge on this signal alone. Runbook: infra/runbooks/capture.md#zcrypto-capture-venue-state-recurrence"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "108"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-logship-worker-stalled
    title: "Logs · the shipping worker has stopped cycling"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Liveness, and deliberately NOT the ship-success gauge: the worker skips the push when the
      # buffer is empty, so last_success goes stale whenever logging is merely quiet -- which is what
      # a healthy capture daemon looks like. This gauge advances on an idle cycle too, and stalls only
      # while the worker is stuck RETRYING (5xx/429/network) or wedged. The worker cycles every
      # second; 5 min is ~300 missed cycles.
      #
      # A permanently-rejected batch (non-429 4xx -- a revoked token, a wrong path) still completes a
      # cycle and still advances this gauge; that fault is zcrypto-logship-lines-dropped's, which
      # counts exactly those discards. Two questions, two rules.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_logship_last_cycle_timestamp_seconds'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [300]}
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The log-shipping worker on the named host has not completed a cycle for over 15 minutes -- either it is stuck retrying a push it cannot complete, or the worker thread is wedged, so logs are queueing and every Loki-based alert on this host is now silent for the wrong reason. Look for a Loki endpoint that is unreachable or erroring, not for rejected credentials: a rejected push still completes a cycle and would leave this rule green, showing up instead as dropped log lines. Runbook: infra/runbooks/observability.md#zcrypto-logship-worker-stalled"
      __dashboardUid__: "zcrypto-integrity"
      __panelId__: "602"
      unit: "seconds since the shipping worker last cycled"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-node-collector-failed
    title: "Node · a node-exporter collector is failing"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # 0 means that collector errored on its last scrape, so its whole metric family goes quietly
      # ABSENT -- and every rule keyed on those series then evaluates NoData, which this fleet maps
      # to OK. A failed `filesystem` collector silently disarms the disk-low rule; a failed
      # `textfile` collector silently disarms every one-off timer alert.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min by (host) (node_scrape_collector_success)'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "A node-exporter collector is failing on this host, so its entire metric family is absent -- and rules keyed on those series evaluate NoData, which this fleet maps to OK. Any alert depending on them is silently disarmed right now. Check Alloy's logs on the named host for the failing collector. Runbook: infra/runbooks/observability.md#zcrypto-node-collector-failed"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "402"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-load-high
    title: "Capture · node load high"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # NORMALIZED per core, because the two capture boxes differ in core count: dividing load1 by the
      # host's core count (count of idle-mode node_cpu_seconds_total series) makes one threshold mean
      # the same on both, and `on(host) group_left()` matches the per-host count onto load1's richer
      # label set. > 1.5 per core sustained 10m is clear saturation (a runaway or thrashing process),
      # not the seconds-long hourly pull spike, which `for: 10m` outlasts.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_load1{host=~"zcrypto|zcrypto-red"}
            / on(host) group_left()
            count by (host) (node_cpu_seconds_total{host=~"zcrypto|zcrypto-red", mode="idle"})
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [1.5]}  # > 1.5x per core, sustained
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "1-minute load average per core on a capture host exceeds 1.5x its cores, sustained 10m -- runaway/thrashing, not the transient hourly pull (the capture daemon is light, ~0.1/core baseline). Runbook: infra/runbooks/hosts.md#zcrypto-capture-load-high"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "201"
      unit: "as a 1-minute load average per core"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-error-logs
    title: "Capture · daemon ERROR logs"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Loki, level LABEL not a text grep -- no regex anywhere in this path (spec 00068 D4). The
      # capture daemon's logs get their level label from its OWN direct-ship handler
      # (cli/logging/ship.py: `level` = `record.levelname` at the source, pushed straight to Grafana
      # Cloud Loki -- Alloy is not in this path at all). Scoped to container="capture": the daemon on
      # both hosts, whose errors (desync storms, ENOSPC, reconnect failures) are the soak-critical
      # signal. Out of scope here: Alloy self-errors, a separate instrument-health concern, and the
      # engine's logs, owned by `zcrypto-engine-error-logs`. `sum by (host, ...)` names the firing
      # host; `or on() vector(0)` keeps a clean window an explicit 0. This rule fires on the COUNT arm
      # only, so unlike the two dead-men below its labels are genuinely populated when it pages.
      #
      # The `msg` label hoists the log MESSAGE onto the page -- the whole reason a log alert exists;
      # without it the page says "3" and the responder goes hunting on the unbackfillable stream.
      # `printf "%.200s"` bounds one message and `topk(5, ...)` bounds how many; topk is NOT optional,
      # because a desync storm emits one distinct line per pair per event and without the bound each
      # mints its own alert instance and blows past Slack's length limit.
      #
      # `| json message="message"` and NOT a bare `__line__`: this daemon direct-ships a JSON BODY
      # (cli/logging/ship.py's JsonLineFormatter -- ts/level/logger/file/line/message), so the raw line
      # spends most of the 200 characters on the JSON preamble and truncates the message mid-sentence.
      # A page carrying metadata and no message is worse than one carrying no line at all: it LOOKS
      # like it answered the question.
      #
      # `| drop __error__, __error_details__` is required even though EVERY line on this selector is
      # JSON today, and it must not be simplified away: `| json` stamps `__error__="JSONParserErr"` on
      # any line it cannot parse and the query then fails with HTTP 400 -- one unparseable line takes
      # the whole rule to execErrState. Clearing the label instead is impossible (Loki rejects
      # `label_format __error__=...` outright) and `| __error__=""` would silently DROP the offending
      # lines, which on this rule are exactly the ones worth seeing. The `{{ if .message }}` fallback
      # is the same insurance one stage later.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            topk(5, sum by (host, container, level, msg) (count_over_time({host=~"zcrypto|zcrypto-red", container="capture", level=~"ERROR|CRITICAL"} | json message="message" | drop __error__, __error_details__ | label_format msg=`{{ if .message }}{{ printf "%.200s" .message }}{{ else }}{{ printf "%.200s" __line__ }}{{ end }}` [15m]))) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR/CRITICAL log lines from the capture daemon (container=capture) on a capture host in the last 15 minutes -- desync storms, ENOSPC, or reconnect failures on the unbackfillable stream. Zero is the healthy baseline. One alert instance per distinct line, and at most 5 of them -- a storm may carry more lines than are shown here. Runbook: infra/runbooks/capture-daemon.md#zcrypto-capture-error-logs"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "102"
      unit: "ERROR or CRITICAL log lines in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  # Two per-host canaries that make the ERROR rule above trustworthy (mirror zcrypto-ops-log-pipeline-dead).
  # The ERROR rule selects on the `level` label, which exists ONLY because the capture daemon's OWN
  # direct-ship handler attaches it at the source (cli/logging/ship.py, spec 00068 D3/D4) -- so if
  # that ship path regresses (the T0060 class: the label scheme drifting, or the handler/formatter
  # itself breaking), its lines stop arriving with a usable level and the ERROR rule reads 0 = healthy
  # FOREVER. These fire on the absence of ANY parsed capture line (level matching anything). Scoped to
  # container="capture" -- NOT host-wide -- on purpose: a capture-side regression leaves Alloy's OWN
  # leveled lines (its journald-driver stream) flowing, so a host-wide canary would stay green in
  # exactly the blind state this exists to page on. One rule per host: Loki cannot synthesize a
  # per-host zero (an absent stream is no series, not a 0 series), so `or on() vector(0)` only injects
  # a 0 for a SINGLE-host query -- a `sum by(host)` would fire only when BOTH hosts go dark and miss a
  # single host's outage. The `by (host)` each of the two carries is NOT that: each selector still
  # names one host, so the aggregation cannot span the pair. It is there for the notification's label
  # line only, and it is INERT at exactly fire time -- the fire path is the unlabelled fallback arm --
  # which is why each summary names its host in words rather than interpolating `$labels.host`.
  - uid: zcrypto-capture-log-dead-primary
    title: "Capture · log pipeline dead — Capture primary"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="zcrypto", container="capture", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting (not OK): a fires-on-silence dead-man, same posture and reason as
    # `zcrypto-engine-log-dead` above, where it is recorded in full.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED capture-daemon log line (any level) from the capture PRIMARY in 6h -- the daemon emits ~35/hr, so its log plane is dead (the daemon's --ship-logs path down, its Loki credentials dead, or the container gone). The Capture · daemon ERROR logs rule is blind on this host until fixed. Runbook: infra/runbooks/observability.md#zcrypto-capture-log-dead-primary"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-log-dead-secondary
    title: "Capture · log pipeline dead — Capture secondary"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host="zcrypto-red", container="capture", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED capture-daemon log line (any level) from the capture SECONDARY in 6h -- the daemon emits ~35/hr, so its log plane is dead (the daemon's --ship-logs path down, its Loki credentials dead, or the container gone). The Capture · daemon ERROR logs rule is blind on this host until fixed. Runbook: infra/runbooks/observability.md#zcrypto-capture-log-dead-secondary"
      __dashboardUid__: "zcrypto-logs"
      __panelId__: "103"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  # Fleet · Alloy dark (T0079) -- one rule per host, all `critical`. Uniform severity is deliberate:
  # the responder's action is identical on every host (SSH, check the container, restart), so a
  # differentiated severity would imply a differentiated response that does not exist. What differs is
  # only what accumulates unseen meanwhile, which the per-host summary states. These own "not
  # shipping" only.
  # The other case -- Alloy alive but its discovery wedged, the T0048 shape -- is detected by
  # nothing here since `zcrypto-alloy-docker-sd-wedged` was retired (spec 00068 D6/D8).

  # --- memory, watched as a ROUTINE and never as a rollout read --------------------------------------
  # The four rules below replace the capture-image bake's hand-read RSS rows, which every converge
  # voided and which never found a real leak (T0151). They run regardless of converges and across the
  # FLEET: both capture daemons, the engine, and the ops liquidations poller -- the app-daemon
  # headroom rule below excludes Alloy, which gets its own rule covering the four Alloy containers.
  # A bake owes no memory read; a rollout is closed at gate-close.
  - uid: zcrypto-fleet-memory-headroom
    title: "Fleet · a daemon is near its memory limit"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # RSS as a fraction of the CONTAINER limit -- the only number that says "how long until the
      # OOM-kill", which is a leak's one real harm. No metric carries the limit (no cadvisor here:
      # config.alloy says why), so the denominators are literal bytes, one leg per (host, job),
      # unioned with `or`; tests/test_infra_alert_rules.py pins each literal to the ansible var that
      # renders the compose file (capture_memory_limit, engine_memory_limit), so a limit moved in
      # ansible fails the test rather than silently re-scaling this ratio.
      # Alloy is NOT here -- it has its own rule below, at its own bar, because it genuinely runs
      # near its ceiling where these do not. DELIBERATELY ABSENT: the ops liquidations poller
      # (`liquidations_app`), whose compose sets no memory limit, so there is no ceiling to measure
      # headroom against; it is covered by the leak and restart rules below. The NAS archive-pull
      # container exposes no metrics at all.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            (process_resident_memory_bytes{host="zcrypto", job="capture_app"} / 2147483648)
            or (process_resident_memory_bytes{host="zcrypto-red", job="capture_app"} / 1073741824)
            or (process_resident_memory_bytes{host="zcrypto", job="engine_app"} / 1073741824)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 0.7 of the limit is the owner's bar (2026-08-28). The capture daemons sit at ~0.07 of it
            # today, so this fires only on a process that has been growing for a long time -- which
            # is exactly the case the hand-read bands were trying to catch, on any image at any age.
            - evaluator: {type: gt, params: [0.7]}
    # OK: absence is owned by the dead-man and by `Fleet · Alloy dark`, matching every sibling
    # capture rule here.
    noDataState: OK
    execErrState: Alerting
    # A ratio over 0.7 persists; five minutes costs no detection and keeps this rule out of the
    # `for: 0s` set a one-minute datasource error can fire.
    for: 5m
    annotations:
      summary: >-
        A daemon in the fleet is using more than 70% of its container memory limit and will be
        OOM-killed if that keeps climbing. The `job` label says which daemon, `host` which machine. This is
        the slow-leak alarm: read the growth-per-day panel to see how long it has been climbing, and read
        the pins file for what image it has been running since. Runbook: infra/runbooks/fleet.md#zcrypto-fleet-memory-headroom
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "601"
      unit: "fraction of the container memory limit"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-fleet-alloy-memory-headroom
    title: "Fleet · Alloy is near its memory limit"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Alloy gets its OWN bar because it genuinely runs near its ceiling and the app daemons do not:
      # a shared 0.7 bar with them would page ops on a HEALTHY fleet, at every evaluation. ops took a
      # LARGER CAP rather than a looser bar -- `ops_alloy_memory_limit` is 1g and this leg divides by
      # it -- because ops reads the most journal (reconcile, panel, verify-replay, tape-bars,
      # liquidations). The other three stay at 512m: the capture hosts already commit most of their
      # RAM in caps, so headroom there is not free the way it is on ops.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            (process_resident_memory_bytes{host="ops", job="integrations/self"} / 1073741824)
            or (process_resident_memory_bytes{host=~"zcrypto|zcrypto-red|nas", job="integrations/self"} / 536870912)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 0.9 = GOMEMLIMIT / container cap on every host: crossing it means RSS has passed the Go
            # soft limit and is heading for the cgroup limit. The consequence of the ceiling
            # is an OOM-kill taking telemetry dark, which `Fleet · Alloy dark` already owns at 10 m --
            # so this is the EARLY warning for that fault, not its detector.
            - evaluator: {type: gt, params: [0.9]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: >-
        Grafana Alloy on a fleet host is using more than 90% of its container memory limit — 1 GiB on ops, 512 MiB elsewhere. Alloy runs
        closer to its ceiling than the app daemons do by design, and the `host` label says which machine. If it is OOM-killed that
        host's telemetry goes dark, which `Fleet · Alloy dark` reports separately; this is the warning before that.
        Runbook: infra/runbooks/fleet.md#zcrypto-fleet-alloy-memory-headroom
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "601"
      unit: "fraction of Alloy's container memory limit"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-fleet-memory-leak
    title: "Fleet · a daemon's memory floor rose a day on"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Read the hourly FLOOR, never a sample -- the segment-rotation sawtooth spans several MiB and
      # swamps a point read. Compare across a 24 h band -- steps arrive as ~4 h ramps and their repeat
      # lands a day later at the same clock offset, so a shorter window reads a trough as a plateau.
      # And gate the rule OFF on process age for the first 30 h after a restart -- 24 h band + 6 h
      # pending -- because `offset 24h` addresses the series by its labels, which a restart does not
      # change: without the gate the subtraction reads the PREDECESSOR process's floor, so a new
      # image's larger steady working set would page as a leak, and at the 24 h anniversary a warm
      # floor would be compared against the converge-time cold one. The gate is `and on(host, job)`,
      # so a host or job with no start time recorded cannot fire either.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            (
              min_over_time(process_resident_memory_bytes{host=~"zcrypto|zcrypto-red|ops|nas", job=~"capture_app|engine_app|liquidations_app|integrations/self"}[1h])
              - min_over_time(process_resident_memory_bytes{host=~"zcrypto|zcrypto-red|ops|nas", job=~"capture_app|engine_app|liquidations_app|integrations/self"}[1h] offset 24h)
            )
            and on(host, job)
            ((time() - process_start_time_seconds{host=~"zcrypto|zcrypto-red|ops|nas", job=~"capture_app|engine_app|liquidations_app|integrations/self"}) > 108000)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # PROVISIONAL: 64 MiB of floor growth in a day. No real leak has ever been measured on
            # this fleet, so there is no distribution to derive from; the number is sized so that a
            # daemon starting at ~150 MiB would take over a week to reach the headroom bar above,
            # giving this rule a week of notice ahead of that one. What derives the real value: the
            # first leak this fires on, or thirty days of floor deltas read from panel 602.
            - evaluator: {type: gt, params: [67108864]}
    noDataState: OK
    execErrState: Alerting
    # Six hours sustained: a single step that then plateaus stays over the bar for up to a day and
    # is worth one look; a step that reverts within the pending period was the sawtooth.
    for: 6h
    annotations:
      summary: >-
        A daemon in the fleet has been using at least 64 MiB more memory than it was a day ago, for
        six hours running, measured on hourly floors so the normal hour-boundary sawtooth cannot cause
        this. Nothing is broken yet: this is the early warning for a slow leak, well ahead of the memory-limit
        page. Read the growth-per-day panel and the pins file for which image the daemon has been running
        since. Runbook: infra/runbooks/fleet.md#zcrypto-fleet-memory-leak
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "602"
      unit: "bytes of hourly-floor growth over 24 hours"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-fleet-daemon-restarted
    title: "Fleet · a daemon restarted"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # `RestartCount` was a bake abort signal read by hand on the host; it has no metric (no
      # cadvisor). `process_start_time_seconds` is kept and moves on every restart, which is the same
      # fact from inside the process. A converge restarts on purpose and this pages once for it --
      # an attended converge's own record in the channel. Any other firing is the OOM-kill or a
      # crash, and nothing else reports either: the container is back in seconds, the dead-man
      # keeps pinging, and the log-dead rules never see a gap that short.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'changes(process_start_time_seconds{host=~"zcrypto|zcrypto-red|ops|nas", job=~"capture_app|engine_app|liquidations_app|integrations/self"}[15m])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    # `changes(...[15m])` stays above 0 for fifteen minutes after the restart, so two minutes of
    # pending period costs no detection and keeps this out of the `for: 0s` set.
    for: 2m
    annotations:
      summary: >-
        A daemon in the fleet restarted in the last 15 minutes — `job` says which: a capture or engine
        daemon, the ops liquidations poller, or Alloy itself (`integrations/self`). If a converge or an Alloy
        bump just ran on that host, this is that action's own record and needs nothing. If nothing was converged, the daemon was OOM-killed or crashed and came
        back on its own — read `RestartCount` on the container and the memory panels, and check whether
        parquet is advancing. Runbook: infra/runbooks/fleet.md#zcrypto-fleet-daemon-restarted
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "601"
      unit: "daemon process starts in the last 15 minutes"
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-alloy-dark-nas
    title: "Fleet · Alloy dark — NAS"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # `{host="nas"}` (spec 00069 D7): the NAS's config.alloy sets
          # `external_labels = { host = "nas" }` on prometheus.remote_write, as ops and both capture
          # hosts already do.
          # Fires on SILENCE: when this host's Alloy stops shipping, its `up` series goes stale and
          # then absent, `count()` yields no vector, and `or on() vector(0)` supplies the 0 that trips
          # the threshold. `count()`, not `sum()`: `up` is a scrape-health gauge whose VALUE can be 0
          # while Alloy is alive and shipping -- presence of the series is the "shipping" signal, and
          # count() reads presence regardless of value. The fallback (rather than a bare `absent()`)
          # is what lets noDataState stay Alerting -- a raw `absent()` returns NO data while healthy,
          # so it would need noDataState: OK and would then park green if the datasource itself went
          # away.
          expr: >-
            count(up{host="nas"}) or on() vector(0)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting
    execErrState: Alerting
    # 10m tolerates a deploy restart (Alloy is down for seconds, but the series can gap a minute or
    # two) while still beating the ~3h the logs dead-man took to notice the 2026-07-15/16 T0048
    # incident. Prometheus staleness alone is ~5m, so the effective notice is ~15m.
    for: 10m
    annotations:
      summary: "The NAS's Alloy has shipped no metrics for >10m — its telemetry plane is dark, taking out the gate metrics the Stage-6a soak verdict is read from and the NAS archive-pull's log stream (the reconciler is unaffected: its series publish from ops since 2026-07-16). Every OTHER rule scoped to this host is now blind, so their silence means nothing until this clears. First checks: `docker ps` on the host, then `docker logs grafana-alloy`; a restart is the usual fix. Runbook: infra/runbooks/observability.md#zcrypto-alloy-dark-nas"
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "101"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

