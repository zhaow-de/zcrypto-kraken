# Grafana alert-rule provisioning source (spec 00049, Role B / Task 4) for the one canonical
# dashboard's series (infra/grafana/zcrypto-dashboard.json). Pushed by infra/scripts/grafana-push.sh,
# ONE rule per `POST`/`PUT /api/v1/provisioning/alert-rules[/:uid]` call against Grafana's
# **Alerting Provisioning HTTP API** -- that endpoint takes a single alert-rule JSON object per
# call; it is NOT the `apiVersion: 1` / `groups:` file-provisioning shape (that shape is for
# Grafana's config-file provisioner only and is rejected by this HTTP endpoint, which isn't
# usable on Grafana Cloud SaaS anyway). This file is YAML (superset of JSON) purely for the
# inline comments -- the script converts it to the API's per-rule JSON before each push. See:
#   https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/http-api-provisioning/
#   https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/alerting_provisioning/
#
# Each rule's `data` array is a query node (refId A, the Prometheus/Loki datasource, an instant
# query so it already reduces to one number) feeding a `type: threshold` expression node (refId
# C, datasourceUid `__expr__`). The threshold node's own model field is **`expression`**, not
# `expr` -- Grafana's threshold expression (pkg/expr `ThresholdCommand`) reads `expression` to
# find which prior refId to compare; an empty/misnamed field errors "no variable specified to
# reference" and hard-fails the rule's condition on every evaluation.
#
# Placeholders wired at deploy time (see infra/nas/README.md for the vaulted Grafana Cloud creds
# this instance already uses). These are literal `${VAR}` tokens that infra/scripts/grafana-push.sh
# substitutes from its own environment before sending each rule -- Grafana's alert-rule
# provisioning API has no server-side template substitution (unlike the dashboard JSON's
# `${DS_PROMETHEUS}`/`${DS_LOKI}` variables, which Grafana itself resolves on dashboard import):
#   - `${GRAFANA_PROM_DS_UID}` / `${GRAFANA_LOKI_DS_UID}` -- the two datasource UIDs on the
#     already-provisioned Grafana Cloud instance.
#   - `${GRAFANA_ALERT_FOLDER_UID}` -- the folder UID the rules provision into (the API needs
#     the folder's UID, not its display name).
#   - `notification_settings.receiver: metrics` (or `logs` for Loki-sourced rules; the `logs`
#     receiver disables resolve messages -- log alerts resolve by aging, a resolve ping is noise)
#     (both receivers' underlying Slack webhook is provisioned separately, not committed here).
#
# Per-rule noDataState/execErrState reasoning: the four gate rules and the two host-resource
# rules default to Alerting on both no-data and exec-error -- for these, a vanished series
# (Alloy down, textfile exporter dead, cadvisor/node-exporter dead) is itself the failure worth
# paging on, same posture as docs/specs/00043-observability-design.md's disk/memory/CPU rules.
# The ERROR-logs rule uses `or on() vector(0)` (00043's own pattern) so a clean window evaluates
# to 0 rather than NoData, and is marked noDataState: OK to match -- a blanket no-data->alert
# would otherwise leave it permanently firing when healthy.
rules:
  - uid: zcrypto-gate-streak-reset
    title: "Gate · streak reset"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # SUPERSEDES the old "Gate · not MET" rule (uid zcrypto-gate-not-met), which alerted on
    # `zcrypto_gate_status == 0`. That rule's own NOTE conceded the flaw and it duly bit: the gate
    # is MET only after >=14 consecutive clean days, so `status == 0` is the CORRECT, EXPECTED state
    # for the entire accumulation window -- it would have emailed daily for ~12 days to report that
    # we were, correctly, still waiting. That is alarm fatigue, and it trains the reader to ignore
    # gate alerts exactly when one of them matters. It was also redundant: the real failure modes
    # already have their own rules (mismatch / exporter stale / journal pull lag).
    #
    # The signal that actually means something BROKE is the streak going BACKWARDS. `streak_days`
    # only ever increments (a clean complete UTC day) or resets to 0 (a day failed), so a negative
    # delta IS the failure, and nothing else produces one. It fires once on the break and
    # auto-resolves as the 6h window rolls past -- one alert per broken run, not a drumbeat.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}  # 6h, matching the delta window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: delta(zcrypto_gate_streak_days[6h])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0]}  # the streak went BACKWARDS == a clean run broke
    # OK, not Alerting: a missing metric means the exporter is dead, which `Gate · exporter stale`
    # already pages for. Alerting here too would just double-page the same fault.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The Stage-6a clean-day streak went BACKWARDS — a clean run broke and the >=14-day gate clock
        has restarted. (The gate merely being not-MET while it accumulates is normal and no longer alerts.)
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-mismatch
    title: "Gate · mismatch in the last day"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: increase(zcrypto_gate_mismatch_total[1d])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "At least one replay mismatch/validation failure in the last 24h of journaled cycles."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-pull-lag
    title: "Gate · journal pull lag high"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_gate_journal_pull_lag_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [21600]}  # 6h. DERIVED (T0069), not copied: the metric is now-minus-newest-journaled-cycle, so
            # its floor is the ENGINE's 4h cycle cadence, not pull health -- measured 30d ceiling 14767s (4.10h), p99 14512s, 175 samples
            # above 4h and ZERO above 4.5h. A pull period is 3600s + work (work p95 78s, max 791s on a post-recreate cold rebuild), so the
            # old 18000 sat only ~0.9 periods above the ceiling: one slow or missed cycle at a near-ceiling moment paged with nothing wrong.
            # 21600 = ceiling + one worst-case missed cycle + margin. A genuinely stalled pull grows lag without bound, so detection costs
            # ~1h, not correctness. Keep in lockstep with gate-export's --lag-fail-seconds default -- that one gates the hc.io dead-man ping.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The newest journaled cycle is more than 6h old -- the NAS journal pull is stuck or the VPS engine has stalled."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-exporter-stale
    title: "Gate · exporter stale"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_gate_export_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [7200]}  # 2h -- no successful gate-export run in that window
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful `zcrypto engine gate-export` run in over 2h -- the NAS archive-pull loop or the gate-export step itself is broken."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-cache-reverify-stalled
    title: "Gate · cache re-verification stalled"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    # The gate cache (spec 00060) skips replay_cycle on a fingerprint hit -- and that replay is the
    # ONLY place the journal's parquet bytes are re-hashed (the NAS pull uses --no-verify and
    # delegates to it). Spec 00062 therefore force-replays a rotating ~1/24 slice each run so the
    # whole journal is re-verified about daily. THIS RULE IS THAT MECHANISM'S ONLY WITNESS: if the
    # rotation stops, a stalled cache is indistinguishable from a healthy one except through this
    # number. Note save_cache logs a warning and continues on write failure, so a full disk presents
    # as a working cache with invalidated=0 and a quietly-ageing age here (T0077).
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_gate_cache_oldest_verification_age_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 3d. A full rotation is ~24h, so this is ~3 sweeps of slack: late enough that a skipped
            # hour or a restart never pages, early enough that a genuinely stopped rotation surfaces
            # long before the evidence is meaningfully stale.
            - evaluator: {type: gt, params: [259200]}
    # OK, NOT Alerting -- deliberately unlike its zcrypto-gate siblings. gate-export emits this
    # metric only when --cache is active and non-empty. It IS deployed on the NAS as of 2026-07-20,
    # so the series normally exists there; OK still stands because the metric is legitimately absent
    # whenever the cache is off (any other invocation, or the first run after a container recreate
    # discards the ephemeral cache), and paging on those is noise. "The exporter vanished entirely"
    # is already owned by zcrypto-gate-exporter-stale above, so nothing is lost by this choice.
    noDataState: OK
    execErrState: Alerting
    # 15m rather than the 5m its zcrypto-gate siblings use: the underlying value is monotonic and the
    # threshold is 3-day-scale, so a longer window costs no meaningful detection time while absorbing
    # a restart or a skipped hour without a transient page.
    for: 15m
    annotations:
      summary: "The gate cache's oldest cycle has not been re-verified for over 3 days -- the rotating re-verification has stopped, so cached gate verdicts are being served against parquet bytes nobody has re-hashed. Check zcrypto_gate_cache_replayed (should be >0 every run) and the NAS disk."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-disk-low
    title: "NAS · /volume1 free space low"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_filesystem_avail_bytes{mountpoint="/volume1"}
            / node_filesystem_size_bytes{mountpoint="/volume1"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.1]}  # < 10% free
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "/volume1 has less than 10% free space -- the archive keeps growing into it."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-load-high
    title: "NAS · load high"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # Scoped to host="nas" (re-keyed from the old empty-value matcher, spec 00069 D7):
          # ops's Alloy also ships node_load1 (it sets `external_labels = { host = "ops" }` on
          # prometheus.remote_write), and ops is a 24-thread box whose normal working load would
          # trip this Atom-sized `gt 4` threshold constantly. The NAS's config.alloy now sets
          # `external_labels = { host = "nas" }` too (it used to carry no `host` label at all,
          # selected via an empty-value "label absent" matcher instead), so an explicit
          # `host="nas"` selects the NAS's copy of the series only, same partition as before.
          expr: node_load1{host="nas"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # The NAS Atom has 4 cores (infra/nas/README.md) -- 1-min load above that is
            # sustained saturation, not a transient burst.
            - evaluator: {type: gt, params: [4]}
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "1-minute load average exceeds the NAS's 4 cores."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-archive-pull-errors
    title: "NAS · archive-pull ERROR logs"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Selects on the `level` LABEL, not a `|= "ERROR"` grep of the line. Alloy now parses our
      # Python log format at ingest (infra/nas/config.alloy) and strips the level out of the message,
      # so a text grep for "ERROR" would match NOTHING — silently blind, exactly the failure this rule
      # already had once. The label also catches `critical`, which the grep never did.
      # `queryType: instant` is load-bearing and Loki-specific: the `instant: true` MODEL field that
      # the Prometheus rules above use is a Prometheus-datasource setting, and Loki ignores it. Without
      # this the query ran as a RANGE query and returned a time series, so the threshold node rejected
      # it with "invalid format of evaluation results ... looks like time series data, only reduced
      # data can be alerted on" -- the rule was erroring instead of evaluating.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({container="archive-pull", level=~"ERROR|CRITICAL"} [15m])) or on() vector(0)
          queryType: instant
          refId: A
      # Reduce A to a single value before the threshold. Belt-and-braces alongside the instant query:
      # this is the canonical A -> B(reduce) -> C(threshold) chain Grafana's own UI emits, and it keeps
      # the rule valid even if the datasource ever hands back a series again.
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR-level log lines from the archive-pull container in the last 15 minutes."
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  - uid: zcrypto-nas-archive-pull-stalled
    title: "NAS · archive-pull stalled (dead-man)"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The DEAD-MAN, and the only rule that fires on SILENCE. Every other rule needs the archive-pull
      # container to still be alive and talking: `NAS · archive-pull ERROR logs` fires on an ERROR
      # line, so it is green when the container is gone, the pull loop has exited, or the NAS is down
      # -- i.e. exactly when nothing is protecting the unbackfillable archive any more. This one
      # inverts that: it fires when the loop STOPS saying it succeeded.
      #
      # `failed=0` is load-bearing, not decoration. Matching `pull complete` alone would ALSO be
      # satisfied by (a) the JOURNAL pull -- "archive pull complete (no verify) ..."
      # (cli/archive/command.py:104) -- and (b) a CAPTURE pull whose hash verification FAILED, because
      # :109 logs "pull complete ... failed=N" *before* the :118 check raises. Either would hold this
      # rule quiet while the capture mirror -- the unbackfillable thing it exists to protect -- was not
      # advancing at all. The journal line carries no `failed=` field, and a verify failure carries a
      # non-zero one -- but `failed=0` is NOT capture-specific any more: the LIQUIDATIONS, PANEL, and
      # (since the OPS-5 cutover, spec 00054 D4) RECONCILED pulls all run `zcrypto archive pull` WITH
      # verification in this same
      # container and emit the identical clean line, so any one of them keeps this dead-man green
      # even if BOTH capture channels are broken. Known, accepted gap: a broken capture pull fails
      # LOUDLY every cycle, so capture-specific failure is deliberately delegated to the
      # warning-severity ERROR-logs rule above; this rule owns total silence (loop dead, container
      # gone, NAS down, log pipeline dark). Tightening the LogQL to a capture-tree match (the line
      # carries source= naming the tree -- source only; dest= appears on the --no-verify journal
      # line, never on this one) would make it capture-specific again if that gap is
      # ever deemed worth closing.
      #
      # 3h window against a pull that runs hourly (`${ARCHIVE_PULL_INTERVAL:-3600}` in
      # infra/nas/pull-entrypoint.sh): the loop gets three chances to report before this pages, so a
      # single slow or restarted cycle is not enough to wake anyone.
      #
      # `or on() vector(0)` is what makes the dead-man work at all: when the container is gone Loki
      # returns NO series, and a bare `sum(count_over_time(...))` would then evaluate to NoData
      # rather than to zero -- the rule would sit in NoData instead of firing, which is the precise
      # failure it exists to catch. The `or` substitutes an explicit 0, which trips the `lt 1` below.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 10800, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({container="archive-pull"} |= "pull complete" |= "failed=0" [3h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting  # NoData here means the log pipeline itself died -- that IS the alarm
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "archive-pull has not reported a successful pull for 3h -- the loop, the container, the NAS, or the log pipeline is down. The L2 archive is unbackfillable; the NAS mirror is going stale."
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  # --- Reconciler: the redundant capture secondary + gap healing (spec 00050 Role C, task 11) -------
  # Pushed only after the `zcrypto_reconcile_*` series were confirmed VISIBLE in Grafana Cloud. A rule
  # armed before its metric exists evaluates against nothing and sits silent forever, looking healthy
  # -- the same class of failure as T0034. Alloy's keep-regex must carry `zcrypto_reconcile_.*` or the
  # series never leave the NAS (infra/nas/config.alloy).

  - uid: zcrypto-reconcile-exporter-stale
    title: "Reconciler · exporter stale"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for the reconciler itself. Every other rule below reads a metric the reconciler
      # publishes, so all of them go quiet -- not red -- if it simply stops running. This one inverts
      # that: it fires on the silence. The textfile is scraped in place, so a dead reconciler leaves the
      # last value being scraped forever; only the TIMESTAMP reveals it, which is why the gauge exists.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_reconcile_last_success_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h. Since the OPS-5 cutover the series comes from the ops half-hourly overlay-writer (:12/:42), so this is ~6 missed cycles -- kept as provisioned deliberately (T0058 consensus: thresholds stay), and it doubles as the persistent-gate-skip pager (a skipped cycle never rewrites reconcile.prom)
    noDataState: Alerting  # no series at all = the ops node, its Alloy, or the writer cycle is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful `zcrypto archive reconcile` cycle in over 3h. The reconciler is the only thing that heals primary gaps from the secondary -- while it is down, gaps accumulate unhealed and unmeasured."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-residual-gap
    title: "Reconciler · residual gap increased (permanent loss)"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # PERMANENT LOSS. Residual seconds are silence that NEITHER mirror covered -- both_streams_silent
      # (the fleet went dark together) or total_loss (the hour is on neither host). No later cycle can
      # heal it: there is no witness, and L2 is unbackfillable. Any increase at all is worth waking up
      # for, hence `> 0` rather than a tolerance.
      #
      # The counter is derived by SUMMING an append-only ledger, so it normally only grows. The one
      # thing that DECREASES it is a deliberate ledger correction (e.g. the classifier-bug record purged
      # with the owner's approval on 2026-07-14, 6261.8 -> 2661.8 s). Prometheus reads that decrease as a
      # counter reset, and a bare `increase()` would then report the whole post-reset value as fresh
      # permanent loss -- paging the highest-severity alert in the system on an artifact of a correction.
      # The `and resets(...) == 0` guard suppresses exactly that: the rule fires only on an increase with
      # NO reset in the window. A genuine new loss is monotone (no reset) and still fires; a correction
      # (reset) is silenced for one window. Cost: a real loss in the same window as a correction is
      # delayed until the reset ages out -- and that window is now 24h, not 1h, so the blind spot after
      # any ledger correction or rebuild is a full day. Accepted deliberately, because at 1h the page
      # self-resolved to MissingSeries an hour after firing on a real 2,437 s loss; the dashboard panel
      # shows the trend regardless. The other side of the same widening: a SECOND event inside the same
      # 24h produces no state transition, so this pages once per day rather than once per event -- the
      # ledger is the per-event record, the page only has to reach a human.
      # `or on() vector(0)` keeps the healthy state an explicit 0 rather than NoData. See T0044.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: "(increase(zcrypto_reconcile_residual_gap_seconds_total[24h]) > 0 and resets(zcrypto_reconcile_residual_gap_seconds_total[24h]) == 0) or on() vector(0)"
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # the exporter-stale rule above owns "the reconciler is gone"; this one owns loss.
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Permanent L2 loss: silence that NEITHER capture host covered. This cannot be healed or backfilled -- the data is gone. Check the reconcile ledger for the records behind it: both_streams_silent or total_loss for correlated loss, or a minted/would_mint hour whose splice left seconds unfilled -- any of the three can drive this."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-source-lag
    title: "Reconciler · capture mirror lagging"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Per-mirror, so the alert instance names WHICH host went quiet -- `source="primary"` and
      # `source="secondary"` fire independently. This is dataflow-based and therefore independent of
      # both hosts' healthchecks.io dead-men: a host can keep pinging while its capture writes nothing.
      #
      # Threshold 3h against a measured normal of ~1h: a final only commits after its hour closes and
      # the NAS pulls hourly, so ~1-2h of lag is the healthy steady state. 3h means a mirror has missed
      # a whole cycle beyond that.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: max by (source) (zcrypto_reconcile_source_lag_seconds)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h
    noDataState: OK  # owned by the exporter-stale rule above
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "A capture mirror's newest committed final is over 3h old -- that host has stopped producing data, or its pull channel is broken. If it is the SECONDARY, the fleet has no witness and the next primary gap is permanent."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-healable-gap-rate
    title: "Reconciler · primary gap rate high (degrading host)"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The degrading-primary detector, and T0003's outstanding gap-rate-alert item.
      #
      # A primary that is quietly falling apart -- reconnecting constantly, dropping seconds at a time --
      # trips NOTHING else: every gap is healed by the secondary, so residual stays flat; it keeps
      # pinging, so its dead-man stays green; it keeps producing finals, so source-lag stays low. The
      # RATE at which it needs healing is the only thing that reveals it.
      #
      # Reads `healable`, not `healed`: minting is OFF for the whole T0039 soak, so `healed_gap_seconds`
      # (minted only) is pinned at 0 exactly when this signal is most needed. `healable` counts the
      # seconds the secondary WITNESSED and could cover, in both modes.
      #
      # 600s/24h is a starting threshold, not a measured one: ~10 minutes of primary silence a day that
      # the secondary had to cover. Divided by the live pair count, so 600 really is 600 WALL-CLOCK
      # seconds -- undivided it was a cross-stream sum, i.e. ~50 s at 12 pairs, tightening silently with
      # every pair added. The number itself is re-derived only once the counters carry trustworthy
      # steady-state history; until then treat a firing as "look at the ledger", not as a verdict.
      #
      # `and resets(...) == 0` guards the same counter-reset hazard as the residual-gap rule, and MORE so
      # here: this window is 24h, so without the guard a ledger correction would false-page for a full
      # day. A rebuild of the ledger resets this counter too. See T0044.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: "((increase(zcrypto_reconcile_healable_gap_seconds_total[24h]) > 0 and resets(zcrypto_reconcile_healable_gap_seconds_total[24h]) == 0) or on() vector(0)) / scalar(count(count by (pair) (zcrypto_capture_book_desynced)) or vector(1))"
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [600]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "The primary needed more than 10 minutes of healing in the last 24h. Every gap was covered, so nothing else fires -- but a host that needs this much healing is degrading. Check the reconcile ledger's would_mint/minted records for the pattern."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  # --- Trade backfill: daily trade_id-contiguous healing over Kraken's public REST /Trades ---------
  # (spec 00053, iter-100; T0052). Provisioned in this file BEFORE the NAS deploy that will first
  # emit `zcrypto_trade_backfill_*` -- unlike the reconciler block above (pushed only once its
  # series were already confirmed visible), these two rules must not be pushed yet either, for the
  # opposite-looking but equally bad reason: `zcrypto-trade-backfill-stale` below sets
  # `noDataState: Alerting`, and with no series at all yet that would page immediately and forever
  # until the NAS deploy happens. Push only after that deploy confirms the series are visible.

  - uid: zcrypto-trade-backfill-stale
    title: "Trade backfill · last success stale"
    ruleGroup: zcrypto-trade-backfill
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for this step, same shape as Gate/Reconciler `exporter stale` above: the step is
      # DAILY, so a healthy pass can be up to ~24h old between successes -- the threshold must clear
      # that cadence with room for one missed day, hence ~2 days rather than ~2x the gate/reconciler
      # hourly-cadence thresholds.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_trade_backfill_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}  # ~2 days -- tolerates the daily cadence plus one miss
    # Alerting: a vanished series here means the step stopped succeeding (or stopped running
    # altogether), which is itself the failure worth paging on -- same reasoning as the gate/reconciler
    # exporter-stale rules. See the block comment above for the pre-deploy push-order caveat this implies.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No clean `zcrypto archive backfill-trades` run in over ~2 days -- the daily step has been failing every cycle or has stopped running."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-trade-backfill-exit-nonzero
    title: "Trade backfill · non-zero exit code"
    ruleGroup: zcrypto-trade-backfill
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # This is the ONLY signal for a run that recorded errors (exit 1) or found the primary root
      # missing (exit 2) -- T0053's fix stamps the UTC day unconditionally (success or failure), so a
      # failed run no longer retries hourly; this metric, not a retry, is what carries the failure.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_trade_backfill_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the exporter-stale rule above already owns "the step stopped running/succeeding
    # at all" -- this one owns "it ran and recorded a failure", same split as the reconciler's
    # source-lag/healable-gap-rate rules deferring the dead-man case to their own exporter-stale rule.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The daily trade-backfill run recorded a non-zero exit code (1 = errors recorded, 2 = primary root missing). It no longer retries hourly -- this alert is the only signal."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  # --- Ops node (spec 00054): the timer jobs, the logs pipeline, and the host itself ---------------
  # Pushed only after Task 3 (the attended Alloy deploy) confirms the underlying series VISIBLE in
  # Grafana Cloud -- same push-order caveat as the Reconciler/Trade-backfill blocks above: a rule armed
  # before its metric exists sits silent forever, looking healthy. noDataState is per-rule, not
  # boilerplate, and the split is a RULE, not a count (counts go stale as rules are added): a rule
  # whose job is to detect silence -- the dead-men and staleness rules, where no data at all means the
  # host, Alloy, a transport, or a timer is gone -- uses Alerting, because for it silence IS the
  # alarm; a rule that grades an outcome (exit codes, ERROR log lines, load) uses OK, because it must
  # not page a brand-new host for a job that has simply never run yet. Exactly the
  # `zcrypto-trade-backfill-stale`/`zcrypto-trade-backfill-exit-nonzero` split above, applied here.

  - uid: zcrypto-ops-archive-pull-stalled
    title: "Ops · archive-pull stalled (dead-man)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for the ops node's overlay-WRITER cycle (T0058: the rsync mirror pull this
      # rule was written for is retired; the unit/metric names are historical, kept because these
      # rules are provisioned against them). archive-pull.timer fires at :12 and :42
      # (infra/ansible/roles/ops/templates/archive-pull.timer.j2) -- 3h is ~6 missed half-hourly
      # cycles of headroom (kept as provisioned at the cadence doubling, deliberately), same
      # reasoning as the Gate/Reconciler exporter-stale rules above. A clean cycle AND a
      # fail-closed gate-skip both bump last_success (a skip is a state, not a fault); a
      # PERSISTENT skip pages via the reconcile exporter-stale rule instead, which a skipped cycle
      # never refreshes.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - ops_archive_pull_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h; half-hourly timer at :12/:42, so ~6 missed cycles
    noDataState: Alerting  # no series at all = the host, Alloy, or the timer is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The ops overlay-writer cycle (historical name: archive-pull) has not completed for 3h --
        the host, the timer, or Alloy is gone. Reconcile + trade-backfill are not running, and
        nothing else owns that silence (a gate-skip still bumps this metric, so this is not a skip).
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-archive-pull-exit-nonzero
    title: "Ops · archive-pull non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_archive_pull_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the dead-man rule above already owns "the cycle stopped running/succeeding
    # at all" -- this one owns "it ran and the reconcile step failed", same split as the
    # trade-backfill pair. T0058: rsync is gone, so the reconcile `docker run` (including a
    # leftover-container name conflict after a dockerd crash -- archive-pull.sh.j2's T0060 comment
    # names this alert as that failure's loud path) is the only thing that sets rc non-zero; a
    # gate-skip and a trade-backfill failure both leave rc at 0 (the backfill's loud path is its
    # own exit-code alert above).
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last ops overlay-writer cycle (historical name: archive-pull) recorded a non-zero exit code -- the reconcile step failed (image/digest problem, dockerd down, a leftover zcrypto-reconcile container, or the reconciler itself erroring). Gate-skips and trade-backfill failures do NOT trip this rule."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verified-replay-stale
    title: "Ops · verified-replay stale"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # D9's rule. verified-replay.timer fires daily at 05:23 UTC
      # (infra/ansible/roles/ops/templates/verified-replay.timer.j2) -- 48h is 2 missed days, matching
      # the trade-backfill staleness rule's reasoning for a daily-cadence job.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - ops_verified_replay_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}  # 48h -- 2 missed daily cycles
    noDataState: Alerting  # no series at all = the host, Alloy, or the timer is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      # 48h = two daily replay cycles; the invariant is D9 in the spec vocabulary.
      summary: "No successful verified-path journal replay in over 48h -- the daily replay has stopped running or has not succeeded in two cycles."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verified-replay-exit-nonzero
    title: "Ops · verified-replay non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verified_replay_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the stale rule above already owns "the replay stopped running/succeeding at
    # all" -- this one owns "it ran and found a mismatch or a validation failure" -- critical, not
    # warning, because a verified-path mismatch means the canonical replay itself disagrees with the
    # journal, the same class of failure the Gate's mismatch rule pages critical for.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last verified-path journal replay recorded a non-zero exit code -- a replay mismatch or validation failure against yesterday's journaled cycles."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verify-replay-exit-nonzero
    title: "Ops · verify-replay non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # T0060 review finding: archive-pull.sh.j2's T0060 comment promised "unit rc!=0 -> the
      # exit-code alert" for the named jobs, but only archive-pull and verified-replay HAD one --
      # this rule (and the panel rule below) makes that claim true for the remaining two timers.
      # Same shape as the verified-replay exit rule above. Critical: a non-zero here is the daily
      # CONTINUITY replay failing -- the earliest signal that the journal itself is corrupt, ahead
      # of anything the verified path derives from it.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verify_replay_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: same reasoning as the block header's exit-code split -- a brand-new host
    # must not page for a job that has simply never run yet.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last daily continuity replay recorded a non-zero exit code -- the journal failed to replay cleanly, the earliest corruption signal there is."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-panel-exit-nonzero
    title: "Ops · panel non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The second half of the verify-replay rule's finding above. Warning, not critical: the
      # panel is DERIVED data, recomputable from the mirror on the next healthy run -- a failed
      # materialize costs freshness, not truth.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_panel_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last hourly panel materialize recorded a non-zero exit code -- the L2 panel is going stale (derived data; recomputable once the cause is fixed)."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-load-high
    title: "Ops · node load high"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Scoped to host="ops": infra/ansible/roles/ops/files/config.alloy sets
      # `external_labels = { host = "ops" }` on prometheus.remote_write, so every metrics series
      # this Alloy ships carries host="ops" -- that's what makes this selector resolve. The NAS's
      # own node_load1 now carries `host="nas"` too (infra/nas/config.alloy, spec 00069 D7), so
      # `NAS · load high` above scopes itself with `{host="nas"}` (see that rule's own comment) --
      # the two rules partition the metric between the two hosts.
      #
      # Threshold: the ops box has 24 threads (infra/ansible/roles/ops/defaults/main.yml), so the NAS
      # rule's `gt 4` (100% of its 4 cores) would not mean the same thing here. `gt 20` is ~83% of 24
      # threads rather than 100%: ops runs several concurrent services (Alloy, the four timers, and
      # soon the overlay writer) whose transient overlaps are normal, so full-saturation would be
      # noisier than the NAS's single-purpose box; 20 keeps the same "sustained saturation, not a
      # transient burst" intent with headroom for that cross-service scheduling noise.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: node_load1{host="ops"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [20]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "1-minute load average on the ops node exceeds 20 of its 24 threads -- sustained saturation, not a transient burst."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-error-logs
    title: "Ops · ERROR logs"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Same shape as `NAS · archive-pull ERROR logs` above (level LABEL, not a text grep -- the
      # parse stages strip the level out of the message line, so a grep would be silently blind;
      # `queryType: instant` for the same Loki-specific reason). Host-wide rather than per-container:
      # `{host="ops", ...}` covers every parsed ops container at once -- the five named zcrypto-*
      # jobs AND the liquidations poller, a long-lived daemon whose errors flip NO exit-code metric,
      # so this rule is its ONLY error channel.
      #
      # The `level` label reaches this rule via TWO independent paths (00068 T6/T7/T8 review): the
      # four zcrypto-* units and Alloy's own logs get it from config.alloy's parse stages at ingest;
      # the liquidations poller now direct-ships (spec 00068 D3/T6) and stamps `level` itself at the
      # source (cli/logging/ship.py: `level` = `record.levelname`, always present) -- Alloy is not in
      # that path at all. T0060: before this branch's fix both config.alloy stages' selectors were
      # the NAS's container names, so the label was absent on every ops stream and this rule could
      # never have fired -- which is why it lands together with that fix. NoData is normal here
      # (quiet logs = healthy; liveness is owned by the dead-men below), and `or on() vector(0)`
      # keeps a clean window an explicit 0 anyway.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({host="ops", level=~"ERROR|CRITICAL"} [15m])) or on() vector(0)
          queryType: instant
          refId: A
      # Reduce A to a single value before the threshold -- same belt-and-braces A -> B(reduce) ->
      # C(threshold) chain as the NAS rule.
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR-level log lines from the ops node's containers in the last 15 minutes. For the liquidations poller this is the only error signal -- its failures flip no exit-code metric."
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-log-pipeline-dead
    title: "Ops · log pipeline dead (no parsed lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The canary that closes the ERROR-logs rule's green-when-blind gap for the Alloy-fed half of
      # its scope (Alloy's own logs + the four zcrypto-* units). Scoped to `container="alloy"`
      # (review finding, 00068 T6/T7/T8 review Critical 2) -- NOT host-wide any more: the liquidations
      # poller now direct-ships (spec 00068 D3/T6) with its OWN `level` stamped at the source
      # (cli/logging/ship.py), completely bypassing Alloy, so its ~5-min heartbeat alone would have
      # kept a host-wide query green forever even if Alloy/loki.write died outright -- a dead-man
      # pinned green is strictly worse than NoData, because NoData is visible. Alloy's own logfmt
      # stream (config.alloy's `{container="alloy"}` parse stage) is continuous while Alloy lives, is
      # Alloy-produced end to end, and cannot be faked by anything the poller does -- so THIS rule
      # fires on the absence of ANY parsed Alloy-stream line in 6h, which means Alloy itself (or its
      # own parse/ship path) is dead. Deliberately NOT `container=~"zcrypto-.*"` either: on a
      # fail-closed skip-gate streak (archive-pull.sh.j2) the unit emits only unleveled echoes, so a
      # level-filtered 6h query on the units alone would false-fire during a legitimate long skip
      # streak -- `zcrypto-ops-unit-parse-dead` below covers that stream instead, at a wider 26h
      # window sized to tolerate it. This rule is structurally blind to a journal-transport-only
      # death (Alloy alive, journal reader wedged); `zcrypto-ops-journal-transport-dead` below owns
      # that failure mode, and `zcrypto-ops-poller-log-dead` below owns the poller's own direct-ship
      # path, which this rule can no longer see at all now that it is Alloy-scoped.
      # `or on() vector(0)` keeps the query returning data while it is intact; execErrState
      # Alerting still covers "Loki unreachable".
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({host="ops", container="alloy", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK (review finding): this is a fires-on-silence dead-man of critical severity,
    # the same class as zcrypto-nas-archive-pull-stalled above ("NoData here means the log pipeline
    # itself died -- that IS the alarm"). While the `or on() vector(0)` fallback is intact the query
    # always returns data, so Alerting never fires falsely; it is the belt-and-braces layer for the
    # day a future edit drops the fallback, or a Grafana/Loki edge maps an empty response to NoData
    # -- with OK the canary would park green in exactly the blind state it exists to page on.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED Alloy log line (any level label) from the ops node in 6h -- Alloy emits its own logfmt output continuously while alive, so this means Alloy itself is dead, its parse stage has regressed to level=-, or it cannot reach Loki. Scoped to Alloy only: the liquidations poller direct-ships and is watched separately (`Ops · poller log pipeline dead`), and the four zcrypto-* units' own level-parse health is watched separately too (`Ops · unit log parse dead`)."
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-poller-log-dead
    title: "Ops · poller log pipeline dead (no lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The liquidations poller is now the ONLY ops workload that bypasses Alloy entirely
      # (direct-ship, spec 00068 D3/T6) -- nothing watched its own shipping path in isolation until
      # this rule (review finding, 00068 T6/T7/T8 review Critical 2): `zcrypto-ops-log-pipeline-dead`
      # above is now scoped to Alloy only and structurally cannot see this container at all. Mirrors
      # the capture hosts' own per-container canaries (`zcrypto-capture-log-dead-primary/secondary`):
      # `level` comes from the poller's OWN direct-ship handler (cli/logging/ship.py: `level` =
      # `record.levelname`, always present, no regex, Alloy not involved), so <1 line in 6h means the
      # poller's ship path is dead (the --ship-logs flag lost at render time, its Loki credentials
      # dead, or the container gone) -- not a quiet host, since the poller runs continuously on a
      # ~5-min cycle. `or on() vector(0)` keeps the query returning data while intact.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({host="ops", container="liquidations", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK: same fires-on-silence dead-man reasoning as the rules around it -- the
    # vector(0) fallback means this never evaluates NoData while intact, and if that ever breaks,
    # silence stays the alarm rather than parking green.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one PARSED log line from the liquidations poller (container=liquidations) in 6h -- it direct-ships and runs continuously on a ~5-min cycle, so silence means its ship path is dead (the --ship-logs flag, its Loki credentials, or the container itself), not a quiet host."
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-unit-parse-dead
    title: "Ops · unit log parse dead (no leveled lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Restores the T0060 coverage `zcrypto-ops-log-pipeline-dead` used to carry for the four
      # zcrypto-* units before this rework scoped that rule to Alloy only (review finding, 00068
      # T6/T7/T8 review Critical 2) -- without this, a parse regression on config.alloy's zcrypto
      # stage (the stage.regex line-shape, the container selector, the label scheme) would go
      # completely undetected: Alloy itself stays alive and its OWN logfmt stream (watched by
      # `zcrypto-ops-log-pipeline-dead` above) keeps flowing, so that canary would never notice, and
      # `Ops · ERROR logs` would read 0 = healthy forever for the unit streams specifically.
      # Deliberately level-filtered AND a wide 26h window (matching `zcrypto-ops-journal-transport-
      # dead`'s own window below, for the same reason): during a fail-closed skip-gate streak
      # archive-pull emits only unleveled echoes, but panel-materialize (hourly) and verify-replay/
      # verified-replay (daily) run on independent schedules unaffected by that gate, so at least one
      # of the four units produces a leveled line well within 26h even through an extended streak --
      # a 6h window on this same selector would false-fire and was rejected for that reason.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 93600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({host="ops", container=~"zcrypto-.*", level=~".+"} [26h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting, not OK: same fires-on-silence dead-man reasoning as the rules around it.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one LEVEL-PARSED line from any of the four zcrypto-* ops units in 26h -- the four run on independent schedules (half-hourly/hourly/daily) so at least one always produces a leveled line inside that window while Alloy's zcrypto parse stage is intact; silence means that stage regressed (the line-shape regex, the container selector, or the label scheme) even though Alloy itself and its own logs (watched by `Ops · log pipeline dead`) stay healthy."
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  - uid: zcrypto-ops-journal-transport-dead
    title: "Ops · journal transport dead (no unit lines)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The journal-scoped companion to the canary above. `zcrypto-ops-log-pipeline-dead` is scoped to
      # `container="alloy"` (00068 T6/T7/T8 review) -- it proves Alloy's OWN journald-driver stream
      # is flowing, not that the SEPARATE journal-reader path carrying the four zcrypto-* units is
      # intact, so it cannot see a journal-transport-only death either -- and loki.source.journal is
      # the SOLE carrier of those units' logs, including the reconcile skip-gate warning this
      # pipeline exists to ship. The unit failure modes it covers are all silent everywhere else: a
      # rebuilt host where /var/log/journal does not exist (docker CREATES an empty dir for the bind
      # mount, so Alloy starts fine and tails an empty journal forever), journald flipping to volatile
      # storage (/run/log/journal, outside the mount), systemd-journal gid drift after an OS
      # reinstall, or the keep regex going stale after a unit rename. The units' exit-code and
      # staleness metrics don't cover log SHIPPING, so no other rule fires for any of these.
      #
      # Scoping: `container="zcrypto-archive-pull"` can ONLY come from the journal path -- not
      # because a docker-discovery drop rule filters it out (there is no docker path left at all,
      # discovery.docker retired fleet-wide, 00068 D6/D8), but because these four units run their
      # work as an ephemeral `docker run --rm` ATTACHED to the unit (T0060, config.alloy) -- their
      # stdout is journal-stamped as part of the unit's own log stream, never a separately
      # discoverable container. So 26h of silence from this stream isolates the journal transport
      # specifically. Count ANY line, NOT level-parsed: the hourly archive-pull unit writes at
      # least one line in every code path
      # (reconcile CLI INFO on the happy path, the skip-gate/failure echoes otherwise), but its own
      # echoes carry no level label, so a level-filtered query would false-fire during a
      # pull-failure streak. 26h = a full day of hourly runs plus headroom.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 93600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({host="ops", container="zcrypto-archive-pull"} [26h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting for the same dead-man reason as the canary above: the vector(0) fallback means this
    # never evaluates NoData while intact, and if that ever breaks, silence stays the alarm.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Not one journal-path log line from zcrypto-archive-pull in 26h -- the hourly unit writes at least one line every run, so the journal transport (loki.source.journal) is dead: empty/volatile host journal, gid drift, or a stale keep regex. The four systemd units' logs -- including the reconcile skip-gate warning -- are invisible until this is fixed."
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  # ---- Capture hosts (zcrypto = primary + engine, zcrypto-red = secondary) --------------------
  # First alert rules for the capture VPSes. They ship host metrics + container logs via Alloy only
  # since iter-105 (spec 00057 D5); before that no rule selected host="zcrypto"/"zcrypto-red", so the
  # unbackfillable L2 spool's disk-free and the capture daemon's ERROR logs were unwatched in Grafana.
  # The three CONTENT rules (disk/load/error) carry host=~"zcrypto|zcrypto-red" (external_labels
  # host=<hostname>, roles/capture/files/config.alloy) and fire per host. They are noDataState: OK,
  # deliberately UNLIKE the NAS host-resource rules' Alerting -- and stay OK permanently, because
  # "this host's telemetry went dark" is owned by the two per-host log-dead CANARIES below
  # (noDataState: Alerting), not by making each content rule page on NoData (which would false-page on
  # a transient Alloy remote_write gap, like the ops-node DNS incident). Division of labor: the content
  # rules own "bad while alive"; the canaries own "this host's capture log plane is dark" -- a
  # parse-chain regression on a live daemon (the T0060 class, which silently blinds the ERROR rule) OR
  # that host's Alloy dying; the healthchecks.io dead-man (withheld-ping, T0032; independent domain)
  # owns "the daemon itself died / the disk actually filled". The canaries are PER-HOST (not one
  # collective) because a SINGLE host's Alloy death is otherwise invisible to everything: the content
  # rules go NoData->OK and the daemon keeps pinging the dead-man.
  - uid: zcrypto-capture-disk-low
    title: "Capture · spool disk low"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The unbackfillable L2 spool (/var/lib/zcrypto-capture) is on the root fs -- mountpoint="/"
      # resolves live for both hosts (verified 2026-07-19; free ratio 0.70 primary / 0.79 secondary).
      # 10% free is ~8 GB / ~16 days of runway at the measured 0.48 GB/day -- a wide EARLY warning that
      # fires long before the daemon's own 1 GiB DiskWatermark (whose breach withholds the dead-man
      # ping, T0032) and the ~14-day prune ring (spec 00050 D8). Firing here means the ring broke or an
      # unexpected consumer appeared.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_filesystem_avail_bytes{host=~"zcrypto|zcrypto-red", mountpoint="/"}
            / node_filesystem_size_bytes{host=~"zcrypto|zcrypto-red", mountpoint="/"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.1]}  # < 10% free
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "A capture host's root filesystem (the unbackfillable L2 spool, /var/lib/zcrypto-capture) is below 10% free. Early warning -- the daemon's 1 GiB watermark + healthchecks dead-man are the last line. Check both prune timers (zcrypto-capture-prune for the spool, zcrypto-engine-journal-prune for the engine journal) and for an unexpected disk consumer."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-reboot-pending
    title: "Capture · reboot pending (attended)"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The capture VPSes run unattended-upgrades with Automatic-Reboot "false" (T0027, spec 00071):
      # patches install, the reboot is a human act. That closes the risk of an unwatched reboot of
      # unbackfillable L2 capture -- and, on the primary, the live trade engine -- and opens the
      # opposite one: a kernel flag nobody notices. THIS rule is the whole reason the flip is safe.
      # It keeps firing until the human reboots; that persistence is the point, not a nuisance.
      # Published by the zcrypto-reboot-check timer as an explicit 0/1 -- never an absent series,
      # which would be indistinguishable from a dead exporter.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'node_reboot_required{host=~"zcrypto|zcrypto-red"}'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}  # == 1, pending
    noDataState: OK
    execErrState: Alerting
    # 15m: long enough that one failed publish does not page, short enough that a real pending
    # reboot surfaces the same hour. The collector re-serves the file on every scrape, so there is
    # no gap between 15-minute publishes to ride out.
    for: 15m
    annotations:
      summary: "A capture host has a pending reboot (/run/reboot-required) and will NOT reboot itself -- these hosts are attended. Schedule it: secondary first, verify it boots and captures, then the primary; off any 4h engine-cycle boundary, in the traffic trough, hosts >= 1h apart. Expect a ~83s capture gap; containers self-restart. Guidance in .claude/rules/capture-deploys.md."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-textfile-missing
    title: "Capture · a one-off timer stopped publishing entirely"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The gap that hid a real defect: a STALENESS rule cannot fire on a series that never exists.
      # If a timer is disabled, its script fails every run, or its .prom is unreadable, the metric is
      # simply ABSENT -- and with noDataState: OK that reads green forever. count() over the expected
      # publishers turns absence into a value, which is the only shape that alerts on nothing.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'count(node_reboot_required{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [2]}  # both capture hosts must publish
    noDataState: OK
    execErrState: Alerting
    for: 20m
    annotations:
      summary: "A capture host has stopped publishing node_reboot_required entirely -- not stale, ABSENT. The attended-reboot safety net is down on at least one host: a pending kernel reboot would now go unseen. Check `systemctl status zcrypto-reboot-check.timer` on both hosts, then that the .prom exists in /var/lib/zcrypto-node-textfile and is mode 0644 (Alloy reads it as a non-root user)."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-textfile-unreadable
    title: "Capture · node-exporter textfile unreadable or malformed"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Raised when the collector cannot parse OR cannot OPEN a .prom. The open case is not
      # theoretical: mktemp creates 0600 and `mv` preserves it, so a publisher missing an explicit
      # chmod publishes root-only and the non-root collector gets EACCES -- metrics silently gone.
      # This series was admitted to the keep-list before any rule watched it; this is that rule.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'max by (host) (node_textfile_scrape_error{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "Alloy's textfile collector cannot read or parse a .prom on a capture host, so that timer's metrics are absent while everything else looks healthy. Most likely the file is mode 0600 (mktemp's default -- the publisher needs an explicit chmod 0644) or was written malformed. Check /var/lib/zcrypto-node-textfile on that host."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reboot-probe-stale
    title: "Capture · reboot probe is stale"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The reboot probe republishes every 15 min, so it gets its OWN threshold: sharing the daily
      # prune's 26h window would let the attended-reboot safety net sit dead for a day while
      # node_reboot_required served a frozen 0. 1h is ~4 missed runs.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - max by (host) (node_textfile_mtime_seconds{host=~"zcrypto|zcrypto-red", file=~".*/reboot.prom"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [3600]}  # 1 h ~= 4 missed runs
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The pending-reboot probe on a capture host has not refreshed in over an hour (it runs every 15 min), so node_reboot_required is a frozen last-known value, not current state. A kernel reboot could be pending and unreported. Check `systemctl list-timers zcrypto-reboot-check.timer` on that host."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-oneoff-textfile-stale
    title: "Capture · daily one-off timer stopped publishing"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Staleness for the DAILY publishers only -- the journal prune (01:23 UTC). 26h = one missed
      # run plus margin. A stale .prom is NOT a scrape_error: the collector keeps serving the last
      # values forever, so without this the gauge reads healthy indefinitely.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - max by (host) (node_textfile_mtime_seconds{host=~"zcrypto|zcrypto-red", file=~".*/engine-journal-prune.prom"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [93600]}  # 26 h
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "The engine journal prune has not refreshed its .prom in over 26h -- its last run is more than a day old, so the retention it reports is a frozen value. Check `systemctl list-timers zcrypto-engine-journal-prune.timer` and the unit's journal on the primary."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-book-desync-stuck
    title: "Capture · book desync stuck on a pair"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Recovery from a checksum desync is a SINGLE fire-and-forget resubscribe, fired only on the
      # not-was_desynced TRANSITION (deliberately -- retrying in a loop trips Kraken's rate limit).
      # So if that one attempt does not take, `desynced` stays True, the transition guard never
      # re-fires, and the pair is stuck. min_over_time, not max: a desync that HEALED within the
      # window has a 0 in it, so only a pair desynced for the whole 15 min fires -- the stuck shape,
      # not the transient one the daemon handles by itself 234/234 times.
      #
      # This is not one pair's problem. `gap_monitor.is_healthy()` is False while ANY pair has an
      # open gap and the healthcheck ping is gated on it, so one stuck pair silences this host's
      # dead-man for ALL 12 -- the hc.io watchdog then fires and STAYS fired, and any later, worse
      # fault on the same host produces no new page while that signal is saturated. This rule is
      # what names the pair; the dead-man only says the host went quiet.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min_over_time(zcrypto_capture_book_desynced{host=~"zcrypto|zcrypto-red"}[15m])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "A capture pair's order book has been desynced for 15 min straight (paged after 20 min: a 15m window plus a 5m hold) -- its single fire-and-forget resubscribe did not take, and the transition guard will not retry. That pair's L2 is not being captured, AND it silences this host's dead-man for all 12 pairs (is_healthy gates the ping), so hc.io is now saturated and will not page for anything else on this host. Fix: `docker restart zcrypto-capture` on the named host. The `pair` label names the stuck pair."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-resubscribe-rate
    title: "Capture · book resubscribe rate re-elevating"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The second half of T0008's trigger, self-evaluating. The ~200/day desync rate was OUR bug
      # (an unpruned book resurfacing phantom levels, fixed 2026-07-13: replaying a real hour went
      # 482/117/398 CRC failures to ZERO with the depth prune), so any post-fix resubscribe is a
      # genuine venue/network event and should be rare. More than one in a day means either the rate
      # is re-elevating or a pair is flapping desync/heal -- neither is visible in the stuck-pair
      # rule above, which only sees a pair that never recovers. (At a 60 s scrape a fast flapper is
      # invisible to both as a heal; this rule catches it through the counter, not the gauge.)
      #
      # NOTE: this counter carries no `pair` label (one series per host), so it says THAT the rate
      # rose, not which pair. Cross-reference zcrypto_capture_book_desynced to find it.
      # `increase()` handles the counter reset on container recreate.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_capture_resubscribes_total{host=~"zcrypto|zcrypto-red"}[1d])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # NOT [1]: increase() extrapolates to the window edges, so a SINGLE increment
            # returns ~1.0007 for any nonzero sample offset -- `> 1` would page on one genuine
            # self-healed venue desync, asserting a re-elevating rate that is not happening, and
            # stay firing for a day. 1.5 is silent at one and fires at two.
            - evaluator: {type: gt, params: [1.5]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "A capture host has resubscribed a book more than once in 24h. Post-2026-07-13 these should be rare genuine venue events, so a re-elevating rate suggests a regression or a pair flapping desync/heal. This counter has no pair label -- check zcrypto_capture_book_desynced by pair on that host to find which."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-resubscribe-failing
    title: "Capture · book resubscribe is failing (recovery degraded)"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The recovery ladder's resubscribe leg has an alert for how OFTEN it runs (above) and, until
      # now, none for whether it WORKS. Both counters mean the ladder is degraded, differently:
      # a rejected frame (the venue answered subscribe/unsubscribe error, correlated by req_id) means
      # the desync recovery did not happen at all and the book stays stale; a missing unsubscribe ack
      # means the subscribe was sent blind into the race the ack exists to close, so the resubscribe
      # may be silently rejected downstream. Summed because the response is the same -- read the
      # capture log for which, the lines carry the pair.
      #
      # A rejection also logs at ERROR and so already reaches the capture ERROR-log rule; this exists
      # because the ack TIMEOUT logs at WARNING and reaches nothing, and because a rate is what
      # distinguishes one venue hiccup from a recovery path that has stopped working.
      # `increase()` handles the counter reset on container recreate.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'sum(increase(zcrypto_capture_resubscribe_errors_total{host=~"zcrypto|zcrypto-red"}[1d]) + increase(zcrypto_capture_resubscribe_ack_timeouts_total{host=~"zcrypto|zcrypto-red"}[1d]))'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # 1.5, not 1: increase() extrapolates a single increment to ~1.0007, so `> 1` would page
            # on one transient rejection -- the same arithmetic recorded on the resubscribe-rate rule.
            - evaluator: {type: gt, params: [1.5]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "A capture host's book resubscribe is failing: the venue rejected the frames, or the unsubscribe acks are not arriving. The desync recovery ladder depends on this leg -- while it fails, a desynced book cannot heal and the pair keeps writing from a stale state. Check the capture log for the pair and the venue reply."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-watermark-breached
    title: "Capture · disk watermark breached -- DISCARDING data"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The most consequential unwatched signal on these hosts, and it was unwatched for months.
      # A breached watermark does not merely warn: cli/capture/command.py's book and trade handlers
      # `continue`/`return` past the writers while it holds, so incoming L2 and trades are DROPPED.
      # That data is unbackfillable -- every second breached is permanent loss.
      #
      # It also gates the dead-man ping, so hc.io does fire -- but that page says "this host went
      # quiet", not "the disk hit the watermark and capture is discarding". Without this rule the
      # operator has no way to tell those apart, and the 1 GiB watermark sits BELOW the
      # `Capture - spool disk low` early warning (10% free), so that rule fires first only if the
      # fill is gradual; a sudden consumer can breach the watermark with disk-low still green.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'max by (host) (zcrypto_capture_disk_watermark_breached{host=~"zcrypto|zcrypto-red"})'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    for: 2m
    annotations:
      summary: "CAPTURE IS DISCARDING DATA on this host: the disk watermark is breached, so the book and trade handlers drop every incoming message instead of writing it, and L2 is unbackfillable. This also withholds the dead-man ping, so hc.io is saturated and will not page for anything else here. Free space on the capture spool NOW -- check both prune timers and for an unexpected consumer."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-rows-quarantined
    title: "Capture · rows quarantined to .held"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Rows that arrived after their hour was finalized and were spilled to a `.held` sidecar
      # rather than written in place. Measured baseline over 7 d: ZERO on both hosts, so any
      # nonzero value is a real event, not noise. Held rows are not lost, but they are not in the
      # canonical tree either -- the reconciler has to fold them, and nobody knows to look.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_capture_rows_quarantined_total{host=~"zcrypto|zcrypto-red"}[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "A capture host quarantined rows to .held in the last 6h -- rows arrived after their hour was finalized. Baseline is zero, so this is a real event: check for clock skew, a late-delivering stream, or a stalled writer on that host."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-logship-lines-dropped
    title: "Logs · lines dropped before reaching Loki"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The log transport's own loss counter. Measured baseline over 7 d: ZERO on every host. A
      # nonzero value means log lines were discarded before Loki -- so the Loki-based rules
      # (capture-error-logs, log-dead-primary/secondary) are reasoning over an incomplete stream and
      # can go quiet for the wrong reason. This is the one fault that makes OTHER alerts unreliable.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'increase(zcrypto_logship_dropped_lines_total[6h])'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "Log lines were dropped before reaching Loki in the last 6h. Baseline is zero. This matters beyond the lost lines: the Loki-based alert rules now reason over an incomplete stream, so their silence no longer means healthy. Check the shipper's backlog and the Loki push credentials on the named host."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-logship-worker-stalled
    title: "Logs · the shipping worker has stopped cycling"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Liveness, and deliberately NOT the ship-success gauge: the worker skips the push when the
      # buffer is empty, so last_success goes stale whenever logging is merely quiet -- which is
      # what a healthy capture daemon looks like. This gauge advances on an idle cycle too and
      # stalls only while pushes are failing or the thread is dead, so staleness here is a real
      # fault. The worker cycles every second; 5 min is ~300 missed cycles.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'time() - zcrypto_logship_last_cycle_timestamp_seconds'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [300]}
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "The log-shipping worker on the named host has not completed a cycle for over 5 minutes, so logs are no longer reaching Loki. Every Loki-based alert on this host is now silent for the wrong reason. Check the container is running and the Loki push endpoint and credentials still resolve."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-node-collector-failed
    title: "Node · a node-exporter collector is failing"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # 0 means that collector errored on its last scrape, so its whole metric family goes quietly
      # ABSENT -- and every rule keyed on those series then evaluates NoData, which this fleet maps
      # to OK. A failed `filesystem` collector silently disarms the disk-low rule; a failed
      # `textfile` collector silently disarms every one-off timer alert. Baseline: 1 on all four
      # hosts. This is the rule that keeps the other rules honest.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: 'min by (host) (node_scrape_collector_success)'
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.5]}
    noDataState: OK
    execErrState: Alerting
    for: 15m
    annotations:
      summary: "A node-exporter collector is failing on this host, so its entire metric family is absent -- and rules keyed on those series evaluate NoData, which this fleet maps to OK. Any alert depending on them is silently disarmed right now. Check Alloy's logs on the named host for the failing collector."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-load-high
    title: "Capture · node load high"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # NORMALIZED per core, because the two boxes differ: the primary has 2 vCPU, the secondary 1
      # (measured live). Dividing load1 by the host's core count (count of idle-mode
      # node_cpu_seconds_total series) makes one threshold mean the same on both. `on(host)
      # group_left()` matches the per-host core count onto load1's richer label set. Baseline is
      # ~0.02-0.11 per core; > 1.5 per core sustained 10m is clear saturation (a runaway/thrashing
      # process), not the seconds-long hourly NAS rsync-pull spike (`for: 10m` outlasts that).
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_load1{host=~"zcrypto|zcrypto-red"}
            / on(host) group_left()
            count by (host) (node_cpu_seconds_total{host=~"zcrypto|zcrypto-red", mode="idle"})
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [1.5]}  # > 1.5x per core, sustained
    noDataState: OK
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "1-minute load average per core on a capture host exceeds 1.5x its cores, sustained 10m -- runaway/thrashing, not the transient hourly pull (the capture daemon is light, ~0.1/core baseline)."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-capture-error-logs
    title: "Capture · daemon ERROR logs"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Loki, level LABEL not a text grep -- no regex anywhere in this path (D4). The capture daemon's
      # logs get their level label from its OWN direct-ship handler (cli/logging/ship.py, spec 00068
      # D3/D4: `level` = `record.levelname` at the source, pushed straight to Grafana Cloud Loki --
      # Alloy is not in this path at all any more) (verified live pre-rework: INFO/WARNING present,
      # ZERO ERROR/CRITICAL in 7d -- a clean baseline; the label VALUES are unchanged by the rework, so
      # this selector still holds). Scoped to container="capture": the daemon on both hosts, whose
      # errors (desync storms, ENOSPC, reconnect failures) are the soak-critical signal. (Out of scope
      # here: Alloy self-errors -- a separate instrument-health concern; and the engine's logs, which
      # ship no level label until its own --ship-logs lands post-gate (D7) -- the T0042 egress question.)
      # `sum by (host)` names the firing host; `or on() vector(0)` keeps a clean window an explicit 0.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum by (host) (count_over_time({host=~"zcrypto|zcrypto-red", container="capture", level=~"ERROR|CRITICAL"} [15m])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR/CRITICAL log lines from the capture daemon (container=capture) on a capture host in the last 15 minutes -- desync storms, ENOSPC, or reconnect failures on the unbackfillable stream. Zero is the healthy baseline."
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  # Two per-host canaries that make the ERROR rule above trustworthy (mirror zcrypto-ops-log-pipeline-dead).
  # The ERROR rule selects on the `level` label, which exists ONLY because the capture daemon's OWN
  # direct-ship handler attaches it at the source (cli/logging/ship.py, spec 00068 D3/D4: `level` =
  # `record.levelname`, no regex anywhere in this path -- Alloy is not involved) -- so if the daemon's
  # ship path regresses (the T0060 class: the label scheme drifting, or the handler/formatter itself
  # breaking), its lines stop arriving with a usable level and the ERROR rule reads 0 = healthy FOREVER.
  # These fire on the absence of ANY parsed capture line (level matching anything). Scoped to
  # container="capture" -- NOT host-wide -- on purpose: a capture-side regression leaves Alloy's OWN
  # leveled lines (its journald-driver stream) flowing, so a host-wide canary would stay green in
  # exactly the blind state this exists to page on. The capture daemon emits ~35 parsed lines/hr
  # (evidence: 342/341 INFO + 499/497 WARNING per 24h, pre-rework baseline), so <1 in 6h means the
  # capture log plane is dead (the daemon's --ship-logs path down, its Loki credentials dead, or the
  # container gone), not a quiet daemon. One rule per host: Loki cannot synthesize a per-host zero (an
  # absent stream is no series, not a 0 series), so `or on() vector(0)` only injects a 0 for a
  # SINGLE-host query -- a `sum by(host)` would fire only when BOTH hosts go dark and miss a single
  # host's outage.
  - uid: zcrypto-capture-log-dead-primary
    title: "Capture · log pipeline dead — primary (zcrypto)"
    ruleGroup: zcrypto-capture
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 21600, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({host="zcrypto", container="capture", level=~".+"} [6h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    # Alerting (not OK): this is a fires-on-silence dead-man -- the `or on() vector(0)` fallback keeps
    # the query returning data while intact, and Alerting is the belt-and-braces layer for the day an
    # edit drops the fallback or Loki maps an empty response to NoData; with OK it would park green in
    # exactly the blind state it exists to page on.
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
