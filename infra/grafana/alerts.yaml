# Grafana alert-rule provisioning source (spec 00049, Role B / Task 4) for the one canonical
# dashboard's series (infra/grafana/zcrypto-dashboard.json). Pushed by infra/scripts/grafana-push.sh,
# ONE rule per `POST`/`PUT /api/v1/provisioning/alert-rules[/:uid]` call against Grafana's
# **Alerting Provisioning HTTP API** -- that endpoint takes a single alert-rule JSON object per
# call; it is NOT the `apiVersion: 1` / `groups:` file-provisioning shape (that shape is for
# Grafana's config-file provisioner only and is rejected by this HTTP endpoint, which isn't
# usable on Grafana Cloud SaaS anyway). This file is YAML (superset of JSON) purely for the
# inline comments -- the script converts it to the API's per-rule JSON before each push. See:
#   https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/http-api-provisioning/
#   https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/alerting_provisioning/
#
# Each rule's `data` array is a query node (refId A, the Prometheus/Loki datasource, an instant
# query so it already reduces to one number) feeding a `type: threshold` expression node (refId
# C, datasourceUid `__expr__`). The threshold node's own model field is **`expression`**, not
# `expr` -- Grafana's threshold expression (pkg/expr `ThresholdCommand`) reads `expression` to
# find which prior refId to compare; an empty/misnamed field errors "no variable specified to
# reference" and hard-fails the rule's condition on every evaluation.
#
# Placeholders wired at deploy time (see infra/nas/README.md for the vaulted Grafana Cloud creds
# this instance already uses). These are literal `${VAR}` tokens that infra/scripts/grafana-push.sh
# substitutes from its own environment before sending each rule -- Grafana's alert-rule
# provisioning API has no server-side template substitution (unlike the dashboard JSON's
# `${DS_PROMETHEUS}`/`${DS_LOKI}` variables, which Grafana itself resolves on dashboard import):
#   - `${GRAFANA_PROM_DS_UID}` / `${GRAFANA_LOKI_DS_UID}` -- the two datasource UIDs on the
#     already-provisioned Grafana Cloud instance.
#   - `${GRAFANA_ALERT_FOLDER_UID}` -- the folder UID the rules provision into (the API needs
#     the folder's UID, not its display name).
#   - `notification_settings.receiver: metrics` (or `logs` for Loki-sourced rules; the `logs`
#     receiver disables resolve messages -- log alerts resolve by aging, a resolve ping is noise)
#     (both receivers' underlying Slack webhook is provisioned separately, not committed here).
#
# Per-rule noDataState/execErrState reasoning: the four gate rules and the two host-resource
# rules default to Alerting on both no-data and exec-error -- for these, a vanished series
# (Alloy down, textfile exporter dead, cadvisor/node-exporter dead) is itself the failure worth
# paging on, same posture as docs/specs/00043-observability-design.md's disk/memory/CPU rules.
# The ERROR-logs rule uses `or on() vector(0)` (00043's own pattern) so a clean window evaluates
# to 0 rather than NoData, and is marked noDataState: OK to match -- a blanket no-data->alert
# would otherwise leave it permanently firing when healthy.
rules:
  - uid: zcrypto-gate-streak-reset
    title: "Gate · streak reset"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    # SUPERSEDES the old "Gate · not MET" rule (uid zcrypto-gate-not-met), which alerted on
    # `zcrypto_gate_status == 0`. That rule's own NOTE conceded the flaw and it duly bit: the gate
    # is MET only after >=14 consecutive clean days, so `status == 0` is the CORRECT, EXPECTED state
    # for the entire accumulation window -- it would have emailed daily for ~12 days to report that
    # we were, correctly, still waiting. That is alarm fatigue, and it trains the reader to ignore
    # gate alerts exactly when one of them matters. It was also redundant: the real failure modes
    # already have their own rules (mismatch / exporter stale / journal pull lag).
    #
    # The signal that actually means something BROKE is the streak going BACKWARDS. `streak_days`
    # only ever increments (a clean complete UTC day) or resets to 0 (a day failed), so a negative
    # delta IS the failure, and nothing else produces one. It fires once on the break and
    # auto-resolves as the 6h window rolls past -- one alert per broken run, not a drumbeat.
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 21600, to: 0}  # 6h, matching the delta window below
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: delta(zcrypto_gate_streak_days[6h])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0]}  # the streak went BACKWARDS == a clean run broke
    # OK, not Alerting: a missing metric means the exporter is dead, which `Gate · exporter stale`
    # already pages for. Alerting here too would just double-page the same fault.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The Stage-6a clean-day streak went BACKWARDS — a clean run broke and the >=14-day gate clock
        has restarted. (The gate merely being not-MET while it accumulates is normal and no longer alerts.)
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-mismatch
    title: "Gate · mismatch in the last day"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: increase(zcrypto_gate_mismatch_total[1d])
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "At least one replay mismatch/validation failure in the last 24h of journaled cycles."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-pull-lag
    title: "Gate · journal pull lag high"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_gate_journal_pull_lag_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [18000]}  # 5h, matching gate-export's own --lag-fail-seconds default
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The newest journaled cycle is more than 5h old -- the NAS journal pull is stuck or the VPS engine has stalled."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-gate-exporter-stale
    title: "Gate · exporter stale"
    ruleGroup: zcrypto-gate
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_gate_export_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [7200]}  # 2h -- no successful gate-export run in that window
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful `zcrypto engine gate-export` run in over 2h -- the NAS archive-pull loop or the gate-export step itself is broken."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-disk-low
    title: "NAS · /volume1 free space low"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: >-
            node_filesystem_avail_bytes{mountpoint="/volume1"}
            / node_filesystem_size_bytes{mountpoint="/volume1"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [0.1]}  # < 10% free
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "/volume1 has less than 10% free space -- the archive keeps growing into it."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-load-high
    title: "NAS · load high"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # `{host=""}` looks odd but is deliberate: ops's Alloy now ships node_load1 too (it sets
          # `external_labels = { host = "ops" }` on prometheus.remote_write), and ops is a 24-thread
          # box whose normal working load would trip this Atom-sized `gt 4` threshold constantly.
          # The NAS's own node_load1 carries no `host` label at all, so an empty-value matcher --
          # documented PromQL for "label absent" -- selects the NAS's copy of the series only.
          expr: node_load1{host=""}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            # The NAS Atom has 4 cores (infra/nas/README.md) -- 1-min load above that is
            # sustained saturation, not a transient burst.
            - evaluator: {type: gt, params: [4]}
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "1-minute load average exceeds the NAS's 4 cores."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-nas-archive-pull-errors
    title: "NAS · archive-pull ERROR logs"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Selects on the `level` LABEL, not a `|= "ERROR"` grep of the line. Alloy now parses our
      # Python log format at ingest (infra/nas/config.alloy) and strips the level out of the message,
      # so a text grep for "ERROR" would match NOTHING — silently blind, exactly the failure this rule
      # already had once. The label also catches `critical`, which the grep never did.
      # `queryType: instant` is load-bearing and Loki-specific: the `instant: true` MODEL field that
      # the Prometheus rules above use is a Prometheus-datasource setting, and Loki ignores it. Without
      # this the query ran as a RANGE query and returned a time series, so the threshold node rejected
      # it with "invalid format of evaluation results ... looks like time series data, only reduced
      # data can be alerted on" -- the rule was erroring instead of evaluating.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 900, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({container="archive-pull", level=~"ERROR|CRITICAL"} [15m])) or on() vector(0)
          queryType: instant
          refId: A
      # Reduce A to a single value before the threshold. Belt-and-braces alongside the instant query:
      # this is the canonical A -> B(reduce) -> C(threshold) chain Grafana's own UI emits, and it keeps
      # the rule valid even if the datasource ever hands back a series again.
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # `or on() vector(0)` makes a clean window evaluate to 0, not NoData
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "ERROR-level log lines from the archive-pull container in the last 15 minutes."
    labels:
      severity: warning
    notification_settings:
      receiver: logs

  - uid: zcrypto-nas-archive-pull-stalled
    title: "NAS · archive-pull stalled (dead-man)"
    ruleGroup: zcrypto-nas
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The DEAD-MAN, and the only rule that fires on SILENCE. Every other rule needs the archive-pull
      # container to still be alive and talking: `NAS · archive-pull ERROR logs` fires on an ERROR
      # line, so it is green when the container is gone, the pull loop has exited, or the NAS is down
      # -- i.e. exactly when nothing is protecting the unbackfillable archive any more. This one
      # inverts that: it fires when the loop STOPS saying it succeeded.
      #
      # `failed=0` is load-bearing, not decoration. Matching `pull complete` alone would ALSO be
      # satisfied by (a) the JOURNAL pull -- "archive pull complete (no verify) ..."
      # (cli/archive/command.py:104) -- and (b) a CAPTURE pull whose hash verification FAILED, because
      # :109 logs "pull complete ... failed=N" *before* the :118 check raises. Either would hold this
      # rule quiet while the capture mirror -- the unbackfillable thing it exists to protect -- was not
      # advancing at all. `failed=0` appears only on a fully-clean capture pull: the journal line
      # carries no `failed=` field, and a verify failure carries a non-zero one. So this rule tracks
      # the capture mirror specifically. A pull that fails LOUDLY is the ERROR rule's job; this one
      # owns silence.
      #
      # 3h window against a pull that runs hourly (`${ARCHIVE_PULL_INTERVAL:-3600}` in
      # infra/nas/pull-entrypoint.sh): the loop gets three chances to report before this pages, so a
      # single slow or restarted cycle is not enough to wake anyone.
      #
      # `or on() vector(0)` is what makes the dead-man work at all: when the container is gone Loki
      # returns NO series, and a bare `sum(count_over_time(...))` would then evaluate to NoData
      # rather than to zero -- the rule would sit in NoData instead of firing, which is the precise
      # failure it exists to catch. The `or` substitutes an explicit 0, which trips the `lt 1` below.
      - refId: A
        queryType: instant
        relativeTimeRange: {from: 10800, to: 0}
        datasourceUid: "${GRAFANA_LOKI_DS_UID}"
        model:
          expr: >-
            sum(count_over_time({container="archive-pull"} |= "pull complete" |= "failed=0" [3h])) or on() vector(0)
          queryType: instant
          refId: A
      - refId: B
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: reduce
          reducer: last
          expression: "A"
          refId: B
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "B"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting  # NoData here means the log pipeline itself died -- that IS the alarm
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "archive-pull has not reported a successful pull for 3h -- the loop, the container, the NAS, or the log pipeline is down. The L2 archive is unbackfillable; the NAS mirror is going stale."
    labels:
      severity: critical
    notification_settings:
      receiver: logs

  # --- Reconciler: the redundant capture secondary + gap healing (spec 00050 Role C, task 11) -------
  # Pushed only after the `zcrypto_reconcile_*` series were confirmed VISIBLE in Grafana Cloud. A rule
  # armed before its metric exists evaluates against nothing and sits silent forever, looking healthy
  # -- the same class of failure as T0034. Alloy's keep-regex must carry `zcrypto_reconcile_.*` or the
  # series never leave the NAS (infra/nas/config.alloy).

  - uid: zcrypto-reconcile-exporter-stale
    title: "Reconciler · exporter stale"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for the reconciler itself. Every other rule below reads a metric the reconciler
      # publishes, so all of them go quiet -- not red -- if it simply stops running. This one inverts
      # that: it fires on the silence. The textfile is scraped in place, so a dead reconciler leaves the
      # last value being scraped forever; only the TIMESTAMP reveals it, which is why the gauge exists.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_reconcile_last_success_timestamp_seconds
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h. The cycle is ~1.2h (the sleep follows the pull+reconcile work), so this is ~2 missed cycles of headroom
    noDataState: Alerting  # no series at all = the NAS, Alloy, or the reconciler is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful `zcrypto archive reconcile` cycle in over 3h. The reconciler is the only thing that heals primary gaps from the secondary -- while it is down, gaps accumulate unhealed and unmeasured."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-residual-gap
    title: "Reconciler · residual gap increased (permanent loss)"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # PERMANENT LOSS. Residual seconds are silence that NEITHER mirror covered -- both_streams_silent
      # (the fleet went dark together) or total_loss (the hour is on neither host). No later cycle can
      # heal it: there is no witness, and L2 is unbackfillable. Any increase at all is worth waking up
      # for, hence `> 0` rather than a tolerance.
      #
      # The counter is derived by SUMMING an append-only ledger, so it normally only grows. The one
      # thing that DECREASES it is a deliberate ledger correction (e.g. the classifier-bug record purged
      # with the owner's approval on 2026-07-14, 6261.8 -> 2661.8 s). Prometheus reads that decrease as a
      # counter reset, and a bare `increase()` would then report the whole post-reset value as fresh
      # permanent loss -- paging the highest-severity alert in the system on an artifact of a correction.
      # The `and resets(...) == 0` guard suppresses exactly that: the rule fires only on an increase with
      # NO reset in the window. A genuine new loss is monotone (no reset) and still fires; a correction
      # (reset) is silenced for one window. Cost: a real loss in the SAME 1h window as a correction is
      # delayed until the reset ages out -- rare, bounded, and the dashboard panel shows the trend
      # regardless. `or on() vector(0)` keeps the healthy state an explicit 0 rather than NoData. See T0044.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 3600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: "(increase(zcrypto_reconcile_residual_gap_seconds_total[1h]) > 0 and resets(zcrypto_reconcile_residual_gap_seconds_total[1h]) == 0) or on() vector(0)"
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    noDataState: OK  # the exporter-stale rule above owns "the reconciler is gone"; this one owns loss.
    execErrState: Alerting
    for: 0s
    annotations:
      summary: "Permanent L2 loss: silence that NEITHER capture host covered. This cannot be healed or backfilled -- the data is gone. Check the reconcile ledger for the both_streams_silent / total_loss records behind it."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-source-lag
    title: "Reconciler · capture mirror lagging"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Per-mirror, so the alert instance names WHICH host went quiet -- `source="primary"` and
      # `source="secondary"` fire independently. This is dataflow-based and therefore independent of
      # both hosts' healthchecks.io dead-men: a host can keep pinging while its capture writes nothing.
      #
      # Threshold 3h against a measured normal of ~1h: a final only commits after its hour closes and
      # the NAS pulls hourly, so ~1-2h of lag is the healthy steady state. 3h means a mirror has missed
      # a whole cycle beyond that.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: max by (source) (zcrypto_reconcile_source_lag_seconds)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h
    noDataState: OK  # owned by the exporter-stale rule above
    execErrState: Alerting
    for: 10m
    annotations:
      summary: "A capture mirror's newest committed final is over 3h old -- that host has stopped producing data, or its pull channel is broken. If it is the SECONDARY, the fleet has no witness and the next primary gap is permanent."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-reconcile-healable-gap-rate
    title: "Reconciler · primary gap rate high (degrading host)"
    ruleGroup: zcrypto-reconciler
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The degrading-primary detector, and T0003's outstanding gap-rate-alert item.
      #
      # A primary that is quietly falling apart -- reconnecting constantly, dropping seconds at a time --
      # trips NOTHING else: every gap is healed by the secondary, so residual stays flat; it keeps
      # pinging, so its dead-man stays green; it keeps producing finals, so source-lag stays low. The
      # RATE at which it needs healing is the only thing that reveals it.
      #
      # Reads `healable`, not `healed`: minting is OFF for the whole T0039 soak, so `healed_gap_seconds`
      # (minted only) is pinned at 0 exactly when this signal is most needed. `healable` counts the
      # seconds the secondary WITNESSED and could cover, in both modes.
      #
      # 600s/24h is a starting threshold, not a measured one: ~10 minutes of primary silence a day that
      # the secondary had to cover. T0039's soak recalibrates it from the real cross-host distribution --
      # until then treat a firing as "look at the ledger", not as a verdict.
      #
      # `and resets(...) == 0` guards the same counter-reset hazard as the residual-gap rule, and MORE so
      # here: this window is 24h, so without the guard a ledger correction would false-page for a full
      # day. A rebuild of the ledger resets this counter too. See T0044.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 86400, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: "(increase(zcrypto_reconcile_healable_gap_seconds_total[24h]) > 0 and resets(zcrypto_reconcile_healable_gap_seconds_total[24h]) == 0) or on() vector(0)"
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [600]}
    noDataState: OK
    execErrState: Alerting
    for: 30m
    annotations:
      summary: "The primary needed more than 10 minutes of healing in the last 24h. Every gap was covered, so nothing else fires -- but a host that needs this much healing is degrading. Check the reconcile ledger's would_mint/minted records for the pattern."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  # --- Trade backfill: daily trade_id-contiguous healing over Kraken's public REST /Trades ---------
  # (spec 00053, iter-100; T0052). Provisioned in this file BEFORE the NAS deploy that will first
  # emit `zcrypto_trade_backfill_*` -- unlike the reconciler block above (pushed only once its
  # series were already confirmed visible), these two rules must not be pushed yet either, for the
  # opposite-looking but equally bad reason: `zcrypto-trade-backfill-stale` below sets
  # `noDataState: Alerting`, and with no series at all yet that would page immediately and forever
  # until the NAS deploy happens. Push only after that deploy confirms the series are visible.

  - uid: zcrypto-trade-backfill-stale
    title: "Trade backfill · last success stale"
    ruleGroup: zcrypto-trade-backfill
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for this step, same shape as Gate/Reconciler `exporter stale` above: the step is
      # DAILY, so a healthy pass can be up to ~24h old between successes -- the threshold must clear
      # that cadence with room for one missed day, hence ~2 days rather than ~2x the gate/reconciler
      # hourly-cadence thresholds.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - zcrypto_trade_backfill_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}  # ~2 days -- tolerates the daily cadence plus one miss
    # Alerting: a vanished series here means the step stopped succeeding (or stopped running
    # altogether), which is itself the failure worth paging on -- same reasoning as the gate/reconciler
    # exporter-stale rules. See the block comment above for the pre-deploy push-order caveat this implies.
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No clean `zcrypto archive backfill-trades` run in over ~2 days -- the daily step has been failing every cycle or has stopped running (spec 00053)."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-trade-backfill-exit-nonzero
    title: "Trade backfill · non-zero exit code"
    ruleGroup: zcrypto-trade-backfill
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # This is the ONLY signal for a run that recorded errors (exit 1) or found the primary root
      # missing (exit 2) -- T0053's fix stamps the UTC day unconditionally (success or failure), so a
      # failed run no longer retries hourly; this metric, not a retry, is what carries the failure.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: zcrypto_trade_backfill_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the exporter-stale rule above already owns "the step stopped running/succeeding
    # at all" -- this one owns "it ran and recorded a failure", same split as the reconciler's
    # source-lag/healable-gap-rate rules deferring the dead-man case to their own exporter-stale rule.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The daily trade-backfill run recorded a non-zero exit code (1 = errors recorded, 2 = primary root missing). It no longer retries hourly (T0053) -- this alert is the only signal."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  # --- Ops node: the four textfile series Task 1 (spec 00054 D1) finally made scrapable -------------
  # Pushed only after Task 3 (the attended Alloy deploy) confirms these series VISIBLE in Grafana Cloud
  # -- same push-order caveat as the Reconciler/Trade-backfill blocks above: a rule armed before its
  # metric exists sits silent forever, looking healthy. noDataState is per-rule, not boilerplate: the
  # two dead-man rules (archive-pull staleness, verified-replay staleness) use Alerting -- no series at
  # all means the host, Alloy, or the timer is gone, which IS the alarm -- while the two exit-code rules
  # use OK, so a brand-new host does not page for a job it has simply never run yet. Exactly the
  # `zcrypto-trade-backfill-stale`/`zcrypto-trade-backfill-exit-nonzero` split above, applied here.

  - uid: zcrypto-ops-archive-pull-stalled
    title: "Ops · archive-pull stalled (dead-man)"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # The dead-man for the ops node's hourly mirror pull. archive-pull.timer fires at :12 every
      # hour (infra/ansible/roles/ops/templates/archive-pull.timer.j2) -- 3h is ~2 missed cycles of
      # headroom, same reasoning as the Gate/Reconciler exporter-stale rules above.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - ops_archive_pull_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [10800]}  # 3h; hourly timer at :12, so ~2 missed cycles
    noDataState: Alerting  # no series at all = the host, Alloy, or the timer is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: >-
        The ops node's mirror is the input to the overlay writer, the panel, and both replays. While
        the pull is stalled every one of them is reasoning from a mirror that is silently ageing.
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-archive-pull-exit-nonzero
    title: "Ops · archive-pull non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_archive_pull_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the dead-man rule above already owns "the pull stopped running/succeeding at
    # all" -- this one owns "it ran and at least one tree failed to sync", same split as the
    # trade-backfill pair.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last ops archive-pull cycle recorded a non-zero exit code -- at least one of the mirrored trees failed to sync this cycle."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verified-replay-stale
    title: "Ops · verified-replay stale"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # D9's rule. verified-replay.timer fires daily at 05:23 UTC
      # (infra/ansible/roles/ops/templates/verified-replay.timer.j2) -- 48h is 2 missed days, matching
      # the trade-backfill staleness rule's reasoning for a daily-cadence job.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: time() - ops_verified_replay_last_success_timestamp
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [172800]}  # 48h -- 2 missed daily cycles
    noDataState: Alerting  # no series at all = the host, Alloy, or the timer is gone. That IS the alarm.
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "No successful verified-path journal replay in over 48h (D9) -- the daily replay has stopped running or has not succeeded in two cycles."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-verified-replay-exit-nonzero
    title: "Ops · verified-replay non-zero exit"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: ops_verified_replay_exit_code
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [0]}
    # OK, not Alerting: the stale rule above already owns "the replay stopped running/succeeding at
    # all" -- this one owns "it ran and found a mismatch or a validation failure" -- critical, not
    # warning, because a verified-path mismatch means the canonical replay itself disagrees with the
    # journal, the same class of failure the Gate's mismatch rule pages critical for.
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "The last verified-path journal replay recorded a non-zero exit code -- a replay mismatch or validation failure against yesterday's journaled cycles."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

  - uid: zcrypto-ops-load-high
    title: "Ops · node load high"
    ruleGroup: zcrypto-ops
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      # Scoped to host="ops": infra/ansible/roles/ops/templates/config.alloy sets
      # `external_labels = { host = "ops" }` on prometheus.remote_write, so every metrics series
      # this Alloy ships carries host="ops" -- that's what makes this selector resolve. The NAS's
      # own node_load1 carries no `host` label at all (infra/nas/config.alloy deliberately doesn't
      # set one), so `NAS · load high` above scopes itself with `{host=""}` instead (see that
      # rule's own comment) -- the two rules partition the metric between the two hosts.
      #
      # Threshold: the ops box has 24 threads (infra/ansible/roles/ops/defaults/main.yml), so the NAS
      # rule's `gt 4` (100% of its 4 cores) would not mean the same thing here. `gt 20` is ~83% of 24
      # threads rather than 100%: ops runs several concurrent services (Alloy, the four timers, and
      # soon the overlay writer) whose transient overlaps are normal, so full-saturation would be
      # noisier than the NAS's single-purpose box; 20 keeps the same "sustained saturation, not a
      # transient burst" intent with headroom for that cross-service scheduling noise.
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          expr: node_load1{host="ops"}
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: gt, params: [20]}
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: "1-minute load average on the ops node exceeds 20 of its 24 threads -- sustained saturation, not a transient burst."
    labels:
      severity: warning
    notification_settings:
      receiver: metrics
