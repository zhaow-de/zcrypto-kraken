  - uid: zcrypto-alloy-dark-ops
    title: "Fleet · Alloy dark — Ops"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # Fires on SILENCE: when this host's Alloy stops shipping, its `up` series goes stale and
          # then absent, `count()` yields no vector, and `or on() vector(0)` supplies the 0 that trips
          # the threshold. `count()`, not `sum()`: `up` is a scrape-health gauge whose VALUE can be 0
          # while Alloy is alive and shipping -- presence of the series is the "shipping" signal, and
          # count() reads presence regardless of value. The fallback (rather than a bare `absent()`)
          # is what lets noDataState stay Alerting -- a raw `absent()` returns NO data while healthy,
          # so it would need noDataState: OK and would then park green if the datasource itself went
          # away.
          expr: >-
            count(up{host="ops"}) or on() vector(0)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting
    execErrState: Alerting
    # 10m tolerates a deploy restart (Alloy is down for seconds, but the series can gap a minute or
    # two) while still beating the ~3h the logs dead-man took to notice the 2026-07-15/16 T0048
    # incident. Prometheus staleness alone is ~5m, so the effective notice is ~15m.
    for: 10m
    annotations:
      summary: "The ops node's Alloy has shipped no metrics for >10m — its telemetry plane is dark, taking out the panel/verify timer series, the liquidations poller signals, and the reconcile/trade-backfill exporter families — expect their exporter-stale rules to double-page alongside this one. Every OTHER rule scoped to this host is now blind, so their silence means nothing until this clears. First checks: `docker ps` on the host, then `docker logs grafana-alloy`; a restart is the usual fix."
      __dashboardUid__: "zcrypto-fleet"
      __panelId__: "101"
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

