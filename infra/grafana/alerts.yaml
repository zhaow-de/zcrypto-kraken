  # Fleet · Alloy dark (T0079) -- four rules, one per host, all `critical`.
  # Uniform severity is deliberate: the responder's action is identical on every host (SSH, check the
  # container, restart), so a differentiated severity would imply a differentiated response that does
  # not exist. What differs is only what accumulates unseen meanwhile, which the per-host summary
  # states. These own "not shipping" only -- a rule for "shipping but wedged" (`zcrypto-alloy-docker-
  # sd-wedged`, T0048 defect 1: the T0048 incident was Alloy alive, discovery frozen) used to cover
  # the other case, but it is *removed from this file*, retired on all four hosts once D7's
  # converges run (spec 00068 D6/D8/D7) -- once that rollout completes, nothing re-detects that
  # failure mode.

  - uid: zcrypto-alloy-dark-nas
    title: "Fleet · Alloy dark — NAS"
    ruleGroup: zcrypto-fleet
    folderUID: "${GRAFANA_ALERT_FOLDER_UID}"
    orgId: 1
    condition: C
    data:
      - refId: A
        queryType: ""
        relativeTimeRange: {from: 600, to: 0}
        datasourceUid: "${GRAFANA_PROM_DS_UID}"
        model:
          # `{host="nas"}` (re-keyed from an empty-value matcher, spec 00069 D7 -- this comment
          # used to forbid exactly this re-key; it is now the deliberate, done thing). ops and both
          # capture hosts already set `external_labels = { host = ... }` on their
          # prometheus.remote_write; the NAS's config.alloy now does too. The old empty-value
          # matcher existed because adding a label to an already-live series changes its identity,
          # which can read as a value jump under an `increase()`/`resets()` rule -- i.e. a FALSE
          # permanent-data-loss page -- but the one series that risk was about,
          # zcrypto_reconcile_residual_gap_seconds_total, no longer publishes from the NAS (the
          # writer moved to ops at spec 00054 D2), so nothing left here sits under that shape of
          # rule. The smaller seam this rule itself carries -- `up`'s own identity changing at the
          # labeling moment -- is the accepted cost (D7): a possible one-off false page at this
          # attended rollout window, cheap to dismiss.
          # Fires on SILENCE: when this host's Alloy stops shipping, its `up` series goes stale and
          # then absent, `count()` yields no vector, and `or on() vector(0)` supplies the 0 that trips
          # the threshold. `count()`, not `sum()`: `up` is a scrape-health gauge whose VALUE can be 0
          # while Alloy is alive and shipping -- presence of the series is the "shipping" signal, and
          # count() reads presence regardless of value. The fallback (rather than a bare `absent()`)
          # is what lets noDataState stay Alerting -- a raw `absent()` returns NO data while healthy,
          # so it would need noDataState: OK and would then park green if the datasource itself went
          # away.
          expr: >-
            count(up{host="nas"}) or on() vector(0)
          instant: true
          refId: A
      - refId: C
        queryType: ""
        relativeTimeRange: {from: 0, to: 0}
        datasourceUid: "__expr__"
        model:
          datasource: {type: "__expr__", uid: "__expr__"}
          type: threshold
          expression: "A"
          refId: C
          conditions:
            - evaluator: {type: lt, params: [1]}
    noDataState: Alerting
    execErrState: Alerting
    # 10m tolerates a deploy restart (Alloy is down for seconds, but the series can gap a minute or
    # two) while still beating the ~3h the logs dead-man took to notice the 2026-07-15/16 T0048
    # incident. Prometheus staleness alone is ~5m, so the effective notice is ~15m.
    for: 10m
    annotations:
      summary: "The NAS's Alloy has shipped no metrics for >10m — its telemetry plane is dark, taking out the gate metrics the Stage-6a soak verdict is read from and the NAS archive-pull's log stream (the reconciler is unaffected: its series publish from ops since 2026-07-16). Every OTHER rule scoped to this host is now blind, so their silence means nothing until this clears. First checks: `docker ps` on the host, then `docker logs grafana-alloy`; a restart is the usual fix."
    labels:
      severity: critical
    notification_settings:
      receiver: metrics

