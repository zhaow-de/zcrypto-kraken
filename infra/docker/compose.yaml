# Reference compose for the capture daemon; the deploy host renders the `capture` role's
# compose.yaml.j2 instead. `${...}` resolve from the environment or an adjacent `.env`:
#   CAPTURE_IMAGE_DIGEST=sha256:<digest> CAPTURE_UID=$(id -u) CAPTURE_GID=$(id -g) \
#     docker compose -f infra/docker/compose.yaml up
services:
  capture:
    image: ghcr.io/zhaow-de/zcrypto-capture@${CAPTURE_IMAGE_DIGEST}
    container_name: zcrypto-capture
    restart: unless-stopped
    user: "${CAPTURE_UID:-10001}:${CAPTURE_GID:-10001}"
    environment:
      CAPTURE_DATA_DIR: /var/lib/zcrypto-capture
      CAPTURE_DEPTH: "${CAPTURE_DEPTH:-100}"
      CAPTURE_PAIRS: "${CAPTURE_PAIRS:-}"
      HEALTHCHECK_URL: "${HEALTHCHECK_URL:-}"
      # Mirrors the capture role's guarded logship additions (compose.yaml.j2) so this reference
      # file stays in lock-step: all empty by default (--ship-logs stays off), or set every
      # ZCRYPTO_LOKI_*/ZCRYPTO_LOG_* var to test --ship-logs against a real Loki endpoint locally.
      ZCRYPTO_SHIP_LOGS: "${ZCRYPTO_SHIP_LOGS:-}"
      ZCRYPTO_LOG_HOST: "${ZCRYPTO_LOG_HOST:-}"
      ZCRYPTO_LOG_SERVICE: "${ZCRYPTO_LOG_SERVICE:-}"
      ZCRYPTO_LOKI_URL: "${ZCRYPTO_LOKI_URL:-}"
      ZCRYPTO_LOKI_USERNAME: "${ZCRYPTO_LOKI_USERNAME:-}"
      ZCRYPTO_LOKI_PASSWORD: "${ZCRYPTO_LOKI_PASSWORD:-}"
      # Mirrors the capture role's UNGUARDED metrics-port additions (compose.yaml.j2, spec 00069
      # D6): the real deploy pins the literal `9101` (nothing there needs an override), but this
      # reference file follows the same `${VAR:-default}` pattern as every sibling var above so a
      # local run can point the exporter at a different port without hand-editing this file.
      ZCRYPTO_METRICS_PORT: "${ZCRYPTO_METRICS_PORT:-9101}"
    ports:
      - "127.0.0.1:${ZCRYPTO_METRICS_PORT:-9101}:${ZCRYPTO_METRICS_PORT:-9101}"
    volumes:
      - /var/lib/zcrypto-capture:/var/lib/zcrypto-capture
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
