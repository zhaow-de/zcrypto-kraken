[project]
name = "zcrypto"
version = "0.0.0"
description = "Quant trading at Kraken"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "nautilus-trader===2.0.0rc6.dev20260918",
    "numpy>=2.5.2",
    "polars>=1.44.0",
    "prometheus-client>=0.26.0",
    "typer>=0.27.1",
    "websockets>=17.0.1",
]

[project.scripts]
zcrypto = "cli.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[[tool.uv.index]]
name = "nautechsystems"
url = "https://packages.nautechsystems.io/simple"
explicit = true

[tool.uv.sources]
nautilus-trader = { index = "nautechsystems" }

[tool.pytest.ini_options]
# `data`: the test needs a dataset under `data/` or a mount this machine may not have, so CI
# structurally skips it and only a data-bearing workstation runs it. The marker is declared on the
# MODULE (`pytestmark = pytest.mark.data`), not the test: a gate's reason is an f-string in places,
# it is sometimes raised by a helper a fixture calls, and a file-level mark cannot miss one of those
# where a per-test mark would. `tests/test_data_gated_marker.py` holds every file carrying such a
# gate to the mark, reading the same vocabulary `infra/scripts/data-gated-run.py` parses skips with.
markers = ["data: needs a dataset under data/ or a mount CI does not have"]

[tool.coverage.run]
source = ["cli"]

[tool.coverage.report]
exclude_also = [
    # Module entrypoint guard: boilerplate, only reachable via `python -m cli`, never on import.
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "ansible>=14.3.1",
    "ansible-lint>=26.8.0",
    "coverage>=7.15.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
