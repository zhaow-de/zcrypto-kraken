[project]
name = "zcrypto"
version = "0.0.0"
description = "Quant trading at Kraken"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "nautilus-trader===2.0.0rc8.dev20261027+19881",
    "numpy==2.5.4",
    "polars==2.0.0",
    "prometheus-client==0.26.0",
    "typer==0.27.3",
    "websockets==17.3",
]

[project.scripts]
zcrypto = "cli.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[[tool.uv.index]]
name = "nautechsystems"
url = "https://packages.nautechsystems.io/simple"
explicit = true

[tool.uv.sources]
nautilus-trader = { index = "nautechsystems" }

[tool.pytest.ini_options]
# `data`: the test needs a dataset under `data/` or a mount this machine may not have, so CI
# structurally skips it and only a data-bearing workstation runs it. The mark is the MODULE's, and
# `tests/test_data_gated_marker.py` holds every file carrying such a gate to it.
markers = [
    "data: needs a dataset under data/ or a mount CI does not have",
    "slow: a case tests/slow-cases.txt lists; tests/conftest.py marks it",
    "retired: a closed research trial's subject test; CI deselects it, the nightly runs it",
]
# Without this an unregistered mark is a warning, so `pytest.mark.dta` drops its file out of
# `-m data` silently -- the one selection nothing else can catch, since a typo is still a valid mark.
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["cli"]

[tool.coverage.report]
exclude_also = [
    # Module entrypoint guard: boilerplate, only reachable via `python -m cli`, never on import.
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "ansible==14.5.0",
    "ansible-lint==26.10.1",
    "coveralls==4.1.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.1",
]
