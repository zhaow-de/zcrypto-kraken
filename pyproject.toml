[project]
name = "zcrypto"
version = "0.0.0"
description = "Quant trading at Kraken"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "polars>=1.42.1",
    "typer>=0.26.7",
]

[project.scripts]
zcrypto = "cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.coverage.run]
source = ["cli"]

[tool.coverage.report]
exclude_also = [
    # Module entrypoint guard: boilerplate, only reachable via `python -m cli`, never on import.
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "ruff>=0.15.18",
]
