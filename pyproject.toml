[project]
name = "zcrypto"
version = "0.0.0"
description = "Quant trading at Kraken"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "nautilus-trader==1.231.0",
    "numpy>=2.5.2",
    "polars>=1.44.0",
    "prometheus-client>=0.26.0",
    "typer>=0.27.1",
    "websockets>=17.0.1",
]

[project.scripts]
zcrypto = "cli.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.coverage.run]
source = ["cli"]

[tool.coverage.report]
exclude_also = [
    # Module entrypoint guard: boilerplate, only reachable via `python -m cli`, never on import.
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "ansible>=14.3.1",
    "ansible-lint>=26.8.0",
    "coverage>=7.15.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
